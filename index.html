  }
  // whirlpool: dithered funnel darkening toward the eye, three ink arms
  // spiralling in, turning over time
  // ---------- Cloud shadows ----------
  // Big, soft, billowy shadows drifting downwind on a wrapping field. They
  // only fall on land (clipped to the island outlines), darkening whatever
  // is there: sand, vegetation, trees, the hut. On the plain sea they'd
  // just read as noise.
  const CLOUD_P = WORLD.w/Math.max(1, Math.round(WORLD.w/1800));   // wrap period of the cloud field, ~1800 px, dividing the world so it tiles
  const CLOUD_SPEED = 10;                      // px/s at full wind
  let cloudOX = 0, cloudOY = 0;
  // Clouds: puffy, soft-shaded, with a crisp inked edge. They float close
  // to the camera, so they slide past faster than the sea below (parallax),
  // and each drops a soft shadow on sea and land, offset by the sun.
  const CLOUD_PAR = 1.4;                       // how much faster than the ground they cross the view
  const CLOUD_SHADOW = [70, 105];              // sun from the upper left: shadow lands down-right
  function makeCloud(){
    const W = rand(120,270), H = W*rand(0.4,0.65), pad = 22;
    const cw = Math.ceil(W*1.2+pad*2), chh = Math.ceil(H*1.4+pad*2), cx = cw/2, cy = chh/2 + H*0.12;
    // puffs, grown organically: a few heaps of different heights, each a
    // big billow with smaller ones bubbling round its top; an uneven,
    // lumpy base; and a fringe of little curls along the upper edge
    const puffs = [];
    const heaps = 2 + Math.floor(rand(0,3));
    for(let h=0; h<heaps; h++){
      const hx = cx + (heaps===1 ? 0 : (-0.5 + h/(heaps-1))*W*0.5) + rand(-W*0.06, W*0.06);
      const tall = h === (heaps>>1);                            // one heap towers over the others
      const big = W*rand(0.15,0.23)*(tall ? 1.15 : 1), hy = cy - H*(tall ? rand(0.22,0.38) : rand(0.0,0.14));
      puffs.push([hx, hy, big]);
      const baseY = cy + H*0.12;                               // fill down to the base so the heap sits on it
      for(let yy = hy + big*0.5; yy < baseY; yy += big*0.5){ puffs.push([hx - big*rand(0.3,0.6), yy, big*rand(0.7,0.9)]); puffs.push([hx + big*rand(0.3,0.6), yy, big*rand(0.7,0.9)]); }
      const kids = 3 + Math.floor(rand(0,4));
      for(let k=0;k<kids;k++){ const a = -Math.PI*rand(0.05,0.95), d = big*rand(0.6,1.0); puffs.push([hx + Math.cos(a)*d*1.15, hy + Math.sin(a)*d*0.7, big*rand(0.38,0.65)]); }
    }
    let bx = cx - W*0.44;
    while(bx < cx + W*0.4){                                    // lumpy base
      const r = W*rand(0.05,0.1); puffs.push([bx + r*0.6, cy + H*0.16 + rand(-H*0.07, H*0.05), r]); bx += r*rand(1.0,1.6);
    }
    // Ghibli-style cauliflower edge: every big billow is crowned with
    // smaller billows, and those with smaller curls still
    puffs.forEach(p=> p[3] = 1);
    const primaries = puffs.filter(p=> p[2] > W*0.075 && p[1] < cy + H*0.05);
    for(const [px,py,pr] of primaries){
      const n2 = 4 + Math.floor(rand(0,3));
      for(let k=0;k<n2;k++){
        const a = -Math.PI*(0.08 + 0.84*(k+rand(0.1,0.9))/n2), r2 = pr*rand(0.3,0.5);
        const sx = px + Math.cos(a)*pr*0.86, sy = py + Math.sin(a)*pr*0.86;
        puffs.push([sx, sy, r2, 2]);
        if(Math.random() < 0.55){
          const n3 = 2 + Math.floor(rand(0,2));
          for(let m=0;m<n3;m++){ const b = a + rand(-0.9,0.9); puffs.push([sx + Math.cos(b)*r2*0.85, sy + Math.sin(b)*r2*0.85, r2*rand(0.3,0.48), 3]); }
        }
      }
    }
    // a few flat wisps trailing off the base
    for(let k=0;k<2+Math.floor(rand(0,2));k++) puffs.push([cx + rand(-0.5,0.5)*W*0.9, cy + H*0.2 + rand(-3,3), W*rand(0.04,0.06), 4]);
    // kept as puffs relative to the centre; the shape never changes
    return {W, H, puffs: puffs.map(([x,y,r,lv])=>[x-cx, y-cy, r, lv||1]), cw, ch: chh};
  }
  // a few cloud shapes (CLOUD_MODELS), made once per game and shared by all
  // the clouds in the sky
  const CLOUD_SHAPES = Array.from({length: Math.max(1, CLOUD_MODELS)}, makeCloud);
  const clouds = [];
  for(let tries=0; tries<1500 && clouds.length<CLOUD_COUNT; tries++){
    const x = rand(0,CLOUD_P), y = rand(0,CLOUD_P);
    const clear = clouds.every(c=>{
      const dx = Math.abs(c.x-x), dy = Math.abs(c.y-y);
      return Math.hypot(Math.min(dx,CLOUD_P-dx), Math.min(dy,CLOUD_P-dy)) > 300;
    });
    if(clear){ const shape = CLOUD_SHAPES[clouds.length % CLOUD_SHAPES.length]; clouds.push({x, y, ...shape, shape}); }
  }
  // about a third of the clouds carry rain: a darker underside, and a
  // shower falling on the sea beneath them
  // and some of those are storms (STORM_SHARE): darker still, heavier rain, and lightning (see Storms)
  let rainN = 0;
  clouds.forEach((c,i)=>{
    c.rain = RAIN_CLOUD_EVERY > 0 && i % RAIN_CLOUD_EVERY === 0;
    if(!c.rain) return;
    c.storm = !!STORM_ON && Math.floor((rainN + 1)*STORM_SHARE) > Math.floor(rainN*STORM_SHARE); rainN++;
    c.drops = Array.from({length: Math.round(c.W*(c.storm ? 0.45 : 0.3))}, ()=>{ const a = rand(0,6.3), r = Math.sqrt(Math.random()); return {u: Math.cos(a)*r, v: Math.sin(a)*r, ph: Math.random(), len: rand(6,10)}; });
  });
  // the stormy West's own storm clouds: placed once in the world (not in the tiled cloud field) and hanging there,
  // only swaying a little (c.west: see cloudGround), spaced apart, clear of the villages' quays
  if(STORM_ON){
    const west = [];
    for(let tries=0; tries<3000 && west.length<WEST_STORM_CLOUDS; tries++){
      const [x, y] = westPoint();
      if(VILLAGES.some(v=> wdist(x, y, v.isl.x, v.isl.y) < 380)) continue;
      if(west.some(c=> wdist(c.x, c.y, x, y) < 300)) continue;
      const shape = CLOUD_SHAPES[west.length % CLOUD_SHAPES.length];
      const c = {x, y, ...shape, shape, west: true, rain: true, storm: true, ph: rand(0, 6.3), sway: rand(25, 60)};
      c.drops = Array.from({length: Math.round(c.W*0.45)}, ()=>{ const a = rand(0,6.3), r = Math.sqrt(Math.random()); return {u: Math.cos(a)*r, v: Math.sin(a)*r, ph: Math.random(), len: rand(6,10)}; });
      west.push(c);
    }
    clouds.push(...west);
  }
  function puffPath(P, ox, oy, grow, dx, dy, k){
    ctx.beginPath();
    for(const [x,y,r,lv] of P){
      const rr = Math.max(1, r*k + grow), ry = lv===4 ? rr*0.35 : rr;            // wisps are flat
      ctx.moveTo(ox+x+dx+rr, oy+y+dy); ctx.ellipse(ox+x+dx, oy+y+dy, rr, ry, 0, 0, Math.PI*2);
    }
  }
  function drawCloudBody(c, P, ox, oy){
    ctx.fillStyle = INKC; puffPath(P, ox, oy, 1.8, 0, 0, 1); ctx.fill();                 // defined inked edge
    ctx.fillStyle = V(c.storm ? 0.28 : c.rain ? 0.48 : 0.66); puffPath(P, ox, oy, 0, 0, 0, 1); ctx.fill(); // the shaded underside of every billow (heavy with rain: darker; a storm: darkest)
    ctx.save(); puffPath(P, ox, oy, 0, 0, 0, 1); ctx.clip();
    ctx.fillStyle = V(c.storm ? 0.5 : c.rain ? 0.72 : 0.84); puffPath(P, ox, oy, 0, -c.W*0.02, -c.H*0.07, 0.96); ctx.fill();  // half-lit
    ctx.fillStyle = V(c.storm ? 0.74 : 0.95); puffPath(P, ox, oy, 0, -c.W*0.04, -c.H*0.13, 0.8); ctx.fill();   // lit
    ctx.fillStyle = c.storm ? V(0.86) : PAPERC;  puffPath(P, ox, oy, 0, -c.W*0.055, -c.H*0.18, 0.6); ctx.fill();  // brightest tops
    // inner billow lines: short inked curves under the crowning bumps, the
    // way hand-painted cumulus are drawn
    ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.55;
    ctx.beginPath();
    P.forEach(([x,y,r,lv], i)=>{ if(lv!==2 || i%3) return; ctx.moveTo(ox+x+Math.cos(0.2*Math.PI)*r, oy+y+Math.sin(0.2*Math.PI)*r); ctx.arc(ox+x, oy+y, r, 0.2*Math.PI, 0.7*Math.PI); });   // only a few, sparingly
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function drawCloudShade(c, P, ox, oy){
    for(const [k,a] of [[1.05,0.12],[0.85,0.1],[0.62,0.08]]){ ctx.fillStyle = 'rgba(0,0,0,'+a+')'; puffPath(P, ox, oy, 0, 0, 0, k); ctx.fill(); }
  }
  // the clouds keep their shape, so each cloud shape (and its shadow, and
  // its darker rain version) is painted once into its own little canvas
  function cloudSprite(c, shade){
    const sh = c.shape, key = shade ? 'sh' : c.storm ? 'spS' : c.rain ? 'spR' : 'sp';
    if(!sh[key]){
      const cv = sh[key] = document.createElement('canvas'), saved = ctx;
      cv.width = Math.ceil(c.cw*1.3); cv.height = Math.ceil(c.ch*1.3);
      ctx = sceneCtx(cv);
      if(shade) drawCloudShade(c, c.puffs, cv.width/2, cv.height/2);
      else {
        drawCloudBody(c, c.puffs, cv.width/2, cv.height/2);
        // opacity mask: CLOUD_CORE in the middle, easing out to CLOUD_ALPHA at the rim
        const r = Math.max(c.W, c.H)*0.62, sy = c.H/c.W*1.25;
        ctx.save(); ctx.globalCompositeOperation = 'destination-in';
        ctx.translate(cv.width/2, cv.height/2); ctx.scale(1, sy);
        const g = ctx.createRadialGradient(0,0,0,0,0,r);
        const core = c.storm ? 1 : CLOUD_CORE, rim = c.storm ? Math.min(1, CLOUD_ALPHA*1.6) : CLOUD_ALPHA;   // (a storm is denser: it doesn't wash out)
        g.addColorStop(0, 'rgba(0,0,0,'+core+')'); g.addColorStop(0.35, 'rgba(0,0,0,'+(core*0.9)+')');
        g.addColorStop(1, 'rgba(0,0,0,'+rim+')');
        ctx.fillStyle = g; ctx.fillRect(-cv.width, -cv.height/sy, cv.width*2, cv.height*2/sy);
        ctx.restore();
      }
      ctx = saved;
    }
    return sh[key];
  }
  // nearest copy of a cloud's ground point to the view centre
  function cloudGround(c, vcx, vcy){
    if(c.west){                                               // a West storm: its own place in the world, swaying slowly round it
      const x = c.x + Math.sin(t*0.05 + c.ph)*c.sway, y = c.y + Math.cos(t*0.037 + c.ph)*c.sway*0.6;
      return [vcx + wdx(x, vcx), vcy + wdy(y, vcy)];
    }
    let x = c.x + cloudOX, y = c.y + cloudOY;
    x += CLOUD_P*Math.round((vcx-x)/CLOUD_P); y += CLOUD_P*Math.round((vcy-y)/CLOUD_P);
    return [x,y];
  }
  function drawCloudShadowsAll(camX, camY, w, h){
    const vcx = camX+w/2, vcy = camY+h/2;
    for(const c of clouds){
      const [, , x, y] = cloudAndShadow(c, vcx, vcy);          // always the same step down-right of its cloud
      if(x - c.cw/2 > camX+w || y - c.ch/2 > camY+h || x + c.cw/2 < camX || y + c.ch/2 < camY) continue;
      { const sp = cloudSprite(c, true); ctx.drawImage(sp, x - sp.width/2, y - sp.height/2); }
    }
  }
  function drawCloudsAbove(camX, camY, w, h){
    const vcx = camX+w/2, vcy = camY+h/2;
    for(const c of clouds){
      const [gx,gy] = cloudGround(c, vcx, vcy);
      const x = vcx + (gx-vcx)*CLOUD_PAR, y = vcy + (gy-vcy)*CLOUD_PAR;   // parallax
      if(x - c.cw/2 > camX+w || y - c.ch/2 > camY+h || x + c.cw/2 < camX || y + c.ch/2 < camY) continue;
      { const sp = cloudSprite(c, false); ctx.drawImage(sp, x - sp.width/2, y - sp.height/2); }   // opacity is in the sprite
    }
  }
  // rain under the rain clouds: drops leave the cloud's belly and fall all
  // the way down onto its shadow on the sea (seen from above, the fall runs
  // from the cloud, which floats up near the camera, to where its shadow
  // lies), each ending in a little splash ring on the water
  const RAIN_FALL = 1.05;                      // seconds per drop (slow enough to read as a smooth fall on a phone)
  function rainFootprint(c){ return [c.W*0.42, c.H*0.55]; }
  // where a cloud is drawn (with parallax) and where its shadow lies, for a
  // view centred on (vcx,vcy): the shadow keeps a fixed offset from the
  // cloud, down and to the right, so the rain always falls beneath it
  function cloudAndShadow(c, vcx, vcy){
    const [gx,gy] = cloudGround(c, vcx, vcy);
    const x = vcx + (gx-vcx)*CLOUD_PAR, y = vcy + (gy-vcy)*CLOUD_PAR;
    return [x, y, x + CLOUD_SHADOW[0], y + CLOUD_SHADOW[1]];
  }
  // the grey of a shower, painted once per cloud into a small image
  function rainTint(c){
    if(c.tint) return c.tint;
    const [rx,ry] = rainFootprint(c), cv = document.createElement('canvas');
    cv.width = Math.ceil(rx*2); cv.height = Math.ceil(ry*2);
    const g2 = sceneCtx(cv), g = g2.createRadialGradient(rx,rx,0,rx,rx,rx);
    const k = c.storm ? 1.8 : 1; g.addColorStop(0,'rgba(0,0,0,'+0.12*k+')'); g.addColorStop(0.7,'rgba(0,0,0,'+0.07*k+')'); g.addColorStop(1,'rgba(0,0,0,0)');
    g2.scale(1, ry/rx); g2.fillStyle = g; g2.beginPath(); g2.arc(rx,rx,rx,0,Math.PI*2); g2.fill();
    return (c.tint = cv);
  }
  // drops are batched by opacity: a few paths per cloud instead of one
  // stroke per drop (after the 1-bit dither the steps don't show)
  const RAIN_LEVELS = 4;
  const RAIN_GREY = 0.72;                      // grey of the drops (1 = sea/paper, 0 = ink)
  function drawRain(camX, camY, w, h){
    const vcx = camX+w/2, vcy = camY+h/2;
    for(const c of clouds){
      if(!c.rain) continue;
      const [cx,cy,sx,sy] = cloudAndShadow(c, vcx, vcy), [rx,ry] = rainFootprint(c);
      if(Math.min(cx,sx) - rx > camX+w || Math.min(cy,sy) - ry > camY+h || Math.max(cx,sx) + rx < camX || Math.max(cy,sy) + ry < camY) continue;
      ctx.drawImage(rainTint(c), sx - rx, sy - ry);                        // the grey of the shower, on the shadow
      const fx = sx - cx, fy = sy - cy, fl = Math.hypot(fx, fy) || 1, ux = fx/fl, uy = fy/fl;
      const streaks = [], rings = [];
      for(let i=0;i<RAIN_LEVELS;i++){ streaks.push(new Path2D()); rings.push(new Path2D()); }
      const tt = t/RAIN_FALL;
      for(const q of c.drops){
        const p = (tt + q.ph) % 1, ox = q.u*rx, oy = q.v*ry;
        if(p < 0.8){                                                        // falling from the cloud to the shadow, speeding up
          const k = Math.pow(p/0.8, 1.3), a = Math.min(1, k*6);
          if(a < 0.12) continue;
          const x = cx + ox + fx*k, y = cy + oy + fy*k, l = q.len*(1.3 + 1.4*k);   // long streaks: motion blur, so the fall looks continuous
          const P = streaks[Math.min(RAIN_LEVELS-1, (a*RAIN_LEVELS)|0)];
          P.moveTo(x - ux*l, y - uy*l); P.lineTo(x, y);
        } else {                                                            // landed: a ring spreading and fading
          const k = (p-0.8)/0.2, a = 1-k;
          if(a < 0.12) continue;
          const P = rings[Math.min(RAIN_LEVELS-1, (a*RAIN_LEVELS)|0)], ex = 1 + k*3.5, ey = 0.6 + k*1.8;
          P.moveTo(sx + ox + ex, sy + oy); P.ellipse(sx + ox, sy + oy, ex, ey, 0, 0, Math.PI*2);
        }
      }
      ctx.strokeStyle = V(RAIN_GREY); ctx.lineCap = 'round';          // pale: barely darker than the sea
      for(let i=0;i<RAIN_LEVELS;i++){
        const a = (i+0.5)/RAIN_LEVELS;
        ctx.globalAlpha = a; ctx.lineWidth = 1.3; ctx.stroke(streaks[i]);
        ctx.globalAlpha = 0.9*a; ctx.lineWidth = 1.1; ctx.stroke(rings[i]);
      }
      ctx.globalAlpha = 1;
    }
  }
  // how close the boat is to a shower (where it lands, on the shadow), 0..1, for the sound of the rain
  function rainNear(){
    let best = 0;
    for(const c of clouds){
      if(!c.rain) continue;
      const [, , sx, sy] = cloudAndShadow(c, boat.x, boat.y), [rx] = rainFootprint(c);   // the camera follows the boat
      const d = Math.hypot(sx - boat.x, sy - boat.y);
      best = Math.max(best, Math.max(0, Math.min(1, 1 - (d - rx*0.6)/(rx + 260))));
    }
    return best;
  }

  // ---------- Storms ----------
  // A storm cloud (c.storm) now and then (STORM_EVERY) throws a bolt down onto the sea under it. First a warning
  // (STORM_WARN s): a ring flickers on the water where it will strike, often right where she is if she's under the
  // storm (STORM_AIM); then the bolt, a flash over the screen and thunder, later and softer the further off it falls.
  // Struck within STORM_HIT_R of the bolt, she takes STORM_DAMAGE. Only storms near her bother (out to ~1100 px).
  // Where a bolt falls is kept as an offset from the storm's shadow, so it drifts with the cloud.
  let flashT = 0;
  function updateStorms(dt){
    flashT = Math.max(0, flashT - dt);
    if(!STORM_ON || !playing) return;
    for(const c of clouds){
      if(!c.storm) continue;
      const [, , sx, sy] = cloudAndShadow(c, boat.x, boat.y), [rx, ry] = rainFootprint(c);
      if(Math.hypot(sx - boat.x, sy - boat.y) > 1100){ c.bolt = null; continue; }
      const b = c.bolt;
      if(b){
        b.t -= dt;
        if(b.t <= 0 && !b.struck){
          b.struck = true;
          const x = sx + b.ou, y = sy + b.ov, d = Math.hypot(x - boat.x, y - boat.y);
          // the flash only when the bolt or its cloud is on screen (a storm out of sight is only heard)
          { const hw = GW*PX/2 + 30, hh = GH*PX/2 + 30, [ccx, ccy, csx, csy] = cloudAndShadow(c, camFx, camFy);
            const seen = (px, py, m)=> Math.abs(wdx(px, camFx)) < hw + m && Math.abs(wdy(py, camFy)) < hh + m;
            if(seen(csx + b.ou, csy + b.ov, 0) || seen(ccx, ccy, c.cw*0.4)) flashT = Math.max(flashT, 0.3); }
          const near = Math.max(0, 1 - d/350), vol = Math.max(0, 1 - d/1100);
          setTimeout(()=> Sfx.thunder(vol, near), Math.min(1600, d*1.4));   // the thunder comes after the flash, later the further off
          if(d < STORM_HIT_R && !moor){
            boat.health = Math.max(0, boat.health - STORM_DAMAGE);
            hurtFlash = 0.45; shake = 0.18; showHealth(); Sfx.crash(0.7);
            boat.rock = Math.min(2.5, (boat.rock||0) + 1.2);
            buzz([60, 30, 90]);
            popups.push({x: boat.x, y: boat.y - 26, text: fmt(TEXT.popups.lightning, {damage: STORM_DAMAGE}), life: 1.8, max: 1.8});
          } else if(near > 0.3) buzz([20]);
        }
        if(b.t < -0.5) c.bolt = null;
        continue;
      }
      if(c.boltT === undefined) c.boltT = rand(STORM_EVERY[0]*0.5, STORM_EVERY[1]);
      c.boltT -= dt;
      if(c.boltT > 0) continue;
      c.boltT = rand(STORM_EVERY[0], STORM_EVERY[1]);
      let ou, ov;
      if(Math.hypot((boat.x - sx)/rx, (boat.y - sy)/ry) < 1 && Math.random() < STORM_AIM){ ou = boat.x - sx + rand(-8, 8); ov = boat.y - sy + rand(-8, 8); }
      else { const a = rand(0, Math.PI*2), r = Math.sqrt(Math.random())*0.9; ou = Math.cos(a)*r*rx; ov = Math.sin(a)*r*ry; }
      c.bolt = {ou, ov, t: STORM_WARN, struck: false, seed: Math.random()*1000};
    }
  }
  // the warning ring, then the bolt (jagged, a paper core in an ink line, a fork or two) and a splash where it lands
  function drawStorms(camX, camY, w, h){
    const vcx = camX + w/2, vcy = camY + h/2;
    for(const c of clouds){
      const b = c.bolt; if(!b) continue;
      const [cx, cy, sx, sy] = cloudAndShadow(c, vcx, vcy), x = sx + b.ou, y = sy + b.ov;
      if(x < camX - 60 || x > camX + w + 60 || y < camY - 60 || y > camY + h + 60) continue;
      if(b.t > 0){                                                  // the warning: a ring that tightens and flickers faster
        const q = 1 - b.t/STORM_WARN, on = Math.sin(t*(10 + 30*q)) > -0.2;
        if(!on) continue;
        const rr = STORM_HIT_R*(1.4 - 0.4*q);                       // (paper in an ink line: it reads on the dark shower and on the pale sea)
        ctx.setLineDash([5, 4]); ctx.lineDashOffset = -t*20;
        for(const [lw, col] of [[3.4, INKC], [1.6, PAPERC]]){ ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(x, y, rr, rr*0.7, 0, 0, Math.PI*2); ctx.stroke(); }
        ctx.setLineDash([]); ctx.lineDashOffset = 0;
        continue;
      }
      const age = -b.t, R = (k)=>{ const v = Math.sin(b.seed + k*12.9898)*43758.5453; return v - Math.floor(v); };
      const x0 = cx + b.ou*0.35, y0 = cy + b.ov*0.35, n = 9, pts = [];
      for(let i=0;i<=n;i++){ const u = i/n, j = (i && i < n) ? (R(i) - 0.5)*14 : 0; pts.push([x0 + (x - x0)*u + j, y0 + (y - y0)*u + (R(i + 50) - 0.5)*6*(i && i < n)]); }
      const fork = (i0, k)=>{ const [px, py] = pts[i0]; return [[px, py], [px + (R(k) - 0.5)*30, py + 10 + R(k + 1)*16], [px + (R(k + 2) - 0.5)*40, py + 24 + R(k + 3)*14]]; };
      const paths = [pts, fork(3, 200), fork(6, 300)];
      ctx.globalAlpha = age < 0.25 ? 1 : Math.max(0, 1 - (age - 0.25)/0.25); ctx.lineJoin = 'miter'; ctx.lineCap = 'round';
      for(const [lw, col] of [[5, INKC], [2.4, PAPERC]]){
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
        for(const pp of paths){ pp.forEach(([px, py], i)=> i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); }
        ctx.stroke();
      }
      ctx.strokeStyle = INKC; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.ellipse(x, y, 4 + age*60, (4 + age*60)*0.6, 0, 0, Math.PI*2); ctx.stroke();   // the splash
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Ambient life: gulls ----------
  // Gulls: a small flock (1–3) crosses the screen every 30–45 s, riding
  // roughly downwind. Ink silhouette with a paper halo so it stays crisp
  // over any dither; a faint dithered shadow on the water below.
  const gulls = [];
  let gullTimer = rand(6,10);                 // first flock comes early
  function updateAmbientLife(dt){
    updateStorms(dt);
    const dw = windAngle+Math.PI;
    cloudOX += Math.cos(dw)*CLOUD_SPEED*windStrength*dt;
    cloudOY += Math.sin(dw)*CLOUD_SPEED*windStrength*dt;

    gullTimer -= dt;
    if(gullTimer<=0){
      gullTimer = rand(15,22);
      const th = dw + rand(-0.7,0.7), ux = Math.cos(th), uy = Math.sin(th);
      const reach = Math.hypot(GW*PX, GH*PX)/2 + 60;            // spawn just outside the view
      const side = rand(-0.35,0.35)*viewH();
      const sx = boat.x - ux*reach - uy*side, sy = boat.y - uy*reach + ux*side;
      const n = 1+Math.floor(rand(0,3)), sp = rand(72,95);
      const flock = {calls: 0};
      for(let k=0;k<n;k++){
        const back = k*rand(22,34), off = (k%2?1:-1)*k*rand(12,20);   // loose V
        gulls.push({x: sx-ux*back-uy*off, y: sy-uy*back+ux*off, ux, uy, sp: sp*rand(0.95,1.05),
                    ph: rand(0,6), wob: rand(0,6), flap: 0, left: reach*2+200+back, flock});
      }
    }
    for(let k=gulls.length-1;k>=0;k--){
      const g = gulls[k];
      g.x += g.ux*g.sp*dt; g.y += g.uy*g.sp*dt;
      g.wob += dt*0.9;
      const lat = Math.cos(g.wob)*6*dt;                    // gentle weave
      g.x += -g.uy*lat; g.y += g.ux*lat;
      g.ph += dt;
      g.left -= g.sp*dt;
      // passing overhead: the flock calls once or twice
      const gd = wdist(g.x,g.y,boat.x,boat.y);
      if(gd < 240 && g.flock.calls < 2 && (g.flock.calls===0 || Math.random() < dt*0.6)){
        g.flock.calls++;
        Sfx.gull(Math.max(-0.8, Math.min(0.8, wdx(g.x,boat.x)/260)), 0.05 + 0.04*(1-gd/240));
      }
      if(g.left<=0) gulls.splice(k,1);
    }
  }
  // wing state: bursts of flapping, then gliding with wings spread
  function gullWing(g){
    const cyc = g.ph % 3.2;
    return cyc < 1.3 ? 0.55 + 0.45*Math.cos(cyc*9) : 1;
  }
  function gullShape(span, sweep){
    // top-down gull heading +x: gull-wing "M" — elbows forward, tips swept back
    ctx.beginPath();
    ctx.moveTo(-sweep, -span);
    ctx.quadraticCurveTo(4, -span*0.55, 0.5, 0);
    ctx.quadraticCurveTo(4,  span*0.55, -sweep, span);
  }
  function drawGullShadow(g){
    const s = gullWing(g), span = 10*s;
    ctx.save();
    ctx.translate(g.x+26, g.y+32);                         // high up: shadow well offset
    ctx.rotate(Math.atan2(g.uy,g.ux));
    ctx.strokeStyle=V(0.5); ctx.lineWidth=2; ctx.lineCap='round';
    gullShape(span, 3); ctx.stroke();
    ctx.restore();
  }
  function drawGull(g){
    const s = gullWing(g), span = 11*s;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(Math.atan2(g.uy,g.ux));
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=PAPERC; ctx.lineWidth=4.5; gullShape(span, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(5,0); ctx.stroke();
    ctx.strokeStyle=INKC; ctx.lineWidth=1.7; gullShape(span, 3); ctx.stroke();
    ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(4.5,0); ctx.stroke();   // body + tail
    ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(4.5,0,1.6,0,Math.PI*2); ctx.fill();         // head
    ctx.restore();
  }

  // whirlpool: soft dithered halo and funnel, a few broad pale arms of water winding in, and many curved foam
  // streaks sucked inward along a logarithmic spiral, turning faster as they near the eye (like real water, angular
  // speed grows toward the centre); every line is a smooth curve that swells and thins, wobbling a little as it
  // goes, so it reads as flowing water. The core edge is a broken, wobbling foam ring.
  const WP_PARTS = 34, WP_LIFE = 3.6, WP_ARMS = 3;   // streaks per whirlpool, seconds rim → eye, pale arms
  function drawWhirlpool(w){
    // (its two gradients are made once, round 0,0, and drawn moved to where it wanders)
    if(!w.grads){
      const halo = ctx.createRadialGradient(0,0,w.core,0,0,w.r);
      halo.addColorStop(0, V(0.86)); halo.addColorStop(0.35, V(0.93));
      halo.addColorStop(0.7, V(0.975)); halo.addColorStop(1, 'rgba(255,255,255,0)');
      const g = ctx.createRadialGradient(0,0,0,0,0,w.core*1.1);
      g.addColorStop(0, V(0.2)); g.addColorStop(0.4, V(0.55));
      g.addColorStop(0.8, V(0.78)); g.addColorStop(1, V(0.86));
      w.grads = {halo, g};
    }
    ctx.save(); ctx.translate(w.x, w.y);
    ctx.fillStyle = w.grads.halo;
    ctx.beginPath(); ctx.arc(0,0,w.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = w.grads.g;
    ctx.beginPath(); ctx.arc(0,0,w.core*1.1,0,Math.PI*2); ctx.fill();
    ctx.restore();

    if(!w.parts){
      w.parts=[];
      for(let k=0;k<WP_PARTS;k++) w.parts.push({ph:Math.random(), a0:Math.random()*Math.PI*2, len:0.1+Math.random()*0.12, wob:Math.random()*6.3});
    }
    const R0 = w.r*0.9, EYE = 3;
    const C = 1.6;                                 // spiral tightness (tighter: the streaks curve more)
    const pos = (p, a0, wob)=>{                    // p: 0 at rim → 1 at eye

    };

  // rocks never change but their surf ring, so each is painted once into a

  function drawRocks(list){
    ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.globalAlpha=0.45;               // surf rings, faint → dotted after dithering
    ctx.beginPath();
    for(const o of list){ const r = o.r+3+Math.sin(t*2+o.foam); ctx.moveTo(o.x+r, o.y); ctx.arc(o.x,o.y,r,0,Math.PI*2); }
    ctx.stroke(); ctx.globalAlpha=1;
    for(const o of list){ const sp = o.sprite || rockSprite(o); ctx.drawImage(sp.c, sp.x0, sp.y0); }
  }
  // the wreck: a slick of dark water and foam round it, its shadow, then the two halves of a white cruise

  function drawWreck(wk){

      const saved = ctx; ctx = sceneCtx(c); ctx.translate(S/2, S/2); ctx.rotate(wk.a); paintWreck(wk); ctx = saved;
      wk.sprite = {c, S};
    }

  function paintWreck(wk){

      ctx.fillStyle = PAPERC; ctx.strokeStyle = INKC; ctx.lineWidth = 1.6; path(x0, x1); ctx.fill(); ctx.stroke(); // the deck

      ctx.fillStyle = PAPERC; ctx.fillRect(a0 + 4, -hb + 6.5, a1 - a0 - 8, B - 13); ctx.strokeRect(a0 + 4, -hb + 6.5, a1 - a0 - 8, B - 13);

      for(let u = a0 + 4; u < a1 - 6; u += 9) for(const sd of [-1, 1]){ if(rnd(u*7 + sd) < 0.3) continue;

        ctx.fillStyle = V(0.55); ctx.fillRect(a0 + L*0.06, -2.5, L*0.07, 5); ctx.strokeRect(a0 + L*0.06, -2.5, L*0.07, 5);
        const fx = a1 - L*0.1; ctx.fillStyle = INKC; ctx.beginPath(); ctx.ellipse(fx, 0, 5, 3.4, 0, 0, Math.PI*2); ctx.fill();

    });

    ctx.strokeStyle = INKC; ctx.lineWidth = 1;
    for(let k=0;k<5;k++){ const u = (xb + xf)/2 + (rnd(k+400)-0.5)*6, v = (rnd(k+410)-0.5)*B; ctx.beginPath(); ctx.moveTo(u - 2, v); ctx.lineTo(u + 1, v + 2 + rnd(k+420)*3); ctx.stroke(); }
    for(let k=0;k<6;k++){ ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc((xb + xf)/2 + (rnd(k+500)-0.5)*8, (rnd(k+510)-0.5)*B*1.4, 1.2 + rnd(k+520)*1.8, 0, Math.PI*2); ctx.fill(); }
  }
  function rockSprite(o){

    const x0 = Math.floor(o.x + Math.min(...xs) - 3), x1 = Math.ceil(o.x + Math.max(...xs) + 3);

  // fish bank: a lumpy patch of stirred, darker water (no ring round it),
  // with a school of small dark fish circling inside on wobbly
  // paths; now and then one jumps. When fished out, the school scatters.
  function drawBank(b){
    if(!inView(b.x,b.y,b.r+30)) return;
    const sc = b.state==='scatter' ? Math.min(1, b.t/1.8) : 0;     // 0 → 1 while dispersing
    const fade = 1 - sc;
    // stirred water
    ctx.globalAlpha = fade;
    for(const [ox,oy,rr] of b.blobs){
      stampDot(softDot('bank', [[0,0.13],[0.7,0.07],[1,0]]), b.x+ox, b.y+oy, rr, 1);
    }
    // the fish, in the shade of their kind (same as the counter icons)
    const shade = INKC, outline = false;                            // all alike: the kind is only known once hauled in
    const net = fishing && fishing.bank===b ? netAmount() : 0;
    const pull = fishing && fishing.bank===b && fishing.phase==='wait' ? Math.min(1, fishing.t/fishing.dur) : 0;
    for(const f of b.fish){
      const a = f.a + f.sp*b.t;
      let rr = b.r*f.rad*(1 + f.wob*Math.sin(b.t*0.9+f.ph));
      let x = b.x + Math.cos(a)*rr, y = b.y + Math.sin(a)*rr;
      let hd = a + (f.sp>0 ? Math.PI/2 : -Math.PI/2) + 0.25*Math.sin(b.t*3+f.ph);
      if(net>0 && pull>0){                              // drawn toward the net as the minutes pass

        x += (tx-x)*pull*0.7; y += (ty-y)*pull*0.7;

  }
  // the net: thrown from the boat toward the bank's middle, flying out in a
  // little arc as it opens; hauled back in to the boat
  function netPos(){
    const f = fishing; if(!f) return [boat.x, boat.y];
    const k = netAmount(), e = k*k*(3-2*k), dist = 8 + (f.thr - 8)*e;
    const lift = f.phase==='drop' ? Math.sin(Math.PI*Math.min(1, f.t/NET_DROP))*9 : 0;   // in the air on the way out
    return [boat.x + f.ux*dist, boat.y + f.uy*dist - lift];
  }
  function netCentreX(){ return netPos()[0]; }
  function netCentreY(){ return netPos()[1]; }
  // net: a wobbly mesh with a ring of bobbing floats and two lines to the boat
  function drawNet(){
    const k = netAmount();
    if(k<=0) return;
    const e = k*k*(3-2*k);
    const cx = netCentreX(), cy = netCentreY(), R = 20*e;
    const wob = (a)=> R*(1 + 0.08*Math.sin(a*3 + t*1.7) + 0.05*Math.sin(a*5 - t*2.3));
    // lines from the gunwale
    const s = fishing.side, ca = Math.cos(boat.angle), sa = Math.sin(boat.angle);
    ctx.strokeStyle = INKC; ctx.lineWidth = 1;
    ctx.beginPath();
    for(const f of [6,-12]){
      const hx = boat.x + ca*f - sa*s*8, hy = boat.y + sa*f + ca*s*8;
      ctx.moveTo(hx,hy); ctx.lineTo(cx + (hx-cx)*0.35, cy + (hy-cy)*0.35);
    }

    ctx.save();
    ctx.beginPath();
    for(let i=0;i<=24;i++){ const a=i/24*Math.PI*2, r=wob(a); const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r; if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); }

    ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.6;

      ctx.moveTo(cx+u-R, cy-R+sway); ctx.lineTo(cx+u+R, cy+R+sway);
      ctx.moveTo(cx+u+R, cy-R-sway); ctx.lineTo(cx+u-R, cy+R-sway);
    }
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    // cork floats on the rim, bobbing
    for(let i=0;i<10;i++){
      const a = i/10*Math.PI*2 + 0.2, r = wob(a) + Math.sin(t*3+i*1.7)*0.8;
      const x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
      ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = INKC; ctx.lineWidth = 1.1; ctx.stroke();
    }
  }


  // the boat; with g (a client's boat at the guest pier: {x, y, angle, speed,
  // moored, …}) the same model is drawn for it, sail furled when it's tied up
  // the steam over the funnel: little cartoon clouds, white with an ink outline (all the young puffs stroked first,
  // then filled, so they merge into one billowing plume), growing as they rise; old ones break up into a few dotted
  // wisps and fade. A puff's height shows as a shift up the screen (BOAT_TILT), like the boat's own
  function drawSteam(){
    if(!steam.length) return;
    const groups = [[new Path2D(), 0, 1], [new Path2D(), 0, STEAM_LIGHT + 0.25]], wisps = new Path2D();
    for(const f of steam){
      const y = f.y - f.z*BOAT_TILT;
      if(!inView(f.x, y, 14)) continue;
      const q = f.life/f.max, r = f.r*(1 + 3.5*q);
      if(q < 0.62){ const gp = groups[f.a > 0.85 ? 0 : 1]; gp[0].moveTo(f.x + r, y); gp[0].arc(f.x, y, r, 0, Math.PI*2); gp[1]++; }
      else for(let m=0;m<3;m++){ const a = f.seed + m*2.1, d = r*0.7, rr = r*0.45*(1 - q)/0.38 + 0.4;
        wisps.moveTo(f.x + Math.cos(a)*d + rr, y + Math.sin(a)*d); wisps.arc(f.x + Math.cos(a)*d, y + Math.sin(a)*d, rr, 0, Math.PI*2); }
    }

    for(const [path, n, al] of groups){

      ctx.fillStyle = PAPERC; ctx.fill(path);
    }

  }
  function drawBoat(g){
    const B = g || boat;
    const LWK = 1;                      // line-width factor for the boat's details
    // buoyancy: the swell lifts and drops her (the shadow shifts), rolls her
    // from side to side and pitches bow and stern; rougher with more wind
    // and after a knock (B.rock), gentle when she lies still
    const sea = 0.6 + 0.4*windStrength + (B.rock||0);
    const heave = (Math.sin(t*1.25) + 0.5*Math.sin(t*2.05+1.3))*sea;          // up and down
    // she is a little 3D model: roll (about her keel, + lifts the starboard side) and pitch (+ lifts the bow) are
    // damped springs, pulled toward the swell's motion, a heel to leeward with the sail drawing (most with the wind
    // on the beam), a lean out of a turn, the bow lifting as she gathers way and dipping as she slows; knocks
    // (B.rock) shake her
    {
      const now = performance.now(), mdt = Math.min(0.05, (now - (B.motLast || now))/1000); B.motLast = now;
      const sm = sea*BOAT_SEA_MOTION;
      const rollWave = (Math.sin(t*1.6+0.4)*0.07 + Math.sin(t*2.7)*0.035)*sm;
      const pitchWave = (Math.sin(t*1.1+2.1) + 0.4*Math.sin(t*2.3))*0.03*sm;
      const rel = norm(B.angle - windAngle - (B.windOff||0)), lee = (B.boomSigned||0) >= 0 ? 1 : -1;
      const drive = B.rig ? (B.sailPower||0)*(B.sailAmount === undefined ? 1 : B.sailAmount)*(1 - (B.furl||0)) : 0;
      const heel = -lee*BOAT_HEEL*drive*Math.abs(Math.sin(rel))*(B.rig === 'lateen' ? 1 : 0.8);
      const turn = mdt > 0 ? norm(B.angle - (B.angPrev === undefined ? B.angle : B.angPrev))/mdt : 0; B.angPrev = B.angle; B.turnRate = turn;

        const sw = Math.sin(t*1.7 + ff + sd)*0.3 + roll*5*sd;           // a little swing

        ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, 2.2, 1.5, 0, 0, Math.PI*2); ctx.clip();
        ctx.fillStyle = V(0.55); ctx.fillRect(x - 2.5, y + 0.2, 5, 1.6);   // shaded lower half

        ctx.fillStyle = INKC; ctx.fillRect(x - 0.5, y - sd*1.5 - 0.4, 1, 0.8);              // the eye at its top

      const [a0, a1] = P(20.4, 0, FB), [b0, b1] = P(22.6, 0, FB + 7), [c0, c1] = P(-18.4, 0, FB), [d0, d1] = P(-19.6, 0, FB + 3.5);
      ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(a0, a1); ctx.lineTo(b0, b1); ctx.moveTo(c0, c1); ctx.lineTo(d0, d1); ctx.stroke();

    }
    if(!g && anchored){                                // anchor rode running down from the bow
      ctx.strokeStyle = INKC; ctx.lineWidth = 1*LWK; ctx.setLineDash([2,1.5]);
      ctx.beginPath(); ctx.moveTo(19,0); ctx.quadraticCurveTo(26, 2+Math.sin(t*1.5)*1.5, 31, 0); ctx.stroke();

    }

    ctx.beginPath(); ctx.moveTo(-17.5,0); ctx.lineTo(-17.5+Math.cos(rud*0.75)*7, Math.sin(rud*0.75)*7); ctx.stroke();
    // the helmsman: a black figure seen from above, sitting aft beside the tiller with a hand on it,

    }

    const zY = MAST_H - 2, zF = zY - (zY - FB - 5)*(1 - 0.85*furl);

    L(zF); ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; sailPath(); ctx.stroke();       // the foot
    { const a0 = P(ax, ay, zF), a1 = P(ax, ay, zY), b0 = P(bx, by, zF), b1 = P(bx, by, zY);   // the two leeches

    ctx.strokeStyle=INKC; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx+nx*belly*k*0.72, my+ny*belly*k*0.72); ctx.stroke();

    ctx.restore();
    ctx.restore();
  }

  // the lateen sail (boat frame, bow at +x): a long slanted yard slung on a
  // short mast near the bow; the triangle of cloth trails aft from it and is
  // eased out to leeward (B.boomSigned: the yard's angle off the centreline,
  // its sign the lee side; it swings across the middle when she tacks or gybes)
  function drawLateenSail(B, P, L, base, FB, mast){

    const mx = 6, my = 0;                                   // the mast
    const LA = 22*SAIL_SIZE*LATEEN_SIZE, LF = 9*SAIL_SIZE*LATEEN_SIZE;              // yard aft and forward of the mast
    const ex = -Math.cos(sabs), ey = lee*Math.sin(sabs);    // along the yard, toward its peak
    const tx = mx - ex*LF, ty = my - ey*LF;                 // tack: the yard's low forward end
    const px = mx + ex*LA, py = my + ey*LA;                 // peak: its high aft end
    const furl = B.furl, open = 1 - furl;
    const p = B.sailPower*open;
    const reef = (0.3 + 0.7*B.sailAmount)*(1 - 0.9*furl);
    // clew: the sheeted corner, a little further out than the yard; furled, it's drawn up to the yard
    const ca = sabs + 0.5, CL = 0.62*LA*(1 - 0.75*furl);
    const cx = mx - Math.cos(ca)*CL, cy = my + lee*Math.sin(ca)*CL;
    const belly = (1.5 + p*7)*reef*SAIL_SIZE*LATEEN_SIZE;
    const luff = p < 0.25 ? (1 - p/0.25) : 0;
    const ripple = Math.sin(t*22)*2.2*luff*open;           // (a furled sail doesn't flap)
    // in 3D: the yard climbs from the tack, low by the bow, to the peak high aft; it hangs from the masthead
    const zT = FB + 3, zP = MAST_H, zMh = zT + (zP - zT)*LF/(LF + LA), zC = FB + 4 + (zMh - FB - 4)*furl;
    // the cloth bellies out to leeward, off the leech and the foot
    const bulge = (x0,y0,x1,y1,amt)=>{
      let nx = -(y1-y0), ny = x1-x0; const L = Math.hypot(nx,ny) || 1; nx/=L; ny/=L;
      if(ny*lee < 0){ nx=-nx; ny=-ny; }
      return [(x0+x1)/2 + nx*amt, (y0+y1)/2 + ny*amt];
    };
    const [l1x,l1y] = bulge(px,py,cx,cy, belly*0.8 + ripple);
    const [f1x,f1y] = bulge(cx,cy,tx,ty, belly*1.3 - ripple);
    const T = P(tx, ty, zT), Pk = P(px, py, zP), C = P(cx, cy, zC), L1 = P(l1x, l1y, (zP + zC)/2), F1 = P(f1x, f1y, (zT + zC)/2), M = P(mx, my, zMh);
    mast(mx, zMh);
    ctx.setTransform(base);
    const sailPath=()=>{ ctx.beginPath(); ctx.moveTo(...T); ctx.lineTo(...Pk);
      ctx.quadraticCurveTo(...L1, ...C); ctx.quadraticCurveTo(...F1, ...T); };
    const tone = SAIL_TONE - 0.14*(1-p) - 0.1*(1-B.sailAmount) - 0.08*furl;
    ctx.fillStyle = V(tone);
    sailPath(); ctx.closePath(); ctx.fill();
    // one seam from the masthead down to the clew, then the ink edge of the cloth
    ctx.strokeStyle=INKC; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(...M); ctx.quadraticCurveTo((M[0]+C[0])/2 + (L1[0]-(Pk[0]+C[0])/2)*0.5, (M[1]+C[1])/2 + (L1[1]-(Pk[1]+C[1])/2)*0.5, ...C); ctx.stroke();
    ctx.lineWidth=1.4; sailPath(); ctx.stroke();
    // the sheet, from the clew to the stern quarter
    const Q = P(-13, lee*6, FB);
    ctx.lineWidth=0.8; ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.moveTo(...C); ctx.lineTo(...Q); ctx.stroke(); ctx.globalAlpha=1;
    // the yard
    ctx.lineWidth=2.2; ctx.lineCap='round';
    ctx.beginPath(); skSeg(T[0],T[1],Pk[0],Pk[1],1.5); ctx.stroke();
    ctx.fillStyle=INKC;
    ctx.beginPath(); ctx.arc(M[0],M[1],1.6,0,Math.PI*2); ctx.fill();
  }



  function draw(){
    frameNo++; bakedThisFrame = 0;
    const w = GW*PX, h = GH*PX;
    // camera follows the boat freely (no edges), snapped to the game-pixel grid
    if(!playing){ camFx = boat.x; camFy = boat.y; }
    let camX = camFx - w/2;
    let camY = camFy - h/2;
    const sk = shake*24;
    camX += sk ? rand(-sk,sk) : 0; camY += sk ? rand(-sk,sk) : 0;
    const gx = Math.round(camX/PX), gy = Math.round(camY/PX);
    camX = gx*PX; camY = gy*PX;

    ctx.setTransform(1/PX,0,0,1/PX,0,0);
    ctx.fillStyle=PAPERC; ctx.fillRect(0,0,w+PX,h+PX);
    ctx.save();
    ctx.translate(-camX,-camY);
    drawSea(camX,camY,w,h);
    drawDeep(camX,camY,w,h);                                   // the deep water, where big waves run: a darker sea
    drawBoilTint(camX,camY,w,h);                               // the boiling South: a murkier sea…
    drawRoomSeams(camX,camY,w,h);                              // the room map's squares, dotted on the sea

    // near an edge the view overlaps a neighbouring copy of the world:
    // draw each layer once per copy that touches the screen
    const shiftsFor = (M)=>{
      const out = [];
      for(const sx of [-WORLD.w, 0, WORLD.w]) for(const sy of [-WORLD.h, 0, WORLD.h]){
        if(camX+w < sx-M || camX > sx+WORLD.w+M || camY+h < sy-M || camY > sy+WORLD.h+M) continue;
        out.push([sx,sy]);
      }
      return out;
    };
    const shifts = shiftsFor(320), islandShifts = shiftsFor(320 + MAX_RMAX);   // (a big island may reach far past the edge)
    const layer = (fn, wide)=>{
      for(const [sx,sy] of (wide ? islandShifts : shifts)){
        ctx.save(); ctx.translate(sx,sy);
        view.x=camX-sx; view.y=camY-sy; view.w=w; view.h=h;
        fn(sx,sy);
        ctx.restore();
      }
      view.x=camX; view.y=camY;
    };
    const visIslands = ()=>{
      const out = [];
      islandGrid.query(view.x+w/2, view.y+h/2, Math.max(w,h)/2+60, isl=>{ if(inView(isl.x,isl.y,isl.rmax+50)) out.push(isl); });
      return out;
    };
    layer(()=>{ for(const wp of whirlpools) if(wp.s>0 && inView(wp.x,wp.y,wp.r+10)){ ctx.globalAlpha = wp.s; drawWhirlpool(wp); ctx.globalAlpha = 1; } });
    layer(()=>drawBoilBubbles());                             // …bubbling
    layer(()=>{ if(drawnIsl) drawIslandWater(drawnIsl); for(const isl of visIslands()) drawIslandWater(isl); }, true);
    layer(()=>{ for(const isl of visIslands()) drawIslandLand(isl); if(drawnIsl) drawIslandLand(drawnIsl); }, true);   // (the drawn land over the villages' edges, so they join it)
    layer(()=>{ const vis = []; rockGrid.query(view.x+w/2, view.y+h/2, Math.max(w,h)/2+20, o=>{ if(!o.hidden && inView(o.x,o.y,o.r+6)) vis.push(o); }); drawRocks(vis);
      for(const wk of wrecks) if(inView(wk.x, wk.y, wk.L*0.7)) drawWreck(wk); });
    layer(()=>{ for(const b of banks) drawBank(b); for(const bo of bottles) drawBottle(bo); });
    layer(()=>drawShark());
    layer(()=>drawZora());
    layer(()=>{ for(const w of rollers) drawRoller(w); });
    layer(()=>{ for(const b of buoys) drawBuoy(b); for(const tr of traders) drawTrader(tr); });   // under the fog
    drawCloudShadowsAll(camX, camY, w, h);                   // cloud shadows fall on sea and land
    drawRain(camX, camY, w, h);                              // showers under the rain clouds
    drawStorms(camX, camY, w, h);                            // lightning: the warning ring and the bolts
    drawFog(camX, camY, w, h);
    layer(()=>{ for(const v of VILLAGES) if(inView(v.isl.vl.light.x, v.isl.vl.light.y, BEAM_LEN)) drawBeam(v.isl.vl.light); });
    drawNet();
    layer(()=>{
      ctx.fillStyle=INKC;
      // bow spray: white bits with a broken ink rim; young ones whole, old
      // ones breaking into a few specks as they fade
      if(bowSpray.length){
        const solid = new Path2D(), rims = new Path2D(), specks = new Path2D();
        for(const f of bowSpray){
          if(!inView(f.x,f.y,6)) continue;
          const q = f.life/f.max, r = f.r*(1 + 1.2*q);
          if(q < 0.55){ solid.moveTo(f.x + r, f.y); solid.arc(f.x, f.y, r, 0, Math.PI*2);
            rims.moveTo(f.x + Math.cos(f.seed)*r, f.y + Math.sin(f.seed)*r); rims.arc(f.x, f.y, r, f.seed, f.seed + 3.6); }
          else for(let m=0;m<3;m++){ const a = f.seed + m*2.1, d = r*0.9, rr = r*0.35*(1 - q) + 0.3;
            specks.moveTo(f.x + Math.cos(a)*d + rr, f.y + Math.sin(a)*d); specks.arc(f.x + Math.cos(a)*d, f.y + Math.sin(a)*d, rr, 0, Math.PI*2); }
        }
        ctx.globalAlpha = 0.85; ctx.strokeStyle = INKC; ctx.lineWidth = 1; ctx.stroke(rims); ctx.globalAlpha = 1;
        ctx.fillStyle = PAPERC; ctx.fill(solid);
        ctx.fillStyle = INKC; ctx.globalAlpha = 0.55; ctx.fill(specks); ctx.globalAlpha = 1;
        ctx.fillStyle = INKC;
      }
      for(const f of wake){
        if(!inView(f.x,f.y,4)) continue;
        const k=f.life/f.max;
        ctx.globalAlpha = k*0.6;
        ctx.beginPath(); ctx.arc(f.x,f.y,1+(1-k)*2.2,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      for(const g of gulls) if(inView(g.x+26,g.y+32,16)) drawGullShadow(g);
    });
    layer(()=>{ for(const g of guests) if(inView(g.x, g.y, 40)) drawBoat(g); });   // the clients' boats
    drawBoat();
    layer(()=>drawSteam());                                  // the funnel's steam, over the boat
    layer(()=>drawBoilFumes());
    layer(()=>drawStones());                                 // slingshot stones in the air, and their splashes                              // steam rising off the boiling South
    layer(()=>drawStreaks());
    layer(()=>{
      for(const g of gulls) if(inView(g.x,g.y,16)) drawGull(g);
      ctx.textAlign='center';
      ctx.font='bold 14px Georgia, serif';
      ctx.lineJoin='round';
      for(const pp of popups){
        if(!inView(pp.x,pp.y,60)) continue;
        ctx.globalAlpha = Math.min(1, pp.life/pp.max*1.5);
        ctx.strokeStyle=PAPERC; ctx.lineWidth=4;
        ctx.strokeText(pp.text, pp.x, pp.y);
        ctx.fillStyle=INKC;
        ctx.fillText(pp.text, pp.x, pp.y);
      }
      ctx.globalAlpha = 1;
    });
    drawCloudsAbove(camX, camY, w, h);                        // closest to the camera: over everything
    if(flashT > 0){ ctx.globalAlpha = Math.min(0.7, flashT*2.6); ctx.fillStyle = PAPERC; ctx.fillRect(camX, camY, w, h); ctx.globalAlpha = 1; }   // a lightning flash
    ctx.restore();

    nightCamX = camX; nightCamY = camY;
    ditherPass(gx, gy);
    if(!gl){ sctx.imageSmoothingEnabled = false; sctx.drawImage(obuf, 0, 0, GW, GH, 0, 0, GW*K, GH*K); }   // (the WebGL pass draws straight to the screen)

    drawWheel();
    placeTip();                                             // tutorial bubble (only while a control is being taught)
    if(!logIconDone) drawLogbookIcon();                     // once (it needs the dither table, ready by now)
    if(tutAt('compass')) drawCompass();                    // shown from the tutorial's compass step on
  }


  const elFps = document.getElementById('fps');
  let fpsN = 0, fpsT0 = 0;
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    t += dt;
    const tW = performance.now();
    if(playing) update(dt);
    draw();
    workMs += performance.now() - tW;
    fpsN++;                                                 // frame rate, shown in the logbook (only while it's open)
    if(now - fpsT0 >= 500){ if(bookOpen) elFps.textContent = Math.round(fpsN*1000/(now - fpsT0)) + ' fps · ' + (gl ? 'gl' : 'js') + (gl ? (SCENE_ON_CPU ? '/cpu' : '/gpu') : '')
      + ' · ' + (workMs/fpsN).toFixed(1) + ' ms (up ' + (upMs/fpsN).toFixed(1) + ')'; fpsN = 0; fpsT0 = now; upMs = 0; workMs = 0; }
    // gl / js: the dither runs on the GPU, or the slow JS fallback; ms: JS time per frame; up: of which copying the frame to the GPU
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
