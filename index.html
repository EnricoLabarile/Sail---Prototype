  function drawGull(g){
    const s = gullWing(g), span = 11*s;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(Math.atan2(g.uy,g.ux));
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=PAPERC; ctx.lineWidth=4.5; gullShape(span, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(5,0); ctx.stroke();
    ctx.strokeStyle=INKC; ctx.lineWidth=1.7; gullShape(span, 3); ctx.stroke();
    ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(4.5,0); ctx.stroke();   // body + tail
    ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(4.5,0,1.6,0,Math.PI*2); ctx.fill();         // head
    ctx.restore();
  }

  // whirlpool: soft dithered halo and funnel, and many short foam streaks
  // that are sucked inward along a logarithmic spiral, turning faster as
  // they near the eye (like real water, angular speed grows toward the
  // centre). The core edge is a broken, wobbling foam ring.
  const WP_PARTS = 38, WP_LIFE = 3.6;           // streaks per whirlpool, seconds rim → eye
  function drawWhirlpool(w){
    const halo = ctx.createRadialGradient(w.x,w.y,w.core,w.x,w.y,w.r);
    halo.addColorStop(0, V(0.86)); halo.addColorStop(0.35, V(0.93));
    halo.addColorStop(0.7, V(0.975)); halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.fill();
    const g = ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.core*1.1);
    g.addColorStop(0, V(0.2)); g.addColorStop(0.4, V(0.55));
    g.addColorStop(0.8, V(0.78)); g.addColorStop(1, V(0.86));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.core*1.1,0,Math.PI*2); ctx.fill();

    if(!w.parts){
      w.parts=[];
      for(let k=0;k<WP_PARTS;k++) w.parts.push({ph:Math.random(), a0:Math.random()*Math.PI*2, len:0.05+Math.random()*0.05});
    }
    const R0 = w.r*0.9, EYE = 3;
    const C = 1.1;                                 // spiral tightness
    const pos = (p, a0)=>{                         // p: 0 at rim → 1 at eye
      const r = EYE + (R0-EYE)*Math.pow(1-p, 1.25);
      const th = a0 + w.rot*0.35 + w.dir*C*Math.log(R0/r);
      return [w.x+Math.cos(th)*r, w.y+Math.sin(th)*r];
    };
    ctx.strokeStyle=INKC; ctx.lineCap='round';
    for(const q of w.parts){
      const p = (t/WP_LIFE + q.ph) % 1;
      const head = p, tail = Math.max(0, p - q.len*(0.6+p));
      const fadeIn = Math.min(1, p/0.18), fadeOut = Math.min(1, (1-p)/0.1);
      ctx.globalAlpha = w.s * (0.25 + 0.75*p) * fadeIn * fadeOut;
      ctx.lineWidth = 0.9 + p*0.9;
      ctx.beginPath();
      for(let s=0;s<=4;s++){
        const [x,y] = pos(tail + (head-tail)*s/4, q.a0);
        if(s===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=w.s;
    // broken foam ring at the core's edge, gently wobbling and turning
    ctx.lineWidth=1.4;
    for(let k=0;k<7;k++){
      const a = w.rot*0.6*w.dir + k*Math.PI*2/7;
      const rr = w.core + Math.sin(t*1.7 + k*2.1)*1.6;
      ctx.beginPath(); ctx.arc(w.x,w.y,rr,a,a+0.6); ctx.stroke();
    }
    ctx.fillStyle=INKC;
    ctx.beginPath(); ctx.arc(w.x,w.y,2.2,0,Math.PI*2); ctx.fill();
  }
  // a faraglione: base in the water, a sheer pale column rising H px
  // (toward the top of the screen), a scrubby cap, and a long shadow
  function drawStack(o){
    const H = o.h;
    const poly = (ox,oy,s)=>{ ctx.beginPath(); o.pts.forEach(([px,py],k)=>{ const x=o.x+ox+px*s, y=o.y+oy+py*s; k? ctx.lineTo(x,y) : ctx.moveTo(x,y); }); ctx.closePath(); };
    ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.globalAlpha=0.45;              // surf at the foot
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r+3+Math.sin(t*2+o.foam),0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,0.3)'; poly(H*0.55, H*0.3, 1); ctx.fill();          // shadow
    ctx.fillStyle=V(0.66);
    for(let k=0;k<=H;k+=1.5){ poly(0,-k,1); ctx.fill(); }                         // the column
    ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.globalAlpha=0.75;                  // fissures
    ctx.beginPath();
    o.pts.forEach(([px,py],k)=>{ if(py<-o.r*0.2) return; const x=o.x+px, y=o.y+py; ctx.moveTo(x,y); ctx.lineTo(x,y-H*(0.5+0.5*((k*37)%10)/10)); });
    ctx.stroke(); ctx.globalAlpha=1;
    ctx.lineWidth=1.2; poly(0,0,1); ctx.stroke();                                 // waterline
    ctx.fillStyle=PAPERC; poly(0,-H,1); ctx.fill();                              // flat top
    ctx.fillStyle=V(0.6); poly(o.r*0.1,-H+o.r*0.05,0.6); ctx.fill();             // scrub on top
    ctx.lineWidth=1.3; poly(0,-H,1); ctx.stroke();
  }
  function drawRock(o){
    if(o.stack) return drawStack(o);
    // surf ring, faint → dotted after dithering
    ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.globalAlpha=0.45;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r+3+Math.sin(t*2+o.foam)*1,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
    // body in shadow tone, lit top face in paper, ink outline
    const path=(ox,oy,s)=>{
      ctx.beginPath();
      ctx.moveTo(o.x+ox+o.pts[0][0]*s, o.y+oy+o.pts[0][1]*s);
      for(let k=1;k<o.pts.length;k++) ctx.lineTo(o.x+ox+o.pts[k][0]*s, o.y+oy+o.pts[k][1]*s);
      ctx.closePath();
    };
    ctx.fillStyle=V(0.4); path(0,0,1); ctx.fill();
    ctx.fillStyle=PAPERC; path(-o.r*0.18,-o.r*0.22,0.62); ctx.fill();
    ctx.strokeStyle=INKC; ctx.lineWidth=o.r>5?1.4:1.1; path(0,0,1); ctx.stroke();
  }

  // fish bank: a lumpy patch of stirred, darker water ringed by broken
  // ripples, with a school of small dark fish circling inside on wobbly
  // paths; now and then one jumps. When fished out, the school scatters.
  function drawBank(b){
    if(!inView(b.x,b.y,b.r+30)) return;
    const sc = b.state==='scatter' ? Math.min(1, b.t/1.8) : 0;     // 0 → 1 while dispersing
    const fade = 1 - sc;
    const pulse = 0.5+0.5*Math.sin(b.t*1.6);
    // stirred water
    ctx.globalAlpha = fade;
    for(const [ox,oy,rr] of b.blobs){
      const g = ctx.createRadialGradient(b.x+ox,b.y+oy,0,b.x+ox,b.y+oy,rr);
      g.addColorStop(0,'rgba(0,0,0,0.13)'); g.addColorStop(0.7,'rgba(0,0,0,0.07)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x+ox,b.y+oy,rr,0,Math.PI*2); ctx.fill();
    }
    // broken ripple ring, slowly turning and breathing
    ctx.strokeStyle = INKC; ctx.lineCap='round';
    for(const q of b.ripples){
      const a = q.a + b.rot, rr = b.r*(q.rr + 0.05*Math.sin(b.t*1.3+q.ph)) * (1+sc*0.6);
      ctx.lineWidth = 1.5 + pulse*0.6;
      ctx.globalAlpha = fade*(0.85+0.15*Math.sin(b.t*2+q.ph));
      ctx.beginPath(); ctx.arc(b.x,b.y,rr,a,a+q.len); ctx.stroke();
    }
    // the fish, in the shade of their kind (same as the counter icons)
    const shade = {nord:PAPERC, est:V(0.78), sud:V(0.45), ovest:INKC}[b.sec], outline = b.sec!=='ovest';
    const net = fishing && fishing.bank===b ? netAmount() : 0;
    const pull = fishing && fishing.bank===b && fishing.phase==='wait' ? Math.min(1, fishing.t/fishing.dur) : 0;
    for(const f of b.fish){
      const a = f.a + f.sp*b.t;
      let rr = b.r*f.rad*(1 + f.wob*Math.sin(b.t*0.9+f.ph));
      let x = b.x + Math.cos(a)*rr, y = b.y + Math.sin(a)*rr;
      let hd = a + (f.sp>0 ? Math.PI/2 : -Math.PI/2) + 0.25*Math.sin(b.t*3+f.ph);
      if(net>0 && pull>0){                              // drawn toward the net as the minutes pass
        const tx = b.x + wdx(netCentreX(), b.x), ty = b.y + wdy(netCentreY(), b.y);
        x += (tx-x)*pull*0.7; y += (ty-y)*pull*0.7;
      }
      if(sc>0){                                          // scatter outward and fade
        const out = Math.atan2(y-b.y, x-b.x);
        x += Math.cos(out)*sc*b.r*1.6; y += Math.sin(out)*sc*b.r*1.6; hd = out;
      }
      ctx.globalAlpha = fade*0.9;
      ctx.save(); ctx.translate(x,y); ctx.rotate(hd); ctx.scale(f.size*1.2,f.size*1.2);
      ctx.fillStyle = shade; ctx.strokeStyle = INKC; ctx.lineWidth = 0.9/(f.size*1.2);
      ctx.beginPath(); ctx.ellipse(0,0,4,1.6,0,0,Math.PI*2); ctx.fill(); if(outline) ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-3.2,0); ctx.lineTo(-6,-2); ctx.lineTo(-6,2); ctx.closePath(); ctx.fill(); if(outline) ctx.stroke();
      ctx.restore();
    }
    // a fish jumping: a tiny arc and a splash ring
    if(b.jump && fade>0){
      const j = b.jump, k = j.t/0.9, x = b.x+Math.cos(j.a)*j.d, y = b.y+Math.sin(j.a)*j.d;
      ctx.globalAlpha = fade*(1-k);
      ctx.strokeStyle = INKC; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x,y,2+k*7,0,Math.PI*2); ctx.stroke();
      if(k<0.6){ ctx.fillStyle=INKC; ctx.beginPath(); ctx.ellipse(x, y-Math.sin(k/0.6*Math.PI)*6, 3.5,1.4, j.a, 0, Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }
  // the net hangs off the boat's side, astern
  function netCentreX(){ const s = fishing ? fishing.side : 1; return boat.x - Math.cos(boat.angle)*14 - Math.sin(boat.angle)*s*20; }
  function netCentreY(){ const s = fishing ? fishing.side : 1; return boat.y - Math.sin(boat.angle)*14 + Math.cos(boat.angle)*s*20; }
  // net: a wobbly mesh with a ring of bobbing floats and two lines to the boat
  function drawNet(){
    const k = netAmount();
    if(k<=0) return;
    const e = k*k*(3-2*k);
    const cx = netCentreX(), cy = netCentreY(), R = 20*e;
    const wob = (a)=> R*(1 + 0.08*Math.sin(a*3 + t*1.7) + 0.05*Math.sin(a*5 - t*2.3));
    // lines from the gunwale
    const s = fishing.side, ca = Math.cos(boat.angle), sa = Math.sin(boat.angle);
    ctx.strokeStyle = INKC; ctx.lineWidth = 1;
    ctx.beginPath();
    for(const f of [6,-12]){
      const hx = boat.x + ca*f - sa*s*8, hy = boat.y + sa*f + ca*s*8;
      ctx.moveTo(hx,hy); ctx.lineTo(cx + (hx-cx)*0.35, cy + (hy-cy)*0.35);
    }
    ctx.stroke();
    // mesh, clipped to the wobbly outline
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<=24;i++){ const a=i/24*Math.PI*2, r=wob(a); const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r; if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); }
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fill();
    ctx.clip();
    ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.6;
    const sway = Math.sin(t*1.2)*1.5;
    ctx.beginPath();
    for(let u=-R-6; u<=R+6; u+=4.5){
      ctx.moveTo(cx+u-R, cy-R+sway); ctx.lineTo(cx+u+R, cy+R+sway);
      ctx.moveTo(cx+u+R, cy-R-sway); ctx.lineTo(cx+u-R, cy+R-sway);
    }
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    // cork floats on the rim, bobbing
    for(let i=0;i<10;i++){
      const a = i/10*Math.PI*2 + 0.2, r = wob(a) + Math.sin(t*3+i*1.7)*0.8;
      const x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
      ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = INKC; ctx.lineWidth = 1.1; ctx.stroke();
    }
  }


  function drawBoat(){
    const LWK = 1;                      // line-width factor for the boat's details
    // buoyancy: the swell lifts and drops her (the shadow shifts), rolls her
    // from side to side and pitches bow and stern; rougher with more wind
    // and after a knock (boat.rock), gentle when she lies still
    const sea = 0.6 + 0.4*windStrength + (boat.rock||0);
    const heave = (Math.sin(t*1.25) + 0.5*Math.sin(t*2.05+1.3))*sea;          // up and down
    const roll  = (Math.sin(t*1.6+0.4)*0.05 + Math.sin(t*2.7)*0.025)*sea;       // side to side
    const pitch = (Math.sin(t*1.1+2.1) + 0.4*Math.sin(t*2.3))*0.018*sea;       // bow up, bow down
    ctx.save();
    ctx.translate(boat.x, boat.y - heave*0.6);
    ctx.rotate(boat.angle);
    ctx.save();
    ctx.scale(1 + pitch, 1 - Math.abs(roll)*0.9);          // pitching lengthens, rolling narrows her from above
    ctx.transform(1, 0, roll*0.6, 1, 0, 0);               // a slight lean to the rolling side
    // hull outline (boat frame, bow at +x)
    const hullPath=(s)=>{
      ctx.beginPath();
      ctx.moveTo(21*s,0);
      ctx.quadraticCurveTo(11*s,-10.5*s,-7*s,-9.5*s);
      ctx.lineTo(-16*s,-6.5*s);
      ctx.lineTo(-16*s,6.5*s);
      ctx.lineTo(-7*s,9.5*s);
      ctx.quadraticCurveTo(11*s,10.5*s,21*s,0);
      ctx.closePath();
    };
    // shadow on the water: further off when a swell lifts her
    ctx.save(); ctx.rotate(-boat.angle); ctx.translate(2.5 + heave*0.5, 3 + heave*0.9); ctx.rotate(boat.angle);
    ctx.fillStyle=V(0.55); hullPath(1); ctx.fill();
    ctx.restore();
    // rudder: a blade hung off the transom, turned by the wheel
    const rud = wheelAngle/WHEEL_MAX;
    {
      const ra = Math.PI - rud*0.75;                     // points astern, swings with the helm
      ctx.save(); ctx.translate(-15.5, 0); ctx.rotate(ra);
      ctx.fillStyle = PAPERC; ctx.strokeStyle = INKC; ctx.lineWidth = 1.1*LWK;
      ctx.beginPath(); ctx.moveTo(0,-1.2); ctx.lineTo(8,-2.2); ctx.quadraticCurveTo(10,0,8,2.2); ctx.lineTo(0,1.2); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // hull: paper; blinks to ink when hit
    const blink = hurtFlash>0 && Math.floor(hurtFlash*20)%2===0;
    ctx.fillStyle = blink ? INKC : PAPERC;
    hullPath(1); ctx.fill();
    // gunwale line and two thwarts, then the ink outline
    ctx.strokeStyle = blink ? PAPERC : INKC;
    ctx.lineWidth=1; hullPath(0.74); ctx.stroke();
    ctx.lineWidth=1.3;
    ctx.beginPath(); skSeg(9,-6.2,9,6.2,0.6); skSeg(-7,-6.4,-7,6.4,0.6); ctx.stroke();
    ctx.strokeStyle=INKC; ctx.lineWidth=1.8; hullPath(1); ctx.stroke();
    // fenders: two a side, hung over the gunwale on short lines (fore and aft
    // of the oars), swinging a touch with the roll
    for(const [fx, ff] of [[8.5, 0], [-9.5, 1.7]]){
      for(const sd of [-1, 1]){
        const sw = Math.sin(t*1.7 + ff + sd)*0.3 + roll*5*sd;           // a little swing
        const gy = sd*9.4, y = sd*(10.5 + Math.max(0, sw*0.3)), x = fx + sw*0.3;   // snug against the hull
        ctx.strokeStyle = INKC; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(fx, gy); ctx.lineTo(x, y - sd*1.4); ctx.stroke();       // the line
        ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.ellipse(x, y, 2.2, 1.5, 0, 0, Math.PI*2); ctx.fill();
        ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, 2.2, 1.5, 0, 0, Math.PI*2); ctx.clip();
        ctx.fillStyle = V(0.55); ctx.fillRect(x - 2.5, y + 0.2, 5, 1.6);   // shaded lower half
        ctx.restore();
        ctx.lineWidth = 0.9; ctx.beginPath(); ctx.ellipse(x, y, 2.2, 1.5, 0, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = INKC; ctx.fillRect(x - 0.5, y - sd*1.5 - 0.4, 1, 0.8);              // the eye at its top
      }
    }

    if(anchored){                                      // anchor rode running down from the bow
      ctx.strokeStyle = INKC; ctx.lineWidth = 1*LWK; ctx.setLineDash([2,1.5]);
      ctx.beginPath(); ctx.moveTo(19,0); ctx.quadraticCurveTo(26, 2+Math.sin(t*1.5)*1.5, 31, 0); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(31, 0, 2.2, 0, Math.PI*2); ctx.stroke();
    }
    // tiller inside the stern: swings opposite to the rudder blade
    ctx.strokeStyle = INKC; ctx.lineWidth = 1.6*LWK; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(-15+Math.cos(rud*0.75)*7, Math.sin(rud*0.75)*7); ctx.stroke();
    // oars: slide out from the gunwales; when turning, they row in
    // opposite senses on the two sides, which is what spins the boat
    if(boat.oarK > 0.01){
      const k = boat.oarK, e = k*k*(3-2*k);
      const turnDir = Math.sign(rud) || 1;
      for(const sd of [-1,1]){
        // turning: the two sides row against each other; going straight: they pull together
        const turningNow = Math.abs(rud)>0.08;
        const sweep = Math.sin(boat.oarPh + (turningNow && sd<0 ? Math.PI : 0))*0.45 * (turningNow || sailLevel===SAIL_MIN ? 1 : 0.15);
        const a = sd*Math.PI/2 + sd*turnDir*sweep - sd*0.15;
        const ux = Math.cos(a), uy = Math.sin(a);
        const px = -2, py = sd*8.5;                     // rowlock on the gunwale
        const L = 17*e;
        ctx.strokeStyle = INKC; ctx.lineWidth = 1.5*LWK;
        ctx.beginPath(); ctx.moveTo(px-ux*3*e, py-uy*3*e); ctx.lineTo(px+ux*L, py+uy*L); ctx.stroke();
        // blade, with a little splash ring when it bites the water
        const bx = px+ux*L, by = py+uy*L;
        ctx.save(); ctx.translate(bx,by); ctx.rotate(a);
        ctx.fillStyle = PAPERC; ctx.lineWidth = 1.1*LWK;
        ctx.beginPath(); ctx.ellipse(0,0,4.2*e,1.9*e,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.restore();
        const bite = Math.max(0, Math.cos(boat.oarPh + (turningNow && sd<0 ? Math.PI : 0)));
        if((turningNow || sailLevel===SAIL_MIN) && bite>0.7 && e>0.9){
          ctx.globalAlpha = (bite-0.7)/0.3*0.6; ctx.lineWidth = 1*LWK;
          ctx.beginPath(); ctx.arc(bx+ux*3, by+uy*3, 3+(1-bite)*10, 0, Math.PI*2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
    // --- square sail on a yard, pivoting at the mast (centre) ---
    const face = boat.boomSigned;
    const nx = Math.cos(face), ny = Math.sin(face);
    const ux = -ny, uy = nx;
    const mx = 2, my = 0;
    const H = 15;
    const ax = mx-ux*H, ay = my-uy*H;
    const bx = mx+ux*H, by = my+uy*H;
    const p = boat.sailPower;
    const reef = 0.3 + 0.7*boat.sailAmount;
    const belly = (1.5 + p*10)*reef;
    const luff = p < 0.25 ? (1 - p/0.25) : 0;
    const ripple = Math.sin(t*22)*3*luff;
    const k = 1.33;
    const dx = bx-ax, dy = by-ay;
    const c1x = ax + dx/3 + nx*(belly + ripple)*k;
    const c1y = ay + dy/3 + ny*(belly + ripple)*k;
    const c2x = ax + dx*2/3 + nx*(belly - ripple)*k;
    const c2y = ay + dy*2/3 + ny*(belly - ripple)*k;
    const sailPath=()=>{ ctx.beginPath(); ctx.moveTo(ax,ay); ctx.bezierCurveTo(c1x,c1y,c2x,c2y,bx,by); };
    // cloth: paper when drawing well, dotted when slack or reefed
    const tone = 1 - 0.14*(1-p) - 0.1*(1-boat.sailAmount);
    ctx.fillStyle = V(tone);
    sailPath(); ctx.closePath(); ctx.fill();
    // one centre seam, then the ink edge of the cloth
    ctx.strokeStyle=INKC; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx+nx*belly*k*0.72, my+ny*belly*k*0.72); ctx.stroke();
    ctx.lineWidth=1.6; sailPath(); ctx.stroke();
    // yard and mast
    ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); skSeg(ax,ay,bx,by,1.5); ctx.stroke();
    ctx.fillStyle=INKC;
    ctx.beginPath(); ctx.arc(mx,my,2.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function draw(){
    frameNo++;
    const w = GW*PX, h = GH*PX;
    // camera follows the boat freely (no edges), snapped to the game-pixel grid
    if(!playing){ camFx = boat.x; camFy = boat.y; }
    let camX = camFx - w/2;
    let camY = camFy - h/2 + DASH_H/2;           // the dashboard covers the bottom: centre the view in the windscreen
    const sk = shake*24;
    camX += sk ? rand(-sk,sk) : 0; camY += sk ? rand(-sk,sk) : 0;
    const gx = Math.round(camX/PX), gy = Math.round(camY/PX);
    camX = gx*PX; camY = gy*PX;

    ctx.setTransform(1/PX,0,0,1/PX,0,0);
    ctx.fillStyle=PAPERC; ctx.fillRect(0,0,w+PX,h+PX);
    ctx.save();
    ctx.translate(-camX,-camY);
    drawSea(camX,camY,w,h);

    // near an edge the view overlaps a neighbouring copy of the world:
    // draw each layer once per copy that touches the screen
    const M = 320;
    const shifts = [];
    for(const sx of [-WORLD.w, 0, WORLD.w]) for(const sy of [-WORLD.h, 0, WORLD.h]){
      if(camX+w < sx-M || camX > sx+WORLD.w+M || camY+h < sy-M || camY > sy+WORLD.h+M) continue;
      shifts.push([sx,sy]);
    }
    const layer = (fn)=>{
      for(const [sx,sy] of shifts){
        ctx.save(); ctx.translate(sx,sy);
        view.x=camX-sx; view.y=camY-sy; view.w=w; view.h=h;
        fn(sx,sy);
        ctx.restore();
      }
      view.x=camX; view.y=camY;
    };
    const visIslands = ()=>{
      const out = [];
      islandGrid.query(view.x+w/2, view.y+h/2, Math.max(w,h)/2+60, isl=>{ if(inView(isl.x,isl.y,isl.rmax+50)) out.push(isl); });
      return out;
    };
    layer(()=>{ for(const wp of whirlpools) if(wp.s>0 && inView(wp.x,wp.y,wp.r+10)){ ctx.globalAlpha = wp.s; drawWhirlpool(wp); ctx.globalAlpha = 1; } });
    layer(()=>{ for(const isl of visIslands()) drawIslandWater(isl); });
    layer(()=>{ for(const isl of visIslands()) drawIslandLand(isl); });
    layer(()=>{ rockGrid.query(view.x+w/2, view.y+h/2, Math.max(w,h)/2+20, o=>{ if(inView(o.x,o.y,o.r+6)) drawRock(o); }); });
    layer(()=>{ for(const b of banks) drawBank(b); });
    layer(()=>{ for(const w of rollers) drawRoller(w); });
    layer(()=>{ for(const b of buoys) drawBuoy(b); for(const tr of traders) drawTrader(tr); });   // under the fog
    drawCloudShadowsAll(camX, camY, w, h);                   // cloud shadows fall on sea and land
    drawRain(camX, camY, w, h);                              // showers under the rain clouds
    drawFog(camX, camY, w, h);
    layer(()=>{ for(const v of VILLAGES) if(inView(v.isl.vl.light.x, v.isl.vl.light.y, BEAM_LEN)) drawBeam(v.isl.vl.light); });
    drawNet();
    layer(()=>{
      ctx.fillStyle=INKC;
      for(const f of wake){
        if(!inView(f.x,f.y,4)) continue;
        const k=f.life/f.max;
        ctx.globalAlpha = k*0.6;
        ctx.beginPath(); ctx.arc(f.x,f.y,1+(1-k)*2.2,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      for(const g of gulls) if(inView(g.x+26,g.y+32,16)) drawGullShadow(g);
    });
    drawBoat();
    layer(()=>drawStreaks());
    layer(()=>{
      for(const g of gulls) if(inView(g.x,g.y,16)) drawGull(g);
      ctx.textAlign='center';
      ctx.font='bold 14px Georgia, serif';
      ctx.lineJoin='round';
      for(const pp of popups){
        if(!inView(pp.x,pp.y,60)) continue;
        ctx.globalAlpha = Math.min(1, pp.life/pp.max*1.5);
        ctx.strokeStyle=PAPERC; ctx.lineWidth=4;
        ctx.strokeText(pp.text, pp.x, pp.y);
        ctx.fillStyle=INKC;
        ctx.fillText(pp.text, pp.x, pp.y);
      }
      ctx.globalAlpha = 1;
    });
    drawCloudsAbove(camX, camY, w, h);                        // closest to the camera: over everything
    ctx.restore();

    nightCamX = camX; nightCamY = camY;
    ditherPass(gx, gy);
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(obuf, 0, 0, GW, GH, 0, 0, GW*K, GH*K);

    drawWheel();
    drawRope();
    if(!logIconDone) drawLogbookIcon();                     // once (it needs the dither table, ready by now)
    if(!dashDone) drawDash();                               // the wooden dashboard (on resize and when the light changes)
    if(tutAt('rope')) drawCompass();                       // shown from the tutorial's halyard step on
  }

  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    t += dt;
    if(playing) update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
