      },
      // calls fn on every object whose box may overlap (x±rad, y±rad);
      // stops and returns true as soon as fn returns true
      query(x,y,rad,fn){
        stamp++;
        for(let j=Math.floor((y-rad)/cell); j<=Math.floor((y+rad)/cell); j++)
          for(let i=Math.floor((x-rad)/cell); i<=Math.floor((x+rad)/cell); i++){
            for(const o of cells[ci(j,ny)*nx+ci(i,nx)]){
              if(o[key]===stamp) continue;
              o[key]=stamp;
              if(fn(o)===true) return true;
            }
          }
        return false;
      }
    };
  }
  const islandGrid = SpatialGrid(512), rockGrid = SpatialGrid(64);
  const rand = (a,b)=>a+Math.random()*(b-a);
  const norm = (a)=>{ while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a; };

  // ---------- Islands ----------
  // Each island is star-shaped: a radius sampled at ISL_N angles, built from
  // a few random harmonics so the outline is irregular but smooth. Along the
  // perimeter, a low-frequency noise decides rocky vs sandy stretches.
  const ISL_N = 96;
  const COS = new Float32Array(ISL_N), SIN = new Float32Array(ISL_N);
  for(let i=0;i<ISL_N;i++){ COS[i]=Math.cos(i/ISL_N*Math.PI*2); SIN[i]=Math.sin(i/ISL_N*Math.PI*2); }

  function harmonics(kFrom,kTo,aMin,aMax,falloff){
    const h=[];
    for(let k=kFrom;k<=kTo;k++) h.push({k, amp:rand(aMin,aMax)/Math.pow(k,falloff), ph:rand(0,Math.PI*2)});
    return h;
  }
  function evalH(h,th){ let v=0; for(const o of h) v+=o.amp*Math.sin(o.k*th+o.ph); return v; }
  function sumAmp(h){ let v=0; for(const o of h) v+=o.amp; return v; }

  // the island's shape before the wobble, as a radius (in R) for each angle:
  // 'blob' a circle; 'C' a circle with a deep bay cut into one side, its two
  // horns standing out; 'L' two long arms (boxes) meeting at a corner, seen
  // from the middle of the corner; 'islet' a long sandy ellipse (atolls)
  function shapeProfile(kind, rot){
    if(kind === 'C'){
      const b = rand(0, Math.PI*2), w = rand(1.0, 1.3), depth = rand(0.8, 0.86);
      return th=>{
        const d = Math.abs(Math.atan2(Math.sin(th-b), Math.cos(th-b)));            // angle from the bay's mouth
        if(d < w) return 1 - depth*Math.pow(Math.cos(d/w*Math.PI/2), 0.5);        // steep-sided bay
        return 1 + 0.22*Math.exp(-Math.pow((d-w)/0.3, 2));                        // the horns
      };
    }
    if(kind === 'L'){
      const T = rand(0.75, 0.95), A = rand(2.1, 2.7), B = rand(1.6, 2.4), rot = rand(0, Math.PI*2);
      // two boxes from the corner (0,0): [0,A]x[0,T] and [0,T]x[0,B]; rays from (T/2,T/2)
      const exit = (dx, dy, x1, y1)=>{                                             // where a ray from the centre leaves a box
        let t = Infinity;
        if(dx > 1e-6) t = Math.min(t, (x1 - T/2)/dx); else if(dx < -1e-6) t = Math.min(t, (-T/2)/dx);
        if(dy > 1e-6) t = Math.min(t, (y1 - T/2)/dy); else if(dy < -1e-6) t = Math.min(t, (-T/2)/dy);
        return t;
      };
      return th=>{ const dx = Math.cos(th-rot), dy = Math.sin(th-rot); return Math.max(exit(dx,dy,A,T), exit(dx,dy,T,B)); };
    }
    if(kind === 'islet'){
      const a = rand(1.4, 1.9), b = rand(0.5, 0.7);
      return th=>{ const c = Math.cos(th-rot), s2 = Math.sin(th-rot); return a*b/Math.sqrt((b*c)*(b*c) + (a*s2)*(a*s2)); };
    }
    return ()=> 1;
  }
  function makeIsland(x,y,R,kind,rot){
    kind = kind || 'blob';
    const prof = shapeProfile(kind, rot||0), plain = kind === 'blob';
    // big lobes + a fine, crinkled coastline (gentler lobes on the shaped
    // islands, so the shape still reads)
    const shapeH = harmonics(2,9,0.06,plain ? 0.3 : 0.12,0.9).concat(harmonics(10,22,0.008,0.022,0));
    const rockH  = harmonics(1,3,0.4,1,0);
    const vegH   = harmonics(3,7,0.2,0.6,0);
    const edgeH  = harmonics(6,16,0.4,1,0.4);      // wobble of the vegetation line
    const rockNorm = sumAmp(rockH), vegNorm = sumAmp(vegH), edgeNorm = sumAmp(edgeH);
    const radii=new Float32Array(ISL_N), rocky=new Uint8Array(ISL_N), sand=new Float32Array(ISL_N);
    let rmax=0;
    for(let i=0;i<ISL_N;i++){
      const th=i/ISL_N*Math.PI*2;
      const p = R*prof(th), r = Math.max(p*0.6, p*(1+evalH(shapeH,th)));
      radii[i]=r; if(r>rmax) rmax=r;
      rocky[i] = kind !== 'islet' && evalH(rockH,th)/rockNorm > -0.45 ? 1 : 0;   // mostly sheer limestone cliffs (islets: all sand)
      const vn = evalH(vegH,th)/vegNorm;          // -1..1
      const en = evalH(edgeH,th)/edgeNorm;

      // bays elsewhere, with a ragged vegetation line
      sand[i] = rocky[i] ? Math.max(2, 3+2*(vn+1)+en*1.5)
                         : Math.max(4, 6 + 22*Math.pow((vn+1)/2, 1.6) + en*3.5);
      sand[i] = Math.min(sand[i], r*0.5);                       // small islands keep some green in the middle
    }
    if(!plain) for(let pass=0; pass<2; pass++){                 // round off the corners of the shape
      const r0 = radii.slice();
      for(let i=0;i<ISL_N;i++) radii[i] = (r0[(i+ISL_N-1)%ISL_N] + 2*r0[i] + r0[(i+1)%ISL_N])/4;

    }

  }
  // Mediterranean macchia: a close, billowy carpet of tree-spurge domes
  // (Euphorbia dendroides), darker thickets, open patches of stony garrigue,
  // tufts of grass, and here and there a stone pine (Pinus pinea) with its
  // flat umbrella crown.
  const gaussR = ()=> (Math.random()+Math.random()+Math.random()-1.5)/1.5;
  // (any angle, not just the ISL_N sampled ones: on a big island those
  // spokes are far apart and things set along them show as lines)
  function sandAt(isl,th){
    const f=islIndex(th), i0=Math.floor(f)%ISL_N, i1=(i0+1)%ISL_N, k=f-Math.floor(f);
    return isl.sand[i0]*(1-k)+isl.sand[i1]*k;
  }
  function vegPoint(isl, depth){          // random point inside the vegetation, depth 0 edge → 1 centre
    const a=Math.random()*Math.PI*2;
    const inner = rAt(isl,a)-sandAt(isl,a);
    const d = inner*(1-depth);
    return [isl.x+Math.cos(a)*d, isl.y+Math.sin(a)*d, Math.round(islIndex(a))%ISL_N];
  }
  function inVegetation(isl, x, y, m){
    const dx=x-isl.x, dy=y-isl.y, a=Math.atan2(dy,dx), i=Math.round(islIndex(a))%ISL_N;
    return Math.hypot(dx,dy) < rAt(isl,a) - sandAt(isl,a) - m;
  }
  // the spurge carpet: many small domes, allowed to overlap a little, kept
  // out of clearings and anywhere `blocked` says
  function scatterMacchia(isl, blocked, density){
    const R = isl.R, bushes = [], cell = 8, G = Math.ceil(isl.rmax*2/cell)+2, grid = new Array(G*G);
    const ox = isl.x - isl.rmax - cell, oy = isl.y - isl.rmax - cell;
    const sk = Math.pow(R/120, 0.25), cl = isl.clearings;
    const tries = Math.floor(4*isl.rmax*isl.rmax/22*(density||1));          // one try per ~22 px² of the island's box
    // the scrub thins out in irregular open patches (a smooth noise of a few
    // crossing waves, new per island), so it isn't one even carpet
    const ph = [rand(0,6.3), rand(0,6.3), rand(0,6.3), rand(0,6.3)];
    const thin = (x,y)=> Math.sin(x*0.031+ph[0]) + Math.sin(y*0.027+ph[1]) + Math.sin((x+y)*0.019+ph[2]) + Math.sin((x-y)*0.043+ph[3]);
    for(let k=0;k<tries;k++){
      // a point anywhere in the box, kept if it's well inside the scrub
      const r = (2.6 + Math.random()*2.2)*sk;

      if(blocked && blocked(x,y,r)) continue;
      let ok = true;
      for(let c=0;c<cl.length;c++){ const q=cl[c]; if((x-q[0])*(x-q[0])+(y-q[1])*(y-q[1]) < q[2]*q[2]){ ok=false; break; } }
      if(!ok) continue;
      const gx = ((x-ox)/cell)|0, gy = ((y-oy)/cell)|0;

        const list = grid[(gy+b2)*G + gx+a];
        if(list) for(const o of list){ const m=(o.r+r)*0.78; if((o.x-x)*(o.x-x)+(o.y-y)*(o.y-y) < m*m){ ok = false; break; } }
      }
      if(!ok) continue;

  function decorateIsland(isl){

    isl.stones = [];
    for(const [cx,cy,cr] of isl.clearings) for(let m=0;m<Math.floor(cr*0.9);m++){

    }

    isl.bushes = scatterMacchia(isl, (px,py,r)=> isl.yard.some(([cx,cy,rr])=> Math.hypot(px-cx,py-cy) < rr+r+3), 0.8);
    addUmbrella(isl, x+48, y+30);                                   // a stone pine by the house
    isl.umbrellas.forEach(u=>{ if(isl.yard.some(([cx,cy,rr])=> Math.hypot(u.x-cx,u.y-cy) < rr+4)) u.gone = true; });
    isl.umbrellas = isl.umbrellas.filter(u=>!u.gone);
    return isl;
  })();
  // Carve a bay into an island facing `dir`: the coast pulls in around that
  // direction and the two horns either side stand out a little, making a C.
  // Decorations left in the new water are removed.
  // Remove an island's decorations where blocked(x, y, margin) is true.
  function clearDecor(isl, blocked){
    isl.patches = (isl.patches||[]).filter(b=>!b.some(([x,y,r])=>blocked(x,y,r)));
    isl.tufts   = (isl.tufts  ||[]).filter(([x,y])=>!blocked(x,y,1));
    if(isl.bushes) isl.bushes = isl.bushes.filter(b=>!blocked(b.x,b.y,b.r));
    if(isl.umbrellas) isl.umbrellas = isl.umbrellas.filter(u=>!blocked(u.x,u.y,8));
    if(isl.stones) isl.stones = isl.stones.filter(([x,y])=>!blocked(x,y,1));
    isl.specks = null;                                       // re-scattered lazily
  }
  // (the island is registered in the grid afterwards, with its final rmax)
  function carveBay(isl, dir, depth, halfW){
    for(let i=0;i<ISL_N;i++){
      const th = i/ISL_N*Math.PI*2;
      const d = Math.abs(Math.atan2(Math.sin(th-dir), Math.cos(th-dir)));
      let f = 1;
      if(d < halfW){ const c = Math.cos(d/halfW*Math.PI/2); f -= depth*c*c; }
      else if(d < halfW*1.7){ const c = Math.sin((d-halfW)/(halfW*0.7)*Math.PI); f += 0.12*c; }   // horns
      isl.radii[i] *= f;
    }
    isl.rmax = Math.max(...isl.radii);
    // anything now standing in the water goes
    clearDecor(isl, (x,y,m)=> Math.hypot(x-isl.x,y-isl.y) > rAt(isl,Math.atan2(y-isl.y,x-isl.x)) - m - 6);
  }
  // (home is added to the grid once its harbour bay has been carved, below)
  // ---------- Piers ----------
  // A pier runs from a root point on land (r0 from the island centre) out
  // past the shore by PIER_LEN, along direction dir.
  function makePier(isl, dir, r0){
    const cx=Math.cos(dir), cy=Math.sin(dir);
    const shore = rAt(isl, dir);
    const pr = { isl, dir, x0:isl.x+cx*r0, y0:isl.y+cy*r0,
                 x1:isl.x+cx*(shore+PIER_LEN), y1:isl.y+cy*(shore+PIER_LEN), dx:cx, dy:cy };
    pr.total = Math.hypot(pr.x1-pr.x0, pr.y1-pr.y0);
    pr.shoreAlong = shore - r0;                    // where the pier leaves the beach
    buildHarbour(pr);
    return pr;
  }
  // Villages get one tall lighthouse on the left-hand point of their bay
  // (the sweeping beam starts there).
  function buildHarbour(pr){
    const isl = pr.isl;
    pr.lights = []; pr.side = 1;
    if(isl.home) return;
    const ang = pr.dir - 0.95, rr = rAt(isl, ang) - 10;
    pr.lights.push({x:isl.x+Math.cos(ang)*rr, y:isl.y+Math.sin(ang)*rr, tall:true, ph: rand(0,6.3)});
  }
  carveBay(home, PIER_DIR, 0.3, 0.85);
  home.rmax = Math.max(...home.radii);
  const BERTH_OFF_START = PIER_W/2 + 12;
  const PIER = makePier(home, PIER_DIR, Math.min(HOME_R*0.55, rAt(home,PIER_DIR)-8));
  PIER.side = 1;                                   // the boat starts on the open (mouth) side
  // the guest pier, on the far (south) side: the clients' boats tie up here
  // (the player's boat doesn't moor at it, but it's solid like any pier)
  const GUEST_DIR = Math.PI/2;
  const GUEST_PIER = GUESTS_ON ? makePier(home, GUEST_DIR, rAt(home, GUEST_DIR) - 26) : null;
  if(GUEST_PIER){
    GUEST_PIER.guest = true;
    clearDecor(home, (x,y,m)=> segDist(x,y, GUEST_PIER.x0,GUEST_PIER.y0, GUEST_PIER.x1,GUEST_PIER.y1) < PIER_W/2 + m + 4);
  }
  addIsland(home);
  const piers = GUEST_PIER ? [PIER, GUEST_PIER] : [PIER];
  // moored alongside the seaward end of the home quay, bow pointing out to sea
  const SPAWN = (function(){
    const a = PIER.total - 16, off = BERTH_OFF_START;
    return { x: PIER.x0 + PIER.dx*a - PIER.dy*PIER.side*off,
             y: PIER.y0 + PIER.dy*a + PIER.dx*PIER.side*off, angle: PIER.dir };
  })();
  // pier-aligned coordinates: along = out from the pier root toward the
  // sea, lat = signed distance across it (wrapped, like everything else)
  function pierFrame(pr,x,y){
    const ax=wdx(x,pr.x0), ay=wdy(y,pr.y0);
    return {along: ax*pr.dx+ay*pr.dy, lat: -ax*pr.dy+ay*pr.dx};
  }
  const BERTH_OFF = PIER_W/2 + 12;                          // hull centre to quay centre when moored
  const MOOR_RANGE = PIER_W/2 + 12 + 30;                    // lateral distance that triggers mooring
  function berthAt(pr, along, side){
    const a = Math.max(pr.shoreAlong+24, Math.min(pr.total-14, along));
    return { x: pr.x0 + pr.dx*a - pr.dy*side*BERTH_OFF,
             y: pr.y0 + pr.dy*a + pr.dx*side*BERTH_OFF, a: pr.dir };
  }
  // nearest pier to a point: distance to its centre line and outward normal
  // (qx,qy is the closest point, expressed next to the query point)
  function pierDist(x,y){
    let best = {d:Infinity, nx:0, ny:0, qx:x, qy:y};
    for(const pr of piers){
      const vx=pr.x1-pr.x0, vy=pr.y1-pr.y0;
      const ax=wdx(x,pr.x0), ay=wdy(y,pr.y0);
      const k=Math.max(0,Math.min(1,(ax*vx+ay*vy)/(vx*vx+vy*vy)));
      const dx=ax-vx*k, dy=ay-vy*k, d=Math.hypot(dx,dy);
      if(d<best.d) best = {d, nx:dx/(d||1), ny:dy/(d||1), qx:x-dx, qy:y-dy};
    }
    return best;
  }

  // ---------- Villages ----------
  // Four market villages toward the edges of the world, one per compass
  // point, each on its own island with a pier facing home and a lighthouse.
  // Each cooks one course of the dinner and sells two specialties of it (one
  // unit each); buy both and the merchant adds a gift that isn't for sale.
  // (all their words are in TEXT.villages; icon: the drawing in ITEM_ICONS)
  const VT = TEXT.villages;
  const drawnKey = v=> v.ux > 0 ? 'E' : v.ux < 0 ? 'W' : v.uy > 0 ? 'S' : 'N';   // (its key in DRAWN_PLACES)
  const VILLAGES = [
    { name:VT.nord.name, ux:0, uy:-1, course:VT.nord.course, own:'sarde', line:VT.nord.line,
      dishes:[{name:VT.nord.dishes[0], icon:'Fiori di Zucca', price:DISH_PRICE}, {name:VT.nord.dishes[1], icon:'Mozzarelle', price:DISH_PRICE}], gift:VT.nord.gift, giftIcon:'Tarallini' },
    { name:VT.est.name, ux:1, uy:0, course:VT.est.course, own:'sgombri', line:VT.est.line,
      dishes:[{name:VT.est.dishes[0], icon:'Orecchiette con Cime di Rapa', price:DISH_PRICE}, {name:VT.est.dishes[1], icon:'Lasagne', price:DISH_PRICE}], gift:VT.est.gift, giftIcon:'Olio Santo' },
    { name:VT.sud.name, ux:0, uy:1, course:VT.sud.course, own:'triglie', line:VT.sud.line,
      dishes:[{name:VT.sud.dishes[0], icon:'Zampina', price:DISH_PRICE}, {name:VT.sud.dishes[1], icon:'Pesce Arrosto', price:DISH_PRICE}], gift:VT.sud.gift, giftIcon:'Vino Rosso' },
    { name:VT.ovest.name, ux:-1, uy:0, course:VT.ovest.course, own:'orate', line:VT.ovest.line,
      dishes:[{name:VT.ovest.dishes[0], icon:'Cartellate', price:DISH_PRICE}, {name:VT.ovest.dishes[1], icon:'Tiramisu', price:DISH_PRICE}], gift:VT.ovest.gift, giftIcon:'Limoncello' }
  ].filter(v=> MAP_DRAWN || !(EOLUS_ON && v.uy === -1))   // the Temple of Eolus stands where Nordania was (on the drawn map, the drawing decides)
   .filter(v=> !MAP_DRAWN || DRAWN_PLACES[drawnKey(v)]);   // (on the drawn map, only those placed on it)
  // ---------- Orders ----------
  // Every day the restaurant at home has an order for dinner: on day 1 a few
  // fish of any kind, from day 2 fish of one kind and one or two village
  // dishes. Whatever of it is aboard is delivered when the boat ties up at
  // home; at DINNER_HOUR dinner is served and the guests' mood (the bar top
  // right) goes up if the order was complete, down by what was missing. At
  // first light comes the next order. The dishes bought at the stalls wait
  // in the hold (dishHold, by dish icon id) until they're delivered.
  const ALL_DISHES = VILLAGES.flatMap(v=> v.dishes.map(d=> ({...d, village: v})));
  const dishHold = {};                    // dish icon id -> how many aboard
  let order = null, satisfaction = SAT_START;
  const freshLines = new Set();           // order lines completed since the logbook was last opened
  function newOrder(day){
    const items = [];
    if(day <= 1) items.push({kind:'fish', key:null, n: FIRST_ORDER_FISH, got:0});
    else {
      const key = FISH_KEYS[(Math.random()*FISH_KEYS.length)|0];
      items.push({kind:'fish', key, n: ORDER_FISH_MIN + Math.floor(Math.random()*(ORDER_FISH_MAX - ORDER_FISH_MIN + 1)), got:0});
      const pool = ALL_DISHES.slice();
      for(let k = 0; k < (day >= ORDER_TWO_DISHES_FROM ? 2 : 1); k++){
        const d = pool.splice((Math.random()*pool.length)|0, 1)[0];
        items.push({kind:'dish', icon: d.icon, name: d.name, n:1, got:0});
      }
    }
    order = {day, items, closed:false, result:null};
  }
  const orderLeft = ()=> order ? order.items.reduce((a,it)=> a + it.n - it.got, 0) : 0;
  const orderDone = ()=> !!order && orderLeft() === 0;
  // tied up at home before dinner: hand over whatever of the order is aboard
  function deliverOrder(){
    if(!order || order.closed) return;
    const notes = [];
    order.items.forEach((it, i)=>{
      let want = it.n - it.got;
      if(want <= 0) return;
      let gave = 0;
      if(it.kind === 'dish'){ gave = Math.min(want, dishHold[it.icon]||0); dishHold[it.icon] = (dishHold[it.icon]||0) - gave; }
      else {
        const keys = it.key ? [it.key] : FISH_KEYS.slice().sort((a,b)=> counts[b] - counts[a]);   // any kind: the biggest catch first
        for(const k of keys){ const g = Math.min(want - gave, counts[k]); counts[k] -= g; gave += g; }
      }
      if(!gave) return;
      it.got += gave;
      if(it.got >= it.n){ freshLines.add(i); elListBtn.classList.add('news'); }
      notes.push(gave > 1 ? gave + ' × ' + orderLineName(it) : orderLineName(it));
    });
    if(!notes.length) return;
    notes.forEach((txt,k)=> popups.push({x:boat.x, y:boat.y-26-k*16, text:'− '+txt, life:1.8, max:1.8}));
    Sfx.coins(); buzz([15,40,15,40,55]);
    toast(orderDone() ? TEXT.toasts.orderReady : TEXT.toasts.delivered);
    if(elList.classList.contains('open')) renderList();
  }
  function orderLineName(it){
    if(it.kind === 'dish') return it.name;
    return it.key ? FISH_NAME[it.key].many : TEXT.logbook.fishAny.replace('{n} ', '');
  }
  // dinner time: the guests sit down to whatever came home
  function serveDinner(){
    if(!order || order.closed) return;
    order.closed = true;
    const total = order.items.reduce((a,it)=> a + it.n, 0), got = order.items.reduce((a,it)=> a + Math.min(it.n, it.got), 0);
    const ok = got >= total;
    order.result = ok ? 'ok' : 'short';
    if(SATISFACTION_ON) satisfaction = Math.max(0, Math.min(1, satisfaction + (ok ? SAT_GAIN : -SAT_LOSS*(1 - got/total))));
    toast(ok ? TEXT.toasts.dinnerOk : TEXT.toasts.dinnerShort);
    if(ok){ Sfx.bell(); buzz([14,22,14,22,40]); } else { Sfx.thunk(0.3); buzz([40,60,40]); }
    if(SATISFACTION_ON) satPulse = 1.2;
    if(elList.classList.contains('open')) renderList();
  }
  function resetOrders(){
    for(const v of VILLAGES){ v.done = false; v.giftGot = false; for(const d of v.dishes) d.boughtEver = false; }
    for(const k in dishHold) delete dishHold[k];
    satisfaction = SAT_START; freshLines.clear();
    newOrder(1);
  }
  let satPulse = 0;
  // the masseria's look follows the guests' mood: 0 desolate … 4 lively
  // (its picture is baked into the island's tiles, so they're redrawn when it changes)
  const homeStageFor = s=> Math.max(0, Math.min(4, Math.round(s*4)));
  let homeStage = homeStageFor(SAT_START);
  function rebakeHome(){
    const bb = home.bb; if(!bb) return;
    for(const tl of bb.tiles.values()){ const k = cached.indexOf(tl); if(k >= 0) cached.splice(k, 1); }
    bb.tiles.clear();
  }
  // the clients' boats: as many tied up at the guest pier as the mood
  // allows; a new one sails in from the open sea, one too many sails away
  const guests = [];
  const GUEST_IN_T = 10;                  // seconds to sail in (or out)
  function guestBerths(){                 // two a side near the pier head: one alongside, one rafted up outside it
    const pr = GUEST_PIER, out = [], a = pr.total - 16;
    for(const off of [BERTH_OFF, BERTH_OFF + 22]) for(const side of [1, -1])
      out.push({x: pr.x0 + pr.dx*(a - (off > BERTH_OFF ? 5 : 0)) - pr.dy*side*off, y: pr.y0 + pr.dy*(a - (off > BERTH_OFF ? 5 : 0)) + pr.dx*side*off, a: pr.dir});
    return out;
  }
  function newGuest(slot, there){
    const b = guestBerths()[slot], a = GUEST_DIR + rand(-0.6, 0.6), far = 520;
    const g = {slot, bx:b.x, by:b.y, ba:b.a, sx: b.x + Math.cos(a)*far, sy: b.y + Math.sin(a)*far, k: there ? 1 : 0, dir: there ? 0 : 1,
               x:b.x, y:b.y, angle:b.a, speed:0, moored: there, rock:0, boomSigned: rand(-0.3,0.3), sailPower:0.8, sailAmount:1, oarK:0, oarPh:0,
               furl: there ? 1 : 0};
    guests.push(g);
    return g;
  }
  function updateGuests(dt){
    if(!GUEST_PIER) return;
    const want = Math.round(satisfaction*GUEST_BOATS_MAX), staying = guests.filter(g=> g.dir >= 0);
    if(staying.length < want){                                   // one more comes in
      const used = new Set(guests.map(g=> g.slot));
      const slot = [0,1,2,3].find(s=> !used.has(s));
      if(slot !== undefined) newGuest(slot, false);
    } else if(staying.length > want){                            // one leaves
      const g = staying.find(g=> g.dir === 0) || staying[staying.length-1];
      g.dir = -1; g.moored = false;
    }
    for(let i=guests.length-1; i>=0; i--){
      const g = guests[i];
      if(g.dir){
        const k0 = g.k;
        g.k = Math.max(0, Math.min(1, g.k + g.dir*dt/GUEST_IN_T));
        const e = q=> 1 - Math.pow(1 - q, 2.2);                    // slows as it nears the pier
        const px = g.sx + (g.bx - g.sx)*e(g.k), py = g.sy + (g.by - g.sy)*e(g.k);
        g.speed = Math.hypot(px - g.x, py - g.y)/Math.max(dt, 1e-3);
        const head = Math.atan2(g.by - g.sy, g.bx - g.sx) + (g.dir < 0 ? Math.PI : 0);
        const turn = Math.max(0, (g.k - 0.8)/0.2);                 // the last stretch: swings alongside
        g.angle = head + Math.atan2(Math.sin(g.ba - head), Math.cos(g.ba - head))*turn;
        g.x = px; g.y = py;
        if(g.dir > 0 && g.k >= 1){ g.dir = 0; g.moored = true; g.speed = 0; }
        if(g.dir < 0 && g.k <= 0){ guests.splice(i, 1); continue; }
        if(k0 === g.k) g.speed = 0;
      }
    }
  }
  function resetGuests(){
    guests.length = 0;
    if(!GUEST_PIER) return;
    const n = Math.round(satisfaction*GUEST_BOATS_MAX);
    for(let s2=0; s2<n; s2++) newGuest(s2, true);
  }
  // hand-shaped village island: rounded, with a wide clearing at the centre
  function makeVillageIsland(v){
    const x = v.px, y = v.py;                                 // (see placeVillages)
    const isl = makeIsland(x, y, rand(108,122));
    // soften the shape a little so the village and pier fit well
    for(let i=0;i<ISL_N;i++) isl.radii[i] = isl.R*0.55 + isl.radii[i]*0.45;
    isl.rmax = Math.max(...isl.radii);
    const dir = v.pierDir ?? Math.atan2(START.y-y, START.x-x);   // pier faces home (on the drawn map, the open sea by its dot)
    carveBay(isl, dir, 0.32, 0.85);
    const pr = makePier(isl, dir, Math.min(isl.R*0.45, rAt(isl,dir)-10));
    isl.village = v; v.isl = isl; v.pier = pr; v.done = false;
    makeVillageLayout(isl, v, pr);
    piers.push(pr);
    addIsland(isl);
  }
  function segDist(px,py, ax,ay, bx,by){
    const vx=bx-ax, vy=by-ay, k=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/(vx*vx+vy*vy)));
    return Math.hypot(px-ax-vx*k, py-ay-vy*k);
  }
  function makeVillageLayout(isl, v, pr){
    const cx = isl.x, cy = isl.y;
    const VR = Math.min(isl.R*0.52, 62);
    const L = {VR, houses:[], stalls:[], lanes:[]};
    // lanes: one down to the pier, two or three out into the scrub
    L.lanes.push([cx,cy,pr.x0,pr.y0]);
    const nl = 2+Math.floor(rand(0,2));
    for(let k=0;k<nl;k++){
      const a = pr.dir + Math.PI*(0.5+k*2/(nl+1)) + rand(-0.3,0.3);
      L.lanes.push([cx,cy,cx+Math.cos(a)*(VR+6),cy+Math.sin(a)*(VR+6)]);
    }
    const onLane = (x,y,m)=>L.lanes.some(l=>segDist(x,y,l[0],l[1],l[2],l[3])<m);
    // houses clustered around the piazza, off the lanes, never overlapping
    for(let tries=0; tries<2000 && L.houses.length<20; tries++){
      const a = rand(0,Math.PI*2), d = 19 + Math.random()*(VR-24);
      const w = Math.round(rand(12,19)), h = Math.round(rand(10,15));
      const hx = Math.round(cx+Math.cos(a)*d - w/2), hy = Math.round(cy+Math.sin(a)*d - h/2);
      if(onLane(hx+w/2, hy+h/2, 6+Math.max(w,h)/2)) continue;
      if(Math.hypot(hx+w/2-cx, hy+h/2-cy) > VR-4) continue;
      { const a=Math.atan2(hy+h/2-cy, hx+w/2-cx); if(Math.hypot(hx+w/2-cx, hy+h/2-cy) > rAt(isl,a)-Math.max(w,h)-6) continue; }   // stay on land (bay)
      if(L.houses.some(o=> hx < o.x+o.w+2 && hx+w+2 > o.x && hy < o.y+o.h+2 && hy+h+2 > o.y)) continue;
      L.houses.push({x:hx, y:hy, w, h, roof: Math.random()<0.55 ? 'flat' : 'gable', vert: Math.random()<0.5});
    }
    // market stalls around the piazza
    for(let k=0;k<4;k++){
      const a = pr.dir + 0.8 + k*Math.PI/2 + rand(-0.2,0.2);
      L.stalls.push({x: Math.round(cx+Math.cos(a)*12-3), y: Math.round(cy+Math.sin(a)*12-2)});
    }
    // lighthouse on the shore beside the pier root, with the keeper's hut
    const tl = pr.lights.find(l=>l.tall);
    L.light = {x: tl.x, y: tl.y, ph: tl.ph};
    L.hut = {x: Math.round(tl.x - Math.cos(pr.dir)*14 - 4), y: Math.round(tl.y - Math.sin(pr.dir)*14 - 4), w:8, h:7, roof:'gable', vert:false};
    isl.vl = L;
    // clear the decorations out of the village and off the pier path
    const busy = (x,y,m)=> Math.hypot(x-cx,y-cy) < VR+m || onLane(x,y,m+4)
      || segDist(x,y,pr.x0,pr.y0,pr.x1,pr.y1) < 10+m || Math.hypot(x-L.light.x,y-L.light.y) < 16+m;
    clearDecor(isl, busy);
  }
  // where the villages go this game: each one pushed out from home by up to
  // VILLAGE_OUT_MAX and slid sideways by up to VILLAGE_SIDE_MAX, kept
  // VILLAGE_EDGE from the edge of the map. No village may end up closer to
  // another one, or to the ruins, than in the plain cross layout (distances on
  // the map, home in the middle): sliding sideways brings it toward a ruin, so
  // the slide picks how far out it must go at least, and the whole set is
  // drawn again in the rare case two villages still come too close.
  function placeVillages(){
    const rd = VILLAGE_DIST/Math.SQRT2*1.02;                  // (where makeRuinIsland puts the ruins)
    const ruins = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=> [a*rd, b*rd]);
    const at = (v, out, side)=> [v.ux*(VILLAGE_DIST+out) - v.uy*side, v.uy*(VILLAGE_DIST+out) + v.ux*side];
    const gaps = (P)=> [...P.flatMap((p,i)=> P.slice(i+1).map(q=> Math.hypot(p[0]-q[0], p[1]-q[1]))),
                        ...P.flatMap(p=> ruins.map(r=> Math.hypot(p[0]-r[0], p[1]-r[1])))];
    const base = VILLAGES.map(v=> at(v, 0, 0)), need = gaps(base);
    const outMax = Math.max(0, Math.min(VILLAGE_OUT_MAX, WORLD.w/2 - VILLAGE_EDGE - VILLAGE_DIST));
    const ruinGap2 = rd*rd + (VILLAGE_DIST-rd)*(VILLAGE_DIST-rd);   // village to its nearer ruins, squared, in the cross
    const nudge = ()=>{
      for(let t = 0; t < 50; t++){
        const side = rand(-VILLAGE_SIDE_MAX, VILLAGE_SIDE_MAX);
        const outMin = Math.max(0, Math.sqrt(Math.max(0, ruinGap2 - (rd-Math.abs(side))**2)) + rd - VILLAGE_DIST);
        if(outMin <= outMax) return [rand(outMin, outMax), side];
      }
      return [0, 0];
    };
    let P = base;
    for(let tries = 0; tries < 200; tries++){
      const Q = VILLAGES.map(v=> at(v, ...nudge()));
      if(gaps(Q).every((d,i)=> d >= need[i] - 1e-6)){ P = Q; break; }
    }
    VILLAGES.forEach((v,i)=>{ v.px = wrapX(START.x + P[i][0]); v.py = wrapY(START.y + P[i][1]); });
    if(MAP_DRAWN) VILLAGES.forEach(v=>{ [v.px, v.py, v.pierDir] = drawnPlace(DRAWN_PLACES[drawnKey(v)]); });   // (the drawn map: where Enrico put them)
  }
  placeVillages();
  for(const v of VILLAGES) makeVillageIsland(v);

  // ---------- Ruins ----------
  // Four islands on the diagonals, each with the stones of an ancient
  // sanctuary and a stone pier. Docking there grants a mysterious power.
  const RUIN_COOLDOWN = 180;          // seconds before the same ruin answers again
  const RUINS = [...(!RUINS_ON ? [] : [
    { name:TEXT.ruins.name, ux:-1, uy:-1 },
    { name:TEXT.ruins.name, ux: 1, uy:-1 },
    { name:TEXT.ruins.name, ux: 1, uy: 1 },
    { name:TEXT.ruins.name, ux:-1, uy: 1 }
  ]), ...(EOLUS_ON && (!MAP_DRAWN || DRAWN_PLACES.temple) ? [{ name:TEXT.eolus.name, ux:0, uy:-1, eolus:true, d:VILLAGE_DIST }] : [])];   // (the temple: north, as far out as the villages)
  function makeRuinIsland(r){
    const d = r.d || VILLAGE_DIST/Math.SQRT2*1.02;
    let x = wrapX(START.x + r.ux*d), y = wrapY(START.y + r.uy*d);
    let pierDir = null;
    if(MAP_DRAWN && r.eolus) [x, y, pierDir] = drawnPlace(DRAWN_PLACES.temple);   // (the drawn map)
    const isl = makeIsland(x, y, rand(96,110));
    for(let i=0;i<ISL_N;i++) isl.radii[i] = isl.R*0.5 + isl.radii[i]*0.5;
    isl.rmax = Math.max(...isl.radii);
    const dir = pierDir ?? Math.atan2(START.y-y, START.x-x);
    carveBay(isl, dir, 0.22, 0.7);
    const pr = makePier(isl, dir, Math.min(isl.R*0.42, rAt(isl,dir)-10));
    pr.stone = true; pr.lights = [];
    isl.ruin = r; r.isl = isl; r.pier = pr; r.readyAt = 0;
    makeRuinLayout(isl, pr);
    piers.push(pr);
    addIsland(isl);
  }
  function makeRuinLayout(isl, pr){
    const cx = isl.x - pr.dx*6, cy = isl.y - pr.dy*6;
    const L = {cx, cy, R: 34};
    // temple platform with a colonnade: some columns standing, some broken,
    // some fallen; drums scattered around; a broken arch nearby
    L.plat = {w: 46, h: 30};
    L.cols = [];
    for(let i=0;i<5;i++) for(const row of [-1,1]){
      const st = Math.random();
      L.cols.push({x: cx-18+i*9, y: cy+row*11, h: st<0.4 ? rand(12,17) : st<0.75 ? rand(3,7) : 0});
    }
    L.drums = [];
    for(let k=0;k<7;k++){ const a=rand(0,6.3), d=rand(26,42); L.drums.push({x:cx+Math.cos(a)*d, y:cy+Math.sin(a)*d*0.8, a:rand(0,6.3), long: Math.random()<0.4}); }
    const aa = rand(0,6.3);
    L.arch = {x: cx+Math.cos(aa)*40, y: cy+Math.sin(aa)*30};
    isl.rl = L;
    const busy = (x,y,m)=> Math.hypot(x-cx,y-cy) < 52+m || segDist(x,y,pr.x0,pr.y0,cx,cy) < 8+m;
    clearDecor(isl, busy);
  }
  for(const r of RUINS) makeRuinIsland(r);
  const SPECIALS = [...VILLAGES, ...RUINS];        // keep rocks and whirlpools away from these
  finishDrawnLand(SPECIALS);                       // (the drawn map: the villages and the temple join its land)

  // an atoll: a ring of low sandy islets, each lying along the ring, round a
  // lagoon; a few places on the ring are left open so a boat can sail in
  function tryAtoll(x, y, gap){
    const sq = Math.sqrt(ISLAND_SCALE), Ra = rand(140, 230)*ISLAND_SCALE, n = Math.round(Ra/(12*sq)), out = Ra + 40*sq;
    if(wdist(x,y,START.x,START.y) < out + LAGOON_R) return false;
    if(islandGrid.query(x,y,out+gap, o=> wdist(x,y,o.x,o.y) < out+o.rmax+gap)) return false;
    const a0 = rand(0, Math.PI*2), open = new Set();
    const nOpen = 2 + Math.floor(rand(0, 2));
    for(let k=0;k<nOpen;k++) open.add(Math.floor(k*n/nOpen + rand(0, n/nOpen)) % n);   // passages, spread round the ring

      const a = a0 + k/n*Math.PI*2 + rand(-0.08, 0.08), rr = Ra*rand(0.94, 1.06);
      const isl = makeIsland(wrapX(x + Math.cos(a)*rr), wrapY(y + Math.sin(a)*rr), rand(14, 22)*sq, 'islet', a + Math.PI/2);   // lying along the ring
      isl.atoll = true;
      addIsland(isl);
    }
    return true;
  }
  (function genIslands(){
    const N = MAP_DRAWN ? 0 : ISLAND_COUNT;                   // (the drawn map has only the land Enrico drew)
    let attempts=0, placed=0, openPlaced=0;                    // wild islands only (an atoll counts as one)
    // the shaped islands go down first (they need more room), then the blobs fill in
    const quota = {atoll: Math.round(N*ISLAND_ATOLL), L: Math.round(N*ISLAND_L), C: Math.round(N*ISLAND_C), big: Math.round(N*ISLAND_BIG)};
    const got = {atoll: 0, L: 0, C: 0, big: 0};
    while(placed<N && attempts<60000){
      attempts++;
      const x = rand(0, WORLD.w);
      const y = rand(0, WORLD.h);
      const dg = danger(x,y);
      const ar = archipelago(x,y);
      const open = ar < 0.5;
      if(open && openPlaced >= OPEN_ISLANDS) continue;          // open water stays open: only a few small islands
      if(Math.random() > (0.2 + 0.8*dg*dg)*(open ? 0.3 : 1)) continue;   // sparser near home
      const gap = (210 - 120*dg)*(1.45 - 1.2*ar);              // tight channels in the clusters, wide water in the open
      const want = ['atoll','L','C','big'].find(k=> got[k] < quota[k] && attempts < 30000) || 'blob';
      if(want === 'atoll'){ if(tryAtoll(x, y, gap)){ placed++; got.atoll++; } continue; }
      const big = want === 'big', kind = big ? 'blob' : want;
      const R = rand(90,160)*(ar > 0.5 ? rand(0.35, 0.85) : rand(0.22, 0.38))*(big ? rand(1.5, 1.9) : kind === 'L' ? 0.85 : kind === 'C' ? 1.3 : 1)*ISLAND_SCALE;   // in open water: small ones
      // cheap pre-check with a generous radius before building the island
      if (wdist(x,y,START.x,START.y) < R*0.6+LAGOON_R) continue;
      if (islandGrid.query(x,y,R*0.6+gap, o=> wdist(x,y,o.x,o.y) < R*0.6+o.rmax+gap)) continue;
      const isl = makeIsland(x,y,R,kind);
      if (wdist(x,y,START.x,START.y) < isl.rmax+LAGOON_R) continue;   // the home lagoon stays open
      const clash = islandGrid.query(x,y,isl.rmax+gap, o=> wdist(x,y,o.x,o.y) < isl.rmax+o.rmax+gap);
      if(!clash){ addIsland(isl); placed++; if(open) openPlaced++; if(want !== 'blob') got[want]++; }
    }
  })();

  // ---------- Rocks ----------
  // Density falls off with distance from shore, higher off rocky coast,
  // plus a few reef patches per island and sparse clusters in open water.
  const rocks = [];
  function makeRock(x,y,r){
    const n=6+Math.floor(rand(0,3)), pts=[];
    const a0=rand(0,Math.PI*2);
    for(let k=0;k<n;k++){
      const a=a0+k/n*Math.PI*2+rand(-0.25,0.25), rr=r*rand(0.75,1.15);
      pts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
    }
    const g=Math.floor(rand(-10,10));
    const tone=(v)=>'rgb('+(v[0]+g)+','+(v[1]+g)+','+(v[2]+g)+')';
    return {x,y,r,pts,foam:rand(0,Math.PI*2), dark:tone([109,104,98]), light:tone([143,138,130])};
  }
  // a rock's size: most as before, some bigger, the biggest ROCK_BIG_MAX × (so they don't all look alike)
  const rockSize = (r)=> r*(Math.random() < ROCK_BIG ? 1 + (ROCK_BIG_MAX - 1)*Math.pow(Math.random(), 1.5) : rand(0.85, 1.15));
  // between two rocks (or a rock and the shore) either they touch, or there's ROCK_GAP of water: no slot to get stuck in
  const tooTight = (x, y, r)=> rockGrid.query(x, y, r + ROCK_GAP + 40, o=>{
    const d = Math.hypot(wdx(o.x,x), wdy(o.y,y)), gap = d - o.r - r;
    return gap > -0.3*Math.min(o.r, r) && gap < ROCK_GAP;            // (overlapping well into each other: one bigger rock, fine)
  });
  const shoreTight = (x, y, r)=> onLand(x, y, r + ROCK_GAP) && !onLand(x, y, r*0.6);   // near the shore but not on it
  function tryRock(x,y,r,allowShore){
    x = wrapX(x); y = wrapY(y);
    if(wdist(x,y,START.x,START.y) < LAGOON_R) return false;
    for(const v of SPECIALS) if(wdist(x,y,v.isl.x,v.isl.y) < v.isl.rmax+140) return false;   // clear approach
    r = rockSize(r);
    if(!allowShore && onLand(x,y,r*0.5+2)) return false;
    if(shoreTight(x,y,r) || tooTight(x,y,r)) return false;
    const o = makeRock(x,y,r);
    rocks.push(o); rockGrid.add(o,x,y,0);
    return true;
  }
  const gauss = ()=> (Math.random()+Math.random()+Math.random()-1.5)/1.5;
  (function genRocks(){
    for(const isl of islands){
      if(isl.home || isl.village || isl.ruin || isl.atoll) continue;   // keep home, village and ruin waters clear, and the atolls' passages open
      const rf = 0.4 + 1.4*danger(isl.x, isl.y);   // rockiness grows with distance
      // boulders sitting right on rocky stretches of coast
      for(let i=0;i<ISL_N;i+=2){
        if(!isl.rocky[i] || Math.random()<0.9) continue;
        const r=isl.radii[i]+rand(-2,5);
        tryRock(isl.x+COS[i]*r, isl.y+SIN[i]*r, rand(3,7), true);
      }
      // scattered rocks, denser near the shore
      const target = Math.round(isl.R*0.035*rf);
      let placed=0, tries=0;
      while(placed<target && tries<target*20){
        tries++;
        const th=rand(0,Math.PI*2);
        const rocky=rockyAt(isl,th);
        if(!rocky && Math.random()>0.3) continue;
        const d = 6 - Math.log(1-Math.random())*(rocky?42:24);
        if(d>300) continue;
        const size = rand(3,6) + 9*Math.exp(-d/50)*Math.random();
        const r=rAt(isl,th)+d;
        if(tryRock(isl.x+Math.cos(th)*r, isl.y+Math.sin(th)*r, size, false)) placed++;
      }
      // reef patches: tight clusters a bit offshore, preferably off rocky coast
      const nReef = Math.random() < 0.35*rf ? 1 : 0;
      for(let q=0;q<nReef;q++){
        let th=rand(0,Math.PI*2);
        for(let k=0;k<12 && !rockyAt(isl,th);k++) th=rand(0,Math.PI*2);
        const cr=rAt(isl,th)+rand(50,140);
        const cx=isl.x+Math.cos(th)*cr, cy=isl.y+Math.sin(th)*cr;
        const n=4+Math.floor(rand(0,5));
        let got=0;
        for(let k=0;k<n*3 && got<n;k++){
          if(tryRock(cx+gauss()*38, cy+gauss()*38, rand(3,8), false)) got++;
        }
      }
    }
    // sparse open-water rocks
    for(let c=0;c<OPEN_ROCK_TRIES;c++){
      const x=rand(0,WORLD.w), y=rand(0,WORLD.h);
      const dg=danger(x,y);
      if(Math.random() > 0.05 + 0.95*Math.pow(dg,1.5)) continue;
      if(onLand(x,y,60)) continue;
      const n=1+Math.floor(rand(0, 1+2*dg));
      for(let k=0;k<n;k++) tryRock(x+gauss()*20, y+gauss()*20, rand(4,10), false);
    }
  })();

  // ---------- Whirlpools ----------
  // Open-water hazards, only away from home and more common far out.
  // Sail into the eye and the boat is spun round and flung off on a random heading.
  const whirlpools = [];
  // A whirlpool lives a while in one spot, fades out, and some time later
  // opens up somewhere else. While faded out it has no effect at all.
  const whirlAsleep = (w)=>{ w.phase = 'off'; w.s = 0; w.timer = rand(2, 40); };   // shut, waking at a staggered time
  const bankList = [];                    // fish banks (filled further down)
  // the stormy West (see Biomes in Tuning): west of home past WEST_FROM, within WEST_HALF_H of its latitude
  const inWest = (x, y)=> wdx(x, START.x) < -WEST_FROM && Math.abs(wdy(y, START.y)) < WEST_HALF_H;
  const westPoint = ()=> [wrapX(START.x - WEST_FROM - rand(0, WORLD.w/2 - WEST_FROM)), wrapY(START.y + rand(-WEST_HALF_H, WEST_HALF_H))];
  function findWhirlSpot(avoidBoat, west){
    for(let tries=0; tries<600; tries++){
      const [x, y] = west ? westPoint() : [rand(0, WORLD.w), rand(0, WORLD.h)];
      const dg = danger(x,y);
      if(wdist(x,y,START.x,START.y) < SAFE_R + 170) continue;        // not in home waters (pull ring included)
      if(SPECIALS.some(v=>wdist(x,y,v.isl.x,v.isl.y) < 460)) continue;
      if(!west && Math.random() > Math.pow(dg,1.5)*(0.3 + 1.4*(1 - archipelago(x,y)))) continue;   // far out, and mostly in open seas (in the West: anywhere)
      const r = rand(120, 155);            // outer edge of the pull ring (wide)
      const core = rand(30, 40);           // where the boat gets caught and spun
      if(avoidBoat && wdist(x,y,boat.x,boat.y) < r+260) continue;   // never right under the boat
      if(onLand(x,y,core+50)) continue;
      // rocks may sit in the pull ring, never in the core
      if(rockGrid.query(x,y,core+60, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < core+o.r+30)) continue;
      if(whirlpools.some(w=> w.phase!=='off' && wdist(w.x,w.y,x,y) < r+w.r+50)) continue;
      if(bankList.some(b=> b.state==='live' && wdist(b.x,b.y,x,y) < r+b.r+40)) continue;
      return {x, y, r, core};
    }
    return null;
  }
  (function genWhirlpools(){
    const N = WHIRL_COUNT + WEST_WHIRLS;
    for(let k=0; k<N*3 && whirlpools.length<N; k++){
      const west = whirlpools.length >= WHIRL_COUNT;            // the last WEST_WHIRLS of them belong to the stormy West
      const sp = findWhirlSpot(false, west);
      if(!sp) continue;
      const w = {...sp, west, dir: Math.random()<0.5?-1:1, rot: rand(0,Math.PI*2),
                 hd: rand(0,Math.PI*2), vel: rand(5,9),
                 speed: rand(1.4,2.2), armed: true, escaping: false};
      whirlAsleep(w);                                // all shut on day 1 (out of step with each other later)
      whirlpools.push(w);
    }
  })();
  // may a whirlpool's eye be here? open water, clear of home and villages
  function whirlWaterOK(x,y,core){
    if(wdist(x,y,START.x,START.y) < SAFE_R + 170) return false;
    if(SPECIALS.some(v=>wdist(x,y,v.isl.x,v.isl.y) < 460)) return false;
    if(onLand(x,y,core+50)) return false;
    if(pierDist(x,y).d < 240) return false;                 // keep out of harbour mouths
    return !rockGrid.query(x,y,core+40, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < core+o.r+20);
  }
  function updateWhirlpools(dt){
    // slow wandering: a heading that drifts; turn away from land, rocks, piers
    for(const w of whirlpools){
      if(w.s<=0 || w.hd===undefined) continue;
      // she's near (within WHIRL_FOLLOW × its radius): it creeps after her, slowly, as long as the water lets it
      const fd = wdist(boat.x, boat.y, w.x, w.y);
      if(playing && w.phase !== 'out' && fd < w.r*WHIRL_FOLLOW && !boat.whirl){
        const to = Math.atan2(wdy(boat.y, w.y), wdx(boat.x, w.x));
        w.hd += norm(to - w.hd)*Math.min(1, dt*1.5);
        const nx = wrapX(w.x + Math.cos(w.hd)*WHIRL_FOLLOW_SPEED*dt), ny = wrapY(w.y + Math.sin(w.hd)*WHIRL_FOLLOW_SPEED*dt);
        if(whirlWaterOK(nx, ny, w.core)){ w.x = nx; w.y = ny; }

      w.hd += rand(-0.6,0.6)*dt;
      // check the water a few seconds ahead, twice a second (staggered)
      w.chk = (w.chk===undefined ? Math.random()*0.5 : w.chk) - dt;
      if(w.chk<=0){
        w.chk = 0.5;
        const ahead = w.vel*6;
        if(!whirlWaterOK(wrapX(w.x+Math.cos(w.hd)*ahead), wrapY(w.y+Math.sin(w.hd)*ahead), w.core)) w.hd += Math.PI*rand(0.6,1.4);
      }
      w.x = wrapX(w.x + Math.cos(w.hd)*w.vel*dt); w.y = wrapY(w.y + Math.sin(w.hd)*w.vel*dt);
    }

    let lvl = boat.whirl ? 1 : 0;
    for(const w of whirlpools){
      if(w.s<=0) continue;
      const d = wdist(boat.x,boat.y,w.x,w.y), reach = w.r*2.6;
      if(d < reach) lvl = Math.max(lvl, w.s*Math.pow(1 - Math.max(0,d-w.core)/(reach-w.core), 1.5));
    }
    Sfx.drone(playing ? lvl : 0);
    for(const w of whirlpools){
      w.rot += w.dir*w.speed*dt;
      const holding = boat.whirl && boat.whirl.w===w;            // don't vanish mid-spin
      if(w.phase==='in'){ w.s = Math.min(1, w.s + dt/WHIRL_FADE); if(w.s>=1){ w.phase='on'; w.timer=rand(25,60); } }
      else if(w.phase==='on'){ w.timer -= dt; if(w.timer<=0 && !holding) w.phase='out'; }
      else if(w.phase==='out'){ if(!holding) w.s = Math.max(0, w.s - dt/WHIRL_FADE); if(w.s<=0){ w.phase='off'; w.timer=rand(4,12); } }
      else if(w.phase==='off'){

        if(w.timer<=0){

          const sp = findWhirlSpot(true, w.west);                 // (a West one opens again in the West)
          if(sp){ Object.assign(w, sp); w.phase='in'; w.s=0; w.armed=true; w.escaping=false; w.dir=Math.random()<0.5?-1:1; w.hd=rand(0,Math.PI*2); w.vel=rand(5,9); }
          else { w.phase='off'; w.timer=rand(3,8); }
        }
      }
    }
  }

  // ---------- Sharks ----------
  // Rarely (SHARK_CHANCE a minute at sea, out of home waters), a shark finds her: it comes in from out of sight,
  // swimming in long S-curves, follows her (SHARK_SPEED), and when it reaches the hull it bites (SHARK_DAMAGE), then
  // makes off fast and is gone out of sight. It gives up after SHARK_GIVE_UP s, or if she gets back into home waters.
  // Seen from above: a dark silhouette under the water and the dorsal fin cutting the surface with a little foam
  let shark = null, sharkCool = 30;
  function resetShark(){ shark = null; sharkCool = 30; }
  function updateShark(dt){
    if(!SHARK_ON || !playing) return;
    const home = wdist(boat.x, boat.y, START.x, START.y) < SAFE_R;
    if(!shark){
      sharkCool -= dt;
      if(sharkCool > 0 || home || moor || boat.whirl) return;
      if(Math.random() > SHARK_CHANCE*dt/60) return;
      const a = rand(0, Math.PI*2), d = 330;
      const x = wrapX(boat.x + Math.cos(a)*d), y = wrapY(boat.y + Math.sin(a)*d);
      if(onLand(x, y, 20)) return;
      shark = {x, y, hd: a + Math.PI, t: 0, mode: 'hunt', vis: 0, seen: false, wig: rand(0, 6.3), sz: rand(1.15, 1.4)};
      return;
    }
    const sh = shark;
    sh.t += dt;
    const dx = wdx(boat.x, sh.x), dy = wdy(boat.y, sh.y), d = Math.hypot(dx, dy);
    if(sh.mode === 'hunt'){
      if(sh.t > SHARK_GIVE_UP || home || moor){ sh.mode = 'flee'; }
      else {
        // aim a little ahead of her, and weave in long S-curves (less as it closes in)
        const lead = Math.min(1.2, d/60), tx = dx + Math.cos(boat.angle)*boat.speed*lead, ty = dy + Math.sin(boat.angle)*boat.speed*lead;
        const to = Math.atan2(ty, tx) + Math.sin(sh.t*1.3 + sh.wig)*0.5*Math.min(1, d/120);
        sh.hd += norm(to - sh.hd)*Math.min(1, dt*2.2);
        sh.v = SHARK_SPEED*(d < 70 ? 1.25 : 1);
        if(d < 16 + 6*sh.sz){                                            // it reaches the hull: a bite
          boat.health = Math.max(0, boat.health - SHARK_DAMAGE);
          hurtFlash = 0.35; shake = 0.12; showHealth(); Sfx.crash(0.45);
          boat.rock = Math.min(2.5, (boat.rock||0) + 0.9);
          buzz([40, 30, 70]);
          popups.push({x: boat.x, y: boat.y - 26, text: fmt(TEXT.popups.sharkBite, {damage: SHARK_DAMAGE}), life: 1.6, max: 1.6});
          sh.mode = 'flee'; sh.hd = Math.atan2(-dy, -dx) + rand(-0.5, 0.5);
        }
      }
      if(!sh.seen && d < 230){ sh.seen = true; popups.push({x: sh.x, y: sh.y - 14, text: TEXT.popups.sharkSeen, life: 1.4, max: 1.4}); buzz([15]); }
    }
    if(sh.mode === 'flee'){
      sh.hd += norm(Math.atan2(-dy, -dx) - sh.hd)*Math.min(1, dt*1.2);

    }
    // it keeps clear of land: look ahead and swerve
    if(onLand(wrapX(sh.x + Math.cos(sh.hd)*40), wrapY(sh.y + Math.sin(sh.hd)*40), 6)) sh.hd += 2.4*dt*(sh.wig > 3 ? 1 : -1)*4;
    sh.x = wrapX(sh.x + Math.cos(sh.hd)*sh.v*dt); sh.y = wrapY(sh.y + Math.sin(sh.hd)*sh.v*dt);
    sh.vis = Math.min(1, sh.vis + dt/1.2);
    if(sh.mode === 'flee' && d > 420){ shark = null; sharkCool = SHARK_COOLDOWN; }
  }
  // ---------- Sea imps ----------
  // Now and then (ZORA_CHANCE a minute at sea, out of home waters) a sea imp, like Zelda's Zora, turns up: ripples
  // ZORA_DIST from her, it rises out of the water, stares, spits a fireball at her (ZORA_BALL_SPEED, ZORA_DAMAGE if it
  // hits), ducks under and pops up somewhere else, ZORA_POPS times, then it's gone. A slingshot stone sends it off.
  let zora = null, zoraCool = 20;
  const fireballs = [];
  function resetZora(){ zora = null; zoraCool = 20; fireballs.length = 0; }
  function zoraSpot(){
    for(let k=0;k<20;k++){
      const a = rand(0, TAU), d = rand(ZORA_DIST[0], ZORA_DIST[1]), x = wrapX(boat.x + Math.cos(a)*d), y = wrapY(boat.y + Math.sin(a)*d);
      if(!onLand(x, y, 14)) return [x, y];
    }
    return null;
  }
  function updateZora(dt){
    // the fireballs fly on whatever the imp does
    for(let i=fireballs.length-1;i>=0;i--){
      const f = fireballs[i]; f.t += dt;
      f.x = wrapX(f.x + f.vx*dt); f.y = wrapY(f.y + f.vy*dt);
      if(f.t > f.life || onLand(f.x, f.y, 2)){ fireballs.splice(i, 1); continue; }
      if(!moor && wdist(f.x, f.y, boat.x, boat.y) < 13){
        fireballs.splice(i, 1);
        boat.health = Math.max(0, boat.health - ZORA_DAMAGE);
        hurtFlash = 0.35; shake = 0.12; showHealth(); Sfx.crash(0.45); Sfx.sizzle(0.6);
        boat.rock = Math.min(2.5, (boat.rock||0) + 0.8); buzz([40, 30, 60]);
        popups.push({x: boat.x, y: boat.y - 26, text: fmt(TEXT.popups.zoraHit, {damage: ZORA_DAMAGE}), life: 1.6, max: 1.6});
      }
    }
    if(!ZORA_ON || !playing) return;
    const home = wdist(boat.x, boat.y, START.x, START.y) < SAFE_R;
    if(!zora){
      zoraCool -= dt;
      if(zoraCool > 0 || home || moor || boat.whirl) return;
      if(Math.random() > ZORA_CHANCE*dt/60) return;
      zora = {pops: ZORA_POPS[0] + Math.floor(Math.random()*(ZORA_POPS[1] - ZORA_POPS[0] + 1)), phase: 'gone', t: 0, wait: 0.3, x: 0, y: 0, seen: false, seed: rand(0, 6.3)};
      return;
    }
    const z = zora; z.t += dt;
    if((home || moor) && z.phase === 'gone'){ zora = null; zoraCool = ZORA_COOLDOWN; return; }
    if(z.phase === 'gone'){                                   // under water, swimming to its next spot
      if(z.t < z.wait) return;
      if(z.pops <= 0){ zora = null; zoraCool = ZORA_COOLDOWN; return; }
      const sp = zoraSpot(); if(!sp) return;
      z.x = sp[0]; z.y = sp[1]; z.phase = 'rise'; z.t = 0; z.pops--; z.shot = false;
    } else if(z.phase === 'rise' && z.t >= 0.6){
      z.phase = 'aim'; z.t = 0; Sfx.splash();
      if(!z.seen){ z.seen = true; popups.push({x: z.x, y: z.y - 20, text: TEXT.popups.zoraSeen, life: 1.4, max: 1.4}); buzz([15]); }
    } else if(z.phase === 'aim' && z.t >= 0.75 && !z.shot){   // it spits: a fireball at where she'll be
      z.shot = true;
      const lead = 0.5, tx = wdx(boat.x + Math.cos(boat.angle)*boat.speed*lead, z.x), ty = wdy(boat.y + Math.sin(boat.angle)*boat.speed*lead, z.y), d = Math.hypot(tx, ty) || 1;
      fireballs.push({x: z.x, y: z.y - 4, vx: tx/d*ZORA_BALL_SPEED, vy: ty/d*ZORA_BALL_SPEED, t: 0, life: 3});
      Sfx.thunk(0.3); Sfx.sizzle(0.35);
    } else if(z.phase === 'aim' && z.t >= 1.15){ z.phase = 'sink'; z.t = 0; }
    else if(z.phase === 'sink' && z.t >= 0.5){ z.phase = 'gone'; z.t = 0; z.wait = rand(1.2, 2.4); }
  }
  // a stone from the slingshot lands at (x, y): if the imp is up there, it dives and leaves
  function stoneAtZora(x, y){
    const z = zora;
    if(!z || z.phase === 'gone' || wdist(x, y, z.x, z.y) > 14*ZORA_SIZE) return false;
    z.phase = 'sink'; z.t = 0; z.pops = 0;
    popups.push({x: z.x, y: z.y - 20, text: TEXT.popups.zoraGone, life: 1.4, max: 1.4}); buzz([20, 30, 20]);
    return true;
  }
  // drawn as a little fish-man rising out of a ring of ripples: a round dark head with a crest of fin along its top,
  // big paper eyes, shoulders and two webbed hands; the water's edge covers it as it rises and sinks
  function drawZora(){
    const z = zora;
    for(const f of fireballs){                               // fireballs: an ink ball, a flickering paper core, a little trail
      if(!inView(f.x, f.y, 10)) continue;
      const fl = 0.7 + 0.3*Math.sin(f.t*40);
      ctx.fillStyle = INKC; ctx.globalAlpha = 0.35;
      for(let k=1;k<=3;k++){ ctx.beginPath(); ctx.arc(f.x - f.vx*0.04*k, f.y - f.vy*0.04*k, 4.2 - 0.9*k, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(f.x, f.y, 5.2, 0, TAU); ctx.fill();
      ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(f.x, f.y, 2.6*fl, 0, TAU); ctx.fill();
    }
    if(!z || z.phase === 'gone' || !inView(z.x, z.y, 60)) return;
    const up = z.phase === 'rise' ? Math.max(0, (z.t - 0.25)/0.35) : z.phase === 'sink' ? 1 - z.t/0.5 : 1;
    const e = up*up*(3 - 2*up), bob = z.phase === 'aim' ? Math.sin(z.t*6)*0.6 : 0, h = 10*e + bob;   // how far out of the water
    // ripples (before it shows, they warn of it)
    ctx.strokeStyle = INKC; ctx.lineWidth = 1;
    for(let k=0;k<2;k++){ const q = ((z.t*0.9 + k*0.5) % 1); ctx.globalAlpha = (1 - q)*0.8; ctx.beginPath(); ctx.ellipse(z.x, z.y, (6 + 12*q)*ZORA_SIZE, (6 + 12*q)*0.55*ZORA_SIZE, 0, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1;
    if(e <= 0.02) return;
    const S = ZORA_SIZE;
    ctx.save(); ctx.beginPath(); ctx.rect(z.x - 20*S, z.y - 40*S, 40*S, 40*S); ctx.clip();        // nothing below the water line shows
    ctx.translate(z.x, z.y - h*S); ctx.scale(S, S);
    const aimA = z.phase === 'aim' && z.t > 0.55 && !z.shot ? 1 : 0;      // it rears back before it spits
    ctx.fillStyle = INKC; ctx.strokeStyle = PAPERC; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 6, 8, 5, 0, 0, TAU); ctx.fill(); ctx.stroke();          // shoulders
    ctx.beginPath(); ctx.ellipse(-8.5, 4, 2.4, 2, 0, 0, TAU); ctx.ellipse(8.5, 4, 2.4, 2, 0, 0, TAU); ctx.fill();   // webbed hands
    ctx.beginPath(); ctx.moveTo(0, -12 - aimA*1.5); ctx.lineTo(3, -6); ctx.lineTo(-3, -6); ctx.closePath(); ctx.fill(); ctx.stroke();   // the crest fin
    ctx.beginPath(); ctx.ellipse(0, -1 - aimA, 6, 6.5, 0, 0, TAU); ctx.fill(); ctx.stroke();      // the head
    ctx.fillStyle = PAPERC;
    ctx.beginPath(); ctx.ellipse(-2.5, -2 - aimA, 1.8, 2.2, 0, 0, TAU); ctx.ellipse(2.5, -2 - aimA, 1.8, 2.2, 0, 0, TAU); ctx.fill();   // eyes
    ctx.fillStyle = INKC; ctx.beginPath(); ctx.arc(-2.2, -1.6 - aimA, 0.8, 0, TAU); ctx.arc(2.8, -1.6 - aimA, 0.8, 0, TAU); ctx.fill();
    if(aimA){ ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.ellipse(0, 2.2 - aimA, 1.6, 1.2, 0, 0, TAU); ctx.fill(); }   // its mouth opens
    ctx.restore();
    // the water round its middle: a foam collar
    ctx.strokeStyle = PAPERC; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.ellipse(z.x, z.y, 10*S, 4*S, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = INKC; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(z.x, z.y, 11.5*S, 4.8*S, 0, 0, TAU); ctx.stroke();
  }
  function drawShark(){
    const sh = shark;
    if(!sh || !inView(sh.x, sh.y, 60)) return;
    const k = sh.sz, wag = Math.sin(sh.t*(sh.mode === 'flee' ? 14 : 8))*0.28;   // the tail beats, faster when it makes off
    ctx.save(); ctx.translate(sh.x, sh.y); ctx.rotate(sh.hd); ctx.scale(k, k);
    // the body under the water: a dark, soft-edged torpedo, pectoral fins, the tail swinging
    ctx.globalAlpha = 0.85*sh.vis; ctx.fillStyle = V(0.1);
    ctx.beginPath(); ctx.moveTo(22, 0); ctx.quadraticCurveTo(14, -6, 0, -5.5); ctx.quadraticCurveTo(-12, -4, -18, -1.2);
    ctx.lineTo(-18, 1.2); ctx.quadraticCurveTo(-12, 4, 0, 5.5); ctx.quadraticCurveTo(14, 6, 22, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, -5); ctx.lineTo(-3, -13); ctx.lineTo(0, -5); ctx.moveTo(6, 5); ctx.lineTo(-3, 13); ctx.lineTo(0, 5); ctx.fill();   // pectoral fins
    ctx.save(); ctx.translate(-17, 0); ctx.rotate(wag);
    ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(-9, -7); ctx.lineTo(-6, 0); ctx.lineTo(-8, 5); ctx.closePath(); ctx.fill();   // the tail
    ctx.restore();
    ctx.globalAlpha = sh.vis;
    // the dorsal fin above the water, leaning back, with a curl of foam where it cuts the surface
    ctx.strokeStyle = PAPERC; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(6, -3.5); ctx.quadraticCurveTo(10, 0, 6, 3.5); ctx.stroke();
    const fin = ()=>{ ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-6, -2.8); ctx.quadraticCurveTo(-8, 0, -6, 2.8); ctx.closePath(); };
    ctx.strokeStyle = PAPERC; ctx.lineWidth = 1.4; fin(); ctx.stroke();       // a pale rim of water round the fin, so it reads on dark sea
    ctx.fillStyle = INKC; fin(); ctx.fill();
    ctx.strokeStyle = INKC; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-7, -4.5); ctx.stroke();   // the fin's raked tip, seen from above
    ctx.restore(); ctx.globalAlpha = 1;
  }

  // ---------- Fish banks ----------
  // Schools of fish circling in open water. Stop the boat on one (sail
  // down) and after a moment the nets go over the side; ten seconds later
  // you haul 1–2 fish and the school scatters. Which fish depends on which
  // side of home the bank lies (north / east / south / west).
  const FISH = {
    nord:  {key:'sarde',   ...TEXT.fish.sarde},          // (names: see Texts)
    est:   {key:'sgombri', ...TEXT.fish.sgombri},
    sud:   {key:'triglie', ...TEXT.fish.triglie},
    ovest: {key:'orate',   ...TEXT.fish.orate}
  };
  const FISH_KEYS = ['sarde','sgombri','triglie','orate'];
  const FISH_NAME = {}; for(const k in FISH) FISH_NAME[FISH[k].key] = FISH[k];
  // the market: fish are sold for coins, worth more far from the waters
  // they were caught in; the dishes are bought with coins
  // (each dish has its own price: see VILLAGES)
  let coins = 0;                     // the purse
  const counts = { sarde:0, sgombri:0, triglie:0, orate:0 };   // fish in the hold
  let caught = 0;                    // fish landed this voyage
  function sectorAt(x,y){
    const dx = wdx(x,START.x), dy = wdy(y,START.y);
    if(Math.abs(dx) > Math.abs(dy)) return dx>0 ? 'est' : 'ovest';
    return dy>0 ? 'sud' : 'nord';
  }
  const banks = bankList;
  function spotIsClear(x,y,m){
    if(onLand(x,y,m)) return false;
    if(pierDist(x,y).d < m+60) return false;
    for(const w of whirlpools) if(wdist(w.x,w.y,x,y) < w.core+m+60) return false;   // may sit in a pull ring: a gamble
    for(const b of banks) if(b.state!=='gone' && wdist(b.x,b.y,x,y) < b.r+m+90) return false;
    return !rockGrid.query(x,y,m+30, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < o.r+m+14);
  }
  // away: keep new banks out of the player's sight
  // the waters round home (where north, east, south and west meet) keep
  // their own, denser set of banks, with every kind of fish in them
  // the sea roads: from home out to each village, and from each village to the
  // next one round; a share of the open-sea banks (ROUTE_BANK_SHARE) lies along
  // them, so the fish lead the way from place to place
  function routeSpot(){
    const at = (v)=> [wdx(v.px, START.x), wdy(v.py, START.y)];   // (home in the middle, as on the map)
    const n = VILLAGES.length, k = Math.floor(Math.random()*n*2);
    const [a, b] = k < n ? [[0, 0], at(VILLAGES[k])]                     // home to a village
                         : [at(VILLAGES[k-n]), at(VILLAGES[(k-n+1) % n])];  // a village to the next one round
    const f = rand(0.08, 0.92), dx = b[0]-a[0], dy = b[1]-a[1], len = Math.hypot(dx, dy) || 1;
    const side = rand(-1, 1)*ROUTE_BANK_SPREAD;
    return [wrapX(START.x + a[0] + dx*f - dy/len*side), wrapY(START.y + a[1] + dy*f + dx/len*side)];
  }
  function spawnBank(away, home, tile){
    const onRoute = !home && tile === undefined && Math.random() < ROUTE_BANK_SHARE;
    for(let tries=0; tries<900; tries++){
      let x, y;
      if(tile !== undefined){                          // (the drawn map: anywhere at sea in this square of the map)
        const TW = WORLD.w/ROOM_N, ti = tile % ROOM_N, tj = (tile/ROOM_N)|0;
        x = wrapX(START.x - WORLD.w/2 + (ti + Math.random())*TW); y = wrapY(START.y - WORLD.h/2 + (tj + Math.random())*TW);
        if(wdist(x,y,START.x,START.y) < 260 || wdist(x,y,boat.x,boat.y) < 160) continue;
      }
      else if(home){ const a = rand(0,Math.PI*2), d = rand(260, HOME_WATERS); x = wrapX(START.x+Math.cos(a)*d); y = wrapY(START.y+Math.sin(a)*d); }
      else if(onRoute){ [x, y] = routeSpot(); if(wdist(x,y,START.x,START.y) < HOME_WATERS) continue; }
      else { x = rand(0,WORLD.w); y = rand(0,WORLD.h); if(wdist(x,y,START.x,START.y) < HOME_WATERS) continue; }
      if(wdist(x,y,START.x,START.y) < 260) continue;
      if(away && wdist(x,y,boat.x,boat.y) < 900) continue;
      if(tile === undefined && !home && !onRoute && Math.random() > 0.12 + 0.88*Math.pow(danger(x,y),1.3)) continue;     // richer the farther out
      const r = rand(36,46);
      if(!spotIsClear(x,y,r)) continue;
      const sec = home ? ['nord','est','sud','ovest'][Math.floor(Math.random()*4)] : sectorAt(x,y);
      const fish = [];
      // every bank looks the same (the catch is a surprise): a few big dark fish going round (the old sea bream's look)
      const LOOK = BANK_LOOK;
      const n = LOOK[0] + Math.floor(rand(0, LOOK[1]-LOOK[0]+1));
      for(let k=0;k<n;k++) fish.push({a:rand(0,6.3), rad:rand(0.25,0.8), sp:rand(0.5,0.9)*(Math.random()<0.5?-1:1),
                                      ph:rand(0,6.3), wob:rand(0.15,0.35), size:LOOK[2]*rand(0.9,1.1)});
      const blobs = [];                               // soft, lumpy patch of disturbed water
      for(let k=0;k<5;k++){ const a=rand(0,6.3), d=rand(0,0.35)*r; blobs.push([Math.cos(a)*d, Math.sin(a)*d, r*rand(0.6,0.85)]); }
      banks.push({x, y, r, sec, home: !!home, tile, fish, blobs, state:'live', t:0, rot:rand(0,6.3), jumpT:rand(1,4)});
      return;
    }
  }
  // the drawn map: every square of the map gets up to BANKS_PER_TILE banks, anywhere at sea in it; a bank fished is
  // gone until the next refill (at first light, every BANK_REGEN_DAYS days)
  function fillBankTiles(){
    if(!MAP_DRAWN) return;
    for(let k=0; k<ROOM_N*ROOM_N; k++){
      const have = banks.filter(b=> b.tile === k && b.state !== 'scatter').length;
      for(let n=have; n<BANKS_PER_TILE; n++) spawnBank(false, false, k);
    }
  }

  // ---------- Boat ----------
  const boat = {
    x: SPAWN.x, y: SPAWN.y,
    angle: SPAWN.angle,
    speed: 0,
    health: 100,
    kx: 0, ky: 0,     // rebound velocity after a collision (decays quickly)
    kdamp: 3.5,       // how fast kx/ky fade (slower for the push off the pier)
    oarK: 0, oarsOut: false, oarPh: 0,   // oars: how far out (0..1), and rowing phase
    whirl: null,      // set while caught in a whirlpool
    sailPower: 0,
    sailAmount: 1,    // smoothed sail area (0..1): the sail is up by default
    sailSide: 1,      // which side the boom is on (+1 / -1), with hysteresis
    boomSigned: 0,    // smoothed angle the square sail faces, or the lateen yard's angle off the centreline (boat frame)
    rig: START_RIG,   // the sail she carries: 'square', 'lateen' or null (none: the oars only); the others ride in the hold
    windMul: 1, windOff: 0, gustM: 1, gustA: 0, leeK: 0,   // the wind where she is: strength ×, direction offset; gust and lee state
    trimA: 0,         // the angle off the wind the sail is trimmed for (it follows the true one at RIG_RETRIM)
    lwx: 0, lwy: 0,   // leeway: her sideways slip to leeward (px/s)
    dfx: 0, dfy: 0, driftK: 0,   // the current: carried downwind (px/s), eased in and out (driftK 0..1)
    r: 16
  };
  const wake=[]; let wakeAcc=0;
  const bowSpray=[]; let bowAcc=0;
  const steam=[]; let steamAcc=0;            // steam from the funnel: {x, y (world, under the puff), z (height), r, a (strength), life, max}          // bow foam: bits of white water peeling off the stem
  for(let k=0;k<BANK_COUNT;k++) spawnBank(false, false);
  fillBankTiles();

  // ---------- Trade routes and the boats that sail them ----------
  // Sea lanes are found once, when the world is made: an A* search over a
  // coarse grid of open water (wrapping round the world like everything
  // else), straightened where the way is clear and smoothed into curves.
  // They run from home out to each village, and between neighbouring villages.
  const NAV_CELL = 40, NAV_N = Math.round(WORLD.w/NAV_CELL);
  const navOpen = new Uint8Array(NAV_N*NAV_N);
  const ni = (i)=> ((i%NAV_N)+NAV_N)%NAV_N;
  for(let j=0;j<NAV_N;j++) for(let i=0;i<NAV_N;i++){
    const x = (i+0.5)*NAV_CELL, y = (j+0.5)*NAV_CELL;
    navOpen[j*NAV_N+i] = (!onLand(x,y,34) && !rockGrid.query(x,y,26, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < o.r+18)) ? 1 : 0;
  }
  function portPoint(pr){ return [wrapX(pr.x1 + pr.dx*38), wrapY(pr.y1 + pr.dy*38)]; }   // just off the pier head
  function findLane(a, b){
    const si = Math.floor(a[0]/NAV_CELL), sj = Math.floor(a[1]/NAV_CELL);
    const ti = Math.floor(b[0]/NAV_CELL), tj = Math.floor(b[1]/NAV_CELL);
    const open = (i,j)=> navOpen[ni(j)*NAV_N+ni(i)] || (Math.abs(wd(i-si,NAV_N))<=1 && Math.abs(wd(j-sj,NAV_N))<=1) || (Math.abs(wd(i-ti,NAV_N))<=1 && Math.abs(wd(j-tj,NAV_N))<=1);
    const h = (i,j)=> Math.hypot(wd(i-ti,NAV_N), wd(j-tj,NAV_N));
    const g = new Float32Array(NAV_N*NAV_N).fill(1e9), from = new Int32Array(NAV_N*NAV_N).fill(-1), done = new Uint8Array(NAV_N*NAV_N);
    const heap = [];                                   // binary heap of [f, index]
    const push = (f,k)=>{ heap.push([f,k]); let c=heap.length-1; while(c>0){ const p=(c-1)>>1; if(heap[p][0]<=heap[c][0]) break; [heap[p],heap[c]]=[heap[c],heap[p]]; c=p; } };
    const pop = ()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let c=0; for(;;){ const l=2*c+1, r=l+1; let m=c; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===c) break; [heap[m],heap[c]]=[heap[c],heap[m]]; c=m; } } return top; };
    const s0 = ni(sj)*NAV_N+ni(si), t0 = ni(tj)*NAV_N+ni(ti);
    g[s0] = 0; push(h(si,sj), s0);
    while(heap.length){
      const [, k] = pop(); if(done[k]) continue; done[k] = 1;
      if(k === t0) break;
      const i = k % NAV_N, j = (k/NAV_N)|0;
      for(let dj=-1; dj<=1; dj++) for(let di=-1; di<=1; di++){
        if(!di && !dj) continue;
        const ii = ni(i+di), jj = ni(j+dj), kk = jj*NAV_N+ii;
        if(done[kk] || !open(ii,jj)) continue;
        if(di && dj && (!open(i+di,j) || !open(i,j+dj))) continue;   // no squeezing diagonally past land
        const ng = g[k] + (di && dj ? 1.414 : 1);
        if(ng < g[kk]){ g[kk] = ng; from[kk] = k; push(ng + h(ii,jj), kk); }
      }
    }
    if(from[t0] < 0) return null;
    // walk back, unwrapping into one continuous line of points
    const cells = []; for(let k=t0; k!==-1; k=from[k]) cells.push(k); cells.reverse();
    const pts = [[a[0],a[1]]];
    for(const k of cells.slice(1,-1)){

      master = ac.createGain(); master.gain.value = 0.9*(vol.master ?? 1);
      master.connect(ac.destination);
      wheelBus = ac.createGain(); wheelBus.gain.value = 0.6;    // whole wheel group
      wheelBus.connect(master);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const ch = noise.getChannelData(0);
      for(let i=0;i<ch.length;i++) ch[i] = Math.random()*2-1;

      // soft wooden rub while the wheel turns: just dark, low-passed
      // noise (no oscillators, so nothing buzzy or metallic)
      const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.7;
      const out = ac.createGain(); out.gain.value=0;
      src.connect(lp); lp.connect(out); out.connect(chan('wheel', wheelBus));
      src.start();
      rub = {lp, out};
      // the crank's gears grinding while it's turned by hand: low noise (no hiss: everything over ~400 Hz cut),
      // swelling softly as each tooth passes (a triangle at the teeth's rate, not a buzz) and wobbling slowly like
      // an uneven gear; silent until grind() opens it. (A square flutter at 30–100 Hz over brighter noise was tried
      // first: it sounded like a chainsaw.)
      {
        const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
        const lp1 = ac.createBiquadFilter(); lp1.type = 'lowpass'; lp1.frequency.value = 420; lp1.Q.value = 0.5;
        const lp2 = ac.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 420; lp2.Q.value = 0.5;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 170; bp.Q.value = 0.9;
        const grain = ac.createGain(); grain.gain.value = 0.6;
        const lfo = ac.createOscillator(); lfo.type = 'triangle'; lfo.frequency.value = 8;   // the teeth going by
        const la = ac.createGain(); la.gain.value = 0.4; lfo.connect(la); la.connect(grain.gain);
        const wob = ac.createOscillator(); wob.frequency.value = 2.7;                          // the gear running a little uneven
        const wa = ac.createGain(); wa.gain.value = 22; wob.connect(wa); wa.connect(bp.frequency);
        const out = ac.createGain(); out.gain.value = 0;
        src.connect(lp1); lp1.connect(lp2); lp2.connect(bp); bp.connect(grain); grain.connect(out); out.connect(chan('crank', master));
        src.start(0, 2.3); lfo.start(); wob.start();
        grindNodes = {bp, lfo, out};
      }

      // Long (6 s) coloured-noise loops so no repetition is audible; two
      // sea layers panned apart for a little width.
      ambBus = ac.createGain(); ambBus.gain.value = 0.0001;
      ambBus.connect(master);
      ambBus.gain.setTargetAtTime(AMB_LEVEL, ac.currentTime+0.2, 1.5);   // slow fade-in
      const brown = colouredNoise('brown'), pink = colouredNoise('pink');
      const layer = (buf, type, freq, Q, pan, offset)=>{
        const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q;
        const g = ac.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g);
        if(ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(ambBus); }
        else g.connect(ambBus);

        return {f, g};
      };
      sea  = routed('sea', ()=> [ {...layer(brown,'lowpass',380,0.5,-0.55,0),   ph:0,   per:7},
               {...layer(brown,'lowpass',380,0.5, 0.55,3.1), ph:0.5, per:8.5} ]);
      rush = routed('sea', ()=> layer(brown,'lowpass',320,0.5,0,2.2));   // deep, soft water along the hull
      rowL = routed('oars', ()=> layer(pink,'bandpass',480,0.9,0,4.1));   // the oars' wash: a soft swirl of water that swells with each pull (see rowBed())
      // rain on the sea: a broad, soft wash under the patter (see rain()), between a hiss and a murmur
      rainL = routed('rain', ()=> layer(pink,'bandpass',1800,0.35,0,1.3));
      rainBus = ac.createGain(); rainBus.gain.value = 1; rainBus.connect(ambBus);
      // cicadas: a small chorus of singers modelled on the two common
      // Mediterranean species. Each is a band of noise around 4–5 kHz with
      // a fast buzzy grain, opened and closed in short pulses ('echemes')
      // by the scheduler in cicadas(). Cicada orni: ~80 ms echemes, 5–8 a
      // second. Lyristes plebejus: a continuous buzz under ~6 pulses a
      // second, in phrases of single, double and long pulses.
      {
        const out = ac.createGain(); out.gain.value = 0;
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500; lp.Q.value = 0.5;   // no shrill top
