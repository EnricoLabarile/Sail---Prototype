  // ---------- Fog of war ----------
  // The world is split into cells; the ones the boat has come within sight
  // of are remembered. Everything else sits under a soft, dotted fog.
  const FOG_CELL = 48, FOG_N = Math.round(WORLD.w/FOG_CELL);   // 5040/48 = 105 cells a side (WORLD_SIZE is a multiple of 48)
  const explored = new Uint8Array(FOG_N*FOG_N);
  const fci = (i)=>((i%FOG_N)+FOG_N)%FOG_N;
  let fogVer = 0;                                    // +1 each time a cell is explored
  function reveal(x,y){
    const r = SIGHT, C = FOG_CELL;
    for(let j=Math.floor((y-r)/C); j<=Math.floor((y+r)/C); j++)
      for(let i=Math.floor((x-r)/C); i<=Math.floor((x+r)/C); i++){
        const k = fci(j)*FOG_N + fci(i);
        if(explored[k]) continue;
        if(Math.hypot((i+0.5)*C - x, (j+0.5)*C - y) <= r){ explored[k] = 1; fogVer++; }
      }
  }
  // the fog in sight: one pixel a cell, stretched (smoothly) to the cells'
  // size into fogBig, which is only redone when the view crosses into another
  // cell or a cell is explored; every other frame it's one plain stamp
  const fogCv = document.createElement('canvas');
  const fogCtx = sceneCtx(fogCv);
  const fogBig = document.createElement('canvas');
  const fogBigCtx = sceneCtx(fogBig);
  let fogImg = null, fogKey = '', fogBox = null;
  function drawFog(camX, camY, w, h){
    const C = FOG_CELL;
    const i0 = Math.floor(camX/C)-1, j0 = Math.floor(camY/C)-1;
    const nx = Math.ceil(w/C)+3, ny = Math.ceil(h/C)+3;
    const key = i0 + '|' + j0 + '|' + nx + '|' + ny + '|' + fogVer;
    if(key !== fogKey){ fogKey = key; fogBox = buildFog(i0, j0, nx, ny); }
    if(!fogBox) return;                               // all clear in sight: nothing to draw
    ctx.drawImage(fogBig, 0, 0, fogBox.w, fogBox.h, fogBox.x, fogBox.y, fogBox.w, fogBox.h);
  }
  function buildFog(i0, j0, nx, ny){
    const C = FOG_CELL;
    if(fogCv.width!==nx || fogCv.height!==ny || !fogImg){ fogCv.width=nx; fogCv.height=ny; fogImg = fogCtx.createImageData(nx,ny); }
    const d = fogImg.data;
    let bx0 = nx, bx1 = -1, by0 = ny, by1 = -1;                      // the box of the fogged cells
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      const p = (j*nx+i)*4;
      d[p]=d[p+1]=d[p+2]=0;
      const kk = fci(j0+j)*FOG_N + fci(i0+i);
      const fog = !(explored[kk] || buoyClear[kk]);                     // buoys and villages always show through
      d[p+3] = fog ? 255 : 0;                                           // solid black: no stray light dots
      if(fog){ if(i<bx0) bx0=i; if(i>bx1) bx1=i; if(j<by0) by0=j; if(j>by1) by1=j; }
    }
    if(bx1 < 0) return null;
    // stretch only the fogged part (with a clear cell round it, so the soft
    // edges blend just as when the whole grid is drawn)
    bx0 = Math.max(0, bx0-1); by0 = Math.max(0, by0-1); bx1 = Math.min(nx-1, bx1+1); by1 = Math.min(ny-1, by1+1);
    const fw = bx1-bx0+1, fh = by1-by0+1;
    fogCtx.putImageData(fogImg,0,0);
    if(fogBig.width < fw*C || fogBig.height < fh*C){ fogBig.width = Math.max(fogBig.width, fw*C); fogBig.height = Math.max(fogBig.height, fh*C); }
    fogBigCtx.clearRect(0, 0, fw*C, fh*C);
    fogBigCtx.imageSmoothingEnabled = true;           // soft edges between cells
    fogBigCtx.drawImage(fogCv, bx0, by0, fw, fh, 0, 0, fw*C, fh*C);
    return {x: (i0+bx0)*C, y: (j0+by0)*C, w: fw*C, h: fh*C};
  }

  // ---------- Deep water ----------
  // Where the big waves live: past DEEP_SHORE from any land, DEEP_PIER from any pier, and out of home waters.
  // Worked out per cell the first time a cell is needed (then kept); drawn as a soft darker tint on the sea,
  // like the fog: a pixel a cell, stretched smoothly, redone only when the view crosses into another cell.
  const DEEP_N = Math.round(WORLD.w/DEEP_CELL), deepGrid = new Int8Array(DEEP_N*DEEP_N).fill(-1);
  const dci = (i)=>((i%DEEP_N)+DEEP_N)%DEEP_N;
  function deepCell(i, j){
    const k = dci(j)*DEEP_N + dci(i);
    if(deepGrid[k] < 0){
      const x = (dci(i)+0.5)*DEEP_CELL, y = (dci(j)+0.5)*DEEP_CELL;
      deepGrid[k] = !onLand(x, y, DEEP_SHORE) && pierDist(x, y).d >= DEEP_PIER && wdist(x, y, START.x, START.y) >= SAFE_R + 120 ? 1 : 0;
    }
    return deepGrid[k] === 1;
  }
  const deepAt = (x, y)=> deepCell(Math.floor(x/DEEP_CELL), Math.floor(y/DEEP_CELL));
  const deepCv = document.createElement('canvas'), deepCtx = sceneCtx(deepCv);
  const deepBig = document.createElement('canvas'), deepBigCtx = sceneCtx(deepBig);
  let deepImg = null, deepKey = '', deepBox = null;
  function drawDeep(camX, camY, w, h){
    if(DEEP_TINT <= 0) return;
    const C = DEEP_CELL, i0 = Math.floor(camX/C)-1, j0 = Math.floor(camY/C)-1, nx = Math.ceil(w/C)+3, ny = Math.ceil(h/C)+3;
    const key = i0 + '|' + j0 + '|' + nx + '|' + ny;
    if(key !== deepKey){
      deepKey = key;
      if(deepCv.width !== nx || deepCv.height !== ny || !deepImg){ deepCv.width = nx; deepCv.height = ny; deepImg = deepCtx.createImageData(nx, ny); }
      const d = deepImg.data;
      for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const p = (j*nx+i)*4; d[p] = d[p+1] = d[p+2] = 0; d[p+3] = deepCell(i0+i, j0+j) ? 255 : 0; }
      deepCtx.putImageData(deepImg, 0, 0);
      if(deepBig.width < nx*C || deepBig.height < ny*C){ deepBig.width = Math.max(deepBig.width, nx*C); deepBig.height = Math.max(deepBig.height, ny*C); }
      deepBigCtx.clearRect(0, 0, nx*C, ny*C);
      deepBigCtx.imageSmoothingEnabled = true;           // a soft edge where the shelf drops off
      deepBigCtx.drawImage(deepCv, 0, 0, nx, ny, 0, 0, nx*C, ny*C);
      deepBox = {x: i0*C, y: j0*C, w: nx*C, h: ny*C};
    }
    ctx.globalAlpha = DEEP_TINT;
    ctx.drawImage(deepBig, 0, 0, deepBox.w, deepBox.h, deepBox.x, deepBox.y, deepBox.w, deepBox.h);
    ctx.globalAlpha = 1;
  }

  // ---------- The boiling South ----------
  // South of home past SOUTH_FROM (to SOUTH_TO, over the map's wrapped edge), within SOUTH_HALF_W of home's
  // longitude, the sea boils; the edge wanders a little, and villages and temples keep a ring of cool water
  // (BOIL_SAFE). Worked out per cell like the deep water, and drawn the same way as a darker tint, with bubbles
  // swelling and popping and steam rising off it. A while in it (BOIL_DELAY, the hull hissing) and the hull
  // suffers BOIL_DAMAGE a second: her sides scorch (boat.scald), steam pours off her waterline.
  const TAU = Math.PI*2;
  function boilRaw(x, y){
    if(!BOIL_ON) return false;
    const dy = ((y - START.y)%WORLD.h + WORLD.h)%WORLD.h, dx = wdx(x, START.x);
    const wob = 70*Math.sin(x*TAU*3/WORLD.w + 1.3) + 40*Math.sin(x*TAU*8/WORLD.w + 0.4);   // the edge isn't ruler-straight
    if(dy < SOUTH_FROM + wob || dy > (MAP_DRAWN ? Math.min(SOUTH_TO, WORLD.h - START.y) : SOUTH_TO) + wob) return false;   // (on the drawn map it stops at the south edge)
    if(Math.abs(dx) > SOUTH_HALF_W + 90*Math.sin(y*TAU*5/WORLD.h)) return false;
    return !SPECIALS.some(v=> wdist(x, y, v.isl.x, v.isl.y) < BOIL_SAFE);
  }
  const boilGrid = new Int8Array(DEEP_N*DEEP_N).fill(-1);
  function boilCell(i, j){
    const k = dci(j)*DEEP_N + dci(i);
    if(boilGrid[k] < 0) boilGrid[k] = boilRaw((dci(i)+0.5)*DEEP_CELL, (dci(j)+0.5)*DEEP_CELL) ? 1 : 0;
    return boilGrid[k] === 1;
  }
  const boilAt = (x, y)=> boilCell(Math.floor(wrapX(x)/DEEP_CELL), Math.floor(wrapY(y)/DEEP_CELL));
  const boilCv = document.createElement('canvas'), boilCtx = sceneCtx(boilCv);
  const boilBig = document.createElement('canvas'), boilBigCtx = sceneCtx(boilBig);
  let boilImg = null, boilKey = '', boilBox = null, boilAny = false;
  function drawBoilTint(camX, camY, w, h){
    if(!BOIL_ON) return;
    const C = DEEP_CELL, i0 = Math.floor(camX/C)-1, j0 = Math.floor(camY/C)-1, nx = Math.ceil(w/C)+3, ny = Math.ceil(h/C)+3;
    const key = i0 + '|' + j0 + '|' + nx + '|' + ny;
    if(key !== boilKey){
      boilKey = key; boilAny = false;
      if(boilCv.width !== nx || boilCv.height !== ny || !boilImg){ boilCv.width = nx; boilCv.height = ny; boilImg = boilCtx.createImageData(nx, ny); }
      const d = boilImg.data;
      for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const p = (j*nx+i)*4, on = boilCell(i0+i, j0+j); d[p] = d[p+1] = d[p+2] = 0; d[p+3] = on ? 255 : 0; if(on) boilAny = true; }
      if(boilAny){
        boilCtx.putImageData(boilImg, 0, 0);
        if(boilBig.width < nx*C || boilBig.height < ny*C){ boilBig.width = Math.max(boilBig.width, nx*C); boilBig.height = Math.max(boilBig.height, ny*C); }
        boilBigCtx.clearRect(0, 0, nx*C, ny*C);
        boilBigCtx.imageSmoothingEnabled = true;
        boilBigCtx.drawImage(boilCv, 0, 0, nx, ny, 0, 0, nx*C, ny*C);

      boilBox = {x: i0*C, y: j0*C, w: nx*C, h: ny*C};
    }
    if(!boilAny) return;
    ctx.globalAlpha = BOIL_TINT*(0.85 + 0.15*Math.sin(t*1.7));      // it heaves a little

    ctx.globalAlpha = 1;
  }
  const boilBubbles = [], boilFumes = [];
  let boilBubAcc = 0, boilFumeAcc = 0, boilTick = 0, boilSaid = false, boilOutT = 0, boilScaldSaid = false;
  function updateBoil(dt){
    if(!BOIL_ON) return;
    // bubbles and steam on the boiling water in sight (round the camera, which follows the boat)
    const hw = GW*PX/2 + 30, hh = GH*PX/2 + 30;
    boilBubAcc += dt*BOIL_BUBBLES; boilFumeAcc += dt*BOIL_FUMES;
    while(boilBubAcc > 1){ boilBubAcc -= 1;
      const x = wrapX(boat.x + rand(-hw, hw)), y = wrapY(boat.y + rand(-hh, hh));
      if(boilAt(x, y) && !onLand(x, y, 6)){ const n = 3 + Math.floor(Math.random()*4), big = rand(0.8, 1.3);   // a cluster welling up together
        for(let m=0;m<n;m++){ const a = rand(0, TAU), d = m ? rand(3, 9) : 0;
          boilBubbles.push({x: x + Math.cos(a)*d, y: y + Math.sin(a)*d, r: rand(1.8, 4.2)*big*(m ? 0.8 : 1.2), life: -m*rand(0.05, 0.2), max: rand(0.6, 1.5), seed: rand(0, 6.3)}); } }
    }
    while(boilFumeAcc > 1){ boilFumeAcc -= 1;
      const x = wrapX(boat.x + rand(-hw, hw)), y = wrapY(boat.y + rand(-hh, hh));
      if(boilAt(x, y) && !onLand(x, y, 3)) boilFumes.push({x, y, z: 0, vz: rand(5, 9), r: rand(4, 8), life: 0, max: rand(2.5, 4), seed: rand(0, 6.3)});
    }
    const dw = windAngle + Math.PI, wx = Math.cos(dw)*windStrength*8, wy = Math.sin(dw)*windStrength*8;
    for(let i=boilBubbles.length-1;i>=0;i--){ const b = boilBubbles[i]; b.life += dt; if(b.life >= b.max) boilBubbles.splice(i, 1); }
    for(let i=boilFumes.length-1;i>=0;i--){ const f = boilFumes[i]; f.life += dt; if(f.life >= f.max){ boilFumes.splice(i, 1); continue; }
      f.x += wx*dt; f.y += wy*dt; f.z += f.vz*dt; }
    // the boat in it: a few seconds' grace (the hull hisses), then the hull suffers
    const inBoil = playing && !moor && boilAt(boat.x, boat.y);
    if(inBoil){
      boilOutT = 0;
      if(!boilSaid){ boilSaid = true; toast(TEXT.toasts.boilIn); buzz([15, 40, 15]); }
      boat.boilT = (boat.boilT || 0) + dt;
    } else {
      boat.boilT = Math.max(0, (boat.boilT || 0) - dt*2);
      boilOutT += dt; if(boilOutT > 4){ boilSaid = false; boilScaldSaid = false; }
    }
    const burning = inBoil && boat.boilT > BOIL_DELAY;
    boat.scald = Math.max(0, Math.min(1, (boat.scald || 0) + (burning ? dt*0.5 : -dt*0.07)));   // her sides scorch, and slowly come clean
    // steam off the hull at the waterline: a wisp while she's in it, pouring once it scalds
    const hiss = inBoil ? (burning ? 10 : 3) : 0;
    if(hiss && STEAM_ON && Math.random() < hiss*dt*2){
      const ca = Math.cos(boat.angle), sa = Math.sin(boat.angle), u = rand(-15, 17), sd = Math.random() < 0.5 ? -1 : 1, v = sd*(7.5 - Math.abs(u)*0.2);
      const out = sd*rand(3, 6);                             // a little out from her side, so it doesn't hide her
      steam.push({x: boat.x + ca*u - sa*(v + out), y: boat.y + sa*u + ca*(v + out), z: 1, vz: rand(8, 14), r: rand(0.8, 1.3)*(burning ? 1 : 0.7),
                  a: burning ? 0.9 : 0.5, life: 0, max: rand(1, 1.6), seed: Math.random()*6.3});
    }
    if(burning){
      boat.health = Math.max(0, boat.health - BOIL_DAMAGE*dt);
      if(!boilScaldSaid){ boilScaldSaid = true; popups.push({x: boat.x, y: boat.y - 26, text: TEXT.popups.scald, life: 1.8, max: 1.8}); }
      boilTick -= dt;
      if(boilTick <= 0){ boilTick = 1; showHealth(); hurtFlash = Math.max(hurtFlash, 0.15); boat.rock = Math.min(2.5, (boat.rock||0) + 0.3); Sfx.sizzle(1); buzz(30); }
    } else boilTick = 0;
  }
  // bubbles: paper with an ink rim, swelling, then popping into a ring and a few specks; steam drifts over them
  function drawBoilBubbles(){
    if(!boilBubbles.length) return;
    const whole = new Path2D(), rings = new Path2D(), specks = new Path2D();
    for(const b of boilBubbles){
      if(!inView(b.x, b.y, 8)) continue;
      if(b.life < 0) continue;
      const q = b.life/b.max;
      if(q < 0.75){ const r = b.r*Math.sqrt(q/0.75) + 0.3; whole.moveTo(b.x + r, b.y); whole.arc(b.x, b.y, r, 0, TAU); }
      else { const k = (q - 0.75)/0.25, r = b.r*(1 + 0.9*k);
        rings.moveTo(b.x + r, b.y); rings.arc(b.x, b.y, r, 0, TAU);
        for(let m=0;m<3;m++){ const a = b.seed + m*2.1, d = r + 1 + k*2; specks.moveTo(b.x + Math.cos(a)*d + 0.6, b.y + Math.sin(a)*d); specks.arc(b.x + Math.cos(a)*d, b.y + Math.sin(a)*d, 0.6, 0, TAU); } }
    }
    ctx.fillStyle = PAPERC; ctx.fill(whole); ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.stroke(whole);
    ctx.globalAlpha = 0.7; ctx.lineWidth = 0.8; ctx.stroke(rings); ctx.fillStyle = PAPERC; ctx.fill(specks); ctx.globalAlpha = 1;
  }
  function drawBoilFumes(){
    if(!boilFumes.length) return;
    const blobs = new Path2D(), wisps = new Path2D();
    for(const f of boilFumes){
      const y = f.y - f.z*BOAT_TILT;
      if(!inView(f.x, y, 20)) continue;
      const q = f.life/f.max, r = f.r*(1 + 2.2*q);
      if(q < 0.55){ blobs.moveTo(f.x + r, y); blobs.arc(f.x, y, r, 0, TAU); }
      else for(let m=0;m<3;m++){ const a = f.seed + m*2.1, d = r*0.7, rr = r*0.5*(1 - q)/0.45 + 0.4;
        wisps.moveTo(f.x + Math.cos(a)*d + rr, y + Math.sin(a)*d); wisps.arc(f.x + Math.cos(a)*d, y + Math.sin(a)*d, rr, 0, TAU); }
    }
    ctx.globalAlpha = 0.55; ctx.fillStyle = V(0.7); ctx.fill(wisps);
    ctx.globalAlpha = 0.45; ctx.strokeStyle = INKC; ctx.lineWidth = 1.2; ctx.stroke(blobs);
    ctx.globalAlpha = 0.7; ctx.fillStyle = PAPERC; ctx.fill(blobs);
    ctx.globalAlpha = 1;
  }

  // the seams between the room map's squares (A1–I9, home's in the middle), dotted on the water like on the maps
  function drawRoomSeams(camX, camY, w, h){
    if(!(ROOM_SEAMS > 0)) return;
    const x0 = START.x - WORLD.w/2, y0 = START.y - WORLD.h/2, rw = WORLD.w/ROOM_N, rh = WORLD.h/ROOM_N;
    ctx.save(); ctx.strokeStyle = INKC; ctx.globalAlpha = ROOM_SEAMS; ctx.lineWidth = 1.5; ctx.setLineDash([3, 7]); ctx.beginPath();
    for(let i = Math.ceil((camX - x0)/rw), e = Math.floor((camX + w - x0)/rw); i <= e; i++){ const x = Math.round(x0 + i*rw); ctx.moveTo(x, camY); ctx.lineTo(x, camY + h); }
    for(let j = Math.ceil((camY - y0)/rh), e = Math.floor((camY + h - y0)/rh); j <= e; j++){ const y = Math.round(y0 + j*rh); ctx.moveTo(camX, y); ctx.lineTo(camX + w, y); }
    ctx.stroke(); ctx.restore();
  }

  // ---------- Rollers: big breaking waves ----------
  // Now and then a big wave rolls in from upwind, well away from any shore.
  // It builds up, breaks into tumbling foam, then fades out. Crossing its
  // crest head-on or broadside hurts; catching it from astern lets you surf.
  const rollers = [];
  let rollerT = 6;
  // crest offset (along the direction of travel) at u in -1..1: the middle
  // runs ahead, a slow swell rolls along the crest, the ends drag behind
  function rollerCrest(w, u){
    const p = w.t/w.dur;
    return w.bow*(1-u*u)
         + 2.2*Math.sin(u*4.5 + w.t*1.9 + w.seed) + 1.1*Math.sin(u*10 - w.t*2.7 + w.seed*2)
         - 5*Math.pow(Math.abs(u),3)*p;
  }
  function rollerStrength(w){       // 0..1 envelope: build, break, fade
    const p = w.t/w.dur;
    const sm = x=>{ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); };
    return p<0.3 ? sm(p/0.3) : p<0.7 ? 1 : 1 - sm((p-0.7)/0.3);
  }
  // a wave rising at (x,y), travelling downwind, if the spot allows it
  function rollerAt(x, y){
    const dw = windAngle + Math.PI, ux = Math.cos(dw), uy = Math.sin(dw);   // travel direction
    // only in deep water (the darker sea: away from land, harbours and home waters), with some ahead of it
    if(!deepAt(wrapX(x), wrapY(y)) || !deepAt(wrapX(x+ux*120), wrapY(y+uy*120))) return null;
    const speed = rand(25,30), w = {x, y, ux, uy, L: rand(45,75), bow: rand(5,8), thick: rand(9,13),
                    speed, base: speed, t:0, dur: rand(4,6), hit:false, broke:false, seed: rand(0,100)};
    rollers.push(w);
    return w;
  }
  function spawnRoller(){
    const dw = windAngle + Math.PI, ux = Math.cos(dw), uy = Math.sin(dw);
    for(let tries=0; tries<20; tries++){
      const back = rand(60, 360), side = rand(-260, 260);
      if(rollerAt(boat.x - ux*back - uy*side, boat.y - uy*back + ux*side)) return;
    }
  }
  // running downwind for a while, she may get a wave of her own: it rises a
  // little astern (off to one side or the other), close enough to catch her
  // before it dies, so she can surf it if she steers onto it
  let downwindT = 0, surfWave = null;
  function surfWaves(dt){
    if(surfWave && (surfWave.hit || !rollers.includes(surfWave))) surfWave = null;   // one at a time
    const rel = Math.abs(norm(boat.angle - windAngle))*180/Math.PI;
    const running = rel >= DOWNWIND_DEG && boat.speed > ROW_ENTER && !anchored && !moor && !fishing && !boat.whirl;
    downwindT = running ? downwindT + dt : 0;
    if(downwindT < SURF_WAVE_AFTER || surfWave) return;
    if(Math.random() >= 1 - Math.pow(1 - SURF_WAVE_CHANCE, dt)) return;   // SURF_WAVE_CHANCE per second
    const dw = windAngle + Math.PI, ux = Math.cos(dw), uy = Math.sin(dw);
    const back = SURF_WAVE_BACK*rand(0.85, 1.15), side = rand(-1, 1)*SURF_WAVE_SIDE;
    surfWave = rollerAt(boat.x - ux*back - uy*side, boat.y - uy*back + ux*side);
    if(surfWave){                                        // it comes up already at her pace (plus a little), so it closes in
      const c = Math.cos(boat.angle)*ux + Math.sin(boat.angle)*uy;
      surfWave.speed = Math.min(surfWave.base*3, Math.max(surfWave.base, boat.speed*c + ROLLER_CATCH));
      surfWave.dur = rand(5.5, 6.5);                      // and lives long enough to reach her
    }
  }
  // A quiet hand on the waves near the boat: one coming up astern while
  // she runs with it hurries (and lingers a little) so it can catch her and
  // she surfs; one about to hit her badly (head-on or broadside) slows, giving
  // her time to turn or get clear. Eased in and out, so it never shows as a jump.
  // Returns how fast the wave's life runs (a hurrying wave lives a bit longer).
  function rollerPace(w, dt){
    let target = w.base, life = 1;
    if(!w.hit && !moor && !boat.whirl){
      const dx = wdx(boat.x, w.x), dy = wdy(boat.y, w.y);
      const ahead = dx*w.ux + dy*w.uy, u = (-dx*w.uy + dy*w.ux)/(w.L/2);   // boat ahead of the wave (px), and along its crest
      if(ahead > -5 && ahead < 220 && Math.abs(u) < 1.2){
        const near = Math.min(1, (220 - ahead)/80);                           // full effect within 140 px, fading out to none at 220
        const c = Math.cos(boat.angle)*w.ux + Math.sin(boat.angle)*w.uy;      // 1 = she runs with the wave
        if(c > SURF_COS){
          const runs = Math.max(0, boat.speed*c);                             // her pace along the wave's travel
          target = Math.max(w.base, Math.min(w.base*3, runs + ROLLER_CATCH*near));
          life = 1 - 0.4*near;
        } else target = w.base*(1 - (1 - ROLLER_SPARE)*near);
      }
    }
    w.speed += (target - w.speed)*Math.min(1, dt*1.6);
    return life;
  }
  function updateRollers(dt){
    if(playing) surfWaves(dt);
    if(!moor && playing && ROLLER_RATE > 0){
      rollerT -= dt * (fishing ? 0.2 : 1);            // quieter seas while the nets are out
      if(rollerT<=0){
        const dg = danger(boat.x, boat.y);
        const open = 1 - archipelago(boat.x, boat.y);
        rollerT = rand(0.8,1.2) * (4.5 - 2.2*dg) * (1.4 - 0.9*open) / ROLLER_RATE;   // a little rarer near home and among islands, frequent far out on open sea
        if(rollers.length < (open > 0.6 ? 12 : 8)) spawnRoller();            // (anywhere past home waters: spawnRoller keeps them out of those)
      }
    }
    for(let k=rollers.length-1;k>=0;k--){
      const w = rollers[k];
      w.t += dt * rollerPace(w, dt);
      w.x += w.ux*w.speed*dt; w.y += w.uy*w.speed*dt;
      if(!deepAt(wrapX(w.x+w.ux*40), wrapY(w.y+w.uy*40)))
        w.t = Math.max(w.t, w.dur*0.75);                  // dies on leaving deep water (shoaling near land, a harbour mouth)
      if(wdist(wrapX(w.x),wrapY(w.y),START.x,START.y) < SAFE_R + 60){ w.hit = true; w.t = Math.max(w.t, w.dur*0.8); }   // home waters: it dies down harmlessly
      const s = rollerStrength(w);
      const dx = wdx(boat.x, w.x), dy = wdy(boat.y, w.y);
      const dist = Math.hypot(dx,dy);
      // it breaks: a roar, louder the closer it is
      if(!w.broke && w.t > w.dur*0.3){ w.broke = true; if(dist < 700) Sfx.waveBreak(Math.max(0.15, 1-dist/700), Math.max(-0.8,Math.min(0.8,dx/400))); }
      if(w.t >= w.dur){ rollers.splice(k,1); continue; }
      if(w.hit || moor || boat.whirl || s < 0.55) continue;
      // boat in wave frame: across = along travel, along = along the crest
      const across = dx*w.ux + dy*w.uy, along = -dx*w.uy + dy*w.ux;
      const u = along/(w.L/2);
      if(Math.abs(u) >= 1) continue;
      const crest = rollerCrest(w, u);                    // the middle runs ahead, the crest undulates
      const half = w.thick*0.6*Math.pow(1-u*u,0.5) + boat.r*0.5;
      if(Math.abs(across - crest) > half) continue;
      w.hit = true;
      const c = Math.cos(boat.angle)*w.ux + Math.sin(boat.angle)*w.uy;   // 1 = sailing with the wave
      if(c > SURF_COS){
        boat.surfK = rigK(RIG_SURF); boat.surfT = 2.6*boat.surfK;      // the square sail runs before a wave best, the lateen worst
        popups.push({x:boat.x, y:boat.y-24, text:TEXT.popups.surf, life:1.4, max:1.4});
        Sfx.surf();
        boat.rock = Math.min(2.5, (boat.rock||0) + 0.8);
        buzz([180,50,120,50,70]);                   // riding the wave: a sustained rumble
      } else {
        const k2 = s*(0.6 + 0.4*(1-Math.max(0,c)));        // head-on and broadside hurt most
        const dmg = Math.round((6 + 10*k2)*rigK(RIG_WAVE_HIT));        // (the lateen suffers most, the square least)
        boat.health = Math.max(0, boat.health - dmg);
        boat.kx += w.ux*45*s; boat.ky += w.uy*45*s; boat.kdamp = 2.2;
        boat.speed *= 0.4;
        boat.angle += (Math.random()<0.5?-1:1)*0.25*k2*rigK(RIG_BROACH);   // slewed round (the lateen broaches)
        hurtFlash = 0.35; shake = 0.28; showHealth();
        popups.push({x:boat.x, y:boat.y-24, text:'-'+dmg, life:1.1, max:1.1});
        Sfx.waveHit(k2);
        boat.rock = Math.min(2.5, (boat.rock||0) + 1.6*k2);
        buzz([60,30,80]);                           // slapped by a wave
      }
    }
  }
  // soft round shadows (swell, stirred water over a fish bank): a radial
  // gradient painted once into a small sprite and stamped scaled, instead of a
  // new gradient object every patch every frame (garbage and per-pixel maths)
  const softDots = {};
  function softDot(key, stops){
    if(softDots[key]) return softDots[key];
    const S = 64, cv = document.createElement('canvas'); cv.width = cv.height = S;
    const c = sceneCtx(cv), g = c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    for(const [o,a] of stops) g.addColorStop(o, 'rgba(0,0,0,'+a+')');
    c.fillStyle = g; c.fillRect(0,0,S,S);
    return softDots[key] = cv;
  }
  function stampDot(dot, x, y, r, alpha){
    const a0 = ctx.globalAlpha;
    ctx.globalAlpha = a0*alpha;
    ctx.drawImage(dot, x-r, y-r, r*2, r*2);
    ctx.globalAlpha = a0;
  }
  // the wave: a dark, steepening face along a bowed crest line, tapered at
  // the ends; once it breaks, white foam tumbles along the crest and spills
  // back, and as it fades the foam thins into scattered specks
  function drawRoller(w){
    if(!inView(w.x, w.y, w.L)) return;
    const s = rollerStrength(w), p = w.t/w.dur;
    const fx = w.ux, fy = w.uy, cx = -fy, cy = fx;       // travel / crest directions
    const N = 30;
    // the swell rises from the middle outward, and dies back from the ends
    const reach = Math.min(1, 0.3 + 0.7*Math.min(1, p/0.3)) * (p>0.75 ? 1 - (p-0.75)/0.25*0.45 : 1);
    const P = (u, off)=>{                                // u -1..1 along crest, off along travel
      const c = rollerCrest(w, u);
      return [w.x + cx*u*w.L/2 + fx*(c+off), w.y + cy*u*w.L/2 + fy*(c+off)];
    };
    // thickness: tapered ends, breathing, a little lumpy along the crest
    const taper = u=> Math.pow(Math.max(0,1-(u/reach)*(u/reach)), 0.6);
    const thick = u=> w.thick*taper(u)*(0.5+0.5*s)*(0.85 + 0.15*Math.sin(u*7 + w.t*2.3 + w.seed));
    const span = (fn)=>{ for(let i=0;i<=N;i++){ const u=(-1+2*i/N)*reach; fn(u,i); } };
    // the swell: soft overlapping patches of darker water along the crest,
    // each breathing on its own, so the wave reads as moving water
    for(let i=0;i<=N;i+=1){
      const u = (-1+2*i/N)*reach, tp = taper(u);
      if(tp < 0.05) continue;
      const th = thick(u), wob = Math.sin(w.t*2.2 + i*0.9 + w.seed);
      const [x,y] = P(u, -th*(0.45 + 0.12*wob));
      const r = th*(0.7 + 0.18*Math.sin(i*1.3 + w.t*1.6));
      stampDot(softDot('swell', [[0,1],[1,0]]), x, y, r, 0.14*s*tp);
    }
    // crest: a broken, stippled line that comes and goes along its length
    ctx.strokeStyle = INKC; ctx.lineWidth = 1.2; ctx.lineCap='round';
    for(let i=0;i<N;i++){
      const u0=(-1+2*i/N)*reach, u1=(-1+2*(i+0.75)/N)*reach;
      const flick = 0.5 + 0.5*Math.sin(w.t*3.1 + i*1.7 + w.seed);
      if(flick < 0.25) continue;
      ctx.globalAlpha = Math.min(1, s*flick*taper((u0+u1)/2)*1.2);
      const [x0,y0]=P(u0,0), [x1,y1]=P(u1,0);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    // back of the wave: a few ripples trailing behind, stretched by the swell
    ctx.lineWidth = 1;
    for(let k=0;k<5;k++){
      const u = (-0.7 + 0.35*k)*reach, back = -thick(u)*(1.5 + 0.4*Math.sin(w.t*1.7+k)), l = 0.08;
      ctx.globalAlpha = s*0.45;
      const [x0,y0]=P(u-l,back), [x1,y1]=P(u+l,back-1.5);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // foam: tumbling blobs on the crest while breaking, spilling back and
    // breaking up into specks as the wave dies
    const foam = p<0.25 ? 0 : p<0.35 ? (p-0.25)/0.1 : 1;
    if(foam>0){
      const spill = Math.max(0, (p-0.55)/0.45);           // 0 → 1 over the fade
      // white water riding the crest (ink edge, paper body), thinning as it fades
      const bw = 3.2*foam*(1-spill*0.8);
      if(bw>0.8){
        const crestPath = ()=>{ ctx.beginPath(); for(let i=0;i<=N;i++){ const u=(-0.9+1.8*i/N)*reach; const [x,y]=P(u, Math.sin(w.t*3+i)*0.8 - spill*6); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); } };
        ctx.globalAlpha = Math.min(1, s*1.3); ctx.lineCap='round';
        ctx.strokeStyle = INKC; ctx.lineWidth = bw+2; crestPath(); ctx.stroke();
        ctx.strokeStyle = PAPERC; ctx.lineWidth = bw; crestPath(); ctx.stroke();
      }
      const nb = Math.floor(w.L/7);
      for(let i=0;i<nb;i++){
        const h = Math.sin(w.seed + i*12.9898)*43758.5453, rr = h - Math.floor(h);
        const u = (-0.95 + 1.9*(i+rr*0.8)/nb + 0.04*Math.sin(w.t*1.3 + i))*reach;   // foam slides along the crest
        const tw = taper(u);
        if(tw < 0.15) continue;
        const roll = Math.sin(w.t*4 + i*1.7)*2.2;          // tumbling
        const back = -spill*w.thick*1.4*(0.4+rr);
        const [x,y] = P(u, roll*0.5 + back);
        const r = (1.4 + 1.9*rr)*tw*foam*(1 - spill*0.7);
        if(r < 0.5) continue;
        ctx.globalAlpha = Math.min(1, s*1.3);
        ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
        if(spill < 0.6){ ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.stroke(); }
        // little curls thrown ahead of the crest
        if(i%3===0 && spill<0.3){
          const [qx,qy] = P(u, 5+roll);
          ctx.beginPath(); ctx.arc(qx,qy,2.4*tw,Math.atan2(fy,fx)-2.2,Math.atan2(fy,fx)+0.6); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---- rowing by hand: the oar button on the right, pressed in rhythm ----
  // Like grinding berries: the first press sets her rowing, slowly (power
  // oarSpin = OAR_START), and the button's disc starts turning, its pointer
  // going round once a stroke (OAR_RATE turns a second, a steady beat; it
  // eases in at the start and winds down to a halt at the end). Each time the pointer comes back up to the fixed mark is the
  // moment to press: the button swells just before (OAR_WARN). On time
  // (within OAR_WINDOW of the mark) the stroke gets a proper push (OAR_GOOD,
  // the disc flashes ink); too early or too late, only a little (OAR_MISS).
  // One press a turn counts. Without presses the power drains away
  // (OAR_SPIN_FADE) and she stops. Her way is OAR_MAX × power, in surges,
  // plus a kick for each stroke on time (OAR_KICK, fading).
  const elOar = document.getElementById('oar-ctl'), elOarRot = elOar.querySelector('.oar-rot');
  let oarLocked = false, oarSpin = 0, oarCycle = 0, oarRate = 0, oarKick = 0, oarShown = -1, oarPressedTurn = -1, oarHitT = 0, oarSkipped = 0;
  elOar.setAttribute('aria-label', TEXT.oars.label);
  function pressOar(){
    Sfx.init();

      oarSpin = OAR_START;
      if(boat.oarK > 0.05){ oarPressedTurn = oarSkipped = Math.floor(oarCycle); }   // the oars still out: carry on from where the blades are, no jump
      else { oarCycle = 0; oarPressedTurn = 0; oarSkipped = 0; }

    if(turn === oarPressedTurn) { buzz(4); return; }         // already pressed for this one

  // ---- the spring (SPRING_PADDLES): wind the crank, the wheels do the rest ----
  // A finger on the crank and turned round clockwise winds the spring (SPRING_TURNS full turns to fill it; turning back
  // does nothing, a ratchet); a click every quarter turn. While it holds some charge the paddle wheels drive her on their
  // own (SPRING_SPEED), and it runs down over SPRING_TIME s of driving; it rests while the sail drives her faster, at anchor or moored
  const elCrank = document.getElementById('crank'), elCrankRot = elCrank.querySelectorAll('.rot'), elCrankCharge = elCrank.querySelector('.charge');
  let spring = 0, windProg = 0, crankA = 0, crankDrag = null, crankTick = 0, crankStep = 0, crankKey = '', crankLocked = false, crankBack = 0, crankMove = 0, crankSpeed = 0;   // (crankBack: radians still to unwind as it springs back)
  // (locked: wound full, it won't turn again until the spring has run right down)

  const windSpring = da=>{                                   // da: radians turned clockwise
    if(da <= 0 || crankLocked) return;

    const was = spring;

    const TOOTH = Math.PI*2/16;                              // the gear's sixteen teeth: a tick each, a heavier step every quarter turn
    while(crankTick >= TOOTH){ crankTick -= TOOTH;
      const tense = 1 + 0.4*windProg;                        // the spring tightening: the gear's knock rises a little
      if(crankStep >= Math.PI/2){ crankStep -= Math.PI/2; Sfx.ratchet(CRANK_VOL, true, tense); buzz(spring < 1 ? 12 : 4); }
      else Sfx.ratchet(CRANK_VOL*(spring < 1 ? 1 : 0.5), false, tense);

  // ---------- Cicadas ----------
  // In the afternoon a chorus of cicadas sings on the wild islands (in the
  // pines and the macchia): heard only when the boat is close to a shore,
  // never on the village islands (the town is heard there), and quiet by
  // evening; the crickets take over at night.
  const CICADA_REACH = 220;                    // heard only this close to a shore
  let cicadaT = 0, cicadaNear = 0;
  // they sing in the afternoon: in from early afternoon, quiet by evening
  // (dayT: 0 first light, 0.5 midday-ish, 0.58 golden hour, 0.66 night)
  function cicadaHours(){
    const ss = (a,b,x)=>{ const k = Math.max(0, Math.min(1, (x-a)/(b-a))); return k*k*(3-2*k); };
    return ss(0.28, 0.34, dayT) * (1 - ss(0.5, 0.57, dayT));
  }
  function updateCicadas(dt){
    cicadaT -= dt;
    if(cicadaT <= 0){                                   // how close is land? (a few times a second is plenty)
      cicadaT = 0.3; let best = 0;
      islandGrid.query(boat.x, boat.y, CICADA_REACH + 200, isl=>{
        if(isl.village || isl.home) return;            // not at home, nor on town islands (their own sounds come first)
        const d = Math.max(0, Math.hypot(wdx(isl.x, boat.x), wdy(isl.y, boat.y)) - isl.rmax*0.9);   // ≈ distance from the shore
        best = Math.max(best, 1 - Math.min(1, d/CICADA_REACH));
      });
      if(drawnSD) best = Math.max(best, 1 - Math.min(1, Math.max(0, drawnDist(boat.x, boat.y))/CICADA_REACH));   // the drawn map's coasts
      cicadaNear = best;
    }
    Sfx.cicadas(playing ? cicadaHours()*cicadaNear*cicadaNear : 0);
  }

  // ---------- Night sounds ----------
  // After dark: crickets chirping (louder near land) and, now and then,
  // a howl from some island far off, sometimes answered.
  let cricketT = 0.5, howlT = 12;
  // crickets come and go in spells; everything is placed on actual islands
  let crGate = 0, crTarget = 1, crPhaseT = 12;
  function updateNightSound(dt){
    const n = typeof NIGHT==='number' ? NIGHT : 0;
    if(!playing || n < 0.3) return;
    const k = (n-0.3)/0.7;
    // spells: on for a while, then a hush
    crPhaseT -= dt;
    if(crPhaseT <= 0){ crTarget = crTarget ? 0 : 1; crPhaseT = crTarget ? rand(8,18) : rand(6,14); }
    crGate += (crTarget - crGate)*Math.min(1, dt*0.5);
    // nearby islands: the crickets live there
    const near = [];
    islandGrid.query(boat.x, boat.y, 650, isl=>{
      const dx = wdx(isl.x, boat.x), dy = wdy(isl.y, boat.y), d = Math.max(0, Math.hypot(dx,dy) - isl.R*0.7);
      if(d < 650) near.push([isl, dx, d]);
    });
    if(near.length && crGate > 0.05){
      cricketT -= dt*(0.8 + 1.8*k)*crGate*Math.min(3, near.length);
      if(cricketT <= 0){
        cricketT = rand(0.2, 0.7);
        const [isl, dx, d] = near[Math.floor(Math.random()*near.length)];
        const v = Math.max(0, 1 - d/650);
        Sfx.cricket(0.013*k*v*crGate*rand(0.6,1), Math.max(-0.9, Math.min(0.9, dx/350)));
      }
    }
    // a howl from some island further off, sometimes answered from another
    howlT -= dt*k;
    if(howlT <= 0){
      howlT = rand(24, 55);
      const far = [];
      islandGrid.query(boat.x, boat.y, 1300, isl=>{ const dx=wdx(isl.x,boat.x), dy=wdy(isl.y,boat.y), d=Math.hypot(dx,dy); if(d > 250 && !isl.home && !isl.village) far.push([dx,d]); });
      if(far.length){
        const [dx,d] = far[Math.floor(Math.random()*far.length)];
        const v = 0.016*k*(1 - 0.5*d/1300);
        Sfx.howl(v, Math.max(-0.9, Math.min(0.9, dx/500)));
        if(far.length > 1 && Math.random() < 0.45){
          const [dx2,d2] = far[Math.floor(Math.random()*far.length)];
          setTimeout(()=> Sfx.howl(0.011*k*(1 - 0.5*d2/1300), Math.max(-0.9, Math.min(0.9, dx2/500))), rand(1800,3500));
        }
      }
    }
  }


  // ---------- Town sounds ----------
  let townEvT = 1, chatT = 0;
  const TOWN_VOL = 0.6;               // overall loudness of the town sounds
  const TOWN_EVENTS = ['hammer','hammer','call','call','call','cart','clink','laugh','bell'];
  function updateTownSound(dt){
    let best = 0, pan = 0;
    for(const v of VILLAGES){
      const dx = wdx(v.isl.x, boat.x), dy = wdy(v.isl.y, boat.y), d = Math.hypot(dx,dy);
      const lv = Math.max(0, Math.min(1, 1 - (d-70)/430));
      if(lv > best){ best = lv; pan = Math.max(-1, Math.min(1, dx/300)); }
    }
    const quiet = 1 - 0.55*(typeof NIGHT==='number' ? NIGHT : 0);   // hushed at night
    const lvl = playing ? best*quiet : 0;
    if(lvl > 0.05){
      chatT -= dt;
      if(chatT <= 0){                                   // background crowd: overlapping words
        chatT = rand(0.07, 0.22) / (0.3 + lvl);
        Sfx.chatter(TOWN_VOL*0.025*lvl*rand(0.5,1), Math.max(-0.9, Math.min(0.9, pan + rand(-0.5,0.5))));
      }
      townEvT -= dt*(0.4 + lvl);
      if(townEvT <= 0){
        townEvT = rand(0.9, 2.6);
        const kind = TOWN_EVENTS[Math.floor(Math.random()*TOWN_EVENTS.length)];
        Sfx.townEvent(kind, TOWN_VOL*lvl, Math.max(-0.9, Math.min(0.9, pan + rand(-0.3,0.3))));
      }
    }

  // ---------- Wind streaks ----------
  // Now and then a long, thin line of wind sweeps across the view in the
  // direction the wind blows, sometimes ending in a little curl.
  const streaks = [];
  let streakT = 1;
  function makeStreakPath(){
    // a wavy line along +x that ends in a tightening curl (in local units)
    const pts = [[0,0]], L = rand(40, 70)*WIND_STREAK_LEN, amp = rand(1.5,3), fr = rand(0.05,0.08), ph = rand(0,6.3);
    for(let u=3; u<=L; u+=3) pts.push([u, Math.sin(u*fr+ph)*amp*(0.4+0.6*u/L)]);
    const [ex,ey] = pts[pts.length-1], dirUp = Math.random()<0.5 ? -1 : 1;
    let r = rand(4,6.5), a = -dirUp*Math.PI/2;
    const cx = ex, cy = ey + dirUp*r;
    for(let k=0;k<13;k++){ a += dirUp*0.38; r *= 0.94; pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]); }
    const cum = [0]; for(let k=1;k<pts.length;k++) cum.push(cum[k-1] + Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1]));
    return {pts, cum, len: cum[cum.length-1]};
  }
  function updateStreaks(dt){
    streakT -= dt;
    if(streakT <= 0){
      streakT = rand(1.2, 2.8) / (0.5 + windStrength*boat.windMul) / WIND_STREAK_RATE;   // (more in a gust)
      const dw = windAngle + boat.windOff + Math.PI;                      // the wind where she is (it veers among the islands)
      const a = rand(0,Math.PI*2), d = rand(40, 260);
      streaks.push({x: boat.x + Math.cos(a)*d, y: boat.y + Math.sin(a)*d, ang: dw + rand(-0.15,0.15),
                    drift: rand(12, 22), age: 0, life: rand(1.8, 2.6), path: makeStreakPath(), wig: rand(0,6.3)});
    }
    const dw = windAngle + boat.windOff + Math.PI;
    for(let k=streaks.length-1;k>=0;k--){
      const s = streaks[k];
      s.age += dt; s.x += Math.cos(dw)*s.drift*dt; s.y += Math.sin(dw)*s.drift*dt;   // barely drifting
      if(s.age >= s.life) streaks.splice(k,1);
    }
  }
  function drawStreaks(){
    ctx.strokeStyle = INKC; ctx.lineCap = 'round'; ctx.lineWidth = WIND_STREAK_WIDTH;
    for(const s of streaks){
      if(!inView(s.x, s.y, 140)) continue;
      const p = s.age/s.life, P = s.path;
      // the line draws itself out (head advancing), then the tail catches up
      const head = P.len * Math.min(1, p/0.55), tail = P.len * Math.max(0, (p-0.45)/0.55);
      const ca = Math.cos(s.ang), sa = Math.sin(s.ang);
      ctx.globalAlpha = WIND_STREAK_ALPHA * Math.min(1, p*9, (1-p)*9);        // quick fade in and out
      ctx.beginPath();
      let started = false;
      for(let k=0;k<P.pts.length;k++){
        const c = P.cum[k];
        if(c < tail || c > head) continue;
        const wig = Math.sin(s.age*3 + k*0.4 + s.wig)*0.5;          // a slight ripple along the line
        const lx = P.pts[k][0], ly = P.pts[k][1] + wig;
        const x = s.x + lx*ca - ly*sa, y = s.y + lx*sa + ly*ca;
        if(started) ctx.lineTo(x,y); else { ctx.moveTo(x,y); started = true; }
      }
      if(started) ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Shopping list ----------

      + '<circle cx="'+f(hx*Rr*eff)+'" cy="'+f(hy*Rr*eff)+'" r="3.4" fill="currentColor" stroke="var(--paper)" stroke-width="1"/>'
      + '<g transform="rotate('+f(rel)+')">'   // the boat herself, seen from above, bow along her heading
      + '<path d="M0 -13 Q6.2 -6 5.6 3 L4 10 H-4 L-5.6 3 Q-6.2 -6 0 -13 Z" fill="var(--paper)" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>'
      + '<path d="M-3.6 -7 H3.6 M-4.2 4.5 H4.2" stroke="currentColor" stroke-width=".8"/>'   // two thwarts

      + '<p class="wind-sub">'+fmt(TEXT.sails.breeze, {pct: Math.round(windStrength*100)})+(sailsInHold().length ? ' · '+TEXT.sails.spareLine : '')+'</p>';
  }
  // the right page: the boat's hold. The purse, every fish aboard (small, as

  const elHoldPage = document.getElementById('hold-page');
  let cargoSel = null;                                   // picked in the Cargo, to throw overboard: {kind:'fish'|'dish'|'bottle', key}
  function holdHTML(){
    // HOLD_MAX slots in a grid: the spare sail, fish, then dishes, the rest empty; the gifts are kept apart, below
    const items = [...sailsInHold().map(r=> ({sail: r})), ...(chargeSlots() ? [{charges: true}] : []), ...bottleHold.map((b,i)=> ({bottle: i})), ...FISH_KEYS.flatMap(k=> Array(counts[k]).fill({name: FISH_NAME[k].one, svg: document.querySelector('#wood .fish-'+k+' svg').outerHTML, fish:true, kind:'fish', key:k})),

    const slot = k=> { const it = items[k]; if(it && it.sail) return spareHTML(it.sail);
      if(it && it.charges){ const nm = fmt(TEXT.oars.chargesLeft, {n: charges}); return '<span class="slot charges" title="'+nm+'" role="img" aria-label="'+nm+'">'+itemIcon('Charges')+'<span class="n">'+charges+'</span></span>'; } if(it && it.bottle !== undefined) return bottleSlotHTML(it.bottle, selCls(it)); return it ? '<button type="button" class="slot item'+(it.fish?' fish':'')+selCls(it)+'" data-item="'+it.kind+'|'+it.key+'" title="'+it.name+'" aria-label="'+it.name+'">'+it.svg+'</button>' : '<span class="slot empty"></span>'; };

      + (gifts.length || powerOwned ? '<div class="hold-goods">'+powerHTML()+gifts.map(g=> '<span title="'+g.name+'" role="img" aria-label="'+g.name+'">'+itemIcon(g.icon)+'</span>').join('')+'</div>' : '');
  }

  let listKey = '';
  const holdKey = ()=> [dayNo, coins, charges, boat.rig, cargoSel ? cargoSel.kind + cargoSel.key : '', bottleHold.map(b=> b.read ? 'r' : 'u').join(''), ...FISH_KEYS.map(k=>counts[k]), ...ALL_DISHES.map(d=> dishHold[d.icon]||0), ...VILLAGES.map(v=> v.giftGot?'g':''), powerOwned, powerLeft, Math.ceil(boonWindT), powerLeft < POWER_USES ? Math.ceil(powerT) : 0,

  // while the list is open, keep the hold up to date (a catch, a repair)

  const rooms = new Uint8Array(ROOM_N*ROOM_N), ROOM_W = WORLD.w/ROOM_N, ROOM_H = WORLD.h/ROOM_N;

  // the logbook button's icon, drawn like the wheel: in greys into a small
  // low-res canvas (one pixel per CSS pixel), then dithered to the interface's
  // two colours. Two states: the closed book (leather, spine with raised
  // bands, metal corners, an embossed compass rose, a strap and clasp) and the
  // open book shown while the panel is down. Drawn once, on the first frame.
  let logIconDone = false;
  const LOG_PX = 76;                           // the logbook icon's size, CSS px
  function drawLogbookIcon(){
    logIconDone = true;
    const S = LOG_PX, k = Math.max(1, Math.round(window.devicePixelRatio||1));   // drawn in 56 units, scaled up crisply
    const g = v=> 'rgb('+v+','+v+','+v+')', INKW = '#000', PAPW = '#fff';
    const paint = (cv, fn)=>{
      const lo = document.createElement('canvas'); lo.width = S; lo.height = S;
      const c = lo.getContext('2d', {willReadFrequently:true});
      c.lineJoin = 'round'; c.lineCap = 'round'; c.setTransform(S/56, 0, 0, S/56, 0, 0);
      fn(c); c.setTransform(1, 0, 0, 1, 0, 0); ditherUI(c, S, S);
      cv.width = S*k; cv.height = S*k;
      const x = cv.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(lo, 0, 0, cv.width, cv.height);
    };
    // closed: the cover with its page block showing on the fore-edge
    paint(elListBtn.querySelector('.log-cover'), c=>{
      c.fillStyle = g(90); c.beginPath(); c.roundRect(13, 10, 33, 40, 4); c.fill();                       // shadow
      c.fillStyle = PAPW; c.strokeStyle = INKW; c.lineWidth = 1.4;                                        // page block
      c.beginPath(); c.roundRect(14, 8, 30, 39, 3); c.fill(); c.stroke();
      c.strokeStyle = g(150); c.lineWidth = 0.8;
      for(let y = 11; y < 45; y += 2.2){ c.beginPath(); c.moveTo(40, y); c.lineTo(43.2, y); c.stroke(); }
      const cover = ()=>{ c.beginPath(); c.roundRect(9, 5, 31, 40, 3.5); };
      const lg = c.createLinearGradient(9, 5, 40, 45); lg.addColorStop(0, g(78)); lg.addColorStop(1, g(30));   // dark leather, a little lighter top left
      c.fillStyle = lg; cover(); c.fill();
      c.fillStyle = INKW; c.beginPath(); c.roundRect(9, 5, 7, 40, [3.5, 0, 0, 3.5]); c.fill();          // the spine
      c.strokeStyle = g(200); c.lineWidth = 1.2;                                                          // raised bands
      for(const y of [11, 19, 31, 39]){ c.beginPath(); c.moveTo(9.5, y); c.lineTo(15.5, y); c.stroke(); }
      const corner = (x, y, sx, sy)=>{                                                                    // metal corners
        c.save(); c.translate(x, y); c.scale(sx, sy);
        c.fillStyle = g(235); c.strokeStyle = INKW; c.lineWidth = 1.1;
        c.beginPath(); c.moveTo(0, 7); c.quadraticCurveTo(0, 0, 7, 0); c.lineTo(9, 0); c.lineTo(0, 9); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = INKW; c.beginPath(); c.arc(2.6, 2.6, 0.9, 0, Math.PI*2); c.fill();
        c.restore();
      };
      corner(40, 5, -1, 1); corner(40, 45, -1, -1);
      c.fillStyle = g(225); c.strokeStyle = INKW; c.lineWidth = 1.1;                                      // strap and clasp
      c.beginPath(); c.roundRect(34, 21, 12, 6, 1.5); c.fill(); c.stroke();
      c.fillStyle = PAPW; c.beginPath(); c.roundRect(41, 20, 5, 8, 1.2); c.fill(); c.stroke();
      c.fillStyle = INKW; c.beginPath(); c.arc(43.5, 24, 0.9, 0, Math.PI*2); c.fill();
      c.strokeStyle = INKW; c.lineWidth = 1.6; cover(); c.stroke();
    });
    // open: two pages over the cover, a crease, a few lines of writing
    paint(elListBtn.querySelector('.log-pages'), c=>{
      c.fillStyle = g(90); c.beginPath(); c.roundRect(5, 14, 48, 32, 4); c.fill();                        // shadow
      c.fillStyle = g(60); c.strokeStyle = INKW; c.lineWidth = 1.4;                                       // the cover beneath
      c.beginPath(); c.roundRect(3, 12, 50, 31, 3.5); c.fill(); c.stroke();
      const page = (sx)=>{ c.beginPath(); c.moveTo(28, 15); c.quadraticCurveTo(28 + sx*11, 10, 28 + sx*22, 13);
        c.lineTo(28 + sx*22, 39); c.quadraticCurveTo(28 + sx*11, 36, 28, 41); c.closePath(); };
      for(const sx of [-1, 1]){
        c.fillStyle = PAPW; page(sx); c.fill();
        const sg = c.createLinearGradient(28, 0, 28 + sx*9, 0); sg.addColorStop(0, g(170)); sg.addColorStop(1, 'rgba(255,255,255,0)');   // shade into the gutter
        c.fillStyle = sg; page(sx); c.fill();
        c.strokeStyle = INKW; c.lineWidth = 1.2; page(sx); c.stroke();
        c.strokeStyle = g(110); c.lineWidth = 0.9;
        for(let i=0;i<5;i++){ const y = 18 + i*4; c.beginPath(); c.moveTo(28 + sx*5, y + 0.6); c.quadraticCurveTo(28 + sx*12, y - 1, 28 + sx*(i===4 ? 14 : 19), y); c.stroke(); }
      }
      c.strokeStyle = INKW; c.lineWidth = 1.4; c.beginPath(); c.moveTo(28, 15); c.lineTo(28, 41); c.stroke();   // the crease
    });
  }
  // opening: the shut book slides down ('open'), then its cover swings open
  // ('unfold'). Closing: the cover folds shut, then the book slides back up.
  let bookOpen = false, bookT = null;
  const BOOK_DROP = 260, BOOK_FOLD = 330;      // ms: matched to the CSS transitions
  function toggleList(open){
    const on = open===undefined ? !bookOpen : open;
    if(on === bookOpen) return;
    bookOpen = on; clearTimeout(bookT);
    elListBtn.classList.toggle('open', on);

      if(tut === 'book' || tut === 'intro') tutBookSeen = true;   // (opened while the scroll was still flying in counts too)

    }

  // ---------- Fair wind (a power, POWER_USES of it, given by Eolus) ----------
  // An item in the Cargo (with the gifts, it takes no slot): tapped, for
  // POWER_WIND_T seconds the wind swings round to blow from astern whichever
  // way she steers (the same spell as the ruins' friendly wind, boonWindT).
  // It's not there until she docks at the Temple of Eolus; a spent use comes
  // back POWER_RECHARGE seconds after it was used (the item shows the seconds).
  let powerOwned = !EOLUS_ON, powerLeft = POWER_USES, powerT = 0;   // (powerT: seconds until a spent use comes back)
  function powerUI(){ if(elList.classList.contains('open')) renderList(); }
  function rechargePower(dt){
    if(!powerOwned || powerLeft >= POWER_USES) return;
    powerT -= dt;
    if(powerT <= 0){ powerLeft++; powerUI(); powerT = POWER_RECHARGE; buzz(10); }
  }
  function usePower(){
    Sfx.init();
    if(!playing || !powerOwned || powerLeft <= 0 || boonWindT > 0){ buzz(12); return; }
    if(powerLeft === POWER_USES) powerT = POWER_RECHARGE;   // the recharge starts with the first use spent
    powerLeft--;
    boonWindT = POWER_WIND_T; shiftDur = 0;
    popups.push({x:boat.x, y:boat.y-26, text:TEXT.popups.fairWind, life:1.6, max:1.6});
    Sfx.surf(); buzz([20,40,60]);

  function powerHTML(){
    if(!powerOwned) return '';
    const spent = powerLeft <= 0, blowing = boonWindT > 0;
    const lbl = blowing ? fmt(TEXT.eolus.blowing, {s: Math.ceil(boonWindT)}) : spent ? fmt(TEXT.eolus.recharging, {s: Math.ceil(powerT)}) : TEXT.eolus.item;
    const note = blowing ? Math.ceil(boonWindT) + 's' : spent ? Math.ceil(powerT) + 's' : '';

  }

  // ---------- Sea chart ----------
  // The chart under the logbook's map of squares (the first spread's right page): only what the boat has seen (the
  // fog of war's cells) and nothing else, no marks for home, ports or the boat: land solid ink (as in the world
  // generator's preview), a dotted edge on the water along the shore so the coasts' shape reads, the sea not yet seen
  // clean paper (only the grid over it); the crosses from the messages in bottles wherever they are. Dithered like the widgets.
  // (It had a spread of its own, facing the wind card; that page is gone.) The wind card is on the second spread.
  const elWindPage = document.getElementById('wind-page');
  const mapCv = document.createElement('canvas');
  const mapCtx = mapCv.getContext('2d', {willReadFrequently:true});
  let mapLand = null, mapN = 0;                // land under each chart pixel, worked out once (again if the size changes)
  function paintChart(out, N){
    N = Math.max(60, Math.min(MAP_RES, N)); const S = WORLD.w/N;
    if(N !== mapN){ mapN = N; mapLand = null; mapCv.width = mapCv.height = N; }
    if(!mapLand){
      mapLand = new Uint8Array(N*N);
      for(let j=0;j<N;j++) for(let i=0;i<N;i++) mapLand[j*N+i] = onLand((i+0.5)*S, (j+0.5)*S, 0) ? 1 : 0;
    }
    const im = mapCtx.createImageData(N, N), d = im.data;
    const seen = (i,j)=> explored[fci(Math.floor((((j+N)%N)+0.5)*S/FOG_CELL))*FOG_N + fci(Math.floor((((i+N)%N)+0.5)*S/FOG_CELL))];
    const land = (i,j)=> mapLand[((j+N)%N)*N + (i+N)%N];
    for(let j=0;j<N;j++) for(let i=0;i<N;i++){
      let g = 255;                                                     // not yet seen: clean paper (a dotted line marks the edge of what she has seen)
      if(seen(i,j) && !(seen(i-1,j) && seen(i+1,j) && seen(i,j-1) && seen(i,j+1))) g = 120;   // the edge of what she has seen: a dotted line
      else if(seen(i,j)){
        const near = (a,b)=> land(i+a,j+b);
        if(land(i,j)) g = 30;                                          // land: solid ink, like the world generator's preview
        else if(near(-1,0) || near(1,0) || near(0,-1) || near(0,1)) g = 150;   // the water along the shore: a dotted edge, so the coast reads
        else if(near(-2,0) || near(2,0) || near(0,-2) || near(0,2) || near(-1,-1) || near(1,1) || near(-1,1) || near(1,-1)) g = 235;
        else g = 255;                                                  // open sea
      }
      const q = (j*N+i)*4; d[q] = d[q+1] = d[q+2] = g; d[q+3] = 255;
    }
    mapCtx.putImageData(im, 0, 0);
    // the crosses from the messages in bottles: an ink X, wherever they are (seen or not)
    mapCtx.strokeStyle = '#000'; mapCtx.lineWidth = Math.max(1.5, N/120); mapCtx.lineCap = 'round';
    const xs = Math.max(3, N/50), ox = wrapX(START.x - WORLD.w/2), oy = wrapY(START.y - WORLD.h/2);   // (the squares start half a world west and north of home)
    for(const m of marks){
      const x = wrapX(m.x - ox)/S, y = wrapY(m.y - oy)/S;
      mapCtx.beginPath(); mapCtx.moveTo(x-xs, y-xs); mapCtx.lineTo(x+xs, y+xs); mapCtx.moveTo(x+xs, y-xs); mapCtx.lineTo(x-xs, y+xs); mapCtx.stroke();
    }
    ditherUI(mapCtx, N, N);
    out.width = out.height = N;
    // laid out like the squares: the world from half a world west and north of home (home's square in the middle)
    const g = out.getContext('2d'), dx = Math.round(ox/S), dy = Math.round(oy/S);
    for(const a of [0, N]) for(const b of [0, N]) g.drawImage(mapCv, a - dx, b - dy);
  }
  function renderMap(){                        // the second spread: the wind card (its facing page is empty)
    elWindPage.innerHTML = '<div id="wind-card">'+windHTML()+'</div>'; windKey = windCardKey();
  }

  // ---------- Home's look (the logbook's third spread) ----------
  // Three looks for home, from a fisherman's hut to a fortified palace: the
  // left page has a button for each (a little ink drawing and its name), the
  // right page a preview of home drawn as it would look, dithered like the
  // chart. A tap switches home itself too (baseLevel; its tiles are baked
  // again), for now just to see how each one feels.
  const BASE_ICONS = [
    // a hut: a pitched roof and a door
    '<svg viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" fill="none"><path d="M4 12 L12 5 L20 12"/><path d="M6 11 V19 H18 V11"/><path d="M10.5 19 V15 H13.5 V19"/></svg>',
    // the masseria: a walled court with a tower on its corner
    '<svg viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" fill="none"><path d="M3 20 V11 H14 V20 Z"/><path d="M14 20 V6 H20 V20 Z"/><path d="M14 6 V4.5 H15.5 V6 M17 6 V4.5 H18.5 V6"/><path d="M7 20 V16 H10 V20"/><path d="M3 11 V9.5 H4.5 V11 M6.5 11 V9.5 H8 V11 M10 11 V9.5 H11.5 V11"/></svg>',
    // the palace: two towers, a long house between them and a flag
    '<svg viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" fill="none"><path d="M2 21 V8 H6 V21 M18 21 V8 H22 V21"/><path d="M6 21 V12 H18 V21"/><path d="M2 8 V6.5 H3.5 V8 M4.5 8 V6.5 H6 M18 8 V6.5 H19.5 V8 M20.5 8 V6.5 H22 V8"/><path d="M10 21 V16 Q12 14 14 16 V21"/><path d="M20 6.5 V2 L23 3 L20 4"/></svg>'];
  const elBaseL = document.getElementById('base-l'), elBasePrev = document.getElementById('base-prev'), elBaseName = document.getElementById('base-name');
  function renderBase(){
    const B = TEXT.base;
    elBaseL.innerHTML = '<h2>'+B.title+'</h2><p class="base-hint">'+B.hint+'</p>'
      + B.levels.map((name,i)=> '<button type="button" class="base-pick'+(i===baseLevel?' on':'')+'" data-level="'+i+'">'+BASE_ICONS[i]+'<span>'+name+'</span></button>').join('');
    elBaseName.textContent = B.levels[baseLevel];

  }
  // home drawn into a small canvas (its land as the tiles have it), then dithered to the book's ink
  function drawBasePreview(){
    const S = 150, span = 190;                               // canvas pixels; world px shown across it
    const lo = document.createElement('canvas'); lo.width = S; lo.height = S;
    const c = lo.getContext('2d', {willReadFrequently:true});
    c.fillStyle = '#fff'; c.fillRect(0, 0, S, S);
    const saved = ctx; ctx = c;
    ctx.setTransform(S/span, 0, 0, S/span, 0, 0); ctx.translate(span/2 - home.x, span/2 - home.y + 8);
    bakeR = {x0: home.x - span/2, y0: home.y - span/2 - 8, x1: home.x + span/2, y1: home.y + span/2 - 8};
    drawIslandWaterStatic(home); drawIslandLandStatic(home);
    bakeR = null; ctx = saved;
    c.setTransform(1, 0, 0, 1, 0, 0); ditherUI(c, S, S);
    const k = 2; elBasePrev.width = S*k; elBasePrev.height = S*k;
    const x = elBasePrev.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(lo, 0, 0, S*k, S*k);
  }
  elBaseL.addEventListener('click', e=>{
    const b = e.target.closest('[data-level]'); if(!b) return;
    e.stopPropagation(); Sfx.init();
    const lv = +b.dataset.level; if(lv === baseLevel) return;
    baseLevel = lv; rebakeHome(); renderBase();
    Sfx.thunk(0.3); buzz([10,30,15]);
  });

  // ---------- Turning the logbook's pages ----------
  // Three spreads: 0 = the dinner list and the cargo, 1 = the sea chart, 2 = home's look. A
  // swipe across the open book turns the page (left: forward, right: back);
  // the book remembers the spread it was left on.
  let logSpread = 0, turning = false;
  const PAGE_TURN = 460;                       // ms for a page to swing over
  const elPages = elList.querySelector('.pages'), elPageL = elList.querySelector('.page.left'), elPageR = elList.querySelector('.page.right');
  // a copy of a page as it looks now, canvases included; what shows and the
  // padding are frozen inline, so turning the spread doesn't restyle the copy
  function snapPage(el){
    const cp = el.cloneNode(true), from = el.querySelectorAll('*'), to = cp.querySelectorAll('*'), drop = [];
    cp.style.padding = getComputedStyle(el).padding;
    from.forEach((n, i)=>{
      const d = getComputedStyle(n).display;
      if(d === 'none'){ drop.push(to[i]); return; }
      to[i].style.display = d;
      if(n.tagName === 'CANVAS' && n.width && n.height) to[i].getContext('2d').drawImage(n, 0, 0);
    });
    drop.forEach(n=> n.remove());
    return cp;
  }
  function placeAt(el, ref, base){
    const r = ref.getBoundingClientRect();
    Object.assign(el.style, {left: (r.left-base.left)+'px', top: (r.top-base.top)+'px', width: r.width+'px', height: r.height+'px'});
  }
  function turnPage(dir){                       // +1: forward, -1: back
    const to = logSpread + dir;
    if(turning || to < 0 || to > 2 || !elList.classList.contains('unfold')) return;
    turning = true;
    const fwd = dir > 0, oldL = snapPage(elPageL), oldR = snapPage(elPageR);
    logSpread = to;
    elList.classList.toggle('on-map', to === 1);
    elList.classList.toggle('on-base', to === 2);
    if(to === 1) renderMap(); else if(to === 2) renderBase(); else { renderList(); freshLines.clear(); }
    const base = elPages.getBoundingClientRect();
    // the page that stays put until the turning sheet lands on it
    const under = fwd ? oldL : oldR; under.classList.add('under'); placeAt(under, fwd ? elPageL : elPageR, base);
    // the sheet: the page it leaves on its front, the new page on its back
    const turn = document.createElement('div'); turn.className = 'turn';
    placeAt(turn, fwd ? elPageR : elPageL, base);
    const front = fwd ? oldR : oldL, back = snapPage(fwd ? elPageL : elPageR);
    back.classList.add('back');
    turn.append(front, back);
    turn.style.transformOrigin = fwd ? '-8px 50%' : 'calc(100% + 8px) 50%';   // the spine, in the middle of the crease
    turn.style.transition = 'transform '+PAGE_TURN+'ms cubic-bezier(.45,.05,.35,1)';
    elPages.append(under, turn);
    turn.getBoundingClientRect();                                        // (start the swing from flat)
    turn.style.transform = 'rotateY('+(fwd ? -180 : 180)+'deg)';
