    setTimeout(()=>{ under.remove(); turn.remove(); turning = false; buzz(8); }, PAGE_TURN);   // landed: a light tap
  }
  // a swipe: mostly sideways, far enough, and quick
  let swipe = null;
  elList.addEventListener('pointerdown', ev=>{ swipe = {x: ev.clientX, y: ev.clientY, t: performance.now(), id: ev.pointerId}; });
  elList.addEventListener('pointerup', ev=>{
    if(!swipe || swipe.id !== ev.pointerId) return;
    const dx = ev.clientX - swipe.x, dy = ev.clientY - swipe.y, dt = performance.now() - swipe.t;
    swipe = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)*1.3 && dt < 800) turnPage(dx < 0 ? 1 : -1);
  });
  elList.addEventListener('pointercancel', ()=>{ swipe = null; });

  // ---------- Buoys and a village's waters ----------
  // a small window in the fog round every buoy, so they can be spotted
  // and followed before the waters are explored
  const buoyClear = new Uint8Array(FOG_N*FOG_N);
  for(const b of buoys){
    const C = FOG_CELL, r = 66;
    for(let j=Math.floor((b.y-r)/C); j<=Math.floor((b.y+r)/C); j++)
      for(let i=Math.floor((b.x-r)/C); i<=Math.floor((b.x+r)/C); i++)
        if(Math.hypot((i+0.5)*C - b.x, (j+0.5)*C - b.y) <= r) buoyClear[fci(j)*FOG_N + fci(i)] = 1;
  }
  // and a wide one round every village, so the towns can be seen from
  // afar and steered for
  const VILLAGE_CLEAR = 340;
  for(const v of [...VILLAGES, ...RUINS.filter(r=> r.eolus)]){                   // (and round the Temple of Eolus)
    const C = FOG_CELL, r = VILLAGE_CLEAR, x = v.isl.x, y = v.isl.y;
    for(let j=Math.floor((y-r)/C); j<=Math.floor((y+r)/C); j++)
      for(let i=Math.floor((x-r)/C); i<=Math.floor((x+r)/C); i++)
        if(Math.hypot((i+0.5)*C - x, (j+0.5)*C - y) <= r) buoyClear[fci(j)*FOG_N + fci(i)] = 1;
  }
  const elToast = document.getElementById('toast');
  let toastT = 0;
  function toast(text){ elToast.textContent = text; elToast.classList.add('show'); toastT = 3.2; }
  function updateWaters(dt){
    if(toastT > 0){ toastT -= dt; if(toastT <= 0) elToast.classList.remove('show'); }
    // brushing past a buoy: it doesn't stop you, it just rocks and knocks
    for(const b of buoys){
      b.wob = Math.max(0, (b.wob||0) - dt*0.7);
      b.cool = Math.max(0, (b.cool||0) - dt);
      if(b.cool > 0 || moor) continue;
      const dx = wdx(b.x, boat.x), dy = wdy(b.y, boat.y);
      if(Math.abs(dx) < 18 && Math.abs(dy) < 18 && Math.hypot(dx,dy) < 16){
        b.wob = 1; b.cool = 1.2;
        b.wdir = Math.sign(dx*Math.sin(boat.angle) - dy*Math.cos(boat.angle)) || 1;   // tips away from the hull
        buzz([22,35,14]); Sfx.buoy();
      }
    }
    { // home waters, the same way
      const d = wdist(boat.x, boat.y, START.x, START.y);
      if(homeInside === null) homeInside = d < SAFE_R;
      else if(!homeInside && d < SAFE_R){ homeInside = true; if(playing){ toast(TEXT.toasts.homeBack); buzz([12,40,12]); } }
      else if(homeInside && d > SAFE_R + 150){ homeInside = false; if(playing){ toast(TEXT.toasts.homeLeave); buzz(12); } }
    }
    for(const v of VILLAGES){
      const d = wdist(boat.x, boat.y, v.isl.x, v.isl.y);
      if(v.inside === null){ v.inside = d < BUOY_R; continue; }
      if(!v.inside && d < BUOY_R){
        v.inside = true;
        if(playing){ toast(fmt(TEXT.toasts.villageIn, {village: v.name})); buzz([12,40,12]); }
      } else if(v.inside && d > BUOY_R + 150){             // a little past the buoys, so it doesn't flicker
        v.inside = false;
        if(playing){ toast(fmt(TEXT.toasts.villageOut, {village: v.name})); buzz(12); }
      }
    }
  }
  // a buoy: a striped float riding the swell, a pole with a cone topmark,
  // and a small lamp that blinks after dusk
  function drawBuoy(b){
    if(!inView(b.x, b.y, 20)) return;
    const w = b.wob||0, bob = Math.sin(t*1.8 + b.ph)*1.2 + w*Math.sin(t*11)*1.5;
    const tilt = Math.sin(t*1.3 + b.ph)*0.18 + w*w*(b.wdir||1)*0.7*Math.cos(t*8);   // a knock sets it rocking, dying away
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.5;                          // ripple ring
    ctx.beginPath(); ctx.ellipse(0, 2, 8 + Math.sin(t*1.8+b.ph), 3.5, 0, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = V(0.4); ctx.beginPath(); ctx.ellipse(2.5, 3, 5, 2.4, 0, 0, Math.PI*2); ctx.fill();   // shadow
    ctx.translate(0, -bob); ctx.rotate(tilt);
    ctx.fillStyle = PAPERC; ctx.strokeStyle = INKC; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,4.6,0,Math.PI*2); ctx.clip();                         // bands
    ctx.fillStyle = INKC; ctx.fillRect(-5,-1.2,10,2.4); ctx.restore();
    ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,-11); ctx.stroke();           // pole
    ctx.fillStyle = INKC; ctx.beginPath(); ctx.moveTo(-3,-10); ctx.lineTo(3,-10); ctx.lineTo(0,-15); ctx.closePath(); ctx.fill();   // topmark
    if((typeof NIGHT==='number' ? NIGHT : 0) > 0.3 && Math.sin(t*2.2 + b.ph) > 0.6){
      ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(0,-16.5,1.8,0,Math.PI*2); ctx.fill();         // blinking lamp
    }
    ctx.restore();
  }

  // ---------- Traders ----------
  function updateTraders(dt){
    for(const tr of traders){
      if(tr.wait > 0){
        tr.wait -= dt;
        if(tr.wait <= 0){                                   // pick the next lane from this port
          const port = tr.dir > 0 ? tr.lane.b : tr.lane.a;
          const opts = lanes.filter(L=> (L.a===port || L.b===port) && L!==tr.lane);
          const L = opts.length ? opts[Math.floor(Math.random()*opts.length)] : tr.lane;
          tr.lane = L; tr.dir = L.a===port ? 1 : -1; tr.s = tr.dir > 0 ? 0 : L.len;
        }
      } else {
        tr.s += tr.dir*tr.speed*dt;                          // she keeps to her lane, whoever is about
        if(tr.s <= 0 || tr.s >= tr.lane.len){ tr.s = Math.max(0, Math.min(tr.lane.len, tr.s)); tr.wait = rand(5,10); }
      }
      const [x,y,a] = lanePoint(tr.lane, tr.s);
      const ha = tr.dir > 0 ? a : a + Math.PI;               // her heading
      // run into her and she's shoved aside: she drifts off, spins a little,
      // then eases back onto her lane and carries on
      tr.kvx *= Math.exp(-3*dt); tr.kvy *= Math.exp(-3*dt);
      tr.kx += tr.kvx*dt; tr.ky += tr.kvy*dt;
      tr.kx *= Math.exp(-0.5*dt); tr.ky *= Math.exp(-0.5*dt);
      tr.yv *= Math.exp(-2.5*dt); tr.yaw += tr.yv*dt; tr.yaw *= Math.exp(-0.8*dt);
      tr.bumpCool = Math.max(0, tr.bumpCool - dt);
      if((tr.kx || tr.ky) && onLand(wrapX(x + tr.kx), wrapY(y + tr.ky), 10)){ tr.kvx = tr.kvy = 0; tr.kx *= 0.9; tr.ky *= 0.9; }   // never onto the shore
      tr.x = wrapX(x + tr.kx); tr.y = wrapY(y + tr.ky);
      if(!moor){
        const dx = wdx(tr.x, boat.x), dy = wdy(tr.y, boat.y), d = Math.hypot(dx,dy), R = boat.r + 13;   // from the boat to her
        if(d < R){
          const nx = d > 0.01 ? dx/d : Math.cos(boat.angle), ny = d > 0.01 ? dy/d : Math.sin(boat.angle);
          tr.kx += nx*(R-d); tr.ky += ny*(R-d);              // out of the way, at once
          tr.x = wrapX(x + tr.kx); tr.y = wrapY(y + tr.ky);
          if(tr.bumpCool <= 0){
            tr.bumpCool = 0.8;
            const push = 18 + Math.abs(boat.speed)*0.8;
            tr.kvx += nx*push; tr.kvy += ny*push;
            tr.yv += (Math.cos(boat.angle)*ny - Math.sin(boat.angle)*nx > 0 ? 1 : -1)*(0.6 + Math.abs(boat.speed)/MAX_SPEED);
            boat.speed *= 0.85;                               // a nudge you feel, no harm done
            boat.rock = Math.min(2.5, (boat.rock||0) + 0.3);
            buzz([18,30,10]); Sfx.buoy(); Sfx.thunk(0.25);
          }
        }
      }
      // foam from the propeller: churned up astern, spreading and fading
      for(let k=tr.foam.length-1;k>=0;k--){ const f = tr.foam[k]; f.age += dt; f.x += f.vx*dt; f.y += f.vy*dt; if(f.age >= f.life) tr.foam.splice(k,1); }
      if(tr.wait <= 0){
        tr.foamT -= dt;
        if(tr.foamT <= 0){
          tr.foamT = 0.07;
          const ca = Math.cos(tr.a), sa = Math.sin(tr.a), sx = tr.x - ca*18, sy = tr.y - sa*18;
          for(const sd of [-1,1]) tr.foam.push({x: sx - sa*sd*2, y: sy + ca*sd*2, vx: -sa*sd*9 - ca*4, vy: ca*sd*9 - sa*4, age: 0, life: rand(1.2,1.8)});
        }
      }
      if(tr.wait <= 0) tr.a = ha;
      // passing close: a hail across the water (a speech bubble and a voice)
      tr.talkCool = Math.max(0, tr.talkCool - dt); tr.talkT = Math.max(0, tr.talkT - dt);
      const pd = wdist(boat.x, boat.y, tr.x, tr.y);
      if(pd < 150 && tr.talkCool <= 0 && playing && !moor){
        tr.talkT = 2.8; tr.talkCool = rand(14, 22);
        tr.marks = Array.from({length: 2 + Math.floor(rand(0,2))}, ()=> rand(0.45, 1));   // scribbled 'words'
        const pan = Math.max(-0.9, Math.min(0.9, wdx(tr.x, boat.x)/260)), vol = 0.16*(1 - pd/220);
        Sfx.chatter(vol, pan); setTimeout(()=> Sfx.chatter(vol*0.9, pan), 380); setTimeout(()=> Sfx.chatter(vol*0.8, pan), 900);
      }
    }
  }
  // a trader is a little motor boat (a gozzo with a wheelhouse): no sail
  // to trim, just the outboard churning a white wake behind her
  function drawTrader(tr){
    // wake first (it may reach into view before the boat does)
    for(const f of tr.foam){
      if(!inView(f.x, f.y, 8)) continue;
      const k = f.age/f.life;
      ctx.globalAlpha = (1-k)*0.9;
      ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(f.x, f.y, 1.2 + k*3.2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = INKC; ctx.lineWidth = 0.8; ctx.globalAlpha = (1-k)*0.5; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if(!inView(tr.x, tr.y, 30)) return;
    const bob = Math.sin(t*1.4 + tr.ph)*0.5, roll = Math.sin(t*1.9 + tr.ph)*0.04;
    ctx.save(); ctx.translate(tr.x, tr.y - bob); ctx.rotate(tr.a + tr.yaw);
    ctx.save(); ctx.scale(1, 1 - Math.abs(roll));
    const hull = ()=>{ ctx.beginPath(); ctx.moveTo(19,0); ctx.quadraticCurveTo(11,-8.5,-4,-8); ctx.lineTo(-14,-6); ctx.quadraticCurveTo(-16,0,-14,6); ctx.lineTo(-4,8); ctx.quadraticCurveTo(11,8.5,19,0); ctx.closePath(); };
    ctx.save(); ctx.translate(2.5,3); ctx.fillStyle=V(0.45); hull(); ctx.fill(); ctx.restore();   // shadow
    ctx.fillStyle=PAPERC; hull(); ctx.fill();
    ctx.fillStyle=V(0.55); ctx.beginPath(); ctx.moveTo(19,0); ctx.quadraticCurveTo(11,8.5,-4,8); ctx.lineTo(-14,6); ctx.quadraticCurveTo(-15,3,-14,1.5); ctx.lineTo(18,0.5); ctx.closePath(); ctx.fill();   // shaded side
    ctx.strokeStyle=INKC; ctx.lineWidth=1.5; hull(); ctx.stroke();
    ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-12,0); ctx.stroke();                     // keel line
    // wheelhouse: a little cabin with a dark window band and a flat roof
    ctx.fillStyle=V(0.3); ctx.fillRect(-7.5,-4.8+1.2,11,9.6);
    ctx.fillStyle=PAPERC; ctx.fillRect(-8.5,-4.8,11,9.6);
    ctx.strokeStyle=INKC; ctx.lineWidth=1.2; ctx.strokeRect(-8.5,-4.8,11,9.6);
    ctx.fillStyle=INKC; ctx.fillRect(1,-3.6,1.4,7.2);                                                         // windscreen
    ctx.fillRect(-7,-4.8,1.1,1.1); ctx.fillRect(-7,3.7,1.1,1.1);                                               // rails
    ctx.beginPath(); ctx.moveTo(-3,-1); ctx.lineTo(-3,-7); ctx.stroke();                                       // a little mast with a pennant
    ctx.fillStyle=INKC; ctx.beginPath(); ctx.moveTo(-3,-7); ctx.lineTo(-6.5+Math.sin(t*6+tr.ph), -6.2); ctx.lineTo(-3,-5.4); ctx.closePath(); ctx.fill();
    // outboard motor on the transom
    ctx.fillStyle=INKC; ctx.fillRect(-18,-1.8,3.5,3.6);
    ctx.restore();
    ctx.restore();
    // the speech bubble: a scrawl of 'words' nobody could read, and a tail
    if(tr.talkT > 0){
      const k = tr.talkT/2.8, a = Math.min(1, (1-k)*8, k*5), bw = 34, bh = 14 + 5*(tr.marks.length-2);
      const bx = tr.x - bw/2, by = tr.y - 26 - bh - (1-k)*4;
      ctx.globalAlpha = a;
      ctx.fillStyle = PAPERC; ctx.strokeStyle = INKC; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tr.x-4, by+bh-0.5); ctx.lineTo(tr.x-1, by+bh+6); ctx.lineTo(tr.x+3, by+bh-0.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tr.x-4, by+bh); ctx.lineTo(tr.x-1, by+bh+6); ctx.lineTo(tr.x+3, by+bh); ctx.stroke();
      ctx.lineWidth = 1; ctx.beginPath();
      tr.marks.forEach((m,i)=>{ const y0 = by + 5 + i*4.5, x1 = bx + 5 + (bw-10)*m;
        ctx.moveTo(bx+5, y0); for(let x=bx+5; x<x1; x+=2.5) ctx.lineTo(x+1.25, y0 + ((x*7|0)%3 - 1)*0.8); });
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Update ----------
  let last = performance.now();
  let lastHp = -1;
  function update(dt){
    const helmFree = !(anchored && weighT <= 0);          // the wheel is stowed while at anchor
    if(turnLeft && helmFree)  wheelAngle = Math.max(-WHEEL_MAX, wheelAngle - WHEEL_KEY_RATE*dt);
    if(turnRight && helmFree) wheelAngle = Math.min( WHEEL_MAX, wheelAngle + WHEEL_KEY_RATE*dt);
    // self-centering, like a car's steering wheel: when nobody holds it,
    // it spins back to centre, fast when far off and easing in at the end
    if(wheelPointer===null && !turnLeft && !turnRight && wheelAngle!==0){
      const step = Math.max(Math.abs(wheelAngle)*3.5, 0.8)*dt;
      wheelAngle = Math.abs(wheelAngle)<=step ? 0 : wheelAngle - Math.sign(wheelAngle)*step;
    }
    if(!moor && !boat.whirl) boat.angle += TURN_RATE*rigK(RIG_TURN)*(sailLevel===SAIL_MIN || boat.rowing ? ROW_TURN_MULT : 1)*(wheelAngle/WHEEL_MAX)*dt;   // (RIG_TURN: the lateen nimble, the square clumsy)   // slow sail = nimble, safe handling
    wheelSound(dt);
    Sfx.ambient(dt, Math.min(1, boat.speed/MAX_SPEED));
    Sfx.rain(playing ? rainNear() : 0);

    rechargePower(dt);                                // a spent fair wind comes back in time
    // wind drift (or, under the ruins' spell, always from astern)
    if(boonWindT>0){
      boonWindT = Math.max(0, boonWindT-dt);
      const want = boat.angle + Math.PI;           // wind FROM behind the boat
      windAngle += Math.atan2(Math.sin(want-windAngle), Math.cos(want-windAngle))*Math.min(1, dt*2.5);
      if(boonWindT<=0) windTimer = rand(10,18);
    } else if(guideWind){
      const nv = VILLAGES[0].isl;                  // Nordania
      const want = Math.atan2(wdy(boat.y, nv.y), wdx(boat.x, nv.x));   // wind FROM the far side: it pushes toward the village
      windAngle += Math.atan2(Math.sin(want-windAngle), Math.cos(want-windAngle))*Math.min(1, dt*1.2);
    } else if(shiftDur>0){
      shiftT += dt;
      const k = Math.min(1, shiftT/shiftDur);
      const e = k*k*(3-2*k);                       // ease in/out
      windAngle = shiftFrom + shiftDelta*e;
      if(k>=1){ shiftDur = 0; windTimer = rand(12,22); }
    } else {
      windTimer -= dt;
      if(windTimer<=0){
        shiftFrom = windAngle;
        shiftDelta = (Math.random()<0.5?-1:1)*rand(0.5,1.6);  // ~30°–90°
        shiftT = 0;
        shiftDur = rand(3,5);
      }
    }
    windStrengthT += dt*0.06;
    windStrength = 0.75 + 0.25*Math.sin(windStrengthT);

    // sea surface drift (downwind), wrapped to the tile size
    updateAmbientLife(dt);
    updateStreaks(dt);
    updateTraders(dt);
    { // the nearest trader under way: you hear her engine as she comes by
      let best = 0, pan = 0;
      for(const tr of traders){ if(tr.wait > 0) continue; const d = wdist(boat.x,boat.y,tr.x,tr.y), l = Math.max(0, 1 - d/320); if(l > best){ best = l; pan = Math.max(-0.9, Math.min(0.9, wdx(tr.x,boat.x)/240)); } }
      Sfx.engine(playing ? best*best : 0, pan);
    }
    updateWaters(dt);
    boat.rock = Math.max(0, (boat.rock||0) - dt*0.8);            // the rocking dies down
    updateAnchor(dt);
    updateTownSound(dt);
    updateNightSound(dt);
    updateCicadas(dt);
    updateWhirlpools(dt);
    updateShark(dt);
    updateZora(dt);
    reveal(boat.x, boat.y);
    updateDialog(dt); updateTalk(dt);
    updateBoonBadge();
    {
      const dinnerT = (DINNER_HOUR - DAWN_HOUR)/24, before = dayT;
      dayT += dt/DAY_LEN;
      if(ORDERS_ON && before < dinnerT && dayT >= dinnerT) serveDinner();  // dinner time: the order is judged
      if(dayT >= 1){                                                       // first light: a new day, a new order
        dayT -= 1; dayNo++;
        if((dayNo - 1) % BANK_REGEN_DAYS === 0) fillBankTiles();          // the fished banks come back (drawn map)
        if(ORDERS_ON){
          if(order && !order.closed) serveDinner();
          newOrder(dayNo); freshLines.clear();
          toast(TEXT.toasts.newOrder); elListBtn.classList.add('news');
        }
        if(elList.classList.contains('open')) renderList();
      }
    }
    // camera focus: normally the boat; during a village visit it glides over
    // to frame the village below the dialog box, then back to the boat
    let fx = boat.x, fy = boat.y;
    if(moor && (moor.pier.isl.village || moor.pier.isl.ruin) && (dlg || marketV || talk)){
      const vi = moor.pier.isl;
      fx = boat.x + wdx(vi.x, boat.x);
      fy = boat.y + wdy(vi.y, boat.y) - viewH()*0.03;
    }
    const kf = Math.min(1, dt*2.2);
    camFx = boat.x + wdx(camFx, boat.x); camFy = boat.y + wdy(camFy, boat.y);   // follow wraps
    camFx += (fx-camFx)*kf; camFy += (fy-camFy)*kf;

    if(playing) updateLocalWind(dt);
    const localWind = windAngle + boat.windOff, localStrength = windStrength*boat.windMul;   // the wind where she is
    const relDeg = norm(boat.angle-localWind)*180/Math.PI;
    // the sail looks after itself: when she's crawling and the wind can't help
    // (head to wind, or nearly), the sail is brailed up and the oars come out;
    // once the sail could drive her well again it's set and the oars come in.
    // Never because of the anchor: while it's down (or going down) the sail stays up and the oars stay in
    {
      const could = MAX_SPEED*speedFactor(relDeg)*windStrength*WIND_BOOST*downwindBonus(relDeg);   // what the sail would give
      if(anchored || moor || boat.whirl || MANUAL_OARS){ sailLevel = 0; rowT = 0; }   // (rowing by hand: the sail is never brailed up for the oars)
      else if(sailLevel === 0){
        rowT = (boat.speed < ROW_ENTER && could < ROW_ENTER) ? rowT + dt : 0;   // (the wind can't help: also right after weighing anchor head to wind)
        if(rowT > ROW_DELAY){ sailLevel = SAIL_MIN; rowT = 0; }
      } else {
        rowT = could > ROW_EXIT ? rowT + dt : 0;
        if(rowT > ROW_DELAY){ sailLevel = 0; rowT = 0; }
      }
    }
    // the sail is trimmed for the angle it had: when the wind shifts (or she turns) it takes a while to trim it again,
    // slowly for the square sail, at once for the lateen (RIG_RETRIM); meanwhile it gives less (RETRIM_SPAN, _FLOOR)
    const absRel = Math.abs(relDeg);
    boat.trimA += (absRel - boat.trimA)*Math.min(1, dt*rigK(RIG_RETRIM));
    const trimEff = Math.max(RETRIM_FLOOR, 1 - Math.abs(absRel - boat.trimA)/RETRIM_SPAN*(1 - RETRIM_FLOOR));
    // the lateen changing tack: its yard swings across the mast and drives little; and on its bad tack it gives less
    const tackEff = boat.rig === 'lateen' ? (boat.swingAcross ? LATEEN_TACK_DRIVE : boat.sailSide < 0 ? LATEEN_MALA : 1) : 1;
    const windSf = speedFactor(relDeg)*localStrength*trimEff*tackEff;   // how well the sail is fed
    boat.sailAmount += ((boat.sailFurled ? 0 : SAIL_LEVELS[sailLevel].amount)-boat.sailAmount)*Math.min(1,dt*2.5);   // (furled from the badge: no drive)
    const sf = windSf*boat.sailAmount;                    // actual drive
    let targetSpeed = anchored ? 0 : MAX_SPEED*sf*WIND_BOOST*downwindBonus(relDeg);   // a well-trimmed sail pays off more
    boat.sailV = targetSpeed;                                      // the way the sail alone gives her (fast enough: the oars are shipped)
    if(!anchored && sailLevel===SAIL_MIN) targetSpeed = Math.max(targetSpeed, ROW_SPEED);        // at minimum sail the oars keep her going
    // rowing by hand: the way the strokes give her (it dies off unless she keeps pulling)
    // the oars push in surges: the pull (blades sweeping aft, the first half of each cycle) drives her on, the
    // recovery lets her coast; on average OAR_MAX × power
    const oarSurge = 1 - OAR_SURGE + OAR_SURGE*Math.PI*Math.max(0, Math.sin(2*Math.PI*(oarCycle % 1)));
    boat.rowV = MANUAL_OARS && !(anchored || moor || boat.whirl) ? (SPRING_PADDLES ? SPRING_SPEED*oarSpin : OAR_MAX*oarSpin*oarSurge + oarKick) : 0;   // + the kick of a stroke on time (the spring's wheels: a steady push)
    if(boat.rowV > targetSpeed) targetSpeed = boat.rowV;
    boat.sailPower += (windSf-boat.sailPower)*Math.min(1,dt*3/SAIL_TRIM_TIME);   // (the cloth fills and slackens over SAIL_TRIM_TIME)

    // Square sail: the yard pivots on the mast at its centre. The sail's
    // belly faces where the wind blows TO (in boat frame), braced round at
    // most ~60° from the bow. Dead downwind the yard is square across the
    // hull; with wind on the beam it's braced round toward fore-and-aft.
    const relR = norm(boat.angle-localWind);
    const MAX_BRACE = 1.05;
    // only ambiguous when head-to-wind: keep the side there (hysteresis)
    const wantSide = relR>=0 ? 1 : -1;
    if(wantSide!==boat.sailSide && Math.abs(relR)>0.2) boat.sailSide = wantSide;
    const faceRaw = norm(Math.PI-relR);         // wind-to direction, boat frame
    // (a lateen yard instead trails aft, eased out to leeward about half the wind's angle off the bow)
    // the yard only sways a little either way (SAIL_SWING_MAX), plus a faint flutter: she has to be turned to the wind
    const sway = Math.sin(t*1.3 + 0.7)*0.03 + Math.sin(t*3.1)*0.015;
    const faceTarget = boat.rig === 'lateen' ? boat.sailSide*Math.max(0.12, Math.min(0.12 + SAIL_SWING_MAX, Math.abs(relR)*0.5)) + sway
                                              : boat.sailSide*Math.min(Math.abs(faceRaw), MAX_BRACE, SAIL_SWING_MAX) + sway;
    // the lateen's long yard is heavy: when she changes tack it swings across slowly (LATEEN_SWING), then trims as usual
    if(boat.rig === 'lateen' && Math.sign(faceTarget) !== Math.sign(boat.boomSigned) && Math.abs(boat.boomSigned) > 0.05) boat.swingAcross = true;
    if(boat.swingAcross && (boat.rig !== 'lateen' || Math.abs(faceTarget - boat.boomSigned) < 0.08)) boat.swingAcross = false;
    boat.boomSigned += (faceTarget - boat.boomSigned)*Math.min(1, dt*(boat.swingAcross ? LATEEN_SWING : 3/SAIL_TRIM_TIME));
    // surfing a roller from astern: a temporary push above normal top speed
    const surf = boat.surfT>0 ? SURF_BOOST*(boat.surfK || 1)*Math.min(1, boat.surfT/0.8) : 0;
    boat.surfT = Math.max(0, (boat.surfT||0) - dt);
    // she gathers way slowly (BOAT_ACCEL), loses it at the old pace; the anchor bites quickly
    const gaining = targetSpeed + surf > boat.speed;
    boat.speed += (targetSpeed + surf - boat.speed)*Math.min(1,dt*(anchored ? ANCHOR_BITE : surf>0 ? 3 : gaining ? BOAT_ACCEL*rigK(RIG_ACCEL) : 1.6));
    // leeway: close-hauled (and less on a reach) the sail pushes her sideways too, to leeward (the square sail most)
    {
      const close = Math.max(0, Math.min(1, (130 - absRel)/80)), drive = boat.rig && !anchored && !moor && !boat.whirl ? boat.sailAmount*close : 0;
      const lv = rigK(RIG_LEEWAY)*Math.max(0, boat.speed - boat.rowV*0.5)*drive;
      const tx = Math.cos(localWind + Math.PI), ty = Math.sin(localWind + Math.PI), hx = Math.cos(boat.angle), hy = Math.sin(boat.angle);
      const along = tx*hx + ty*hy, px = tx - along*hx, py = ty - along*hy, pl = Math.hypot(px, py) || 1;
      boat.lwx = px/pl*lv; boat.lwy = py/pl*lv;
    }
    // the current: the wind sets the water moving, and it carries her downwind whatever the sail does
    {
      const on = !anchored && !moor && !boat.whirl && !fishing && !onLand(boat.x, boat.y, CURRENT_SHORE) ? 1 : 0;   // (none close to a shore)
      boat.driftK += (on - boat.driftK)*Math.min(1, dt*0.8);       // (it takes hold slowly after weighing anchor, and lets go as the anchor bites)
      const v = CURRENT_DRIFT*localStrength*boat.driftK;
      boat.dfx = Math.cos(localWind + Math.PI)*v; boat.dfy = Math.sin(localWind + Math.PI)*v;
    }
    if(!anchored && boat.rowV > boat.speed) boat.speed += (boat.rowV - boat.speed)*Math.min(1, dt*3.5);   // the oars bite quickly

    const hullR = boat.r*0.75;
    // ---- mooring at the home pier ----
    if(!moor && !boat.whirl){
      for(const pr of piers){
        if(pr.guest) continue;                               // the clients' pier: not for us
        const pf = pierFrame(pr, boat.x, boat.y);
        const near = pf.along > pr.shoreAlong+8 && pf.along < pr.total+20 && Math.abs(pf.lat) < MOOR_RANGE;
        if(pr===moorLock){ if(!near) moorLock = null; continue; }   // re-arm once clear of it
        if(near){
          const side = pf.lat>=0 ? 1 : -1;
          const b = berthAt(pr, pf.along, side);
          // approach from where the boat is, in the pier's own (unwrapped) frame
          const fx = pr.x0 + pr.dx*pf.along - pr.dy*pf.lat, fy = pr.y0 + pr.dy*pf.along + pr.dx*pf.lat;
          moor = {phase:'approach', t:0, side, pier:pr, fx, fy, fa:boat.angle, bx:b.x, by:b.y, ba:b.a};
          boat.kx = boat.ky = 0;
          break;
        }
      }
    }
    if(moor){
      boat.speed = 0; boat.kx = boat.ky = 0;
      if(moor.phase==='approach'){
        moor.t += dt;
        const k = Math.min(1, moor.t/MOOR_TIME), e = k*k*(3-2*k);
        boat.x = moor.fx + (moor.bx-moor.fx)*e;
        boat.y = moor.fy + (moor.by-moor.fy)*e;
        boat.angle = moor.fa + norm(moor.ba-moor.fa)*e;
        if(k>=1){ anchored = true; weighT = 0; anchorUI(); moor.phase = 'moored'; repairT = 0.4; Sfx.thunk(0.35); buzz([35,90,15]);   // bump, then tied up
        }
      } else {
        boat.x = moor.bx; boat.y = moor.by; boat.angle = moor.ba;
        const village = moor.pier.isl.village, ruin = moor.pier.isl.ruin;
        if(!moor.started && guideWind && village === VILLAGES[0]){ guideWind = false; windTimer = rand(14,22); }   // reached the north: the wind is free again
        if(!moor.started){ moor.started = true; moor.skipLock = true; if(ruin) startRuin(ruin); }   // (the market and the storehouse open from the badge over the quay)
        if(marketV) renderMarket();
        // home: whatever of today's order is aboard goes ashore for dinner
        if(ORDERS_ON && !village && !ruin && moor.pier.isl.home) deliverOrder();
        // repairs: free for now, they just happen at any pier, a patch every
        // half second (the hold is never touched; making them a cost the
        // player has to think about is for later)
        repairT -= dt;
        if(repairT<=0 && boat.health < MAX_HEALTH-0.5){
          const before = boat.health;
          boat.health = Math.min(MAX_HEALTH, boat.health + FISH_HEAL);
          popups.push({x:boat.x, y:boat.y-22, text:'+'+Math.round(boat.health-before), life:1.2, max:1.2});
          Sfx.hammer();
          showHealth();
          repairT = REPAIR_EVERY;
          moor.repaired = true;
        }
        // cast off: once there's nothing left to repair, any wheel input
        // pushes the boat away from the pier, out towards open water
        const repaired = boat.health >= MAX_HEALTH-0.5;
        const steering = turnLeft || turnRight || (wheelPointer!==null && Math.abs(wheelAngle) > 0.35);
        if(!steering) moor.skipLock = false;                  // a fresh turn of the wheel is needed
        // at the ruins the wheel first skips the text, then (another turn) casts off
        if(ruin && dlg && !dlg.ready && steering && !moor.skipLock){
          dlg.shown = dlg.text.length; elDlgText.textContent = dlg.text; dlg.t = Math.max(dlg.t, dlg.pause); dlg.ready = true;
          moor.skipLock = true;
        }
        const done = village ? true : ruin ? (ruin.eolus ? !talk : dlg && dlg.ready) && repaired : repaired;
        if(ruin && done && !moor.told){                        // visit over and hull seen to
          moor.told = true; moor.rang = true;
          elDlgFoot.textContent = TEXT.pier.weighHint;
        }
        if(done && !anchored){                               // anchor weighed: off we go
          boat.kx = -moor.pier.dy*moor.side*9;     // a small push off the pier
          boat.ky =  moor.pier.dx*moor.side*9;
          boat.kdamp = 1.1;                         // …that fades slowly
          boat.speed = 3;
          moorLock = moor.pier; moor = null; closeDialog(); closeMarket();
          Sfx.thunk(0.25); buzz([10,40,30]);            // lines cast off
        }
      }
    } else {
      // ---- whirlpools ----
      for(const w of whirlpools){
        if(w.s<=0) continue;                              // faded out: no effect
        const dx = wdx(boat.x,w.x), dy = wdy(boat.y,w.y), d = Math.hypot(dx,dy);
        if(d > w.r){ if(w.escaping){ w.escaping = false; w.armed = true; } if(boat.flingW === w) boat.flingW = null; continue; }
        if(boat.whirl || w.escaping) continue;          // thrown out: no pull until clear
        // outer ring: a pull toward the eye (plus a little swirl), almost
        // nothing near the rim and rising exponentially toward the core
        if(d > w.core){
          const k = 1 - (d-w.core)/(w.r-w.core);          // 0 at rim → 1 at core edge
          const pull = w.s*WHIRL_PULL*(Math.exp(WHIRL_CURVE*k)-1)/(Math.exp(WHIRL_CURVE)-1);
          const ux = -dx/(d||1), uy = -dy/(d||1);
          boat.x += (ux*pull + uy*w.dir*pull*0.35)*dt;            // (the drift goes the way the swirl is drawn turning)
          boat.y += (uy*pull - ux*w.dir*pull*0.35)*dt;
          // slingshot: running round the ring with the swirl (heading along
          // it, not into the eye), the water flings her on: extra speed,
          // more the deeper in she dares, fading once she's out
          const tx = uy*w.dir, ty = -ux*w.dir;                    // the swirl's way round (as drawn: the foam spirals in this way)
          const al = Math.cos(boat.angle)*tx + Math.sin(boat.angle)*ty;
          if(al > WHIRL_FLING_COS && boat.speed > ROW_ENTER && !anchored){
            const f = w.s*(al - WHIRL_FLING_COS)/(1 - WHIRL_FLING_COS)*(0.35 + 0.65*k);
            boat.speed = Math.min(boat.speed + WHIRL_FLING*f*dt, Math.max(boat.speed, targetSpeed + surf + WHIRL_FLING_MAX));
            if(boat.flingW !== w){                                 // once a pass: a whoosh and a buzz
              boat.flingW = w; Sfx.surf(); buzz([15,30,25]);
              popups.push({x:boat.x, y:boat.y-26, text:TEXT.popups.fling, life:1.4, max:1.4});
            }
          }
        } else if(boat.flingW === w) boat.flingW = null;
        if(!w.armed) continue;
        // core: caught, spun round, damaged and flung out (only once it's fully formed)
        if(d < w.core && w.s > 0.7){
          boat.whirl = { w, t:0, dur: 2.0, a0: Math.atan2(dy,dx), d0: Math.max(d, 8),
                         h0: boat.angle, out: rand(-Math.PI, Math.PI) };
          w.armed = false; w.phase = 'out';               // it has had her: once she's flung out, it dies down
          boat.speed = 0; boat.kx = boat.ky = 0;
          boat.health = Math.max(0, boat.health - WHIRL_DAMAGE);
          hurtFlash = 0.35; shake = 0.15; showHealth(); Sfx.crash(0.6);
          buzz([60,40,60,40,90]);                   // spun round
          popups.push({x:w.x, y:w.y-w.core-8, text:fmt(TEXT.popups.whirl, {damage: WHIRL_DAMAGE}), life:1.4, max:1.4});
          Sfx.whirl();
        }
      }
      if(boat.whirl){
        // orbit the eye (drawn in, then out again) while the hull spins,
        // then swing to a random heading and get flung off along it
        const q = boat.whirl, w = q.w;
        q.t += dt;
        const k = Math.min(1, q.t/q.dur);
        const a = q.a0 + w.dir*k*Math.PI*2.5;
        const r = q.d0 + (w.core*0.45 - q.d0)*Math.sin(Math.PI*k);
        boat.x = w.x + Math.cos(a)*r;
        boat.y = w.y + Math.sin(a)*r;
        const spin = q.h0 + w.dir*k*Math.PI*3.2;
        const blend = Math.max(0, (k-0.65)/0.35), e = blend*blend*(3-2*blend);
        boat.angle = spin + norm(q.out - spin)*e;
        boat.speed = 0;
        if(k>=1){
          boat.angle = q.out;
          // new random heading, but the throw itself is straight outward and
          // sized to carry the boat past the rim of the pull ring
          const ox = wdx(boat.x,w.x), oy = wdy(boat.y,w.y), od = Math.hypot(ox,oy)||1;
          boat.kdamp = 1.1;
          const kick = (w.r - od + 30)*boat.kdamp;
          boat.kx = ox/od*kick; boat.ky = oy/od*kick;
          boat.speed = 0;
          boat.whirl = null;
          w.escaping = true;
        }
      } else {
        boat.x += Math.cos(boat.angle)*boat.speed*dt + (boat.kx + boat.lwx + boat.dfx)*dt;
        boat.y += Math.sin(boat.angle)*boat.speed*dt + (boat.ky + boat.lwy + boat.dfy)*dt;
        const kd = Math.exp(-boat.kdamp*dt);              // rebound fades out
        boat.kx *= kd; boat.ky *= kd;
      }
    }

    // wake: foam spawned at the stern, left behind in world space
    wakeAcc += boat.speed*dt;
    while(wakeAcc > 7){
      wakeAcc -= 7;
      const ca=Math.cos(boat.angle), sa=Math.sin(boat.angle);
      for(const side of [-1,1]){
        wake.push({
          x: boat.x - ca*15 - sa*side*5,
          y: boat.y - sa*15 + ca*side*5,
          vx: -sa*side*12, vy: ca*side*12,
          life: 1.8, max: 1.8
        });
      }
    }
    // bow foam: bits of white water peel off both sides of the stem, more and
    // bigger the faster she goes; the water stays put, so they fall astern
    // as she sails on, spreading out, growing, then breaking up and fading
    {
      const k = Math.max(0, Math.min(1, boat.speed/(MAX_SPEED*WIND_BOOST)));
      if(!moor && k > 0.06){
        bowAcc += dt*(14 + 46*k);
        const ca=Math.cos(boat.angle), sa=Math.sin(boat.angle);
        while(bowAcc > 1){
          bowAcc -= 1;
          const side = Math.random() < 0.5 ? -1 : 1, along = 21 - Math.random()*Math.random()*12;   // most near the stem
          const half = 10.5*Math.max(0, 1 - Math.pow((along-5)/16, 2)) + 0.5;
          const out = rand(4, 14)*(0.5 + k);                                   // flung outward
          bowSpray.push({x: boat.x + ca*along - sa*side*half, y: boat.y + sa*along + ca*side*half,
                         vx: -sa*side*out + ca*rand(-2, 4)*k, vy: ca*side*out + sa*rand(-2, 4)*k,
                         r: rand(0.7, 1.9)*(0.6 + 0.9*k), life: 0, max: rand(0.3, 0.75)*(0.6 + 0.7*k), seed: Math.random()*6.3});
        }
      }
      for(let i=bowSpray.length-1;i>=0;i--){
        const f = bowSpray[i];
        f.life += dt;
        if(f.life >= f.max){ bowSpray.splice(i,1); continue; }
        const drag = Math.exp(-3*dt); f.vx *= drag; f.vy *= drag;
        f.x += f.vx*dt; f.y += f.vy*dt;
      }
    }
    // steam: puffs from the funnel, thick while the spring drives the wheels, a faint wisp while they freewheel under
    // way; each rises, swells, drifts downwind and fades (the air stays put: she sails out from under it)
    if(STEAM_ON){
      const drive = oarSpin > 0.05 && !moor, idle = !drive && !moor && boat.speed > 3;
      const k = drive ? oarSpin : idle ? STEAM_LIGHT : 0;
      steamAcc += dt*(drive ? STEAM_RATE*oarSpin : idle ? STEAM_RATE*STEAM_IDLE : 0);
      const ca = Math.cos(boat.angle), sa = Math.sin(boat.angle);
      while(steamAcc > 1){
        steamAcc -= 1;
        steam.push({x: boat.x - ca*4 + rand(-0.6, 0.6), y: boat.y - sa*4 + rand(-0.6, 0.6), z: 10, vz: rand(12, 18)*(0.6 + 0.4*k),
                    r: rand(1.4, 2)*(0.5 + 0.8*k), a: Math.min(1, 0.35 + 0.75*k), life: 0, max: rand(2, 2.8)*(0.55 + 0.6*k), seed: Math.random()*6.3});
      }
      const dw = windAngle + boat.windOff + Math.PI, wx = Math.cos(dw)*windStrength*14, wy = Math.sin(dw)*windStrength*14;
      for(let i=steam.length-1;i>=0;i--){
        const f = steam[i];
        f.life += dt;
        if(f.life >= f.max){ steam.splice(i,1); continue; }
        f.x += wx*dt; f.y += wy*dt; f.z += f.vz*dt; f.vz *= Math.exp(-1.2*dt);
      }
    } else steam.length = 0;
    for(let k=wake.length-1;k>=0;k--){
      const f=wake[k];
      f.life-=dt;
      if(f.life<=0){ wake.splice(k,1); continue; }
      f.x+=f.vx*dt; f.y+=f.vy*dt;
      const damp=Math.pow(0.97,dt*60);          // frame-rate independent
      f.vx*=damp; f.vy*=damp;
    }

    // no walls: the world wraps around (see the end of the collision block)

    // island collision (star-shaped outline → push out radially)
    hitCooldown = Math.max(0, hitCooldown-dt);
    if(!moor && !boat.whirl) islandGrid.query(boat.x, boat.y, hullR, isl=>{
      const dx=wdx(boat.x,isl.x), dy=wdy(boat.y,isl.y), d=Math.hypot(dx,dy);
      if(d > isl.rmax+hullR) return;
      const minD = rAt(isl, Math.atan2(dy,dx)) + hullR;
      if(d<minD){
        impact(dx/(d||1), dy/(d||1));
        boat.x += dx/(d||1)*minD - dx;
        boat.y += dy/(d||1)*minD - dy;
        boat.speed*=0.25;
      }
    });
    if(drawnSD && !moor && !boat.whirl){                    // the drawn map's coasts: pushed back out along the slope
      const d = drawnDist(boat.x, boat.y);
      if(d < hullR){ const [nx, ny] = drawnNormal(boat.x, boat.y); impact(nx, ny); boat.x += nx*(hullR - d); boat.y += ny*(hullR - d); boat.speed *= 0.25; }
    }
    for(const wk of wrecks) if(!wk.seen && wdist(boat.x, boat.y, wk.x, wk.y) < 220){ wk.seen = true; toast(TEXT.bottles.wreck); buzz([20,40,20]); }   // the wreck from the message, first sighted
    // rock collision
    if(!moor && !boat.whirl) rockGrid.query(boat.x, boat.y, 40, o=>{
      const dx=wdx(boat.x,o.x), dy=wdy(boat.y,o.y);
      const d=Math.hypot(dx,dy), minD=o.r*0.9+hullR;
      if(d<minD){
        impact(dx/(d||1), dy/(d||1));
        boat.x += dx/(d||1)*minD - dx;
        boat.y += dy/(d||1)*minD - dy;
        boat.speed*=0.3;
      }
    });

    // wrap around the world's edges
    boat.x = wrapX(boat.x); boat.y = wrapY(boat.y);

    // pier collisions
    if(!moor){
      const pd = pierDist(boat.x, boat.y), minD = PIER_W/2 + hullR;   // nearest of all piers
      if(pd.d < minD){
        impact(pd.nx, pd.ny);
        boat.x = pd.qx + pd.nx*minD;
        boat.y = pd.qy + pd.ny*minD;
        boat.speed *= 0.3;
      }
    }

    // mooring hint
    if(!moor && !dlg){
      const b = fishing ? (fishing.bank || fishing.bottle) : (bankUnderBoat() || bottleUnderBoat());
      elHint.classList.add('hidden');                   // fishing speaks for itself: nets, fish, splash
      bankHint = !!b && !fishing && !anchored && !holdFull();   // over a bank: the hub of the wheel shows a fish (not with a full hold)
    }
    else elHint.classList.add('hidden');              // at a quay: no hint window

    updateFishing(dt);
    updateBoil(dt);
    updateReel(dt);
    updateGuests(dt);
    if(homeStageFor(satisfaction) !== homeStage){ homeStage = homeStageFor(satisfaction); rebakeHome(); }   // the masseria changes with the mood
    updateRollers(dt);
    // oars: out when crawling along and steering, back in once under way;
    // they row while the boat is actually turning
    {
      // not when the anchor is what's slowing her, nor while she gathers way
      // again after weighing it: only a sail that's losing the wind needs them
      if(anchored) boat.fromAnchor = true;
      else if(boat.speed >= 9) boat.fromAnchor = false;
      const low = boat.speed < 9;
      const turning = !anchored && Math.abs(wheelAngle/WHEEL_MAX) > 0.08;
      const crawling = !anchored && (sailLevel===SAIL_MIN || (!boat.fromAnchor && boat.speed > 2 && boat.speed < 9));
      const want = !moor && !boat.whirl && (MANUAL_OARS ? oarSpin > 0.02 : (low && turning) || crawling);
      boat.oarHold = want ? 0.5 : Math.max(0, (boat.oarHold||0) - dt);   // a short grace so they don't flicker
      boat.oarsOut = want || boat.oarHold > 0;
      const tgt = boat.oarsOut ? 1 : 0;
      boat.oarK += Math.sign(tgt-boat.oarK)*Math.min(Math.abs(tgt-boat.oarK), dt*2.2);
      if(MANUAL_OARS){ boat.rowing = boat.oarsOut; boat.oarPh = oarCycle*Math.PI*2 - Math.PI/2; }   // the blades turn with the stroke cycle (the catch at the start of each)
      else if(boat.oarK>0 && (turning || crawling)) boat.oarPh += dt*(turning ? 4 + 5*Math.abs(wheelAngle/WHEEL_MAX) : 3.2);
    }
    voyageTime += dt;

    // popups, flash, shake
    for(let k=popups.length-1;k>=0;k--){
      popups[k].life -= dt; popups[k].y -= 18*dt;
      if(popups[k].life<=0) popups.splice(k,1);
    }
    hurtFlash = Math.max(0, hurtFlash-dt);
    shake = Math.max(0, shake-dt);

    if(boat.health<=0) sink();

    // hull meter: touch the page only when the number changes
    const hp = Math.ceil(boat.health);
    if(hp !== lastHp){
      lastHp = hp;
      elHpNum.textContent = hp;
      elHpFill.style.width = (boat.health/MAX_HEALTH*100)+'%';
      elStatus.classList.toggle('low', hp<=25);
      elHpMeter.setAttribute('aria-valuenow', hp);
    }
    elStatus.classList.toggle('hurt', hurtFlash>0);
    // the guests' mood bar: written only when it changes
    {
      const pct = Math.round(satisfaction*100), show = playing && SATISFACTION_ON;
      if(pct !== moodShown){ moodShown = pct; elMoodFill.style.width = pct+'%'; elMood.setAttribute('aria-valuenow', pct); }
      if(show !== elMood.classList.contains('show')) elMood.classList.toggle('show', show);
      if(satPulse > 0){ if(!elMood.classList.contains('pulse')) elMood.classList.add('pulse'); satPulse -= dt; if(satPulse <= 0) elMood.classList.remove('pulse'); }
    }
    healthShowT = Math.max(0, healthShowT-dt);
    elStatus.classList.toggle('show', healthShowT>0);
    elWood.classList.add('show');                                   // always visible
    if(playing) markRoom();
    refreshList();
    updateDockBtn();
    updateOarCtl(dt);
    updateSling(dt);
  }

  // ---------- 1-bit rendering ----------
  // Everything is drawn in greys into a low-res buffer, then every frame a
  // post-pass turns it into pure ink/paper with a 4×4 ordered (Bayer)
  // dither. Any grey, gradient or transparency therefore becomes a dot
  // pattern, Playdate-style. The pattern is anchored to the world (offset
  // by the camera) so it doesn't crawl over the scene while you sail.
  const INK = [27,26,23], PAPER = [235,231,220];
  let INK32 = (255<<24)|(INK[2]<<16)|(INK[1]<<8)|INK[0];
  let PAPER32 = (255<<24)|(PAPER[2]<<16)|(PAPER[1]<<8)|PAPER[0];

  // ---------- Day and night ----------
  // Palette only: the two 1-bit colours drift through a day. Everything is
  // drawn exactly the same; only "paper" and "ink" change colour.
  let dayT = 0.1;                              // 0 = first light; start mid-morning
  let dayNo = 1;                               // which day of the voyage it is (shown in the list)
  const DAY_KEYS = [                           // [time of day, paper rgb, ink rgb, darkness 0..1]
    [0.00, [214,190,196], [ 44, 32, 48], 0.35], // dawn: rose paper, plum ink
    [0.07, [235,231,220], [ 27, 26, 23], 0],    // day
    [0.50, [235,231,220], [ 27, 26, 23], 0],
    [0.58, [240,204,156], [ 54, 32, 30], 0.15], // golden hour
    [0.66, [168,184,214], [ 10, 12, 24], 1],    // night: lamps and moon-blue light, the rest dark
    [0.93, [168,184,214], [ 10, 12, 24], 1],
    [1.00, [214,190,196], [ 44, 32, 48], 0.35]
  ];
  let NIGHT = 0;
  function dayPalette(){
    let k = 0; while(k < DAY_KEYS.length-2 && dayT >= DAY_KEYS[k+1][0]) k++;
    const [t0,p0,i0,n0] = DAY_KEYS[k], [t1,p1,i1,n1] = DAY_KEYS[k+1];
    let f = (dayT-t0)/Math.max(1e-6,t1-t0); f = f*f*(3-2*f);
    const mix = (a,b)=> a.map((v,j)=> Math.round(v+(b[j]-v)*f));
    const P = mix(p0,p1), I = mix(i0,i1);
    PAPER32 = (255<<24)|(P[2]<<16)|(P[1]<<8)|P[0];
    INK32   = (255<<24)|(I[2]<<16)|(I[1]<<8)|I[0];
    NIGHT = n0 + (n1-n0)*f;
  }
  // the interface follows the light too, but only partway (UI_TINT): the
  // dithered widgets and the HTML panels (--paper / --ink) share the colours
  let uiPalKey = '';
  // (at most twice a second: each change restyles the whole page and repaints
  // the panels and the logbook icon, too heavy to do every frame at dusk and dawn)
  let uiPalT = -1;
  function uiPalette(){
    if(uiPalKey && t - uiPalT < 0.5 && t >= uiPalT) return;
    uiPalT = t;
    const P = [PAPER32&255, (PAPER32>>8)&255, (PAPER32>>16)&255], I = [INK32&255, (INK32>>8)&255, (INK32>>16)&255];
    const up = PAPER.map((v,j)=> Math.round(v+(P[j]-v)*UI_TINT)), ui = INK.map((v,j)=> Math.round(v+(I[j]-v)*UI_TINT));
    const key = up.join()+'/'+ui.join();
    if(key === uiPalKey) return;                 // only when the colour actually moves
    uiPalKey = key;
    UI_PAPER32 = (255<<24)|(up[2]<<16)|(up[1]<<8)|up[0];
    UI_INK32   = (255<<24)|(ui[2]<<16)|(ui[1]<<8)|ui[0];
    const root = document.documentElement.style;
    root.setProperty('--paper', 'rgb('+up.join()+')');
    root.setProperty('--ink', 'rgb('+ui.join()+')');
    logIconDone = false;                         // the logbook icon is cached: paint it again
  }
  // Night light: a coarse mask (one value per 4×4 pixel block) of how lit
  // each spot is. Outside the light everything sinks toward ink.
  const NIGHT_FLOOR = 0.1, MB = 4;
  let nightCamX = 0, nightCamY = 0, lightMask = null, lmW = 0, lmH = 0;
  function nightLights(){
    const fl = 1 + 0.05*Math.sin(t*9) + 0.03*Math.sin(t*23);             // lantern flicker
    const L = [[boat.x, boat.y, 82*fl, 140*fl, 1]];                    // the boat's lantern: wide, crisp edge
    L.push([START.x-14, START.y+18, 8, 34, 1], [PIER.x1, PIER.y1, 4, 22, 1]);   // home: the house, the pier lamp

  // ---------- Villages: chunky pixel-art, every shape on the pixel grid ----------
  function P(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
  function drawVillageGround(isl){
    const L = isl.vl, cx = isl.x, cy = isl.y;
    // packed-earth clearing (light dots) with a ragged fringe into the scrub,
    // kept on land (the bay cuts into it)
    ctx.save(); traceIsland(isl, i=>isl.radii[i]-2); ctx.clip();
    ctx.fillStyle = V(0.84);                        // thin dotted fringe
    ctx.beginPath(); ctx.arc(cx,cy,L.VR+4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = PAPERC;
    ctx.beginPath();
    for(let k=0;k<14;k++){
      const a = k/14*Math.PI*2, r = L.VR*(0.8+0.25*Math.sin(k*2.3+isl.x));
      ctx.moveTo(cx+Math.cos(a)*r*0.75+r*0.45, cy+Math.sin(a)*r*0.75);
      ctx.arc(cx+Math.cos(a)*r*0.75, cy+Math.sin(a)*r*0.75, r*0.45, 0, Math.PI*2);
    }
    ctx.moveTo(cx+L.VR,cy); ctx.arc(cx,cy,L.VR,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = V(0.78); ctx.lineWidth = 8; ctx.lineCap = 'butt';
    ctx.beginPath(); for(const l of L.lanes){ ctx.moveTo(l[0],l[1]); ctx.lineTo(l[2],l[3]); } ctx.stroke();
    ctx.strokeStyle = PAPERC; ctx.lineWidth = 6;
    ctx.beginPath(); for(const l of L.lanes){ ctx.moveTo(l[0],l[1]); ctx.lineTo(l[2],l[3]); } ctx.stroke();
    ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(cx,cy,17,0,Math.PI*2); ctx.fill();

    for(let yy=-15; yy<=15; yy+=3) for(let xx=-15; xx<=15; xx+=3){
      if(xx*xx+yy*yy > 15*15 || ((xx+yy)/3)%2) continue;
      P(cx+xx, cy+yy, 1, 1, V(0.55));
    }
    drawHarbour(isl.village.pier);
    drawPier(isl.village.pier);
  }
  function drawHouse(hs){
    const {x,y,w,h} = hs;
    P(x+2,y+2,w,h,V(0.3));                       // cast shadow
    P(x,y,w,h,INKC);                             // 1px outline
    if(hs.roof==='flat'){
      P(x+1,y+1,w-2,h-2,PAPERC);                 // whitewashed flat roof
      for(let i=x+3;i<x+w-3;i+=2){ P(i,y+2,1,1,INKC); P(i,y+h-3,1,1,INKC); }   // parapet
      P(x+w-5,y+3,2,2,INKC);                     // stair hatch
    } else if(hs.vert){
      const m = x+Math.floor(w/2);
      P(x+1,y+1,m-x-1,h-2,PAPERC);               // sunny slope
      for(let j=y+2;j<y+h-1;j+=2) P(x+1,j,m-x-1,1,V(0.72));   // tile rows
      P(m+1,y+1,x+w-2-m,h-2,V(0.42));            // shaded slope
      P(m,y,1,h,INKC);                           // ridge

      const m = y+Math.floor(h/2);

      P(x,m,w,1,INKC);
    }
  }
  function drawVillage(isl){
    const L = isl.vl, cx = isl.x, cy = isl.y;
    for(const hs of L.houses) drawHouse(hs);

    for(const st of L.stalls){
      P(st.x+1,st.y+1,7,5,V(0.35));
      P(st.x-1,st.y-1,8,6,INKC);
      for(let i=0;i<6;i++) P(st.x+i,st.y,1,4, i%2 ? INKC : PAPERC);
    }

  }
  // the lighthouse beam sweeps round slowly (live, not cached): a pale wedge
  // with dotted edges, so the villages can be spotted from a distance
  const BEAM_LEN = 720;
  function drawBeam(Lt){
    const a = t*0.35 + Lt.ph, len = BEAM_LEN, sp = 0.1;   // one turn every ~18 s
    const x = Lt.x+0.5, y = Lt.y+0.5;
    // pale light: lifts the dark fog out at sea, fading along its length
    // (the lighthouse never moves: its three gradients are made once)
    if(!Lt.grads){
      const g = ctx.createRadialGradient(x,y,0,x,y,len);
      g.addColorStop(0,'rgba(255,255,255,0.75)'); g.addColorStop(0.5,'rgba(255,255,255,0.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
      const gs = ctx.createRadialGradient(x,y,0,x,y,len);
      gs.addColorStop(0,'rgba(0,0,0,0.1)'); gs.addColorStop(1,'rgba(0,0,0,0)');
      const ge = ctx.createRadialGradient(x,y,0,x,y,len);
      ge.addColorStop(0,'rgba(0,0,0,0.55)'); ge.addColorStop(1,'rgba(0,0,0,0)');
      Lt.grads = {g, gs, ge};
    }
    const {g, gs, ge} = Lt.grads;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(a-sp)*len, y+Math.sin(a-sp)*len);
    ctx.lineTo(x+Math.cos(a+sp)*len, y+Math.sin(a+sp)*len);
    ctx.closePath(); ctx.fill();
    // a faint shadowy wedge so it also reads on the white, explored sea
    ctx.fillStyle = gs;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(a-sp)*len, y+Math.sin(a-sp)*len);
    ctx.lineTo(x+Math.cos(a+sp)*len, y+Math.sin(a+sp)*len);
    ctx.closePath(); ctx.fill();
    // dotted edges along the whole length, fading out
    ctx.strokeStyle = ge; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a-sp)*7, y+Math.sin(a-sp)*7); ctx.lineTo(x+Math.cos(a-sp)*len, y+Math.sin(a-sp)*len);
    ctx.moveTo(x+Math.cos(a+sp)*7, y+Math.sin(a+sp)*7); ctx.lineTo(x+Math.cos(a+sp)*len, y+Math.sin(a+sp)*len);
    ctx.stroke();
    // the lit lantern
    ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  }
  // the lighthouse(s) of a harbour: a tower with a long shadow and a lamp
  function drawHarbour(pr){
    for(const lt of pr.lights){
      const x=lt.x, y=lt.y, big=lt.tall;
      const sh = big ? 20 : 10;
      ctx.fillStyle='rgba(0,0,0,0.32)';
      ctx.beginPath(); ctx.moveTo(x-2.5,y+1); ctx.lineTo(x+sh*0.8-1.5,y+sh+1); ctx.lineTo(x+sh*0.8+2.5,y+sh-2); ctx.lineTo(x+2.5,y-1); ctx.closePath(); ctx.fill();
      const r = big ? 4.6 : 3.4;
      ctx.fillStyle=PAPERC; ctx.strokeStyle=INKC; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      if(big){ ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(x,y,r-1.8,0,Math.PI*2); ctx.stroke(); }
      ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(x,y,big?1.6:1.2,0,Math.PI*2); ctx.fill();
    }
  }
  // Cliffs: where the coast is rock and faces south (toward the viewer), the
  // island's edge is shown as a pale limestone wall with vertical fissures,
  // the plateau sitting on top of it, a bit like the Faraglioni of Capri.
  function drawCliffs(isl){
    if(!isl.rocky.some(v=>v)) return;
    const N = ISL_N, R = isl.radii;
    const H = (i)=>{ const th=i/N*Math.PI*2, f=Math.sin(th)+0.35; return isl.rocky[i] && f>0.05 ? Math.min(1,(f-0.05)/0.6)*(18+6*Math.sin(i*1.7+isl.x)+4*Math.sin(i*0.37)) : 0; };
    const P = (i,up)=>[isl.x+COS[i]*R[i], isl.y+SIN[i]*R[i]-up];
    let i0 = 0; while(i0<N && H(i0)>0) i0++;
    for(let k=0;k<N;k++){
      const i=(i0+k)%N; if(H(i)<=0) continue;
      let j=i; const run=[]; while(H(j%N)>0 && run.length<N){ run.push(j%N); j++; }
      k += run.length;
      if(run.length<2) continue;
      // wall: pale limestone, so it stands out from the scrub above
      ctx.fillStyle=V(0.9);
      ctx.beginPath();
      run.forEach((q,n)=>{ const [x,y]=P(q,0); n? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      for(let n=run.length-1;n>=0;n--){ const [x,y]=P(run[n],H(run[n])); ctx.lineTo(x,y); }
      ctx.closePath(); ctx.fill();
      // fissures and a darker foot
      ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.globalAlpha=0.7;
      ctx.beginPath();
      run.forEach((q,n)=>{ if(n%2) return; const h=H(q); const [x,y]=P(q,0); ctx.moveTo(x,y); ctx.lineTo(x,y-h*(0.55+0.45*Math.abs(Math.sin(q*3.1)))); });
      ctx.stroke(); ctx.globalAlpha=1;
      // cliff top edge
      ctx.lineWidth=1.3; ctx.beginPath();
      run.forEach((q,n)=>{ const [x,y]=P(q,H(q)); n? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      ctx.stroke();
    }
  }
  // a pier of big worn stone blocks (for the ruins)
  function drawStonePier(pr){
    const {x0,y0,dx,dy} = pr, len = pr.total, hw = PIER_W/2+1;
    ctx.save(); ctx.translate(x0,y0); ctx.rotate(Math.atan2(dy,dx));
    const sxl = 4*dx+4*dy, syl = -4*dy+4*dx;
    ctx.fillStyle=V(0.5); ctx.fillRect(sxl,-hw+syl,len,hw*2);
    for(let u=0; u<len; u+=9){
      const h = Math.sin((x0+u)*5.3+y0)*43758.5; const rr = h-Math.floor(h);
      const bw = Math.min(9, len-u);
      for(const [yy,hh] of [[-hw,hw],[0,hw]]){
        ctx.fillStyle = rr>0.5 ? PAPERC : V(0.88); ctx.fillRect(u, yy, bw, hh);
        ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.strokeRect(u+0.5, yy+0.5, bw-1, hh-1);
      }
    }
    ctx.lineWidth=1.6; ctx.strokeRect(0,-hw,len,hw*2);
    ctx.restore();
  }
  // ---------- Ruins: pixel-art temple stones ----------
  function drawRuinGround(isl){
    const L = isl.rl, pr = isl.ruin.pier;
    // bare, stony ground: sparse dots, clipped to the island
    ctx.save(); traceIsland(isl, i=>isl.radii[i]-3); ctx.clip();
    ctx.fillStyle = V(0.86); ctx.beginPath(); ctx.ellipse(L.cx, L.cy, 56, 46, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = V(0.95); ctx.beginPath(); ctx.ellipse(L.cx, L.cy, 44, 36, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = V(0.7); ctx.lineWidth = 7; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(L.cx, L.cy); ctx.lineTo(pr.x0, pr.y0); ctx.stroke();
    ctx.strokeStyle = PAPERC; ctx.lineWidth = 5; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.moveTo(L.cx, L.cy); ctx.lineTo(pr.x0, pr.y0); ctx.stroke(); ctx.setLineDash([]);
    drawPier(pr);
  }
  function drawRuins(isl){
    const L = isl.rl, cx = Math.round(L.cx), cy = Math.round(L.cy), W = L.plat.w, H = L.plat.h;
    // stepped platform (stylobate)
    P(cx-W/2+3, cy-H/2+3, W, H, V(0.4));
    P(cx-W/2, cy-H/2, W, H, INKC);
    P(cx-W/2+1, cy-H/2+1, W-2, H-2, V(0.75));
    P(cx-W/2+3, cy-H/2+3, W-6, H-6, INKC);
    P(cx-W/2+4, cy-H/2+4, W-8, H-8, PAPERC);
    for(let i=cx-W/2+6; i<cx+W/2-6; i+=6) P(i, cy-H/2+4, 1, H-8, V(0.7));      // floor slabs
    // fallen drums and column pieces
    for(const d of L.drums){
      ctx.save(); ctx.translate(Math.round(d.x), Math.round(d.y)); ctx.rotate(d.a);
      const len = d.long ? 12 : 5;
      ctx.fillStyle=V(0.45); ctx.fillRect(-len/2+1.5, -2.5+1.5, len, 5);
      ctx.fillStyle=PAPERC; ctx.fillRect(-len/2, -2.5, len, 5);
      ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.strokeRect(-len/2, -2.5, len, 5);
      if(d.long){ ctx.beginPath(); ctx.moveTo(-len/2+4,-2.5); ctx.lineTo(-len/2+4,2.5); ctx.moveTo(len/2-4,-2.5); ctx.lineTo(len/2-4,2.5); ctx.stroke(); }
      ctx.restore();
    }
    // columns, back row first: standing ones rise upward and cast long shadows
    const cols = [...L.cols].sort((a,b)=>a.y-b.y);
    for(const c of cols){
      const x = Math.round(c.x), y = Math.round(c.y);
      if(c.h > 0){ for(let k=1;k<=c.h;k+=1.5) P(x+k*0.7, y+k*0.45, 4, 3, V(0.35)); }   // shadow
      if(c.h <= 0){ P(x-2,y-1,5,3,V(0.6)); P(x-2,y-1,5,1,INKC); continue; }             // only the base left
      P(x-2, y-c.h, 5, c.h, INKC);                                                       // shaft
      P(x-1, y-c.h+1, 2, c.h-1, PAPERC);
      P(x+1, y-c.h+1, 1, c.h-1, V(0.6));
      P(x-3, y-c.h-2, 7, 2, INKC);                                                       // capital
      if(c.h < 9) P(x-2, y-c.h-3, 2, 1, INKC);                                          // broken top
      P(x-3, y-1, 7, 2, INKC);                                                           // base
    }
    // broken arch
    const ax = Math.round(L.arch.x), ay = Math.round(L.arch.y);
    P(ax-7+2, ay-2+2, 14, 4, V(0.4));
    P(ax-7, ay-12, 3, 13, INKC); P(ax-6, ay-11, 1, 11, PAPERC);
    P(ax+4, ay-7, 3, 8, INKC); P(ax+5, ay-6, 1, 6, PAPERC);
    ctx.strokeStyle=INKC; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ax-1, ay-12, 5, Math.PI, Math.PI*1.55); ctx.stroke();
  }
  // mooring lines are live (they depend on the boat), so they're drawn on
  // top of the cached island image
  function drawMooringLines(){
    if(!moor) return;
    const pr = moor.pier;
    const {x0,y0,dx,dy} = pr;
    const px=-dy, py=dx, hw=PIER_W/2;
    // bow and stern lines to the pier edge while moored
    if(moor && moor.phase==='moored'){
      const sd = moor.side, ca = Math.cos(boat.angle), sa = Math.sin(boat.angle);
      ctx.strokeStyle=INKC; ctx.lineWidth=1;
      for(const f of [11,-11]){
        const hx2 = boat.x + ca*f - px*sd*4, hy2 = boat.y + sa*f - py*sd*4;
        const pf = pierFrame(pr,hx2,hy2);
        const ea = pf.along + f*0.9;

        ctx.beginPath(); ctx.moveTo(hx2,hy2);
        ctx.quadraticCurveTo((hx2+ex)/2+dx*1.5, (hy2+ey)/2+dy*1.5, ex, ey);
        ctx.stroke();
        ctx.fillStyle=INKC;
        ctx.beginPath(); ctx.arc(ex,ey,1.8,0,Math.PI*2); ctx.fill();
      }
    }

  }
  // the house (flat roof terrace with a railing, a small pitched-roof room
  // and a striped awning), a lean-to boat shed, a net drying on poles,
  // a rowboat pulled up on the beach and a few barrels
  // Home: a fortified masseria of the south (Apulia): a walled court with
  // crenellated white walls, a square watchtower on one corner, the owner's
  // house along the south wall, a well in the court, and a cluster of trulli
  // (white drums under grey stone cones) outside the east wall. How it looks
  // follows the guests' mood (homeStage 0..4): breached walls, fallen trulli
  // and weeds when it's low; tables, a pergola, lanterns and a pennant as it
  // rises. Drawn in home units (scaled by HOME_BLD round the island's centre).
  function drawHomeBuildings(isl){
    const x=isl.x, y=isl.y, pal = baseLevel >= 2, st = pal ? 4 : homeStage;   // (the palace: the masseria at its best, and more)
    ctx.save();
    ctx.translate(x,y); ctx.scale(HOME_BLD,HOME_BLD); ctx.translate(-x,-y);
    const R=(x0,y0,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x0,y0,w,h); };
    const ink=(lw)=>{ ctx.strokeStyle=INKC; ctx.lineWidth=lw; };
    if(baseLevel <= 0){ drawHut(x, y, R, ink); drawDryingNet(x, y); ctx.restore(); return; }
    if(pal) drawPalaceGrounds(x, y, R, ink);                                         // the chapel and the olive grove, outside the walls
    // --- the court and its walls ---
    const WX=x-30, WY=y-24, WW=56, WH=46, T=4;
    R(WX+4,WY+4,WW,WH,V(0.35));                                  // the walls' shadow
    R(WX,WY,WW,WH,V(0.9));                                       // the court: pale beaten earth
    ctx.fillStyle=V(0.72);                                       // a few flagstones
    for(let v=WY+T+3; v<WY+WH-T; v+=5) for(let u=WX+T+3+((v/5)|0)%2*2.5; u<WX+WW-T; u+=5) ctx.fillRect(u,v,1,1);
    // breaches: gaps in the walls with rubble, fewer as the mood rises
    const BREACH=[['e',0.3],['s',0.7],['w',0.45]], nb=Math.max(0, 3-st);
    const gaps={n:[[0.44,0.58,'gate']], e:[], s:[[0.44,0.56,'gate']], w:[]};      // the gates (north, to our pier; south, to the guests')
    BREACH.slice(0,nb).forEach(([sd,p])=> gaps[sd].push([p-0.09,p+0.09]));
    const wall=(sd)=>{                                           // one side, in pieces round its gaps
      const horiz = sd==='n' || sd==='s', len = horiz ? WW : WH;
      const cuts = gaps[sd].slice().sort((a,b)=>a[0]-b[0]);
      let from = 0;
      for(const [a,b] of [...cuts, [1,1]]){
        if(a > from){
          const s0=from*len, s1=a*len;
          const r = sd==='n' ? [WX+s0,WY,s1-s0,T] : sd==='s' ? [WX+s0,WY+WH-T,s1-s0,T] : sd==='w' ? [WX,WY+s0,T,s1-s0] : [WX+WW-T,WY+s0,T,s1-s0];
          R(r[0],r[1],r[2],r[3],PAPERC); ink(1.1); ctx.strokeRect(r[0],r[1],r[2],r[3]);
          ctx.fillStyle=INKC;                                    // merlons: little notches along the parapet
          for(let q=s0+2; q<s1-1; q+=4){ if(horiz) ctx.fillRect(WX+q, (sd==='n'?WY:WY+WH-T)+1.4, 1.4, 1.2); else ctx.fillRect((sd==='w'?WX:WX+WW-T)+1.4, WY+q, 1.2, 1.4); }
        }
        from = Math.max(from, b);
      }
      for(const [a,b,gate] of cuts){                             // rubble in the breaches (not in the gates)
        if(gate) continue;
        const m=(a+b)/2*len;
        const [cx,cy] = sd==='n' ? [WX+m,WY+2] : sd==='s' ? [WX+m,WY+WH-2] : sd==='w' ? [WX+2,WY+m] : [WX+WW-2,WY+m];
        for(let k=0;k<6;k++){ const ox=Math.sin(k*2.3+m)*3.5, oy=Math.cos(k*1.7+m)*2.5;

      }
    };
    ['n','e','s','w'].forEach(wall);
    R(x-3.5,WY-1,6,T+2,V(0.3)); ink(0.8); ctx.strokeRect(x-3.5,WY-1,6,T+2);           // the north gate's wooden leaves, open
    R(x-3.5,WY+WH-T-1,6,T+2,V(0.3)); ctx.strokeRect(x-3.5,WY+WH-T-1,6,T+2);         // the south gate
    // --- the owner's house along the south wall: a flat roof terrace ---
    const HX=WX+T, HY=WY+WH-T-15, HW=pal ? 34 : 24, HH=15;                            // (the palace's house runs further along the wall)
    R(HX+2,HY+2,HW,HH,V(0.45)); R(HX,HY,HW,HH,PAPERC);
    ink(1); ctx.strokeRect(HX+1.5,HY+1.5,HW-3,HH-3);                                  // the parapet
    ctx.beginPath(); for(let k=0;k<4;k++){ ctx.moveTo(HX+HW-1,HY+3+k*2.5); ctx.lineTo(HX+HW+4,HY+3+k*2.5); } ctx.stroke();   // stair down to the court
    skPoly([[HX,HY],[HX+HW,HY],[HX+HW,HY+HH],[HX,HY+HH]], true, 1.6, 1.2);
    R(HX+3,HY+3,2.5,2.5,INKC);                                                         // chimney
    if(pal){                                                                           // the palace: an arcaded loggia along the front of the house
      ink(0.9); ctx.fillStyle=V(0.35);
      for(let u=HX+3; u<HX+HW-4; u+=4.4){ ctx.beginPath(); ctx.moveTo(u,HY-0.2); ctx.lineTo(u,HY-3); ctx.arc(u+1.6,HY-3,1.6,Math.PI,0); ctx.lineTo(u+3.2,HY-0.2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }
    if(st >= 2){                                                                       // a striped awning on the terrace
      R(HX+8,HY+4,11,7,PAPERC); ink(1.1); ctx.beginPath(); for(let u=HX+9; u<HX+19; u+=2.4){ ctx.moveTo(u,HY+4); ctx.lineTo(u,HY+11); } ctx.stroke(); ctx.strokeRect(HX+8,HY+4,11,7);
    }
    // --- the watchtower on the north-east corner ---
    const TX=WX+WW-12, TY=WY-6, TS=16;
    R(TX+6,TY+6,TS,TS,V(0.3));                                                         // a long shadow: it's tall
    R(TX,TY,TS,TS,PAPERC); ink(1.6); ctx.strokeRect(TX,TY,TS,TS);
    R(TX+3,TY+3,TS-6,TS-6,V(0.78)); ink(1); ctx.strokeRect(TX+3,TY+3,TS-6,TS-6);         // the roof inside its parapet
    ctx.fillStyle=INKC; for(let q=1.5; q<TS-1; q+=3){ ctx.fillRect(TX+q,TY+0.8,1.2,1); ctx.fillRect(TX+q,TY+TS-1.8,1.2,1); ctx.fillRect(TX+0.8,TY+q,1,1.2); ctx.fillRect(TX+TS-1.8,TY+q,1,1.2); }   // machicolations
    if(st >= 4){                                                                       // a pennant on the tower
      ink(1); ctx.beginPath(); ctx.moveTo(TX+TS/2,TY+TS/2); ctx.lineTo(TX+TS/2,TY-7); ctx.stroke();
      ctx.fillStyle=INKC; ctx.beginPath(); ctx.moveTo(TX+TS/2,TY-7); ctx.lineTo(TX+TS/2+8,TY-5); ctx.lineTo(TX+TS/2,TY-3); ctx.closePath(); ctx.fill();
    }
    if(pal){                                                                           // a second tower on the south-west corner
      const T2X=WX-4, T2Y=WY+WH-12, T2=14;

      R(T2X+3,T2Y+3,T2-6,T2-6,V(0.78)); ink(1); ctx.strokeRect(T2X+3,T2Y+3,T2-6,T2-6);
      ctx.fillStyle=INKC; for(let q=1.5; q<T2-1; q+=3){ ctx.fillRect(T2X+q,T2Y+0.8,1.2,1); ctx.fillRect(T2X+q,T2Y+T2-1.8,1.2,1); ctx.fillRect(T2X+0.8,T2Y+q,1,1.2); ctx.fillRect(T2X+T2-1.8,T2Y+q,1,1.2); }
      ink(1); ctx.beginPath(); ctx.moveTo(T2X+T2/2,T2Y+T2/2); ctx.lineTo(T2X+T2/2,T2Y-6); ctx.stroke();
      ctx.fillStyle=INKC; ctx.beginPath(); ctx.moveTo(T2X+T2/2,T2Y-6); ctx.lineTo(T2X+T2/2+7,T2Y-4); ctx.lineTo(T2X+T2/2,T2Y-2); ctx.closePath(); ctx.fill();
      // a fountain in the middle of the court, with a basin and four paths
      const FX=x+2, FY=y-4;
      ctx.strokeStyle=V(0.72); ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(FX-14,FY); ctx.lineTo(FX+14,FY); ctx.moveTo(FX,FY-12); ctx.lineTo(FX,FY+10); ctx.stroke();
      ctx.fillStyle=V(0.82); ctx.beginPath(); ctx.arc(FX,FY,5.5,0,Math.PI*2); ctx.fill(); ink(1.2); ctx.stroke();

    const WLX=x-10, WLY=y-8;

    ctx.fillStyle=st ? INKC : V(0.4); ctx.beginPath(); ctx.arc(WLX,WLY,1.8,0,Math.PI*2); ctx.fill();
    if(st >= 2){                                                                       // a pergola of vines over the west of the court
      const PX=WX+T+1, PY=WY+T+2, PW=19, PH=17;
      ctx.fillStyle=V(0.55); for(let k=0;k<26;k++){ const u=PX+((k*7.3)%PW), v=PY+((k*5.1)%PH); ctx.beginPath(); ctx.arc(u,v,1.6,0,Math.PI*2); ctx.fill(); }   // leaves
      ink(0.9); ctx.globalAlpha=0.8; ctx.beginPath();
      for(let u=PX; u<=PX+PW; u+=4.75){ ctx.moveTo(u,PY); ctx.lineTo(u,PY+PH); }
      for(let v=PY; v<=PY+PH; v+=5.6){ ctx.moveTo(PX,v); ctx.lineTo(PX+PW,v); }
      ctx.stroke(); ctx.globalAlpha=1;
    }
    const TABLES = pal ? [[x+12,y-14],[x+14,y+6],[x-16,y-14],[x-8,y+5],[x+20,y-4],[x-18,y-3]] : [[x+4,y-12],[x+12,y-4],[x+3,y+2],[x+14,y+7],[x-16,y-14],[x-8,y+3],[x+20,y-14],[x-18,y-3]];
    TABLES.slice(0, Math.min(TABLES.length, st*2)).forEach(([tx,ty])=>{                                         // tables laid for dinner, each with four chairs
      ctx.fillStyle=INKC; for(const [ox,oy] of [[-3,0],[3,0],[0,-3],[0,3]]) ctx.fillRect(tx+ox-0.6,ty+oy-0.6,1.3,1.3);
      R(tx-1.8,ty-1.8,3.6,3.6,PAPERC); ink(0.9); ctx.strokeRect(tx-1.8,ty-1.8,3.6,3.6);
    });
    if(st <= 1){                                                                       // weeds through the flagstones
      ink(0.9); ctx.beginPath();
      for(let k=0;k<(st ? 8 : 16);k++){ const u=WX+T+3+((k*11.7)%(WW-2*T-6)), v=WY+T+3+((k*7.9)%(WH-2*T-6)); ctx.moveTo(u-1.2,v-1.6); ctx.lineTo(u,v); ctx.lineTo(u+1,v-1.9); }
      ctx.stroke();
    }
    if(st >= 3){                                                                       // a string of lanterns from the house to the tower
      const a=[HX+HW-2,HY+1], b=[TX+2,TY+TS-2];
      ink(0.7); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.quadraticCurveTo((a[0]+b[0])/2,(a[1]+b[1])/2+6,b[0],b[1]); ctx.stroke();
      for(let k=1;k<6;k++){ const f=k/6, ux=a[0]+(b[0]-a[0])*f, uy=a[1]+(b[1]-a[1])*f + 6*4*f*(1-f)*0.5;
        ctx.fillStyle=PAPERC; ctx.beginPath(); ctx.arc(ux,uy,1.3,0,Math.PI*2); ctx.fill(); ink(0.6); ctx.stroke(); }
    }
    // --- the trulli, outside the east wall: more of them standing as the mood rises ---
    const TRULLI=[[x+38,y-6],[x+47,y+3],[x+37,y+8],[x+46,y+16],[x+36,y+21]];
    TRULLI.forEach(([tx,ty],k)=>{
      const up = k <= st;                                                              // standing (else fallen in)
      ctx.fillStyle=V(0.35); ctx.beginPath(); ctx.arc(tx+2.5,ty+2.5,7.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=PAPERC; ctx.beginPath(); ctx.arc(tx,ty,7.5,0,Math.PI*2); ctx.fill(); ink(1.3); ctx.stroke();   // the whitewashed drum
      if(up){
        ctx.fillStyle=V(0.5); ctx.beginPath(); ctx.arc(tx,ty,6,0,Math.PI*2); ctx.fill();                     // the cone of grey stone
        ctx.strokeStyle=V(0.82); ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(tx,ty,4.6,Math.PI*1.05,Math.PI*1.6); ctx.stroke();   // lit side
        ink(0.8); for(const r of [4.5, 3]){ ctx.beginPath(); ctx.arc(tx,ty,r,0,Math.PI*2); ctx.stroke(); }    // courses of stone
        ink(1.1); ctx.beginPath(); ctx.arc(tx,ty,6,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle=PAPERC; ctx.beginPath(); ctx.arc(tx,ty,1.6,0,Math.PI*2); ctx.fill(); ink(0.8); ctx.stroke();   // the pinnacle
      } else {
        ctx.fillStyle=V(0.25); ctx.beginPath(); ctx.arc(tx,ty,5.4,0,Math.PI*2); ctx.fill();                  // fallen in: a dark hole
        for(let q=0;q<5;q++){ const a=q*1.3+k, r=3+q%2*1.5; ctx.fillStyle=V(0.6); ctx.beginPath(); ctx.arc(tx+Math.cos(a)*r,ty+Math.sin(a)*r,1.4,0,Math.PI*2); ctx.fill(); ink(0.6); ctx.stroke(); }
      }
    });

    if(!pal) drawDryingNet(x, y);                                                       // (the palace has its chapel there)
    ctx.restore();
  }
  // fishing net drying between two poles, on the west beach
  function drawDryingNet(x, y){
    const P1=[x-62,y+10], P2=[x-44,y+22], sag=5;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(P1[0],P1[1]); ctx.lineTo(P2[0],P2[1]);
    ctx.lineTo(P2[0]+2,P2[1]+sag); ctx.quadraticCurveTo((P1[0]+P2[0])/2+1,(P1[1]+P2[1])/2+sag*2,P1[0]+2,P1[1]+sag);
    ctx.closePath();
    ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fill();
    ctx.clip();
    ctx.strokeStyle=INKC; ctx.lineWidth=0.9; ctx.globalAlpha=0.8;
    ctx.beginPath();
    for(let u=-30; u<40; u+=3.2){ ctx.moveTo(P1[0]+u,P1[1]-12); ctx.lineTo(P1[0]+u+18,P1[1]+18); ctx.moveTo(P1[0]+u+18,P1[1]-12); ctx.lineTo(P1[0]+u,P1[1]+18); }
    ctx.stroke(); ctx.globalAlpha=1;
    ctx.restore();
    ctx.strokeStyle=INKC; ctx.lineWidth=1.3;
    ctx.beginPath(); skSeg(P1[0],P1[1],P2[0],P2[1],1.5); ctx.stroke();
    ctx.fillStyle=INKC;
    for(const [qx,qy] of [P1,P2]){ ctx.beginPath(); ctx.arc(qx,qy,1.8,0,Math.PI*2); ctx.fill(); }
  }
  // home at its humblest: a fisherman's hut of rough stone under a pitched
  // roof, a fire pit, a vegetable patch, a few crates and a rowboat's oars
  function drawHut(x, y, R, ink){
    const HX=x-12, HY=y-8, HW=18, HH=13;
    R(HX+3,HY+3,HW,HH,V(0.35));                                                        // shadow
    R(HX,HY,HW,HH,V(0.8)); ink(1.3); ctx.strokeRect(HX,HY,HW,HH);                      // the roof, seen from above
    ctx.fillStyle=V(0.55); ctx.fillRect(HX+HW/2,HY,HW/2,HH);                           // its shaded half
    ink(1.4); ctx.beginPath(); ctx.moveTo(HX+HW/2,HY); ctx.lineTo(HX+HW/2,HY+HH); ctx.stroke();   // the ridge
    ink(0.7); ctx.beginPath(); for(let v=HY+2.5; v<HY+HH; v+=2.5){ ctx.moveTo(HX+1,v); ctx.lineTo(HX+HW-1,v); } ctx.stroke();   // courses of tiles
    R(HX+HW/2-2,HY+HH,4,2.5,INKC);                                                      // the door, facing the court
    // the fire pit: a ring of stones round the embers
    const FX=x+6, FY=y+12;
    for(let k=0;k<8;k++){ const a=k*Math.PI/4; ctx.fillStyle=k%2?V(0.6):PAPERC; ctx.beginPath(); ctx.arc(FX+Math.cos(a)*3.6,FY+Math.sin(a)*3.6,1.3,0,Math.PI*2); ctx.fill(); ink(0.6); ctx.stroke(); }

    // a vegetable patch in rows, fenced with sticks

    for(let v=VY+2; v<VY+VH-1; v+=3) for(let u=VX+2; u<VX+VW-1; u+=3){ ctx.beginPath(); ctx.arc(u,v,1,0,Math.PI*2); ctx.fill(); }

    ink(1.1); ctx.beginPath(); ctx.moveTo(HX+HW+2,HY+1); ctx.lineTo(HX+HW+5,HY+12); ctx.moveTo(HX+HW+4,HY+1); ctx.lineTo(HX+HW+7,HY+12); ctx.stroke();
  }
  // the palace's grounds outside the walls: a little chapel with a bell
  // gable to the north-west, and an olive grove in rows to the south
  function drawPalaceGrounds(x, y, R, ink){
    const CX=x-52, CY=y-22, CW=16, CH=11;
    R(CX+3,CY+3,CW,CH,V(0.35)); R(CX,CY,CW,CH,PAPERC); ink(1.3); ctx.strokeRect(CX,CY,CW,CH);   // the nave, whitewashed
    ctx.fillStyle=PAPERC; ctx.beginPath(); ctx.arc(CX+CW,CY+CH/2,CH/2,-Math.PI/2,Math.PI/2); ctx.fill(); ink(1.3); ctx.stroke();   // the apse
    ink(0.9); ctx.beginPath(); ctx.moveTo(CX+2,CY+CH/2); ctx.lineTo(CX+CW-2,CY+CH/2); ctx.stroke();   // the roof's ridge

    ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(CX-1,CY+CH/2,1.1,0,Math.PI*2); ctx.fill();   // its bell
    ink(1.1); ctx.beginPath(); ctx.moveTo(CX+CW/2-3,CY-4); ctx.lineTo(CX+CW/2-3,CY+2); ctx.moveTo(CX+CW/2-5,CY-2); ctx.lineTo(CX+CW/2-1,CY-2); ctx.stroke();   // the cross
    // the olive grove: rows of round, silvery trees with their shadows
    for(let r=0;r<3;r++) for(let c=0;c<6;c++){

      ctx.fillStyle=V(0.3); ctx.beginPath(); ctx.arc(ox+1.6,oy+1.8,3.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=V(0.6); ctx.beginPath(); ctx.arc(ox,oy,3.4,0,Math.PI*2); ctx.fill(); ink(0.8); ctx.stroke();
      ctx.fillStyle=V(0.85); ctx.beginPath(); ctx.arc(ox-1,oy-1,1.4,0,Math.PI*2); ctx.fill();
