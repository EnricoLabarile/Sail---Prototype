        const singer = (kind)=>{
          const orni = kind === 'orni';
          const src = ac.createBufferSource(); src.buffer = pink; src.loop = true;
          const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = orni ? 2.2 : 3;
          const base = orni ? rand(4100, 4700) : rand(4800, 5300);
          bp.frequency.value = base;
          const grain = ac.createGain(); grain.gain.value = 0.55;                    // the tymbals' rasp inside each pulse
          const go = ac.createOscillator(); go.type = 'square'; go.frequency.value = orni ? rand(150, 210) : rand(210, 280);
          const ga = ac.createGain(); ga.gain.value = 0.45; go.connect(ga); ga.connect(grain.gain);
          const env = ac.createGain(); env.gain.value = 0;
          src.connect(bp); bp.connect(grain); grain.connect(env);
          let dest = out;
          if(ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = rand(-0.8, 0.8); p.connect(out); dest = p; }
          env.connect(dest);
          let bed = null;
          if(!orni){ bed = ac.createGain(); bed.gain.value = 0; grain.connect(bed); bed.connect(dest); }   // plebejus' steady buzz
          src.start(0, rand(0, 5)); go.start();
          return {orni, env, bp, bed, base, next: 0, boutStart: 0, boutEnd: 0, resting: false, amp: 1, rate: 6, phrase: 0, phraseEnd: 0};
        };
        cicadaSingers = [singer('orni'), singer('orni'), singer('orni'), singer('plebejus')];
        cicadaOut = out;
      }
      // whirlpool drone: two detuned low saws (slow beating) and a rumble of
      // dark noise, through a resonant low-pass that breathes. Silent until
      // a whirlpool is near; see drone().
      {
        const o1 = ac.createOscillator(); o1.type='sawtooth'; o1.frequency.value=46;
        const o2 = ac.createOscillator(); o2.type='sawtooth'; o2.frequency.value=48.3;
        const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=240; lp.Q.value=4;
        const lfo = ac.createOscillator(); lfo.frequency.value=0.18;
        const lfoAmt = ac.createGain(); lfoAmt.gain.value=70;
        lfo.connect(lfoAmt); lfoAmt.connect(lp.frequency);
        const nz = ac.createBufferSource(); nz.buffer = brown; nz.loop = true;
        const nlp = ac.createBiquadFilter(); nlp.type='lowpass'; nlp.frequency.value=160;
        const ng = ac.createGain(); ng.gain.value = 1.4;
        const og = ac.createGain(); og.gain.value = 0.35;
        const out = ac.createGain(); out.gain.value = 0;
        o1.connect(og); o2.connect(og); og.connect(lp);
        nz.connect(nlp); nlp.connect(ng); ng.connect(lp);
        lp.connect(out); out.connect(chan('whirl', master));
        o1.start(); o2.start(); lfo.start(); nz.start(0, 1.1);
        droneNodes = {out, lp, o1, o2};
      }
      // old boat engine: a low saw, chopped by an uneven firing rhythm (a
      // square LFO plus a slower wobble), through a muffled low-pass
      {
        const o = ac.createOscillator(); o.type='sawtooth'; o.frequency.value = 52;
        const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 260; lp.Q.value = 2;
        const chop = ac.createGain(); chop.gain.value = 0.55;
        const fire = ac.createOscillator(); fire.type='square'; fire.frequency.value = 8.5;
        const fa = ac.createGain(); fa.gain.value = 0.45; fire.connect(fa); fa.connect(chop.gain);
        const lope = ac.createOscillator(); lope.frequency.value = 0.7;              // it never runs quite even
        const la = ac.createGain(); la.gain.value = 1.2; lope.connect(la); la.connect(fire.frequency);
        const nz = ac.createBufferSource(); nz.buffer = brown; nz.loop = true;       // exhaust chuff
        const nlp = ac.createBiquadFilter(); nlp.type='bandpass'; nlp.frequency.value = 180; nlp.Q.value = 1.2;
        const ng = ac.createGain(); ng.gain.value = 0.9;
        const out = ac.createGain(); out.gain.value = 0;
        const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
        o.connect(lp); nz.connect(nlp); nlp.connect(ng); ng.connect(lp); lp.connect(chop); chop.connect(out);
        if(pan){ out.connect(pan); pan.connect(chan('engine', master)); } else out.connect(chan('engine', master));
        o.start(); fire.start(); lope.start(); nz.start(0, 0.7);
        engineNodes = {out, pan, o, fire};
      }
      {
      }
      rush.ph = 0;

      document.addEventListener('visibilitychange', ()=>{
        if(document.hidden) ac.suspend(); else ac.resume();
      });
    }
    // 6 s of brown (deep, rumbly) or pink (softer hiss) noise, normalised
    function colouredNoise(kind){
      const n = ac.sampleRate*6, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0,peak=0;
      for(let i=0;i<n;i++){
        const w = Math.random()*2-1;
        let v;
        if(kind==='brown'){ last = (last + 0.02*w)/1.02; v = last; }
        else {
          b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.969*b2+w*0.153852;
          b3=0.8665*b3+w*0.3104856; b4=0.55*b4+w*0.5329522; b5=-0.7616*b5-w*0.016898;
          v=b0+b1+b2+b3+b4+b5+b6+w*0.5362; b6=w*0.115926;
        }
        d[i]=v; if(Math.abs(v)>peak) peak=Math.abs(v);
      }
      // crossfade the ends so the loop point is seamless
      const xf = Math.floor(ac.sampleRate*0.25);
      for(let i=0;i<xf;i++){ const k=i/xf; d[i] = d[i]*k + d[n-xf+i]*(1-k); }
      for(let i=0;i<n;i++) d[i] /= peak;
      return buf;
    }
    // the cicadas' chorus, level 0..1. Schedules each singer's pulses a
    // little ahead: bouts of song (5–18 s) with rests between, a gentle
    // crescendo at the start of each bout, slightly uneven timing, and for
    // plebejus a cycle of phrases (single, double, long pulses)
    const CIC_AHEAD = 0.3;
    function cicadaPulse(env, t, len, a){
      const up = Math.min(0.012, len/3), down = Math.min(0.02, len/3);
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(a, t + up);
      env.gain.setValueAtTime(a, t + len - down);
      env.gain.linearRampToValueAtTime(0, t + len);
    }
    function cicadas(level){
      if(!cicadaOut || ac.state!=='running') return;
      const now = ac.currentTime;
      cicadaOut.gain.setTargetAtTime(0.45*level, now, 1.2);        // a background chorus, kept low
      if(level < 0.01){ for(const s of cicadaSingers) s.next = 0; return; }   // silent: nothing to schedule
      for(const s of cicadaSingers){
        if(!s.next || s.next < now) s.next = now + rand(0, 0.6);
        while(s.next < now + CIC_AHEAD){
          const t0 = s.next;
          if(t0 >= s.boutEnd){
            if(s.boutEnd && !s.resting){                                       // bout over: a rest
              s.resting = true; s.next = t0 + rand(1.5, 7);
              if(s.bed) s.bed.gain.setTargetAtTime(0, t0, 0.3);
              continue;
            }
            s.resting = false; s.boutStart = t0; s.boutEnd = t0 + rand(5, 18);  // a new bout
            s.amp = rand(0.45, 1); s.rate = s.orni ? rand(5, 8) : rand(4.5, 7.6);
            s.bp.frequency.setTargetAtTime(s.base*rand(0.96, 1.04), t0, 0.5);
            if(s.bed) s.bed.gain.setTargetAtTime(0.16*s.amp, t0, 0.8);
            s.phrase = 0; s.phraseEnd = t0 + rand(2, 5);
          }
          const a = s.amp*Math.min(1, 0.3 + (t0 - s.boutStart)/1.5);          // crescendo into the bout
          const period = (1/s.rate)*(1 + rand(-0.08, 0.08));
          if(s.orni){
            cicadaPulse(s.env, t0, rand(0.06, 0.1), a);
            s.next = t0 + period;
          } else {
            if(t0 >= s.phraseEnd){ s.phrase = (s.phrase + 1) % 3; s.phraseEnd = t0 + rand(2, 5); }
            if(s.phrase === 0){ cicadaPulse(s.env, t0, 0.05, a); s.next = t0 + period; }                     // single
            else if(s.phrase === 1){ cicadaPulse(s.env, t0, 0.028, a); cicadaPulse(s.env, t0 + 0.06, 0.028, a*0.9); s.next = t0 + period*1.1; }   // double
            else { cicadaPulse(s.env, t0, rand(0.12, 0.16), a); s.next = t0 + period*1.25; }                   // long
          }
        }
      }
    }
    // one raindrop: a soft tick of patter, a short burst of noise at its own
    // pitch (no watery bubbles: those were too much)
    function rainDrop(t, amp){
      let out = rainBus;
      if(ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = rand(-0.75, 0.75); p.connect(rainBus); out = p; }
      const dur = rand(0.008, 0.02);
      const s = ac.createBufferSource(); s.buffer = noise;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1500, 3800); bp.Q.value = 1.2;
      const g = ac.createGain(); g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(out);
      s.start(t, Math.random()*0.9, dur + 0.01);
    }
    // passing under a shower, level 0..1: a soft wash that comes and goes in
    // gusts, and a patter of single drops, sparse at the edge, thick beneath
    function rain(level){
      if(!rainL || ac.state!=='running') return;
      const t0 = ac.currentTime;
      if(t0 > rainGustT){ rainGustT = t0 + rand(0.8, 2.2); rainGust = rand(0.7, 1.1); }
      rainL.g.gain.setTargetAtTime(0.6*level*level*rainGust, t0, 0.9);
      rainL.f.frequency.setTargetAtTime(1500 + 500*level, t0, 1.2);
      if(level < 0.03){ rainNext = 0; return; }
      if(rainNext < t0) rainNext = t0 + 0.02;
      const rate = 4 + 70*level*level;                          // drops per second
      while(rainNext < t0 + 0.12){                              // schedule a little ahead
        rainDrop(rainNext, 0.22*level*rand(0.3, 1));
        rainNext += -Math.log(1 - Math.random())/rate;           // at random, like real rain
      }
    }
    // whirlpool drone level 0..1 (0 = silent); pitch creeps up a touch when close
    function drone(level){
      if(!droneNodes || ac.state!=='running') return;
      const t0 = ac.currentTime;
      droneNodes.out.gain.setTargetAtTime(0.2*level*level, t0, 0.35);
      droneNodes.o1.frequency.setTargetAtTime(46 + 8*level, t0, 0.5);
      droneNodes.o2.frequency.setTargetAtTime(48.3 + 8.6*level, t0, 0.5);
    }
    // a herring gull: a raucous "kyow" with a pitch that jumps up then
    // slides down, repeated a few times; panned to where the bird is
    function gull(pan, vol){
      if(!ac || ac.state!=='running') return;
      const n = 1 + Math.floor(Math.random()*3);
      let t0 = ac.currentTime + 0.02;
      for(let k=0;k<n;k++){
        const len = 0.22 + Math.random()*0.12, f0 = 1150 + Math.random()*250;
        const o = ac.createOscillator(); o.type='sawtooth';
        o.frequency.setValueAtTime(f0*0.8, t0);
        o.frequency.linearRampToValueAtTime(f0*1.25, t0+0.04);
        o.frequency.exponentialRampToValueAtTime(f0*0.62, t0+len);
        const vib = ac.createOscillator(); vib.frequency.value = 28;       // rough, throaty edge
        const vibAmt = ac.createGain(); vibAmt.gain.value = 35;
        vib.connect(vibAmt); vibAmt.connect(o.frequency);
        const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1700; bp.Q.value=1.6;
        const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=600;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0+0.025);
        g.gain.exponentialRampToValueAtTime(vol*0.5, t0+len*0.6);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+len);
        o.connect(bp); bp.connect(hp); hp.connect(g);
        if(ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(master); }
        else g.connect(master);
        o.start(t0); o.stop(t0+len+0.02); vib.start(t0); vib.stop(t0+len+0.02);
        t0 += len + 0.07 + Math.random()*0.12;
        vol *= 0.85;
      }
    }
    // called every frame: slow irregular swells and gusts, plus water
    // noise that follows the boat's speed (sf = 0..1)
    function ambient(dt, sf){
      if(!sea || ac.state!=='running') return;
      const t = ac.currentTime;
      for(const L of sea){                          // waves washing in and out
        L.ph += dt/L.per;
        if(L.ph>=1){ L.ph -= 1; L.per = 6 + Math.random()*4; }
        const sw = 0.5 - 0.5*Math.cos(L.ph*Math.PI*2);
        L.g.gain.setTargetAtTime(0.35 + 0.65*sw*sw, t, 0.3);
        L.f.frequency.setTargetAtTime(220 + 330*sw, t, 0.3);
      }
      rush.ph += dt*0.7;
      const lap = 0.8 + 0.2*Math.sin(rush.ph) * Math.sin(rush.ph*0.37+1);   // gentle, uneven lapping
      rush.g.gain.setTargetAtTime(0.2*Math.pow(sf,1.5)*lap, t, 0.5);
      rush.f.frequency.setTargetAtTime(260 + 240*sf, t, 0.5);

      g.gain.exponentialRampToValueAtTime(0.0001, t+len);
      return g;
    }
    // one soft wooden knock as a spoke passes: a mid-low band of noise

    function tick(vol, pitch){

      const t = ac.currentTime;
      const src = ac.createBufferSource(); src.buffer = noise;
      const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520*pitch; bp.Q.value=1.4;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1300;
      const g = env(0.22*vol, 0.05);
      src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(wheelBus);
      src.start(t, Math.random()*0.9, 0.07);

      const o = ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(230*pitch, t);
      o.frequency.exponentialRampToValueAtTime(160*pitch, t+0.04);
      const og = env(0.12*vol, 0.06);
      o.connect(og); og.connect(wheelBus);
      o.start(t); o.stop(t+0.08);
    }
    // wheel reaching its end stop: a muted, heavier knock
    function thunk(vol){
      if(!ac || ac.state!=='running') return;
      const t = ac.currentTime;
      const src = ac.createBufferSource(); src.buffer = noise;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500;
      const g = env(0.35*vol, 0.12);
      src.connect(lp); lp.connect(g); g.connect(wheelBus);
      src.start(t, Math.random()*0.8, 0.15);
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(95, t+0.1);
      const og = env(0.2*vol, 0.14);
      o.connect(og); og.connect(wheelBus);
      o.start(t); o.stop(t+0.16);
    }
    // rub volume follows the wheel's angular speed
    // the crank's grind, level 0..1 (how fast it's turned), tense 1..1.4 (the spring tightening): it opens at once and
    // shuts quickly when the hand stops, rougher and higher the quicker it goes
    function grind(level, tense){
      if(!grindNodes || ac.state!=='running') return;
      const t = ac.currentTime, on = level > 0.02;
      grindNodes.out.gain.setTargetAtTime(on ? CRANK_GRIND*0.3*Math.min(1, 0.35 + level) : 0, t, on ? 0.012 : 0.05);
      grindNodes.bp.frequency.setTargetAtTime((140 + 110*level)*tense, t, 0.04);
      grindNodes.lfo.frequency.setTargetAtTime(5 + 13*level, t, 0.04);           // ~the sixteen teeth a turn passing
    }
    function wheel(angVel, vol = 1){
      if(!rub || ac.state!=='running') return;
      const t = ac.currentTime;
      const k = Math.min(1, angVel/7);
      rub.out.gain.setTargetAtTime(k<0.05 ? 0 : 0.05*k*vol, t, 0.08);
      rub.lp.frequency.setTargetAtTime(320 + 200*k, t, 0.1);
    }
    // wood hauled aboard: a small splash and a hollow wooden clonk

      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(2600,t);

      src.start(t, Math.random()*0.6, 0.32);
      for(const [f,a,len] of [[310,0.14,0.16],[520,0.07,0.1]]){      // hollow wood: two resonances

        o.frequency.setValueAtTime(f*1.06, t+0.04);

    // an output placed left (-1) … right (+1)
    function panned(pan){

    // a cricket: a short train of high, bright pulses

      if(!ac || ac.state!=='running') return;

    // a howl far off over the water: rises, holds with a wavering voice,

      if(!ac || ac.state!=='running') return;
      const t0 = ac.currentTime + 0.02, f0 = 330 + Math.random()*90, up = f0*(1.55 + Math.random()*0.25);

    // paying at the market: a handful of coins clinking onto the counter

    function coins(){

    // anchor: dropping = a low thud then a splash; weighing = the chain coming in

        // a quick, low thud as the anchor hits the water…

          const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0+0.08); g.gain.setValueAtTime(0.12, t0+n*0.066-0.1); g.gain.exponentialRampToValueAtTime(0.0001, t0+n*0.066+0.05);

        const og = ac.createGain(); og.gain.setValueAtTime(0.0001, end); og.gain.exponentialRampToValueAtTime(0.08, end+0.004); og.gain.exponentialRampToValueAtTime(0.0001, end+0.09);

    // each sound's kind (for SOUND_VOL); the ones played every frame set gains made in init(), routed there
    const KIND = {oar: 'oars', oarCue: 'oars', oarHit: 'oars', rowBed: 'oars', ratchet: 'crank', paddle: 'paddles', springOff: 'paddles',
                  crate: 'crate', tick: 'clicks', thunk: 'clicks', type: 'clicks', hammer: 'clicks', book: 'book', pageTurn: 'book',
                  pickup: 'nets', splash: 'nets', sizzle: 'crash', bell: 'bell', whirl: 'whirl', drone: 'whirl', gull: 'gulls', crash: 'crash',
                  waveBreak: 'waves', waveHit: 'waves', surf: 'waves', townEvent: 'town', chatter: 'town', cricket: 'night', howl: 'night',

  })();

  // ---------- Ship's wheel ----------
  // The wheel self-centres when released (see update). Wheel angle maps linearly
  // to rudder: ±WHEEL_MAX (1.25 turns) = full rudder. Clockwise = starboard.
  const WHEEL_KEY_RATE = Math.PI*1.1;          // rad/s when using arrow keys
  let wheelAngle = 0;
  const wheelCv = document.getElementById('wheel');
  const wctx = wheelCv.getContext('2d');
  const WH_S = 1.3;                                        // the wheel is drawn 30% up
  const WH_W = 221, WH_H = 242, WH_CX = 110.5, WH_CY = 131;
  // the wheel is drawn in greys into a small low-res canvas (one pixel per
  // game pixel), then dithered to the game's two colours and blown up with
  // hard pixels, so it has the same lo-fi look as the world
  // interface colours: #ebe7dc paper, #1b1a17 ink, tinted halfway toward the
  // day/night palette (see uiPalette in Day and night)
  let UI_PAPER32 = (255<<24)|(0xdc<<16)|(0xe7<<8)|0xeb, UI_INK32 = (255<<24)|(0x17<<16)|(0x1a<<8)|0x1b;
  const wlo = document.createElement('canvas'); wlo.width = WH_W; wlo.height = WH_H;
  const wl = wlo.getContext('2d', {willReadFrequently:true});
  function sizeWheel(){
    const k = Math.max(1, Math.round((window.devicePixelRatio||1)));
    wheelCv.width = WH_W*k; wheelCv.height = WH_H*k;
    wctx.setTransform(1,0,0,1,0,0);
    wctx.imageSmoothingEnabled = false;
  }
  sizeWheel();
  window.addEventListener('resize', ()=>{ sizeWheel(); wheelKey = ''; });   // resizing clears the canvas: draw it again

  let wheelPointer = null, wheelLast = 0;
  const HUB_R = 21;                        // hub radius (unscaled); how long to hold it: HUB_HOLD (Tuning)
  const HUB_SAIL_R = 16.5;                  // the hub's grip while sailing (it's drawn big now: keep the wheel around it to steer)
  let hubHold = null, hubShake = 0, bankHint = false, wheelVis = 1, hubScale = 2;
  const stowed = ()=> anchored && weighT <= 0;             // at anchor the wheel itself is locked
  function wheelLocal(ev){
    const r = wheelCv.getBoundingClientRect();
    return [(ev.clientX-r.left)*(WH_W/r.width) - WH_CX, (ev.clientY-r.top)*(WH_H/r.height) - WH_CY];
  }
  wheelCv.addEventListener('pointerdown', ev=>{
    const [x,y] = wheelLocal(ev);
    const onHub = Math.hypot(x,y) < (stowed() ? HUB_R : HUB_SAIL_R)*WH_S*hubScale;   // sailing: just the hub, so the spokes still steer
    if(Math.hypot(x,y) > 84*WH_S) return;      // outside the handles
    if(stowed() && !onHub) return;             // at anchor only the hub works
    ev.preventDefault();
    wheelPointer = ev.pointerId;
    wheelCv.setPointerCapture(ev.pointerId);
    wheelCv.classList.add('grabbed');
    wheelLast = Math.atan2(y,x);
    if(onHub) hubHold = {t0: performance.now(), x, y, done:false};   // pressing the hub
    Sfx.init();
  });
  wheelCv.addEventListener('pointermove', ev=>{
    if(ev.pointerId!==wheelPointer) return;
    ev.preventDefault();
    const [x,y] = wheelLocal(ev);
    const a = Math.atan2(y,x);
    if(hubHold && Math.hypot(x-hubHold.x, y-hubHold.y) > 9) hubHold = null;   // it's a turn of the wheel, not a press
    if(stowed()) return;                                       // anchored: the wheel doesn't turn
    if(Math.hypot(x,y) < 14*WH_S){ wheelLast = a; return; } // too close to the hub: angle unreliable
    const d = norm(a - wheelLast);
    wheelAngle = Math.max(-WHEEL_MAX, Math.min(WHEEL_MAX, wheelAngle + d));
    wheelLast = a;
  });
  const wheelRelease = ev=>{
    if(ev.pointerId!==wheelPointer) return;
    wheelPointer = null; hubHold = null;
    wheelCv.classList.remove('grabbed');
  };
  wheelCv.addEventListener('pointerup', wheelRelease);
  wheelCv.addEventListener('pointercancel', wheelRelease);

  // compass: the needle always points home, the short way round the world
  const cmp = document.getElementById('compass');
  document.getElementById('cmp-slot').appendChild(cmp);                 // (it lives in the logbook now)
  const cmpCtx = cmp.getContext('2d');
  // the compass is drawn like the wheel: in greys into a low-res canvas (one
  // pixel per CSS pixel), then dithered to the two interface colours, so it
  // has the same textured, 1-bit look; the drawing itself is in 72 units
  const CMP_PX = 95, CMP_K = CMP_PX/72;           // (95 px: 1.25 × the old 76)
  const cmpLo = document.createElement('canvas'); cmpLo.width = CMP_PX; cmpLo.height = CMP_PX;
  const cmpL = cmpLo.getContext('2d', {willReadFrequently:true});
  (function(){ const k = Math.max(1, Math.round(window.devicePixelRatio||1)); cmp.width = CMP_PX*k; cmp.height = CMP_PX*k; cmpCtx.imageSmoothingEnabled = false; })();
  // village dots on the rim: N, E, S, W (screen up is north); pop when filled
  const DOT_ANG = VILLAGES.map(v=> Math.atan2(v.uy, v.ux));   // where each village's dot sits on the rim
  const dotState = VILLAGES.map(()=> false), dotPop = VILLAGES.map(()=> 0);
  let cmpWander = 0;
  // the lid: a hinged brass cover, like a pocket compass. The voyage starts
  // with it shut; a tap swings it up on its hinge (top). Once it's open, a
  // tap turns the face over, like a card, between the compass and a 24-hour
  // watch (one hand, 0 at the top, a mark on WATCH_MARK), and back again
  let lidOpen = true, lidT = 0, lidLastT = performance.now();   // lidT: 1 shut, 0 open (the lid is gone for now: always open)
  let watchOn = false, watchT = 0;                                // watchT: 0 compass, 1 watch (eased: the turn)
  function toggleLid(){
    if(!lidOpen){
      lidOpen = true; Sfx.tick(0.6, 1.3); buzz([8,30,6]);
      if(tut === 'compass') tutNext('anchor');                            // tutorial: opened it, on to the anchor
    } else {
      watchOn = !watchOn; Sfx.tick(0.45, watchOn ? 1.6 : 1.1); buzz([6,25,6]);
    }
  }
  const watchHour = ()=> ((DAWN_HOUR + dayT*24) % 24 + 24) % 24;
  cmp.addEventListener('click', ()=>{ Sfx.init(); toggleLid(); });
  cmp.addEventListener('keydown', e=>{ if((e.key==='Enter' || e.key===' ') && !e.repeat){ e.preventDefault(); e.stopPropagation(); toggleLid(); } });
  let cmpKey = '';
  function drawCompass(){
    {
      const dx = wdx(START.x, boat.x), dy = wdy(START.y, boat.y);
      const seam = Math.min(WORLD.w/2 - Math.abs(dx), WORLD.h/2 - Math.abs(dy));
      const busy = Math.abs(lidT - (lidOpen ? 0 : 1)) > 0.002 || Math.abs(watchT - (watchOn ? 1 : 0)) > 0.002
        || dotPop.some(p=> p > 0) || VILLAGES.some((v,i)=> v.done !== dotState[i])
        || (lidT < 0.98 && !watchOn && seam < 600 && (frameNo & 1));    // near the seam the needle trembles (redrawn every other frame)
      const key = (lidT >= 0.98 ? 'shut' : watchOn ? 'w' + Math.round(watchHour()*30)               // the hour hand moves in 2-minute steps
                  : Math.round(Math.atan2(dy, dx)*120) + '|' + (Math.hypot(dx, dy) < 140)) + '|' + uiPalKey;
      if(!busy && key === cmpKey){ lidLastT = performance.now(); return; }
      cmpKey = key;
    }
    const c = cmpL, INKW='#000', PAPW='#fff', g = v=> 'rgb('+v+','+v+','+v+')';
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,CMP_PX,CMP_PX);
    c.setTransform(CMP_K,0,0,CMP_K,0,0);
    const cx=36, cy=36;
    // drop shadow, then a brass bezel: mid-grey, lit from the top left, ink rims
    c.fillStyle=g(60); c.beginPath(); c.arc(cx+1.4,cy+2,33.2,0,Math.PI*2); c.fill();
    c.fillStyle=g(165); c.beginPath(); c.arc(cx,cy,33,0,Math.PI*2); c.fill();
    c.strokeStyle=g(215); c.lineWidth=2.4; c.beginPath(); c.arc(cx,cy,30.6,Math.PI*0.75,Math.PI*1.75); c.stroke();   // lit edge
    c.strokeStyle=g(115); c.beginPath(); c.arc(cx,cy,30.6,-Math.PI*0.25,Math.PI*0.75); c.stroke();                   // shaded edge
    c.strokeStyle=INKW; c.lineWidth=1.6; c.beginPath(); c.arc(cx,cy,33,0,Math.PI*2); c.stroke();
    for(let k=0;k<8;k++){                                    // rivets between the village dots
      const a = (k+0.5)*Math.PI/4, x = cx+Math.cos(a)*30.6, y = cy+Math.sin(a)*30.6;
      c.fillStyle=INKW; c.beginPath(); c.arc(x,y,1.25,0,Math.PI*2); c.fill();
      c.fillStyle=PAPW; c.beginPath(); c.arc(x-0.4,y-0.4,0.45,0,Math.PI*2); c.fill();
    }
    // the face turns over like a card between the compass and the watch:
    // squeezed sideways to nothing, then the other side opens out
    const nowF = performance.now(), dtF = Math.min(0.05, (nowF - lidLastT)/1000);
    watchT += ((watchOn ? 1 : 0) - watchT)*Math.min(1, dtF*7);
    const showWatch = watchT > 0.5, sqz = Math.max(0.04, Math.abs(Math.cos(watchT*Math.PI)));
    c.save(); c.translate(cx, cy); c.scale(sqz, 1); c.translate(-cx, -cy);
    // the face: paper, a touch darker toward the rim, a faint wind rose
    const fg = c.createRadialGradient(cx-4,cy-5,2,cx,cy,27.5);
    fg.addColorStop(0,PAPW); fg.addColorStop(0.75,g(246)); fg.addColorStop(1,g(212));
    c.fillStyle=fg; c.beginPath(); c.arc(cx,cy,27.5,0,Math.PI*2); c.fill();
    c.strokeStyle=INKW; c.lineWidth=1.5; c.stroke();
    if(showWatch) drawWatchFace(c, cx, cy, INKW, PAPW, g);
    else {
    c.fillStyle=g(222);
    for(let k=0;k<8;k++){ const a = k*Math.PI/4, L = k%2 ? 13 : 20, w = k%2 ? 2.2 : 3;
      c.beginPath(); c.moveTo(cx+Math.cos(a)*L, cy+Math.sin(a)*L); c.lineTo(cx+Math.cos(a+Math.PI/2)*w, cy+Math.sin(a+Math.PI/2)*w);
      c.lineTo(cx+Math.cos(a-Math.PI/2)*w, cy+Math.sin(a-Math.PI/2)*w); c.closePath(); c.fill(); }
    c.strokeStyle=INKW; c.lineWidth=1; c.beginPath(); c.arc(cx,cy,23,0,Math.PI*2); c.stroke();
    for(let k=0;k<16;k++){                               // tick marks (cardinals carry the dots)
      if(k%4===0) continue;
      const a = k*Math.PI/8, r0 = k%2 ? 21 : 19;
      c.lineWidth = k%4 ? 1 : 1.6;
      c.beginPath(); c.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0); c.lineTo(cx+Math.cos(a)*23, cy+Math.sin(a)*23); c.stroke();
    }
    }
    // one dot per village, empty until visited, then filled (with a little pop)
    let changed = false;
    for(let i=0;i<VILLAGES.length;i++){
      const done = VILLAGES[i].done;
      if(done!==dotState[i]){ dotState[i]=done; changed=true; if(done) dotPop[i]=1; }
      dotPop[i] = Math.max(0, dotPop[i]-0.03);
      if(showWatch) continue;                              // (the watch has its own mark on the rim)
      const r = 4.2*(1 + 0.6*Math.sin(dotPop[i]*Math.PI));
      const x = cx+Math.cos(DOT_ANG[i])*30.4, y = cy+Math.sin(DOT_ANG[i])*30.4;
      c.fillStyle = PAPW; c.beginPath(); c.arc(x,y,r+1.6,0,Math.PI*2); c.fill();   // paper halo: reads on dark fog
      c.fillStyle = done ? INKW : PAPW; c.strokeStyle = INKW; c.lineWidth = 1.8;
      c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.stroke();
    }
    if(changed){
      const got = VILLAGES.filter(v=>v.done).map(v=>v.name);
      cmp.setAttribute('aria-label', 'Compass: points home. Ports visited: ' + (got.length ? got.join(', ') : 'none'));
    }
    const dx = wdx(START.x, boat.x), dy = wdy(START.y, boat.y), d = Math.hypot(dx,dy);
    if(showWatch){}                                      // (the watch's hand is drawn with its face)
    else if(d < 140){                                    // at home: just the house
      drawCompassHouse(c, cx, cy, 1.3, INKW, PAPW);
    } else {
      // near the edge of the world (the seam where it wraps round, the far
      // side from home) the needle trembles a little and drifts, unsure;
      // it settles again once you're through
      const seam = Math.min(WORLD.w/2 - Math.abs(dx), WORLD.h/2 - Math.abs(dy));
      const m = Math.max(0, Math.min(1, 1 - seam/600)), mm = m*m;
      const tt = performance.now()/1000;
      cmpWander += (Math.random()-0.5)*0.05*mm; cmpWander *= 0.985;
      const a = Math.atan2(dy,dx)
        + mm*(Math.sin(tt*17)*0.06 + Math.sin(tt*0.9)*1.1 + Math.sin(tt*1.7+1)*0.5 + cmpWander);   // a slight tremble, a slow uncertain drift
      const jx = m*Math.sin(tt*29)*0.4, jy = m*Math.cos(tt*31)*0.4;
      c.save(); c.translate(cx+jx,cy+jy); c.rotate(a);
      c.fillStyle=g(70); c.beginPath(); c.moveTo(14,1.2); c.lineTo(-2,-3.8); c.lineTo(-2,6.2); c.closePath(); c.fill();   // its shadow on the card
      c.fillStyle=INKW;                                    // needle toward home: dark, with a lit half
      c.beginPath(); c.moveTo(13,0); c.lineTo(-3,-5); c.lineTo(-3,5); c.closePath(); c.fill();
      c.fillStyle=g(120); c.beginPath(); c.moveTo(13,0); c.lineTo(-3,-5); c.lineTo(-3,0); c.closePath(); c.fill();
      c.fillStyle=PAPW; c.strokeStyle=INKW; c.lineWidth=1.2;  // tail
      c.beginPath(); c.moveTo(-3,-5); c.lineTo(-15,0); c.lineTo(-3,5); c.closePath(); c.fill(); c.stroke();
      c.restore();
      c.fillStyle=INKW; c.beginPath(); c.arc(cx,cy,3.2,0,Math.PI*2); c.fill();      // the pivot: an ink cap with a bright pin
      c.fillStyle=g(200); c.beginPath(); c.arc(cx,cy,1.6,0,Math.PI*2); c.fill();
      // little house riding on the rim, in the direction of home
      if(m < 0.35) drawCompassHouse(c, cx+Math.cos(a)*19, cy+Math.sin(a)*19, 0.7, INKW, PAPW);
    }
    c.restore();                                         // (end of the turning face)
    // the glass: a soft glare across the top left
    c.strokeStyle='rgba(255,255,255,0.75)'; c.lineWidth=2.2; c.lineCap='round';
    c.beginPath(); c.arc(cx,cy,24.5,Math.PI*1.08,Math.PI*1.38); c.stroke();
    c.lineWidth=1.2; c.beginPath(); c.arc(cx,cy,24.5,Math.PI*1.45,Math.PI*1.52); c.stroke();
    c.lineCap='butt';
    // the lid, swinging on its hinge at the top: foreshortened as it lifts
    {
      const now = performance.now(), dt = Math.min(0.05, (now - lidLastT)/1000); lidLastT = now;
      lidT += ((lidOpen ? 0 : 1) - lidT)*Math.min(1, dt*9);
      if(lidT > 0.02){
        c.save(); c.translate(cx, cy-33); c.scale(1, lidT); c.translate(0, 33);
        const lg = c.createLinearGradient(-33, -33, 33, 33);
        lg.addColorStop(0, g(250)); lg.addColorStop(0.5, g(212)); lg.addColorStop(1, g(150));   // brass, lit from the top left
        c.fillStyle = lg; c.beginPath(); c.arc(0,0,33.4,0,Math.PI*2); c.fill();
        c.strokeStyle = INKW; c.lineWidth = 1.6; c.stroke();
        c.strokeStyle = INKW; c.lineWidth = 1; c.beginPath(); c.arc(0,0,27.5,0,Math.PI*2); c.stroke();   // an engraved border
        c.strokeStyle = g(225); c.lineWidth = 0.8; c.beginPath(); c.arc(0,0,26.3,0,Math.PI*2); c.stroke();
        c.strokeStyle = INKW; c.lineWidth = 0.7;                             // two fine engraved rings
        for(const r of [13, 20]){ c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.stroke(); }
        c.fillStyle = g(240); c.strokeStyle = INKW; c.lineWidth = 0.9;      // a small engraved star
        c.beginPath(); for(let k=0;k<8;k++){ const a = k*Math.PI/4 - Math.PI/2, r = k%2 ? 2.4 : 7.5; c.lineTo(Math.cos(a)*r, Math.sin(a)*r); } c.closePath(); c.fill(); c.stroke();
        c.fillStyle = g(205); c.lineWidth = 1.1;                              // the catch
        c.beginPath(); c.roundRect(-4, 30.5, 8, 4, 1.5); c.fill(); c.stroke();
        c.restore();
      }
      if(lidT > 0.02){ c.fillStyle = g(195); c.strokeStyle = INKW; c.lineWidth = 1.1;   // the hinge (only with a lid)
        c.beginPath(); c.roundRect(cx-6, 0.8, 12, 4.4, 1.6); c.fill(); c.stroke(); }
    }
    c.setTransform(1,0,0,1,0,0);
    ditherUI(c, CMP_PX, CMP_PX);
    cmpCtx.clearRect(0,0,cmp.width,cmp.height);
    cmpCtx.drawImage(cmpLo, 0, 0, cmp.width, cmp.height);
  }
  // the watch: a 24-hour dial, 0 at the top; a tick for every hour, longer
  // every three, numbers every six; a mark on the rim at WATCH_MARK; one hand
  function drawWatchFace(c, cx, cy, INKW, PAPW, g){
    c.strokeStyle = INKW; c.lineWidth = 1; c.beginPath(); c.arc(cx,cy,23,0,Math.PI*2); c.stroke();
    const ang = h=> h/24*Math.PI*2 - Math.PI/2;
    for(let h=0; h<24; h++){
      const a = ang(h), r0 = h%6 === 0 ? 17.5 : h%3 === 0 ? 19 : 20.5;
      c.lineWidth = h%3 === 0 ? 1.6 : 1;
      c.beginPath(); c.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0); c.lineTo(cx+Math.cos(a)*23, cy+Math.sin(a)*23); c.stroke();
    }
    c.fillStyle = INKW; c.font = 'bold 8.5px Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    for(const h of [0, 6, 12, 18]){ const a = ang(h); c.fillText(String(h), cx+Math.cos(a)*11.5, cy+Math.sin(a)*11.5 + 0.5); }
    { // the mark on the rim, like the ports' dots on the compass, with a pointer in to its hour
      const a = ang(WATCH_MARK), x = cx+Math.cos(a)*30.4, y = cy+Math.sin(a)*30.4;
      c.fillStyle = PAPW; c.beginPath(); c.arc(x,y,5.4,0,Math.PI*2); c.fill();
      c.fillStyle = INKW; c.strokeStyle = INKW; c.lineWidth = 1.8; c.beginPath(); c.arc(x,y,3.8,0,Math.PI*2); c.fill(); c.stroke();
      c.lineWidth = 2.4; c.beginPath(); c.moveTo(cx+Math.cos(a)*16.5, cy+Math.sin(a)*16.5); c.lineTo(cx+Math.cos(a)*23, cy+Math.sin(a)*23); c.stroke();
    }
    // the hand: dark, with a lit half and a short paper tail, like the needle
    const a = ang(watchHour());
    c.save(); c.translate(cx, cy); c.rotate(a);
    c.fillStyle=g(70); c.beginPath(); c.moveTo(19,1.2); c.lineTo(-2,-2.8); c.lineTo(-2,5.2); c.closePath(); c.fill();
    c.fillStyle=INKW; c.beginPath(); c.moveTo(18,0); c.lineTo(-3,-3.6); c.lineTo(-3,3.6); c.closePath(); c.fill();
    c.fillStyle=g(120); c.beginPath(); c.moveTo(18,0); c.lineTo(-3,-3.6); c.lineTo(-3,0); c.closePath(); c.fill();
    c.fillStyle=PAPW; c.strokeStyle=INKW; c.lineWidth=1.1;
    c.beginPath(); c.moveTo(-3,-3.6); c.lineTo(-9,0); c.lineTo(-3,3.6); c.closePath(); c.fill(); c.stroke();
    c.restore();
    c.fillStyle=INKW; c.beginPath(); c.arc(cx,cy,3.2,0,Math.PI*2); c.fill();
    c.fillStyle=g(200); c.beginPath(); c.arc(cx,cy,1.6,0,Math.PI*2); c.fill();
  }
  function drawCompassHouse(c, x, y, s, INKW, PAPW){
    c.save(); c.translate(x,y); c.scale(s,s);
    c.fillStyle=PAPW; c.beginPath(); c.arc(0,0,7.5,0,Math.PI*2); c.fill();
    c.strokeStyle=INKW; c.lineWidth=1.4; c.stroke();
    c.fillStyle=INKW;
    c.beginPath(); c.moveTo(-5,-0.5); c.lineTo(0,-5); c.lineTo(5,-0.5); c.closePath(); c.fill();
    c.fillRect(-3.5,-0.5,7,4.5);
    c.fillStyle=PAPW; c.fillRect(-1,1.5,2,3);
    c.restore();
  }

  let wheelKey = '';
  function drawWheel(){
    const c = wl, INKW='#000', PAPW='#fff';
    // the wood is a mid grey (dithered to a dotted tone), so the wheel stands out from the pale sea
    const WOOD = 'rgb(172,172,172)', WOOD_SH = 'rgb(122,122,122)', WOOD_RIM = 'rgb(160,160,160)';
    c.clearRect(0,0,WH_W,WH_H);

    // at anchor the wheel is put away: it fades out
    // and only the hub stays, to weigh anchor or switch sail
    wheelVis += ((stowed() ? 0 : 1) - wheelVis) * 0.15;
    // skip the redraw (and its dither) while nothing on it moves: same angle,
    // same state, no animation running (a hold, a shake, the bank ring, a tutorial hint)
    {
      const busy = hubHold || hubShake > 0 || bankHint || Math.abs(wheelVis - (stowed() ? 0 : 1)) > 0.002
        || ((tut === 'anchor' || tut === 'drop' || tut === 'wheel') && !tutWait);
      const key = wheelAngle.toFixed(4) + '|' + wheelVis.toFixed(3) + '|' + anchored + '|' + bankHint + '|' + !!hubHold + '|' + uiPalKey;   // (a let-go hold must clear its ring)
      if(!busy && key === wheelKey) return;
      wheelKey = key;
    }
    c.globalAlpha = wheelVis;
    // wheel: ink woodcut look; every part has an ink outline so it reads over any terrain
    c.save();
    c.translate(WH_CX, WH_CY);
    c.scale(WH_S, WH_S);
    c.rotate(wheelAngle);
    // a dark backing inside the rim: the gaps between the spokes are a deep
    // dotted texture, so the light wood (spokes, rim, hub) reads clearly on any sea
    {
      const bg = c.createRadialGradient(0, 0, 14, 0, 0, 50);
      bg.addColorStop(0, 'rgb(70,70,70)'); bg.addColorStop(1, 'rgb(44,44,44)');   // a touch lighter toward the hub
      c.fillStyle = bg; c.beginPath(); c.arc(0, 0, 50, 0, Math.PI*2); c.fill();
    }
    c.lineCap='round'; c.lineJoin='round';
    // a spoke/handle profile along +x, turned like a lathe piece: symmetric
    // outline built from [radius, half-width] stations
    const turned = (st)=>{
      c.beginPath();
      st.forEach(([r,hw],n)=> n ? c.lineTo(r,-hw) : c.moveTo(r,-hw));
      for(let n=st.length-1;n>=0;n--) c.lineTo(st[n][0], st[n][1]);
      c.closePath();
    };
    const HANDLE = [[58,2.2],[61,2.6],[62.5,4.2],[64,2.8],[66,4.6],[69.5,5.4],[72.5,4.4],[74,2.6],[75.5,3.6],[78,3.4],[79.5,1.8]];

      turned(SPOKE); c.stroke();

    }
    // rim: two ink edges, a paper band with wood grain, and brass caps with
    // rivets where each spoke passes through
    c.strokeStyle=INKW; c.lineWidth=12; c.beginPath(); c.arc(0,0,55,0,Math.PI*2); c.stroke();
    c.strokeStyle=WOOD_RIM; c.lineWidth=8.6; c.beginPath(); c.arc(0,0,55,0,Math.PI*2); c.stroke();
    c.save(); c.rotate(-wheelAngle);                          // light from top-left: rim darker bottom-right
    c.strokeStyle='rgba(0,0,0,0.18)'; c.lineWidth=8.6; c.beginPath(); c.arc(0,0,55,-0.15*Math.PI,0.85*Math.PI); c.stroke();
    c.restore();
    c.strokeStyle=INKW; c.lineWidth=0.8;

      const a0 = g*0.63 + (g%3)*0.07, rr = 53.5 + (g%2)*2.5, len = 0.22 + (g%3)*0.06;

      c.fillStyle=PAPW; c.fillRect(51.4,-2.4,7.2,4.8);

    c.fillStyle=WOOD_SH; c.beginPath(); c.arc(0,0,13,0,Math.PI*2); c.fill();
    c.fillStyle=INKW; c.beginPath(); c.arc(0,0,9.5,0,Math.PI*2); c.fill();
    for(let k=0;k<8;k++){ const a=k*Math.PI/4; c.fillStyle=INKW; c.beginPath(); c.arc(Math.cos(a)*11.3,Math.sin(a)*11.3,1.1,0,Math.PI*2); c.fill(); }
    c.fillStyle=PAPW; c.beginPath(); c.arc(0,0,4.8,0,Math.PI*2); c.fill();
    c.strokeStyle=INKW; c.lineWidth=1.2; c.beginPath(); c.arc(0,0,2.4,0,Math.PI*2); c.stroke();
    c.beginPath(); c.moveTo(-2.4,0); c.lineTo(2.4,0); c.stroke();
    c.restore();    c.globalAlpha = 1;                                     // the hub is always drawn solid
    // the hub is the anchor button: a half-second press drops or weighs the
    // anchor (a ring fills while it's held, then a little shake)
    if(hubHold && !hubHold.done && performance.now() - hubHold.t0 >= HUB_HOLD){
      hubHold.done = true; hubShake = 1;
      setAnchor(!(anchored && weighT <= 0));
    }
    hubShake = Math.max(0, hubShake - 0.06);
    {
      const jx = hubShake ? Math.sin(performance.now()*0.09)*2.2*hubShake : 0;
      // the hub is always the big size (the one it used to grow to only at
      // anchor): with the wheel away it turns dark, a dotted ink knob
      hubScale = 2;
      const inv = wheelVis < 0.5, HI = inv ? PAPW : INKW;
      c.save(); c.translate(WH_CX + jx, WH_CY); c.scale(WH_S*hubScale, WH_S*hubScale);
      // the knob is shaded in greys (dithered like the rest of the UI): dark at
      // anchor, a light, slightly shaded face while sailing (a bit bigger then)
      // drawn like the compass: a brass bezel (lit from the top left) with
      // four rivets, round a shaded face, and a glint of glass; the face is
      // light while sailing, dark at anchor
      const HR = 15, FR = HR - 3.2;
      const bz = c.createLinearGradient(-HR, -HR, HR, HR);
      bz.addColorStop(0, 'rgb(245,245,245)'); bz.addColorStop(0.5, 'rgb(200,200,200)'); bz.addColorStop(1, 'rgb(140,140,140)');
      c.fillStyle = bz; c.strokeStyle = INKW; c.lineWidth = 1.6;
      c.beginPath(); c.arc(0,0,HR,0,Math.PI*2); c.fill(); c.stroke();
      for(let k=0;k<4;k++){                                                // rivets
        const a = Math.PI/4 + k*Math.PI/2, rx = Math.cos(a)*(HR-1.6), ry = Math.sin(a)*(HR-1.6);
        c.fillStyle = INKW; c.beginPath(); c.arc(rx, ry, 1.05, 0, Math.PI*2); c.fill();
        c.fillStyle = PAPW; c.fillRect(rx-0.6, ry-0.6, 0.6, 0.6);
      }
      const fg = c.createRadialGradient(-FR*0.35, -FR*0.35, 1, 0, 0, FR);
      if(inv){ fg.addColorStop(0, 'rgb(100,100,100)'); fg.addColorStop(1, 'rgb(28,28,28)'); }
      else { fg.addColorStop(0, PAPW); fg.addColorStop(0.6, 'rgb(236,236,236)'); fg.addColorStop(1, 'rgb(182,182,182)'); }
      c.fillStyle = fg; c.strokeStyle = INKW; c.lineWidth = 1;
      c.beginPath(); c.arc(0,0,FR,0,Math.PI*2); c.fill(); c.stroke();
      c.strokeStyle = PAPW; c.lineWidth = 1.1;                              // a glint on the glass
      c.beginPath(); c.arc(0,0,FR-1.6,Math.PI*1.08,Math.PI*1.38); c.stroke();
      if(inv){ c.strokeStyle=PAPW; c.lineWidth=1.3; c.beginPath(); c.arc(0,0,HR+1.4,0,Math.PI*2); c.stroke(); }   // one light rim, so the dark knob reads on dark water
      const ring = (r, a0, a1, lw, dash)=>{                // an ink ring with a paper halo, readable anywhere
        c.save(); if(dash) c.setLineDash(dash);
        c.strokeStyle=PAPW; c.lineWidth=lw+2; c.beginPath(); c.arc(0,0,r,a0,a1); c.stroke();
        c.strokeStyle=INKW; c.lineWidth=lw;   c.beginPath(); c.arc(0,0,r,a0,a1); c.stroke();
        c.restore();
      };
      if(bankHint){ c.save(); c.rotate(performance.now()*0.002); ring(HR + 4, 0, Math.PI*2, 1.6, [3,3]); c.restore(); }   // over a fish bank
      if(hubHold && !hubHold.done){
        const k = Math.min(1, (performance.now()-hubHold.t0)/HUB_HOLD);

      }
      c.strokeStyle = HI; c.fillStyle = HI;
      c.lineCap='round';

      // anchor. Over a fish bank it turns into a little fish for a while, to

      c.save(); c.scale(1.2, 1.2);

        c.beginPath(); c.moveTo(3.4, 0); c.lineTo(8.8, -4.4); c.lineTo(7.6, 0); c.lineTo(8.8, 4.4); c.closePath(); c.fill();          // tail
        c.fillStyle = inv ? INKW : PAPW; c.beginPath(); c.arc(-3.9, -1, 1.15, 0, Math.PI*2); c.fill();                              // eye

      } else {

        c.beginPath(); c.moveTo(0,-5); c.lineTo(0,7.5); c.moveTo(-4.5,-2.2); c.lineTo(4.5,-2.2); c.stroke();
        c.beginPath(); c.moveTo(-6.5,2.5); c.quadraticCurveTo(-5,7.5,0,7.5); c.quadraticCurveTo(5,7.5,6.5,2.5); c.stroke();
      }
      c.restore();
      c.restore();
    }
    drawTutorialHints(c);
    ditherUI(c, WH_W, WH_H);

    wctx.drawImage(wlo, 0, 0, wheelCv.width, wheelCv.height);

  // 1-bit: ordered dither of a UI canvas to the interface palette; transparent outside
  function ditherUI(c, W, H){
    const im = c.getImageData(0,0,W,H), dd = im.data, o32 = new Uint32Array(dd.buffer);
    for(let y=0, p=0; y<H; y++){
      const row = (y&3)*4;
      for(let x=0; x<W; x++, p++){
        const q = p<<2;
        if(dd[q+3] < 110){ o32[p] = 0; continue; }
        const lum = dd[q] * dd[q+3]/255 + 255*(1-dd[q+3]/255);   // alpha edges blend toward paper
        o32[p] = lum > BAYER[row + (x&3)] ? UI_PAPER32 : UI_INK32;
      }
    }
    c.putImageData(im,0,0);
  }


  // anchor: drops and holds the boat where it is; press again to weigh it

  // only when it's aboard does the boat get under way again
  let weighT = 0;                                      // (WEIGH_TIME in Tuning)
  function anchorUI(){ renderSailBtn(); }            // the hub of the wheel shows the state
  function setAnchor(on, instant){
    if(talk && !instant) return;                                          // someone's talking to you: stay put
    if(tut === 'drop') tutSet('done');                                    // tutorial: they found it
    // at the quay with the text still running: the first press just finishes it
    if(!on && moor && moor.phase==='moored' && dlg && !dlg.ready){
      dlg.shown = dlg.text.length; elDlgText.textContent = dlg.text; dlg.t = Math.max(dlg.t, dlg.pause); dlg.ready = true;
      return;
    }
    if(on){
      if(anchored && weighT <= 0) return;
      weighT = 0; anchored = true; anchorUI();
      Sfx.init(); Sfx.anchor(true); buzz([45,40,20,30,15]);
    } else {
      if(!anchored || weighT > 0) return;
      if(instant){ anchored = false; anchorUI(); return; }

  function updateAnchor(dt){

  // sail: full → medium → minimum. At minimum the sail is all but furled

  function renderSailBtn(){

  // a switch: full sail ↔ minimum
  function cycleSail(){

  }

  // ---------- Sail switch ----------
  // A vertical switch, iPhone style, bottom right (as tall as the compass and
  // the logbook together): the thumb is the sail badge. Slide it up to set the
  // sail, down to furl it (a tap toggles too); let go past the middle and the
  // sail switches with a clack and a buzz, otherwise it springs back. The
  // track is drawn in greys and dithered like the other controls (light with
  // the sail set, dark when furled); the badge is pure ink and paper with a

  const sbctx = sailCv.getContext('2d');
  const SW = 76, SH = 160;                      // CSS px (see #sail)
  const TR = 33, TX = SW/2, TOP_Y = 5 + TR, BOT_Y = SH - 5 - TR;   // track radius, thumb centre x, its two stops
  const BADGE_S = 1.75;                         // the badge drawing (38 units across) scaled into the thumb

  const tlo = document.createElement('canvas'); tlo.width = SW; tlo.height = SH;
  const tl = tlo.getContext('2d', {willReadFrequently:true});

  let thumbDrag = null;                            // {ptr, y0, p0, moved, half}
  function sizeSail(){
    const k = Math.max(1, Math.round(window.devicePixelRatio||1));

  }
  sizeSail();
  window.addEventListener('resize', ()=>{ sizeSail(); sailKey = ''; });
  function switchSail(){
    cycleSail(); Sfx.thunk(0.55); buzz([28,40,14]); sailFlash = 1;
    if(tut === 'rope') tutNext('anchor');                                   // tutorial: now weigh anchor
  }
  const sailUp = ()=> sailLevel !== SAIL_MIN;
  const localY = ev=>{ const r = sailCv.getBoundingClientRect(); return (ev.clientY - r.top)*(SH/r.height); };
  sailCv.addEventListener('pointerdown', ev=>{
    ev.preventDefault(); Sfx.init();
    try{ sailCv.setPointerCapture(ev.pointerId); }catch(e){}
    thumbDrag = {ptr: ev.pointerId, y0: localY(ev), p0: thumbPos, moved: false, half: thumbPos > 0.5};

  });

    const dy = localY(ev) - d.y0;

    thumbPos = Math.max(0, Math.min(1, d.p0 - dy/(BOT_Y - TOP_Y)));
    const half = thumbPos > 0.5;
    if(half !== d.half){ d.half = half; Sfx.tick(0.4, half ? 1.15 : 0.9); buzz(8); }   // a click as it passes the middle
  });

    const d = thumbDrag; if(!d || ev.pointerId !== d.ptr) return;

  sailCv.addEventListener('pointercancel', thumbRelease);
  sailCv.addEventListener('keydown', e=>{ if((e.key==='Enter' || e.key===' ') && !e.repeat){ e.preventDefault(); e.stopPropagation(); switchSail(); } });
  let sailKey = '';
  function drawSail(){
    const now = performance.now(), dt = Math.min(0.05, (now - sailLastT)/1000); sailLastT = now;
    sailFlash = Math.max(0, sailFlash - dt*2.5);
    if(!thumbDrag) thumbPos += ((sailUp() ? 1 : 0) - thumbPos)*Math.min(1, dt*14);   // glides to its stop
    let nudge = 0;                                                          // tutorial: it nudges up, to show it slides
    if(tut === 'rope' && !tutWait && !thumbDrag){ const ph = (now/1600) % 1; nudge = ph < 0.3 ? Math.sin(ph/0.3*Math.PI)*0.14 : 0; }
    const ty = BOT_Y + (TOP_Y - BOT_Y)*Math.min(1, thumbPos + nudge);
    {                                                                       // nothing moving: keep the last picture
      const busy = thumbDrag || sailFlash > 0 || nudge > 0 || Math.abs(thumbPos - (sailUp() ? 1 : 0)) > 0.001;
      const key = sailUp() + '|' + thumbPos.toFixed(3) + '|' + uiPalKey;
      if(!busy && key === sailKey) return;

    // water), light dotted with the sail set, dark when furled, a groove down the middle
    {

      c.fillStyle = PAPW; pill(-1.5); c.fill();
      const v = Math.round(62 + 128*thumbPos);                             // dark (furled) to light (set), following the thumb
      const tg = c.createLinearGradient(0, 5, 0, SH-5);

      c.beginPath(); c.moveTo(TX, TOP_Y); c.lineTo(TX, BOT_Y); c.stroke();

      c.fillStyle = INKW; c.beginPath(); c.arc(0,0,16.5,0,Math.PI*2); c.fill();            // the ink rim
      if(furled){ c.strokeStyle = PAPW; c.lineWidth = 1.1; c.beginPath(); c.arc(0,0,14.6,0,Math.PI*2); c.stroke(); }
      else { c.fillStyle = PAPW; c.beginPath(); c.arc(0,0,14.6,0,Math.PI*2); c.fill(); }
      c.strokeStyle = FG; c.fillStyle = FG;
      c.lineWidth=1.4; c.beginPath(); c.moveTo(0,-10); c.lineTo(0,10); c.stroke();          // mast
      c.lineWidth=1.8; c.beginPath(); c.moveTo(-7,-7); c.lineTo(7,-7); c.stroke();          // yard
      if(furled){                                                                            // furled, over a little wave
        c.beginPath(); c.roundRect(-6.5,-6.6,13,3.6,1.7); c.fill();
        c.lineWidth=1.2; c.beginPath(); c.moveTo(-6.5,7); c.quadraticCurveTo(-3.2,5,0,7); c.quadraticCurveTo(3.2,9,6.5,7); c.stroke();
      } else {                                                                               // full and drawing
        c.beginPath(); c.moveTo(-6,-6.2); c.quadraticCurveTo(0,-4.2,6,-6.2); c.quadraticCurveTo(8.2,0,6,6);
        c.quadraticCurveTo(0,8,-6,6); c.quadraticCurveTo(-8.2,0,-6,-6.2); c.fill();
      }
      c.setTransform(1,0,0,1,0,0);
      const im = c.getImageData(0,0,SW,SH), dd = im.data, o32 = new Uint32Array(dd.buffer);
      for(let p = 0, q = 0; p < o32.length; p++, q += 4) o32[p] = dd[q+3] < 128 ? 0 : dd[q] > 127 ? UI_PAPER32 : UI_INK32;

  renderSailBtn();

  // ---------- Intro ----------
  const intro = document.getElementById('intro');
  // the open scroll: rows of the sheet fade out as they near a roll, as if the paper curved away into it (they stay straight)
  const scrollBody = intro.querySelector('.scroll-body'), CURL_BAND = 42;
  function curlScroll(){
    if(intro.classList.contains('hidden')) return;
    const H = scrollBody.clientHeight, st = scrollBody.scrollTop;
    for(const el of scrollBody.querySelectorAll(':scope > *:not(details), #wg-knobs > *, #wg-dknobs > *, #wg-changes > *, #wg-changes li, #wg-sails > *:not(.sl-sail), .sl-sail > *, #wg-audio > *, .wg-sec > *:not(#wg-knobs):not(#wg-dknobs):not(#wg-changes):not(#wg-sails):not(#wg-audio)')){
      let y = 0; for(let e = el; e && e !== scrollBody; e = e.offsetParent) y += e.offsetTop;   // (a transformed row is its children's offsetParent)
      const top = y - st, bot = H - (top + el.offsetHeight);
      const t = Math.max(0, Math.min(1, (CURL_BAND - Math.min(top, bot))/CURL_BAND));

    }
  }
  scrollBody.addEventListener('scroll', curlScroll, {passive:true});
  addEventListener('resize', curlScroll);
  requestAnimationFrame(()=> requestAnimationFrame(curlScroll));
  document.getElementById('start-btn').addEventListener('click', ()=>{
    buzz([25,50,40]);

    Sfx.init();
    rollIntoScroll();
  });
  // setting sail: the card rolls up into a little scroll, which is tossed
  // down into the list button (where the dinner's list lives from now on)
  function rollIntoScroll(){
    const card = intro.querySelector('.card'), btn = document.getElementById('btn-list');
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce || !card.animate){ intro.classList.add('hidden'); if(tut === 'intro') tutSet('book'); return; }
    intro.style.pointerEvents = 'none';
    // the dotted backdrop fades on its own layer, so the card stays solid while it rolls
    const bg = document.createElement('div'); bg.className = 'intro-bg'; document.body.appendChild(bg);
    intro.classList.add('leaving');
    bg.animate([{opacity:1},{opacity:0}], {duration:500, easing:'ease-out', fill:'forwards'}).onfinish = ()=> bg.remove();
    const r = card.getBoundingClientRect();
    // the roll: the paper disappears upward from the bottom edge into a
    // rolled scroll that climbs to the top of the card
    const roll = document.createElement('div'); roll.className = 'scroll-roll';
    Object.assign(roll.style, {left: r.left+'px', top: (r.bottom-12)+'px', width: r.width+'px'});

  // ---------- Tutorial ----------
  // The first voyage teaches the controls one at a time. Until each step is
  // reached its control is hidden and disabled (keys included):
  //   'intro'  the intro card is up
  //   'book'   the logbook shimmers: open it, then close it
  //   'compass' the compass appears and shimmers, with a word on what it does;
  //            nothing to press: after a few seconds it moves on
  //   'rope'   the sail badge appears and glows: tap it to set the sail
  //   'anchor' the wheel's hub (the anchor) appears and pulses: hold it to weigh
  //   'wheel'  arrows on the wheel show it turns; a few seconds, then 'drop'
  //   'drop'   3 s later the hub pulses again: hold it to drop anchor (optional;
  //            gone after 3 s, or as soon as the anchor goes down), then 'done'
  let tut = 'intro', tutBookSeen = false, tutWheelT0 = 0;
  const TUT_ORDER = ['intro','book','compass','anchor','wheel','drop','done'];
  const tutAt = (stage)=> TUT_ORDER.indexOf(tut) >= TUT_ORDER.indexOf(stage);   // reached this step yet?
  function tutSet(stage){
    if(!TUTORIAL_ON) stage = 'done';                                            // (Tuning: the tutorial is off)
    tut = stage;
    document.body.classList.toggle('tut-no-compass', !tutAt('compass'));
    document.body.classList.toggle('tut-compass', stage === 'compass');
    if(stage === 'compass') setTimeout(()=>{ if(tut === 'compass') tutNext('anchor'); }, TUT_COMPASS_T);   // a look, then on
    if(stage === 'drop') setTimeout(()=>{ if(tut === 'drop') tutSet('done'); }, TUT_DROP_T);   // optional: it fades by itself
    document.body.classList.toggle('tut-no-wheel', !tutAt('anchor'));
    if(stage === 'book'){
      if(bookOpen) tutBookSeen = true;                                          // already open: now just close it
      else elListBtn.classList.add('news');                                     // the logbook shimmers
    }
    if(stage === 'rope' || stage === 'anchor'){ buzz([10,50,10]); }              // something new to touch
    if(stage === 'wheel') tutWheelT0 = performance.now();
  }
  tutSet('intro');
  // a step done: its highlight (bubble, wiggle, rings) goes at once, and the
  // next step is shown after a pause, so the player isn't rushed
  let tutWait = false;
  function tutNext(stage, pause = TUT_PAUSE){
    if(tutWait) return;
    tutWait = true;
    document.body.classList.remove('tut-rope', 'tut-compass');
    setTimeout(()=>{ tutWait = false; tutSet(stage); }, pause);
  }
  // a speech bubble by the control being taught, saying in a few words what
  // it does; it follows the control (placed from its layout box, so the
  // wiggle doesn't shake it) and fades out when the step is done
  const elTip = document.getElementById('tut-tip');
  const TUT_TIPS = TEXT.tutorial;          // (see Texts)
  let tipPos = '';
  function placeTip(){
    const text = tutWait ? null : TUT_TIPS[tut];
    elTip.classList.toggle('show', !!text);
    if(!text) return;
    if(elTip.textContent !== text) elTip.textContent = text;
    // where it points: [x of the tail, top of the target, how to align]
    const box = el=> ({l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight});
    let x, top, align, below = false;
    if(tut === 'book'){ const b = box(elListBtn); x = b.l + b.w/2; top = b.t + 4; align = 'left'; }
    else if(tut === 'compass'){ const b = box(cmp); x = b.l + b.w/2; top = b.t + b.h + 12; align = 'center'; below = true; }   // at the top: the bubble hangs under it
    else if(tut === 'rope'){ const b = box(sailCv); x = b.l + b.w/2; top = b.t + 4; align = 'right'; }
    else {
      const r = wheelCv.getBoundingClientRect(), fr = wrapEl.getBoundingClientRect(), b = {l: r.left - fr.left, t: r.top - fr.top, w: r.width, h: r.height}, hx = b.l + b.w*WH_CX/WH_W;   // (centred with a transform: use its real box)
      x = hx; align = 'center';
      top = tut === 'anchor' ? b.t + b.h*WH_CY/WH_H - 48 : tut === 'drop' ? b.t + b.h*WH_CY/WH_H - 38 : b.t - 2;   // over the hub's rings, or over the wheel
    }
    const vw = viewW(), vh = viewH(), w = elTip.offsetWidth;
    let left = align === 'left' ? x - 30 : align === 'right' ? x - w + 30 : x - w/2;
    left = Math.max(8, Math.min(vw - w - 8, left));
    const bottom = below ? vh - top - elTip.offsetHeight : vh - top + 12;
    const pos = Math.round(left) + '|' + Math.round(bottom) + '|' + Math.round(Math.max(14, Math.min(w - 14, x - left))) + '|' + below;
    if(pos === tipPos) return;                                  // only touch the page when it moves
    tipPos = pos;
    const [pl, pb, pt] = pos.split('|');
    elTip.classList.toggle('below', below);
    elTip.style.left = pl + 'px'; elTip.style.bottom = pb + 'px'; elTip.style.setProperty('--tail', pt + 'px');
  }
  // tutorial hints drawn into the wheel's canvas (before it's dithered):
  // rings pulsing out of the hub when it's time to weigh anchor, then two
  // curved arrows over the wheel that sway, showing it turns both ways
  function drawTutorialHints(c){
    if(tutWait) return;                                  // between steps: nothing to point at
    const INKW = '#000', PAPW = '#fff', now = performance.now();
    if(tut === 'anchor' || tut === 'drop'){
      const base = 15*WH_S*hubScale + 3;
      for(const off of [0, 0.5]){
        const k = (now/1300 + off) % 1, r = base + k*30;
        c.globalAlpha = 1 - k*k;                         // (fades late, so the ring reads among the spokes)
        c.strokeStyle = PAPW; c.lineWidth = 6; c.beginPath(); c.arc(WH_CX, WH_CY, r, 0, Math.PI*2); c.stroke();
        c.strokeStyle = INKW; c.lineWidth = 2.6;   c.beginPath(); c.arc(WH_CX, WH_CY, r, 0, Math.PI*2); c.stroke();
      }
      c.globalAlpha = 1;
    }
    if(tut === 'wheel'){
      const el = now - tutWheelT0;
      if(el > 4500 || Math.abs(wheelAngle) > 0.8){ tutNext('drop', TUT_DROP_WAIT); return; }   // seen it, or already steering: then the (optional) anchor tip
      const R = 88, sway = Math.sin(el/1000*Math.PI*1.2)*0.25;
      c.save(); c.translate(WH_CX, WH_CY); c.globalAlpha = Math.min(1, el/400, (4500 - el)/500);
      c.lineCap = 'round'; c.lineJoin = 'round';
      const arrow = (a0, a1)=>{
        const dir = Math.sign(a1 - a0), lo = Math.min(a0, a1), hi = Math.max(a0, a1);
        const hx = Math.cos(a1)*R, hy = Math.sin(a1)*R, tx = -Math.sin(a1)*dir, ty = Math.cos(a1)*dir, nx = Math.cos(a1), ny = Math.sin(a1);
        const head = (g)=>{ c.beginPath(); c.moveTo(hx + tx*(10+g), hy + ty*(10+g)); c.lineTo(hx + nx*(8+g) - tx*g, hy + ny*(8+g) - ty*g); c.lineTo(hx - nx*(8+g) - tx*g, hy - ny*(8+g) - ty*g); c.closePath(); };
        c.strokeStyle = PAPW; c.lineWidth = 8; c.beginPath(); c.arc(0, 0, R, lo, hi); c.stroke();   // paper halo
        c.fillStyle = PAPW; head(2.5); c.fill();
        c.strokeStyle = INKW; c.lineWidth = 3.5; c.beginPath(); c.arc(0, 0, R, lo, hi); c.stroke();
        c.fillStyle = INKW; head(0); c.fill();
      };
      arrow(-Math.PI/2 + 0.22 + sway, -Math.PI/2 + 1.0 + sway);   // clockwise, top right
      arrow(-Math.PI/2 - 0.22 + sway, -Math.PI/2 - 1.0 + sway);   // anticlockwise, top left
      c.restore();
    }
  }

      };

  // Collision damage: scales with how fast the boat was moving INTO the
  // obstacle (nx,ny is the outward normal), so grazing hurts less than
  // ramming. A short cooldown stops one bump from counting every frame.
  function impact(nx, ny){
    const vx = Math.cos(boat.angle)*boat.speed, vy = Math.sin(boat.angle)*boat.speed;
    const into = -(vx*nx + vy*ny);
    if(hitCooldown>0 || into < 4) return;
    const dmg = Math.max(1, Math.round(into/MAX_SPEED*HIT_MAX_DAMAGE));
    boat.health = Math.max(0, boat.health - dmg);
    hitCooldown = 0.6;
    // rebound: a push away from the surface, stronger for harder hits,
    // plus a small yaw so the bow swings off instead of re-hitting
    const kick = (20 + into*0.9)*1.15;                      // a bit more bounce than originally
    boat.rock = Math.min(2.5, (boat.rock||0) + 0.6 + into/MAX_SPEED);   // and she rocks for a while
    boat.kdamp = 3.5;
    boat.kx += nx*kick; boat.ky += ny*kick;
    const hx = Math.cos(boat.angle), hy = Math.sin(boat.angle);
    const cr = hx*ny - hy*nx;
    const side = Math.abs(cr) > 0.05 ? Math.sign(cr) : (Math.random()<0.5?-1:1);
    boat.angle += side * Math.min(0.3, 0.08 + into/MAX_SPEED*0.25);   // a small yaw so the bow swings off
    hurtFlash = 0.35;
    showHealth();
    Sfx.crash(Math.min(1, dmg/HIT_MAX_DAMAGE));
    buzz(dmg > 12 ? [70,35,90] : [45,25,45]);             // hull hit: a jolt, harder for big knocks
    shake = 0.25*Math.min(1, dmg/12);
    popups.push({x:boat.x, y:boat.y-20, text:'-'+dmg, life:1.1, max:1.1});
  }

  // wheel sounds: a soft knock every WHEEL_TICK of rotation, a quiet
  // wooden rub while turning, a muted thud at the stops
  const WHEEL_TICK = Math.PI/3;                // 60° → 6 knocks per turn
  let prevWheel = 0, wheelTickIdx = 0, wheelAtStop = false, lastTickT = 0;
  function wheelSound(dt){
    const angVel = Math.abs(wheelAngle-prevWheel)/Math.max(dt,1e-3);
    prevWheel = wheelAngle;
    const idx = Math.round(wheelAngle/WHEEL_TICK);
    if(idx!==wheelTickIdx){
      wheelTickIdx = idx;
      if(t-lastTickT > 0.09){            // never more than ~11 knocks/s
        lastTickT = t;
        const self = wheelPointer===null && !turnLeft && !turnRight;
        const k = Math.min(1, angVel/8);
        Sfx.tick(WHEEL_VOL*((self?0.5:0.75)+0.25*k), (0.97+0.06*k)*(0.95+Math.random()*0.1));
        buzz(self ? 4 : 6, 60);                          // a click per spoke: under the finger, and softer as it spins back
      }
    }
    const atStop = Math.abs(wheelAngle) >= WHEEL_MAX-1e-4;
    if(atStop && !wheelAtStop && angVel>0.3){ Sfx.thunk(WHEEL_VOL*Math.min(1, 0.5+angVel/10)); buzz(22); }
    wheelAtStop = atStop;
    Sfx.wheel(angVel, WHEEL_VOL);
  }

  const elTalk = document.getElementById('talk'), elTalkName = elTalk.querySelector('.t-name'), elTalkText = elTalk.querySelector('.t-text'), elTalkBtn = elTalk.querySelector('.t-btn'), elTalkPic = elTalk.querySelector('.t-portrait');
  let talk = null, talkPicKey = '';

  function updateTalk(dt){

  const elGoTitle = document.getElementById('go-title');
  // ---------- Fishing ----------
  const NET_DROP = 1.4;          // net deploying animation
  const NET_HAUL = 1.1;          // hauling animation
  const NET_THROW_MIN = 24, NET_THROW_MAX = 46;   // how far the net is thrown, toward the middle of the bank
  let fishing = null;            // {bank, t, phase:'drop'|'wait'|'haul'|'cancel', ...}
  let settleT = 0;
  const fishAboard = ()=> FISH_KEYS.reduce((a,k)=> a + counts[k], 0);
  const dishesAboard = ()=> Object.values(dishHold).reduce((a,n)=> a + n, 0);
  const SAILS = ['square', 'lateen'];
  const sailsInHold = ()=> SPARE_SAIL ? SAILS.filter(r=> r !== boat.rig && !homeStore.sails.includes(r)) : [];   // (a sail left in the storehouse is not aboard)
  const spareSlots = ()=> sailsInHold().length;                      // the sails not rigged take a slot each
  let charges = START_CHARGES;                                       // the sling's charges aboard (they stack: one slot)
  const chargeSlots = ()=> SLING_CHARGES && charges > 0 ? 1 : 0;
  const slotsUsed = ()=> fishAboard() + dishesAboard() + spareSlots() + bottleHold.length + chargeSlots();   // the hold's HOLD_MAX slots: a fish, a dish, the spare sail or a bottle each (gifts are kept apart)
  const holdFull = ()=> slotsUsed() >= HOLD_MAX;
  let fullSaid = null;                                   // the bank we've already said "the hold is full" over
  function bankUnderBoat(){
    for(const b of banks){
      if(b.state!=='live') continue;
      if(wdist(boat.x,boat.y,b.x,b.y) < b.r*FISH_REACH) return b;
    }
    return null;
  }
  function updateFishing(dt){
    for(let k=banks.length-1;k>=0;k--){
      const b = banks[k];
      b.t += dt; b.rot += dt*0.25;
      b.jumpT -= dt;
      if(b.jumpT<=0){ b.jumpT = rand(1.5,4.5); b.jump = {a:rand(0,6.3), d:rand(0.2,0.7)*b.r, t:0}; }
      if(b.jump){ b.jump.t += dt; if(b.jump.t>0.9) b.jump = null; }
      if(b.state==='scatter' && b.t > 1.8){ banks.splice(k,1); if(b.tile === undefined) spawnBank(true, b.home); }   // (a square's bank waits for the next refill)
    }
    updateBottles(dt);
    if(moor || boat.whirl){ fishing = null; settleT = 0; return; }
    const steering = turnLeft || turnRight || (wheelPointer!==null && Math.abs(wheelAngle) > 0.35);
    if(!fishing){
      const fb = bankUnderBoat(), bo = fb ? null : bottleUnderBoat(), b = fb || bo;   // a fish bank, or else a bottle
      const atAnchor = anchored && weighT <= 0;             // anchor down on a bank: nets over almost at once
      const canNet = atAnchor || (!NETS_AT_ANCHOR_ONLY && !(reelOn && fb) && boat.speed < FISH_STOP);   // (only at anchor: NETS_AT_ANCHOR_ONLY; with the reel too)
      if(b !== fullSaid) fullSaid = null;
      if(b && holdFull()){                                // no room: the nets stay aboard (said once per bank)
        settleT = 0;
        if(!fullSaid && canNet){ fullSaid = b; popups.push({x:boat.x, y:boat.y-24, text:TEXT.popups.holdFull, life:1.6, max:1.6}); buzz(20); }
        return;
      }
      if(b && canNet){
        settleT += dt;
        if(settleT >= (atAnchor ? FISH_ANCHOR_SETTLE : FISH_SETTLE)){
          // the net is thrown at the fish: toward the bank's middle (a side if right on top of it)
          const dx = wdx(b.x, boat.x), dy = wdy(b.y, boat.y), d = Math.hypot(dx, dy);
          const a = d > 4 ? Math.atan2(dy, dx) : boat.angle + (Math.random()<0.5 ? 1 : -1)*Math.PI/2;
          const ux = Math.cos(a), uy = Math.sin(a), thr = Math.max(NET_THROW_MIN, Math.min(NET_THROW_MAX, d));
          const side = (-Math.sin(boat.angle)*ux + Math.cos(boat.angle)*uy) < 0 ? -1 : 1;   // which gunwale it goes over
          fishing = {bank:fb, bottle:bo, t:0, phase:'drop', side, ux, uy, thr: bo ? Math.max(NET_THROW_MIN*0.6, Math.min(NET_THROW_MAX, d)) : thr,
                     dur: bo ? BOTTLE_TIME : rand(FISH_TIME_MIN, FISH_TIME_MAX)};
          Sfx.splash();
          buzz(15);
        }
      } else settleT = 0;
      return;
    }
    const f = fishing;
    f.t += dt;
    // nets act like a sea anchor: the boat stays put while fishing
    boat.speed *= Math.exp(-3*dt); boat.kx *= Math.exp(-3*dt); boat.ky *= Math.exp(-3*dt);
    if(f.phase==='drop' && f.t>=NET_DROP){ f.phase='wait'; f.t=0; }
    else if((f.phase==='wait' || f.phase==='game') && reelOn && f.bank && !(anchored && weighT <= 0)){   // anchor weighed: the line comes in
      f.phase='cancel'; f.t=0; popups.push({x:boat.x, y:boat.y-22, text:TEXT.popups.netsIn, life:1.3, max:1.3});
    }
    else if(f.phase==='wait' && reelOn && f.bank && f.t>=f.dur){   // a bite: the reel takes the wheel's place
      f.phase='game'; f.t=0;
      const d = REEL_FISH[FISH[f.bank.sec].key] || 1;
      f.game = {z:0, v:0, f:rand(0.25, 0.5), fv:0, tgt:0.5, tt:0, p:REEL_START, d, w:0, inZ:false};
      popups.push({x:boat.x, y:boat.y-24, text:TEXT.popups.bite, life:1.6, max:1.6});
      Sfx.splash(); buzz([12,40,12,40,20]);
    }
    else if(f.phase==='game'){
      const g = f.game;
      // the fish: darts toward a new depth every so often, quicker and farther the wilder its kind
      g.tt -= dt;
      if(g.tt <= 0){ g.tgt = Math.max(0.03, Math.min(0.97, g.f + rand(-1, 1)*(0.25 + 0.45*g.d))); g.tt = rand(0.5, 1.6)/g.d; }
      g.fv += ((g.tgt - g.f)*14*g.d - g.fv*5)*dt; g.f += g.fv*dt;
      if(g.f < 0.02){ g.f = 0.02; g.fv = Math.abs(g.fv)*0.3; } else if(g.f > 0.98){ g.f = 0.98; g.fv = -Math.abs(g.fv)*0.3; }
      // the band: the reel lifts it, it sinks on its own; a little bounce on the floor, stopped at the top
      g.w += ((dt > 0 ? reelMove/dt : 0) - g.w)*Math.min(1, dt*12);
      g.v = Math.max(-2.5, Math.min(2.5, g.v + (REEL_PULL*g.w - REEL_GRAVITY)*dt));
      g.z += g.v*dt;
      if(g.z < 0){ g.z = 0; g.v = g.v < -0.4 ? -g.v*0.3 : 0; }
      if(g.z > 1 - REEL_ZONE){ g.z = 1 - REEL_ZONE; g.v = Math.min(0, g.v); }
      const inZ = g.f >= g.z && g.f <= g.z + REEL_ZONE;
      if(g.inZ && !inZ) buzz(8);                             // it slips out of the band: a little tug
      g.inZ = inZ;
      g.p += (inZ ? REEL_FILL : -REEL_DRAIN)*dt;
      if(g.p >= 1){ f.phase='haul'; f.t=0; catchFish(f); }
      else if(g.p <= 0){                                     // it got away: the school scatters
        f.phase='cancel'; f.t=0;
        popups.push({x:boat.x, y:boat.y-24, text:TEXT.popups.gotAway, life:1.6, max:1.6});
        Sfx.splash(); buzz([30,40,30]);
        f.bank.state='scatter'; f.bank.t=0;
      }
    }
    else if(f.phase==='wait'){
      if(steering){ f.phase='cancel'; f.t=0; popups.push({x:boat.x, y:boat.y-22, text:TEXT.popups.netsIn, life:1.3, max:1.3}); }
      else if(f.t>=f.dur && f.bottle){                  // a bottle in the net: into the hold, and another drifts in elsewhere
        f.phase='haul'; f.t=0;
        bottles.length = 0; bottleFound = true;         // the other copies vanish: as far as she knows there was only this one
        bottleHold.push({msg: f.bottle.msg, read: false});
        popups.push({x:boat.x, y:boat.y-24, text:TEXT.bottles.caught, life:1.8, max:1.8});
        Sfx.pickup(); buzz([15,50,25]);
        elListBtn.classList.add('news');                // the logbook shimmers: something to read
      }
      else if(f.t>=f.dur){ f.phase='haul'; f.t=0; catchFish(f); }
    }
    else if((f.phase==='haul' || f.phase==='cancel') && f.t>=NET_HAUL){ fishing = null; settleT = 0; }
  }
  function catchFish(f){
        let n = FISH_CATCH_MIN + Math.floor(Math.random()*(FISH_CATCH_MAX - FISH_CATCH_MIN + 1));
        if(boonFish>0){ n *= 2; boonFish--; }
        n = Math.max(0, Math.min(n, HOLD_MAX - slotsUsed()));    // only as many as the hold has room for
        const kind = FISH[f.bank.sec];
        counts[kind.key] += n; caught += n;
        popups.push({x:boat.x, y:boat.y-24, text:fmt(TEXT.popups.catch, {n, fish: n===1 ? kind.one : kind.many}), life:1.8, max:1.8});
        Sfx.pickup();
        buzz([15,50,25]);                           // fish in the boat
        f.bank.state='scatter'; f.bank.t=0;            // the school disperses
  }
  // 0..1 how far the net is out
  function netAmount(){
    if(!fishing) return 0;

    if(f.phase==='drop') return Math.min(1, f.t/NET_DROP);

  // ---- the reel: a ring round the anchor hub, turned clockwise (a ratchet: back does nothing) while a fish is on ----
  const elReel = document.getElementById('reel'), elReelGrip = elReel.querySelector('.grip'), elReelRot = elReel.querySelector('.rot');
  const elFishbar = document.getElementById('fishbar'), elFbZone = elFishbar.querySelector('.fb-zone'),
        elFbFish = elFishbar.querySelector('.fb-fish'), elFbFill = elFishbar.querySelector('.fb-fill');
  let reelMove = 0, reelA = 0, reelTick = 0, reelDrag = null, reelKey = false, reelShown = false;
  elReelGrip.setAttribute('aria-label', TEXT.oars.reel); elReel.title = TEXT.oars.reel;
  const reelAngle = ev=>{ const r = elReel.getBoundingClientRect(); return Math.atan2(ev.clientY - (r.top + r.height/2), ev.clientX - (r.left + r.width/2)); };
  const reelTurn = da=>{
    if(!(da > 0)) return;
    reelMove += da; reelA += da; reelTick += da;
    while(reelTick >= Math.PI/12){ reelTick -= Math.PI/12; Sfx.ratchet(CRANK_VOL*0.35, false, 0, 1.6); }   // a light click every 1/24 turn
  };

  window.addEventListener('keyup', e=>{ if(e.key==='ArrowUp' || e.key==='w' || e.key==='W') reelKey = false; });
  function updateReel(dt){
    const g = fishing && fishing.phase==='game' ? fishing.game : null;
