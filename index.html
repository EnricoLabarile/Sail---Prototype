<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vento e Vele</title>
<script>
// ===== Tuning and texts: first in the file, so they are easy to find and edit (on GitHub too). =====
// Top-level consts in this script are shared with the game script further down.
"use strict";
  // ---------- Tuning ----------
  const HAPTICS_DEFAULT = 0;         // vibration strength on a first visit (0 = off … 1 = strong); the slider on the first screen changes it (and it's remembered)
  // The game's main knobs, all in one place: change a number, save, reload.
  // Each one is used further down (search for its name to see how). When a
  // new feature brings a new knob, it goes here too. The knobs marked (world)
  // change how the world is generated.
  // The world knobs wrapped in knob('NAME', value) can also be set from the
  // first screen (the world generator): its "Generate" reloads the page with
  // them in the address (?ISLAND_SCALE=3&…), and they win over the value here.
  const URLP = new URLSearchParams(location.search);
  const knob = (k, v)=> URLP.has(k) && URLP.get(k) !== '' && isFinite(+URLP.get(k)) ? +URLP.get(k) : v;

  // -- Size of the world (first: the other knobs scale with it) --
  // Distances scale with it (× WORLD_K) and counts with its area (× WORLD_K²),
  // so the sea keeps the same density whatever its size.
  const WORLD_SIZE = 5040;           // px a side (the world wraps round); keep it a multiple of 48 (world). Was 7200
  const WORLD_K = WORLD_SIZE/7200;   // scale against the original 7200 world
  const WK2 = WORLD_K*WORLD_K;

  // -- The drawn map (first too: with it on, the world holds only what Enrico drew) --
  // the sea map drawn on the Supernote template (tools/map-template/import_map.py turns the drawing into DRAWN_LAND,
  // in the section "Drawn map"): its coasts are the world's land. While it's on, whatever the drawing doesn't show is
  // left out, each still switchable from the first screen: random wild islands, rocks, whirlpools, fish banks, storm
  // clouds, the boiling sea, the messages in a bottle (and so the wreck), and the villages and temple not placed below
  const MAP_DRAWN = knob('MAP_DRAWN', 1);            // 1 = the drawn map, 0 = the random archipelago of before (world)
  // where the villages (W, E, S, N: Westa, Estolia, Sudia, Nordania) and the Temple of Eolus (temple) stand on the drawn
  // map, in world px (A1's corner is 0,0; a square is 560 px), each slid toward home until its harbour opens on the
  // sea; one not listed isn't in the world (world)
  const DRAWN_PLACES = {N: [2799, 1241], E: [4303, 2059], S: [3735, 4298], W: [1624, 2298]};   // the four dots of the drawing (unnamed), each given the village of its side of home: Nordania E3, Estolia H4, Sudia G8, Westa C5

  // -- Boat --
  const MAX_SPEED = 50;              // px/s: reference speed (collision damage is scaled by it too)
  const WIND_BOOST = 0.96;           // how much the wind gives: sets the top speed (~52 px/s dead downwind in full wind)
  const BOAT_ACCEL = 0.7/1.2;        // how quickly she gathers way (higher = quicker); slowing down is separate
  const TURN_RATE = 0.6;             // rad/s at full rudder (was 0.42: easier to turn)
  const ROW_TURN_MULT = 2;           // turning is this much quicker on the oars
  const ROW_ENTER = 10;              // px/s: slower than this, with the wind unable to help, and the oars come out (sail brailed up)
  const ROW_EXIT = 16;               // px/s: once the sail could drive her faster than this again, it's set and the oars come in
  const ROW_DELAY = 0.6;             // seconds a condition must hold before switching (no flicker)
  const ROW_SPEED = 9;               // px/s on the oars (the old automatic oars)
  const MANUAL_OARS = true;          // the oars are rowed by hand: press the oar button (right) in rhythm, as its pointer comes round to the mark (false = the old automatic oars)
  const SPRING_PADDLES = true;       // the paddle wheels run off a wound spring: turn the crank (clockwise) to charge it, then they drive her on their own until it runs down; false = the old rhythmic oar button
  const SPRING_TURNS = 1;            // full turns of the crank, in one go, that wind the spring right up (let go before and the winding is lost: start again)
  const SPRING_TIME = 15;            // seconds the wheels can drive her on a full spring (it only runs down while they're driving; was 30)
  const PADDLE_VOL = 3.6;            // loudness of the paddles slapping into the water as the spring drives the wheels (one low splash a paddle; 0 = silent; was 1.8); freewheeling under sail is × PADDLE_FREE_VOL of it
  const STEAM_ON = true;             // steam puffing from a little funnel amidships: thick while the spring drives the paddle wheels, a faint wisp while they only freewheel under way
  const STEAM_RATE = 9;              // puffs a second while the wheels drive her (× how hard they drive)
  const STEAM_IDLE = 0.18;           // …while she moves and the wheels only freewheel: this share of the puffs…
  const STEAM_LIGHT = 0.45;          // …each this much as big and as white (1 = like the driving steam)
  const PADDLE_FREE_VOL = 0.5;       // …and when they only freewheel under sail (dragged round by the water): the same splash at this share of it (× PADDLE_VOL; was 0.22, fading in with her speed)…
  const PADDLE_FREE_PITCH = 1;       // …and this pitch (1 = the same as when driven; was 0.7)
  const CRANK_BACK_SPEED = 12;       // let go of the crank before a full turn and it springs back anticlockwise, like an alarm clock's key: turns a second (radians, quicker the more it was wound)
  const CRANK_WEIGHT = 1;            // weight under the crank's clicks while you wind it: a low thud and a dull knock a tooth (0 = just the click, as when it springs back)
  const CRANK_GRIND = 0.5;           // loudness of the gears grinding under the clicks while you turn the crank (follows how fast; 0 = silent; was 1)
  const CRANK_TICK_GAP = 0.022;      // s: the crank's clicks come at least this far apart, an even run however the finger jumps
  const WHEEL_VOL = 2;               // loudness of the ship's wheel: the spokes' knocks, the thump at full lock and the rub as it turns (was 1)
  const CRANK_BACK_PITCH = 0.6;      // pitch of the ticks as the crank springs back on its own (1 = the winding's clicks; lower = less tinny)
  const CRANK_VOL = 1;               // loudness of the crank's gears as it winds (a tick a tooth, a heavier step each quarter turn; 0 = silent)
  const SLING_ON = true;             // the slingshot on the right: drag its pouch down and let go, a stone flies off ahead of the bow
  const SLING_RANGE = [25, 115];     // px the stone flies ahead: a short pull, a full pull (was [40, 230])
  const SLING_RELOAD = 0.9;          // seconds before the next stone is in the pouch
  const SLING_SCARE_R = 60;          // a stone landing within this many px of the shark sends it off
  const SPRING_SPEED = 39.2;         // px/s the wheels give her (the spring rests while the sail drives her faster than this; was 19.6, doubled)
  const OAR_START = 0.2;             // power the first press gives (0..1): she starts rowing, slowly
  const OAR_GOOD = 0.0;             // power a press right on time adds (the pointer at the mark)…
  const OAR_MISS = 0.04;             // …and a press too early or too late (a little)
  const OAR_WINDOW = 0.13;           // how far from the mark a press still counts as on time (share of a turn, either side)
  const OAR_WARN = 0.2;              // the button swells this share of a turn before the pointer reaches the mark (time to react)
  const OAR_LOCK_SPEED = 16;         // px/s: once the sail alone drives her faster than this the oars are shipped and the oar button is disabled (back below 0.8 × this)
  const OAR_HIT_VOL = 1;             // loudness of the blade's hard catch (a short splash and thump) that answers a press on time (× OAR_CUE_VOL; 0 = silent)
  const OAR_BED_VOL = 1;            // loudness of the oars' wash while rowing (a soft swirl of water that swells with each pull; 0 = silent)
  const OAR_CUE_VOL = 1;            // loudness of the oar's clunk in its wooden thole as the oar button goes ink (the moment to press; 0 = silent)
  // loudness of each kind of sound (1 = as made, 0 = silent, up to 2), on top of the knobs above; also the
  // sliders of the first screen's Audio section (kept on the phone; the line under them can be pasted here)
  const SOUND_VOL = {
    master: 1,     // everything
    sea: 1,        // the swell, and the water along the hull
    rain: 1,       // a shower on the sea: the wash and the patter
    cicadas: 1,    // the afternoon chorus near the islands' shores
    night: 1,      // crickets and the howls at night
    gulls: 1,      // the gulls' cries
    town: 1,       // the villages: chatter, hammers, bells, dogs…
    engine: 1,     // the traders' motor boats
    whirl: 1,      // the whirlpools' drone, and being flung
    waves: 0.5,    // the big waves breaking, hitting her, and surfing (was 1)
    crash: 1,      // knocks on rocks and shores, and the shark's bite
    wheel: 1,      // the wheel's rub as it turns
    clicks: 1,     // the wheel's spokes and the little wooden knocks of the controls
    anchor: 1,     // the anchor chain, down and up
    crank: 1,      // the crank's gears as it winds
    paddles: 1,    // the paddle wheels in the water, and the spring running down
    oars: 1,       // the oars' strokes, cue, catch and wash
    nets: 1,       // the nets: splash going over, haul coming in
    bell: 1,       // the bell (a purchase, a gift, a power)
    buoy: 1,       // a buoy knocked as she brushes past
    crate: 1,      // the storehouse's door and crate
    thunder: 1,    // the thunder of the storm clouds
    coins: 1,      // the purse's jingle at the market
    book: 1,       // the logbook opening, closing and its pages turning
  };
  const OAR_SPIN_FADE = 0.05;        // a slow steady drain of the rowing's power (a share of it per second)…
  const OAR_SKIP = 0.65;             // …and the power kept when the pointer passes the mark without a press (she slows; a few skipped and she stops)
  const OAR_RATE = 0.624;             // turns of the oar button a second: one steady beat, whatever the power (calm: time to look at the sea too; was 0.52)
  const OAR_RATE_EASE = 2;           // how quickly the button gets up to that beat when she starts rowing, and winds down to a halt when she stops
  const OAR_KICK = 20;               // px/s of extra way a stroke pulled right on time gives her (a visible surge; half of it at once)…
  const OAR_KICK_FADE = 1.3;         // …fading away at this rate a second (lower = she glides on longer)
  const OAR_SURGE = 0.5;             // how much of her way on the oars comes in a surge as the blades sweep aft (0 = steady glide, 1 = all of it), then she coasts on the recovery
  const OAR_MAX = 14;                // px/s at full power (rowing is slow, but goes any way she points)
  const WHEEL_MAX = Math.PI;         // how far the wheel turns for full lock (π = half a turn each way)
  const SURF_BOOST = 32;             // extra px/s while surfing a big wave
  const SURF_COS = 0.4;              // surf if the heading is within ~66° of the wave's travel (else the wave hurts)

  // -- Hull and dangers --
  const MAX_HEALTH = 100;            // a full hull
  const HIT_MAX_DAMAGE = 25;         // damage of a head-on hit at full speed (grazes do less)
  const REPAIR_EVERY = 0.5;          // seconds between patches at a pier (repairs are free)
  const FISH_HEAL = 15;              // hull points per patch
  const WHIRL_COUNT = knob('WHIRL_COUNT', MAP_DRAWN ? 0 : Math.round(200*WK2));   // whirlpools in the world (none on the drawn map) (world)
  const WHIRL_FROM_DAY = 1;          // whirlpools start opening from this day (1 = from the start; was 2, a calm first day)
  const WHIRL_DAMAGE = 10;           // hull damage when caught in a whirlpool's core
  const WHIRL_PULL = 22;             // px/s pull at the edge of the core…
  const WHIRL_CURVE = 4;             // …rising exponentially from ~0 at the rim
  const WHIRL_FADE = 3;              // seconds for a whirlpool to open up / die down
  const SHARK_ON = knob('SHARK_ON', MAP_DRAWN ? 0 : 1);   // 1 = on, 0 = off (off on the drawn map for now). Sharks: now and then one finds her at sea, follows her, bites the hull and makes off
  const SHARK_CHANCE = knob('SHARK_CHANCE', 0.6); // the chance of an encounter in each minute she spends at sea, out of home waters (was 0.25)
  const SHARK_COOLDOWN = knob('SHARK_COOLDOWN', 45); // seconds at least between one encounter and the next
  const SHARK_SPEED = knob('SHARK_SPEED', 26); // how fast it swims after her (px/s; was 38; under sail or the wheels she outruns it)
  const SHARK_DAMAGE = knob('SHARK_DAMAGE', 8); // hull damage from a bite
  // the sea imp (like Zelda's Zora): pops out of the water near her, spits a fireball at her, ducks under and pops up elsewhere
  const ZORA_ON = knob('ZORA_ON', MAP_DRAWN ? 0 : 1);   // 1 = sea imps about, 0 = none (none on the drawn map for now)
  const ZORA_CHANCE = knob('ZORA_CHANCE', 0.5); // the chance of one turning up in each minute at sea, out of home waters
  const ZORA_COOLDOWN = 40;          // seconds at least between one sea imp and the next
  const ZORA_POPS = [3, 5];          // how many times it pops up before it leaves (fewest, most)
  const ZORA_DIST = [80, 150];       // px from the boat it pops up (nearest, furthest)
  const ZORA_BALL_SPEED = 75;        // px/s its fireball flies (she can dodge it)
  const ZORA_DAMAGE = knob('ZORA_DAMAGE', 6);   // hull damage from a fireball
  const ZORA_SIZE = 1.7;             // how big the sea imp is drawn (1 = about the boat's helmsman)
  const SHARK_GIVE_UP = knob('SHARK_GIVE_UP', 30); // seconds it follows before giving up, if it never reaches her
  const WHIRL_FOLLOW = knob('WHIRL_FOLLOW', 2); // a whirlpool creeps after her while she's within this many times its radius…
  const WHIRL_FOLLOW_SPEED = knob('WHIRL_FOLLOW_SPEED', 7); // …at this many px/s (slow; it never leaves open water); once it has caught and spun her it dies down
  const WHIRL_FLING = 200;            // px/s² of extra speed while she runs round a whirlpool's outer ring with its swirl (a slingshot)…
  const WHIRL_FLING_MAX = 200;        // …up to this much above her normal speed (it fades once she's out)
  const WHIRL_FLING_COS = 0.8;       // how well her heading must follow the swirl to be flung (cos of ~37°)
  const ROLLER_RATE = knob('ROLLER_RATE', MAP_DRAWN ? 0 : 2);   // how often big waves come (2 = twice as often as at first, 1 = the old pace, 0 = none: so on the drawn map for now)
  // deep water: where the big waves can rise and run (shown as a darker sea); they die down on leaving it
  const DEEP_SHORE = 70;             // px from any land at which the deep water begins (world)
  const DEEP_PIER = 280;             // px from any pier (harbours are never deep) (world)
  const DEEP_TINT = 0.3;            // how much darker the deep water is drawn (0 = not shown, ~0.25 = strong)
  const DEEP_CELL = 24;              // px a side of the cells the deep water is worked out in (smaller = finer edge, more work)
  const ROLLER_CATCH = 25;           // px/s a wave from astern runs faster than the boat, so it catches her to surf (0 = never helps)
  const DOWNWIND_DEG = 120;          // she's running downwind when the wind comes from at least this far round from her bow (180 = dead astern); from here the wind from behind adds speed too
  const SURF_WAVE_AFTER = 0.1;         // seconds running downwind before a wave may come up astern for her to surf
  const SURF_WAVE_CHANCE = MAP_DRAWN ? 0 : 0.3;   // chance each second (after that) of such a wave (none on the drawn map for now)
  const SURF_WAVE_BACK = 100;        // px astern it rises (close enough to reach her before it dies)
  const SURF_WAVE_SIDE = 45;         // px it may be off to either side, so catching it takes a touch of the helm
  const ROLLER_SPARE = 0.55;         // a wave about to hit her badly slows to this share of its pace (1 = never)

  // -- Fishing and market --
  const BANK_COUNT = knob('BANK_COUNT', MAP_DRAWN ? 0 : Math.round(240*WK2));   // fish banks out at sea (none on the drawn map) (world)
  const ROUTE_BANK_SHARE = 0.5;      // share of those banks laid along the sea roads (home to each village, village to village)
  const ROUTE_BANK_SPREAD = Math.round(170*WORLD_K);   // px either side of a road they may lie
  const HOME_WATERS = Math.round(950*WORLD_K);     // radius of home waters (all kinds of fish there)
  const HOME_BANKS = knob('HOME_BANKS', MAP_DRAWN ? 0 : Math.round(18*WK2));   // fish banks in home waters, refilled as they are fished (none on the drawn map) (world)
  const FISH_CATCH_MIN = 1, FISH_CATCH_MAX = 2;   // fish per haul (random in between)
  const BOTTLE_COUNT = knob('BOTTLE_COUNT', MAP_DRAWN ? 0 : 6);   // (none on the drawn map) copies of the one message in a bottle floating about the sea (more = easier to come across; once one is fished up the others are gone) (world)
  const BOTTLE_SIZE = 1.8;           // how big a bottle is drawn (1 = true to the boat's scale; bigger reads better)
  const WRECK_LEN = 190;             // px long, the wrecked cruise ship that lies where a message's cross is (in two halves)
  const BOTTLE_TIME = 1.2;           // seconds with the net out before a bottle is hauled in (fish take FISH_TIME_MIN–MAX)
  const HOLD_MAX = 9;                // slots in the hold: each fish or dish takes one; when it's full the nets stay aboard
  const FISH_REACH = 1.35;           // a bank counts out to this × its radius (a little past its circle)
  const NETS_AT_ANCHOR_ONLY = true;  // the nets go over only when she drops anchor on a bank (or a bottle); false = also when she just stops on it
  const FISH_STOP = 12;              // px/s: slow enough to count as stopped on a bank (with NETS_AT_ANCHOR_ONLY off)
  const FISH_SETTLE = 2;             // seconds stopped on a bank before the nets go over
  const BANK_LOOK = [4, 5, 1.45];    // every fish bank looks alike, whatever it holds: [fewest fish, most fish, their size] (dark, going round)
  const FISH_ANCHOR_SETTLE = 0.25;   // …or this long after dropping anchor on a bank
  const FISH_TIME_MIN = 2, FISH_TIME_MAX = 4;   // seconds with the nets out before the haul (with the reel: before the bite)
  // the reel (a Stardew-style minigame): anchored on a bank, a bite, then a ring round the anchor hub is the reel: turned
  // round clockwise it lifts the band up the bar on the right, let alone it sinks; keep the fish in the band to fill the meter
  const REEL_DEFAULT = false;        // the minigame on a first visit (off: the old passive nets, stop on a bank and they haul it in by themselves); the switch in the first screen's Settings changes it (and it's remembered)
  const REEL_ZONE = 0.28;            // the band's height, a share of the bar
  const REEL_PULL = 0.75;            // the band's lift per rad/s the reel turns (half a turn a second about holds it still)
  const REEL_GRAVITY = 1.9;          // how fast it sinks when the reel is left alone (bar heights per s²)
  const REEL_FILL = 0.3;             // meter gained per second with the fish in the band
  const REEL_DRAIN = 0.15;           // …and lost per second with it out (empty: it gets away)
  const REEL_START = 0.35;           // the meter at the bite
  const REEL_FISH = {sarde: 0.6, sgombri: 0.8, triglie: 1, orate: 1.3};   // how wild each kind is (1 = middling): darts quicker and farther
  const COIN_LOCAL = 1;              // a village pays this for its own kind of fish
  const COIN_FOREIGN = 2;            // …and this for fish from other waters (a fish sells for 1 to 2 coins; was 3)
  const BANKS_PER_TILE = 1;          // drawn map: fish banks in each square of the map (A1…I9), anywhere at sea in it (world; was 2)
  const BANK_REGEN_DAYS = 2;         // drawn map: the banks fished come back every this many days, at first light (2 = every other day)
  const SLING_CHARGES = true;        // the slingshot needs a charge for each shot (they stack in the hold: one slot whatever the number)
  const CHARGE_PACK = 5;             // charges in a pack, as every stall sells them
  const CHARGE_PRICE = 5;            // coins a pack
  const START_CHARGES = 0;           // charges aboard when a voyage starts
  const DISH_PRICE = 6;              // coins per specialty dish
  const DISH_RESALE = 3;             // coins a stall gives for a dish from your hold (any stall takes any dish)

  // -- World --
  const TRADERS_HOME = knob('TRADERS_HOME', MAP_DRAWN ? 0 : 2);   // trading boats between home and the villages (on 2 of the 4 home lanes, picked at random; none on the drawn map for now) (world)
  const TRADERS_VILLAGES = knob('TRADERS_VILLAGES', MAP_DRAWN ? 0 : 4);   // trading boats between neighbouring villages (one on each of those 4 lanes; none on the drawn map for now) (world)
  const ISLAND_SCALE = knob('ISLAND_SCALE', 2.5);          // size of the wild islands (1 = the old small ones) (world)
  const ISLAND_COUNT = knob('ISLAND_COUNT', Math.round(210*WK2*3.5/(ISLAND_SCALE*ISLAND_SCALE)));   // wild islands at most (about 58 at scale 2.5; the clusters fill up first) (world)
  const CLUSTER_SHARE = knob('CLUSTER_SHARE', 0.32);        // share of the sea taken by clusters of islands; the rest is open water (world)
  const SPIRAL_MIN = 0.5, SPIRAL_MAX = 1;                   // each new world picks SPIRAL at random between these, unless it's set in the world generator (world)
  const SPIRAL = knob('SPIRAL', +(SPIRAL_MIN + Math.random()*(SPIRAL_MAX - SPIRAL_MIN)).toFixed(2));   // 0 = clusters scattered … 1 = clusters strung along spiral arms round home, like a galaxy, denser near it (world)
  const SPIRAL_ARMS = knob('SPIRAL_ARMS', 3);               // how many arms the spiral has (world)
  const SPIRAL_TWIST = 2.4;          // how tightly the arms wind round home (higher = more turns) (world)
  const OPEN_ISLANDS = knob('OPEN_ISLANDS', 6);            // small islands scattered in the open water between the clusters (world)
  // share of the wild islands of each shape (the rest are round-ish blobs) (world):
  const ISLAND_L = knob('ISLAND_L', 0);                // L-shaped: two long arms meeting at a corner (0 = none: off for now; was 0.12)
  const ISLAND_C = knob('ISLAND_C', 0);                // C-shaped: a horseshoe round a deep bay (0 = none: off for now; was 0.12)
  const ISLAND_BIG = knob('ISLAND_BIG', 0.07);           // big islands, about 1.7 times the usual size
  const ISLAND_ATOLL = knob('ISLAND_ATOLL', 0);            // atolls: a ring of sandy islets round a lagoon, with gaps to sail in (0 = none: off for now; was 0.05)
  const VILLAGE_DIST = Math.round(2475*WORLD_K);   // px from home to each village (world)
  // each game every village is nudged a little, still roughly N / E / S / W of home:
  const VILLAGE_OUT_MAX = Math.round(300*WORLD_K);   // px it may be pushed further from home (never closer) (world)
  const VILLAGE_SIDE_MAX = Math.round(300*WORLD_K);  // px it may slide sideways, either way; in practice the ruins keep it to about a third of VILLAGE_OUT_MAX (world)
  const VILLAGE_EDGE = Math.round(500*WORLD_K);      // px it must keep from the edge of the map (world)
  const SAFE_R = Math.round(950*WORLD_K);          // home waters: no whirlpools, no big waves
  const LAGOON_R = Math.round(650*WORLD_K);        // calm lagoon round home: no islands, no rocks (world)
  const DANGER_RING = Math.round(3400*WORLD_K);    // the sea gets wilder out to this distance from home (world)
  const BUOY_R = Math.round(880*WORLD_K);          // radius of each village's ring of buoys (world)
  const BUOYS_PER_VILLAGE = Math.round(24*WORLD_K), HOME_BUOYS = Math.round(32*WORLD_K);   // buoys per ring (world)
  const OPEN_ROCK_TRIES = knob('OPEN_ROCK_TRIES', MAP_DRAWN ? 0 : Math.round(127*WK2));     // clusters of rocks tried out in open water (none on the drawn map) (world)
  const ROCK_GAP = 64;               // px of clear water at least between two rocks, or a rock and the shore, unless they touch (about twice the boat's length, so she never gets stuck) (world)
  const ROCK_BIG = 0.4;              // share of rocks drawn bigger than the usual (up to ROCK_BIG_MAX ×) (world)
  const ROCK_BIG_MAX = 2.2;          // the biggest rocks are this many times the usual size (world)
  const DAY_LEN = 720;               // seconds for a whole day, dawn to dawn (was 360)
  const TUTORIAL_ON = false;         // the first-voyage tutorial (controls shown one at a time with tips); off for now
  const RUINS_ON = false;            // the ruins on the diagonals and their powers; off for now (world)
  const EOLUS_ON = true;             // the Temple of Eolus stands in the north, where Nordania was (Nordania is gone while it's on); docking there gives the fair wind (world)
  const POWER_USES = 1;              // uses of the fair wind (the button bottom right, locked until Eolus gives it)
  const POWER_RECHARGE = 60;         // seconds for a spent use of the fair wind to come back
  const POWER_WIND_T = 30;           // seconds the fair wind blows from astern, whichever way she steers
  const DAWN_HOUR = 5;               // the hour on the watch at first light (5 puts the golden hour at about 19)
  const DINNER_HOUR = 19;            // the day's order must be home by this hour; then dinner is served (marked on the watch)
  const WATCH_MARK = DINNER_HOUR;    // the hour marked on the watch's rim

  // -- Orders and the guests --

      rigged:  '{sail} rigged',
    },
    logbook: {
      order:   'Tonight\'s order',
      day:     'Day {n}',
      due:     'Bring it home by {hour}:00.',
      fishAny: '{n} fish, any kind',
      fishKind:'{n} {fish}',
      ready:   'All delivered: dinner will be ready.',
      served:  'Dinner was served. A new order comes at first light.',
      short:   'Dinner was served without everything. A new order comes at first light.',
      cargo:   'Cargo',
      throwAway: 'Throw overboard',
      holdCount: '{n}/{max}',
      rooms:     'Map of the seas sailed',          // the room map's label (for screen readers and on hover)
      roomHere:  'You are in {cell}',               // under the room map: the square she's in (a letter for its column, a number for its row)
      noFish:  'No fish aboard.',
      chart:   'Sea chart',
    },
    // at a pier, under the dialog
    pier: {
      weighHint: 'Hold the centre of the wheel to weigh anchor.',
    },
    // the Temple of Eolus, in the north: the god of the winds gives the fair wind
    eolus: {
      name:    'Temple of Eolus',
      gift:    'Eolus\' fair wind is in your cargo',   // a toast once the spirit has spoken
      item:       'Fair wind: tap to call it',
      blowing:    'Fair wind: blowing, {s} s left',
      recharging: 'Fair wind: back in {s} s',
      again:   'The columns hum softly in the breeze. Eolus is watching over your sails.',
      spirit:  'Spirit of the temple',                // the ghostly keeper who talks to you there (the name over the talk box)
      // docking there the first time: the spirit's words, one line a tap (then the fair wind is given)
      giftLines: [
        'Sailor... few keels still find their way to these old stones. I am what is left of the one who kept this temple.',
        'Eolus, lord of the winds, was honoured here. He has not forgotten those who cross the sea to find him.',
        'Take his breath with you: you\'ll find it in your cargo. Call it, and for a while the wind will blow at your back.',
      ],
    },
    // the talk box at the bottom of the screen (a portrait on the left, the words, a button on the right)
    talk: {
      next: 'Go on',                                 // the button's label while there's more to say
      end:  'Farewell',                              // …and on the last line
    },
    ruins: {
      name:    'Ruins',
      silent:  'The stones are silent.',
      visit:   '{power}',
      title:   '{ruins} · {power}',
      // the powers (their durations are in Tuning: BOON_WIND_T, BOON_FISH_HAULS)
      wind: { title:'the friendly wind', text:'the wind changes its voice and settles at your back.' },
      fish: { title:'the blessed nets',  text:'you feel lucky.' },
      heal: { title:'the hull reborn',   text:'the planks of the boat creak and close up on their own, good as new. The hull is whole again.' },
      badgeWind: 'friendly wind {s} s',
      badgeFish: 'blessed nets ×{n}',
    },
    sunk: {
      title: 'The boat has sunk',
      stats: 'You sailed for {min} min {sec} s and caught {fish} fish.',
    },
    restart: 'Set sail again',
    hud: { hull: 'Hull' },
  };
  // fill the {braces} of a text
  const fmt = (s, o)=> s.replace(/\{(\w+)\}/g, (m, k)=> (o && k in o) ? o[k] : m);
</script>
<style>
  :root{
    --ink:#1b1a17;
    --paper:#ebe7dc;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:'Georgia','Iowan Old Style',serif;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #wrap{position:fixed; inset:0; overflow:hidden;}
  /* the game is made for a phone held upright. On a wide screen (a computer, a
     tablet on its side) it plays in a phone-shaped frame in the middle, at most
     the height of a big phone: same view of the world, same fine grain, the
     controls where they are on the phone. --fw / --fh are the frame's size (the
     whole screen on a phone); the transform makes the fixed UI sit in the frame. */
  :root{--fw:100vw; --fh:100vh;}
  @media (min-aspect-ratio: 4/5){
    :root{--fh:min(100vh, 880px); --fw:min(100vw, calc(var(--fh) * 0.47));}
    html, body{background:#0f0e0c;}
    #wrap{inset:auto; left:50%; top:50%; width:var(--fw); height:var(--fh); transform:translate(-50%, -50%);
      box-shadow:0 0 0 1px rgba(235,231,220,.16), 0 24px 70px rgba(0,0,0,.65);}
  }
  #c{
    position:absolute; top:0; left:0;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }

  /* --- HUD: flat ink on paper, 1-bit --- */
  .hud{position:fixed; pointer-events:none; color:var(--ink); z-index:5;}
  .panel{
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:4px;
    box-shadow:3px 3px 0 var(--ink);
  }
  #topbar{
    top:calc(12px + env(safe-area-inset-top,0px));
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:0 14px;
  }
  #wood{font-size:15px;}
  #status{
    position:fixed;
    top:calc(162px + env(safe-area-inset-top,0px));
    left:14px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:7px 12px;
    font-size:15px;
    z-index:5;
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .35s, transform .35s;
  }
  #status.show{opacity:1; transform:none;}
  #status.hurt{background:var(--ink); color:var(--paper);}
  #status.hurt .hp-track{border-color:var(--paper);}
  #status.hurt .hp-fill{background:var(--paper);}
  /* the guests' mood: a plate and a bar, top right (no words) */
  #mood{position:fixed; right:12px; top:calc(12px + env(safe-area-inset-top,0px)); z-index:5; display:flex; align-items:center; gap:5px;
    padding:4px 7px; opacity:0; transition:opacity .5s; pointer-events:none;}
  #mood.show{opacity:1;}
  #mood svg{width:18px; height:18px; display:block;}
  #mood .mood-track{width:58px; height:9px; border:1.5px solid var(--ink); border-radius:2px; padding:1px;}
  #mood .mood-fill{height:100%; width:50%; background:var(--ink); transition:width .8s;}
  #mood.pulse{animation:moodPulse .45s ease-in-out 3;}
  @keyframes moodPulse{50%{transform:scale(1.12);}}
  body.at-market #mood{display:none;}
  #boon{
    position:fixed;
    top:calc(204px + env(safe-area-inset-top,0px)); left:14px;
    padding:3px 9px; font-size:12px; font-style:italic;
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #boon.show{opacity:1;}
  #wood{
    position:fixed; left:50%; top:calc(3px + env(safe-area-inset-top,0px)); transform:translateX(-50%);
    display:grid; grid-template-areas:". n ." "w c e" ". s ."; grid-template-columns:auto 100px auto; grid-template-rows:24px 100px 24px;
    gap:3px 6px; align-items:center; justify-items:center; padding:0;
    background:none; border:none; box-shadow:none; pointer-events:none; z-index:5;
  }
  #wood .res-item{opacity:0; transition:opacity .6s; }
  #wood .res-item.has{opacity:1;}
  #wood .res-item{background:var(--paper); border:2px solid var(--ink); border-radius:12px; padding:1px 7px; box-shadow:2px 2px 0 var(--ink);}
  #wood .fish-orate{justify-self:end;} #wood .fish-sgombri{justify-self:start;}
  #wood .fish-sarde{grid-area:n;} #wood .fish-sgombri{grid-area:e;} #wood .fish-triglie{grid-area:s;} #wood .fish-orate{grid-area:w;}

  #wood .res-item{display:flex; align-items:center; gap:3px;}
  /* the logbook is a compact card: the list on the left, the compass on the right */
  /* the compass lives in the logbook, on the first spread's right page (a tap turns it over to the watch) */
  #compass{display:block; margin:10px auto 0; width:min(100%, 150px); height:auto; aspect-ratio:1; cursor:pointer; touch-action:manipulation; image-rendering:pixelated;}
  #compass:focus-visible{outline:2px dashed var(--ink); outline-offset:2px; border-radius:50%;}
  body.tut-no-compass #compass{opacity:0; pointer-events:none;}
  #wood{display:none !important;}      /* the fish counters round the compass are retired: the hold is in the logbook */
  /* the market is a window of its own: centred over a dark shade, with room for everything */
  #mk-shade{position:fixed; inset:0; z-index:7; background:none; display:none;}   /* (still catches stray taps behind the market; no dark backdrop) */
  body.at-market #mk-shade{display:block;}
  #market{
    position:fixed;
    top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(440px, calc(var(--fw) - 20px));
    max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    overflow-y:auto;             /* only as a last resort, with a very full hold on a small screen */
    padding:10px 10px 8px;
    z-index:8;
  }
  #mk-title{font-weight:bold; font-style:italic; font-size:15px; margin-bottom:4px;}
  #mk-text{font-size:13px; line-height:1.35; margin-bottom:8px;}
  /* the barter table: your hold on the left, the merchant's stall on the right */
  #mk-table{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
  .mk-side{border:1.5px solid var(--ink); border-radius:4px; padding:5px; min-height:104px; transition:background .15s;}
  .mk-side.drop{background:repeating-linear-gradient(45deg, transparent 0 3px, rgba(27,26,23,.18) 3px 4px);}
  .mk-head{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:bold; font-style:italic; margin-bottom:5px;}
  #mk-purse{display:flex; align-items:center; gap:3px; font-style:normal; font-variant-numeric:tabular-nums;}
  .mk-items{display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start;}
  .mk-empty{font-size:12px; font-style:italic; margin:4px 2px;}
  .mk-unit{
    width:42px; height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:var(--paper); border:1.5px solid var(--ink); border-radius:4px; box-shadow:2px 2px 0 var(--ink);
    touch-action:none; cursor:grab; user-select:none;
  }
  .mk-unit > svg{width:30px; height:16px; display:block; pointer-events:none;}
  .mk-unit.food{width:88px; height:auto; min-height:44px; padding:3px 2px;}
  .mk-unit.food > svg{width:30px; height:22px;}
  .mk-name{font-size:11px; font-weight:bold; line-height:1.1; text-align:center; pointer-events:none;}
  .mk-val{display:flex; align-items:center; gap:2px; font-size:11.5px; line-height:1; pointer-events:none;}
  .coin{width:11px; height:11px; display:inline-block; vertical-align:-1px;}
  .mk-unit.moved{border-style:dashed; box-shadow:none; background-image:radial-gradient(var(--ink) 0.6px, transparent 0.8px); background-size:3px 3px;}
  .mk-unit.lifted{opacity:.3;}
  .mk-unit.ghost{position:fixed; z-index:30; pointer-events:none; transform:scale(1.15) rotate(-4deg); box-shadow:4px 4px 0 var(--ink);}
  #mk-bal{font-size:13px; min-height:18px; margin-bottom:7px; display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  #mk-bal.short{font-weight:bold;}
  #market button{
    display:block; width:100%; margin:0 0 6px; padding:9px 10px;
    font-family:inherit; font-size:15px; text-align:center;
    background:var(--paper); color:var(--ink);
    border:2px solid var(--ink); border-radius:4px; box-shadow:3px 3px 0 var(--ink);
    cursor:grab; touch-action:none;
  }
  #market button:active:not(:disabled){transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  #mk-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  #mk-actions button{margin:0 0 4px;}
  #market button:disabled{box-shadow:none; border-style:dashed; opacity:.7; cursor:default;}
  #market button.done{background:var(--ink); color:var(--paper); opacity:1; border-style:solid;}
  #mk-foot:empty{display:none;}
  #mk-foot{font-size:12.5px; white-space:pre-line; border-top:1.5px solid var(--ink); padding-top:6px; margin-top:2px;}
  #dialog{
    position:fixed;
    top:calc(162px + env(safe-area-inset-top,0px));
    left:50%; transform:translateX(-50%);
    width:min(420px, calc(var(--fw) - 28px));
    padding:12px 15px 13px;
    z-index:7;
    cursor:pointer;
  }
  /* the oar button: a disc with a pointer that turns with the strokes, under a fixed mark; press as the pointer comes round to it */
  #oar-ctl{position:fixed; right:12px; bottom:calc(178px + env(safe-area-inset-bottom,0px)); width:64px; height:74px; z-index:5; touch-action:none; cursor:pointer;}
  /* the crank (SPRING_PADDLES): a paper disc with an arm and a handle that follows the finger round; the ring round it
     fills as the spring is wound, and empties as the wheels use it */
  #crank{position:fixed; right:7px; bottom:calc(8px + env(safe-area-inset-bottom,0px)); width:84px; height:84px; z-index:7; touch-action:none; cursor:grab; color:var(--ink);}
  #crank svg{width:100%; height:100%; display:block; overflow:visible;}
  #crank .disc{fill:var(--paper); stroke:var(--ink); stroke-width:2;}
  #crank .gear{fill:url(#crank-dots); stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round;}
  #crank .plate{fill:var(--paper); stroke:var(--ink); stroke-width:1.4;}
  #crank .hatch{fill:url(#crank-hatch);}
  #crank .rivet{fill:var(--ink);}
  #crank .track{fill:none; stroke:var(--ink); stroke-width:1; stroke-dasharray:1.5 2; opacity:.6;}   /* the spring's charge: a ring inside the plate (under the arm) */
  #crank .charge{fill:none; stroke:var(--ink); stroke-width:3.6; stroke-linecap:butt; transition:stroke-dasharray .1s;}
  #crank.full .charge, #crank.full .track{stroke:var(--paper);}   /* (on the inked plate when full) */
  #crank .arm{stroke:var(--ink); stroke-width:4; stroke-linecap:round;}
  #crank .knob{fill:var(--paper); stroke:var(--ink); stroke-width:2.2;}
  #crank .hub{fill:var(--ink);}
  #crank.full .plate{fill:var(--ink);} #crank.full .hatch{opacity:0;} #crank.full .arm{stroke:var(--paper);} #crank.full .hub{fill:var(--paper);}
  #crank.locked{cursor:default;} #crank.locked .rot{opacity:.45;}   /* wound full: locked until the spring has run down */
  #crank.hidden, body.at-market #crank{display:none;}
  /* the slingshot: on the right, above the crank; its pouch is dragged down and let go */
  #sling{position:fixed; right:12px; bottom:calc(100px + env(safe-area-inset-bottom,0px)); width:64px; height:80px; z-index:7;
    touch-action:none; cursor:grab; color:var(--ink);}
  #sling svg{width:100%; height:100%; display:block; overflow:visible;}
  #sling .wood{fill:var(--paper); stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round;}
  #sling .grain{fill:none; stroke:var(--ink); stroke-width:.8; opacity:.5;}
  #sling .band-bg{fill:none; stroke:var(--paper); stroke-width:5.5; stroke-linecap:round;}   /* a paper edge, so the bands read over the wood */
  #sling .band{fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round;}
  #sling .pouch{fill:url(#crank-dots); stroke:var(--ink); stroke-width:2;}
  #sling .stone{fill:var(--ink);}
  #sling.empty .stone{display:none;}
  #sling.nocharge{opacity:.5;}                     /* no charges aboard: greyed (a pull says so) */
  #shoplist .slot.charges{position:relative; color:var(--ink);}
  #shoplist .slot.charges .n{position:absolute; right:2px; bottom:0; font:bold 11px Georgia, serif; background:var(--paper); padding:0 1px; line-height:1.1;}
  #sling.hidden, body.at-market #sling, body.talking #sling{display:none;}
  /* the reel (fishing): a ring round the anchor hub, where the wheel was (its middle left open: the hub still weighs anchor) */
  #reel{position:fixed; left:calc(50% - 100px); bottom:calc(17px + env(safe-area-inset-bottom,0px)); width:200px; height:200px;
    z-index:7; pointer-events:none; color:var(--ink); transition:opacity .25s, transform .25s;}
  #reel svg{width:100%; height:100%; display:block; overflow:visible;}
  #reel .grip{fill:none; stroke:transparent; stroke-width:40; pointer-events:stroke; cursor:grab; touch-action:none;}
  #reel .rim{fill:url(#reel-dots); stroke:var(--ink); stroke-width:2; fill-rule:evenodd;}
  #reel .teeth{fill:none; stroke:var(--ink); stroke-width:5; stroke-dasharray:2 8.08;}   /* 48 teeth round r 77 */
  #reel .line{fill:none; stroke:var(--ink); stroke-width:1; opacity:.7;}
  #reel .arm{stroke:var(--ink); stroke-width:6; stroke-linecap:round;}
  #reel .knob{fill:var(--paper); stroke:var(--ink); stroke-width:2.4;}
  #reel .knob-in{fill:var(--ink);}
  #reel.hidden{opacity:0; transform:scale(.8); visibility:hidden;}
  /* …and the bar on the right: the band the reel lifts, the fish darting up and down, the meter beside it */
  #fishbar{position:fixed; right:14px; bottom:calc(28px + env(safe-area-inset-bottom,0px)); width:52px; height:250px; z-index:7;
    pointer-events:none; transition:opacity .25s;}
  #fishbar.hidden{opacity:0; visibility:hidden;}
  #fishbar .fb-track{position:absolute; left:0; top:0; bottom:0; width:32px; border:2px solid var(--ink); border-radius:6px;
    background-color:var(--paper); background-image:radial-gradient(var(--ink) .7px, transparent 1px); background-size:4px 4px; overflow:hidden;}
  #fishbar .fb-zone{position:absolute; left:2px; right:2px; border:2px solid var(--ink); border-radius:3px; background:var(--paper);}
  #fishbar.in .fb-zone{background:repeating-linear-gradient(45deg, var(--paper) 0 3px, color-mix(in srgb, var(--ink) 30%, var(--paper)) 3px 5px);}
  #fishbar .fb-fish{position:absolute; left:3px; width:22px; height:14px; margin-bottom:-7px; color:var(--ink);}
  #fishbar .fb-meter{position:absolute; right:0; top:0; bottom:0; width:12px; border:2px solid var(--ink); border-radius:4px; background:var(--paper); overflow:hidden;}
  #fishbar .fb-fill{position:absolute; left:0; right:0; bottom:0; background:var(--ink);}
  body.at-market #reel, body.talking #reel, body.at-market #fishbar, body.talking #fishbar{display:none;}
  /* the talk box (Stardew style): a framed portrait on the left, the words typed out, a smaller round button on the right
     (go on / farewell); while it's up, the boat's controls step aside */
  #talk{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:min(460px, calc(var(--fw) - 24px)); box-sizing:border-box; z-index:8; display:flex; align-items:center; gap:10px; padding:10px; cursor:pointer;}
  #talk.hidden{display:none;}
  #talk .t-portrait{flex:0 0 84px; height:84px; box-sizing:border-box; border:2px solid var(--ink); border-radius:3px; overflow:hidden;
    box-shadow:inset 0 0 0 3px var(--paper), inset 0 0 0 4.5px var(--ink); background:var(--paper); align-self:flex-start;}
  #talk .t-portrait svg{width:100%; height:100%; display:block;}
  #talk .t-body{flex:1; min-width:0;}
  #talk .t-name{font-weight:bold; font-style:italic; font-size:14px; margin-bottom:4px; letter-spacing:.02em;}
  #talk .t-text{font-size:15px; line-height:1.4; min-height:5.6em;}
  #talk .t-btn{flex:0 0 46px; height:46px; padding:0; border-radius:50%; background:var(--paper); color:var(--ink); border:2px solid var(--ink);
    box-shadow:2px 3px 0 var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #talk .t-btn svg{width:22px; height:22px;} #talk .t-btn .ico-end{display:none;}
  #talk.last .t-btn .ico-next{display:none;} #talk.last .t-btn .ico-end{display:block;}
  #talk.typing .t-btn{opacity:.45; box-shadow:none;}                  /* still typing: a tap shows the whole line */
  #talk:not(.typing) .t-btn svg{animation:talkNudge 1.1s ease-in-out infinite;}
  @keyframes talkNudge{50%{transform:translateX(2px);}}
  #talk .t-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink);}
  body.talking #wheel, body.talking #crank, body.talking #oar-ctl,
  body.talking #dock-btn, body.talking #btn-list, body.talking #tut-tip{display:none !important;}
  #oar-ctl .oar-mark{position:absolute; left:50%; top:0; width:0; height:0; margin-left:-6px; border-left:6px solid transparent; border-right:6px solid transparent;
    border-top:9px solid var(--ink); filter:drop-shadow(0 0 1.5px var(--paper));}   /* the fixed mark: the moment to press */
  #oar-ctl .oar-disc{position:absolute; left:4px; top:12px; width:56px; height:56px; border-radius:50%; background:var(--paper); border:2px solid var(--ink);
    box-shadow:2px 3px 0 var(--ink); box-sizing:border-box; transition:transform .12s;}
  #oar-ctl .oar-disc svg{position:absolute; inset:0; width:100%; height:100%; color:var(--ink);}
  #oar-ctl.ready .oar-disc{transform:scale(1.12);}                  /* the pointer is nearly round: get ready */
  #oar-ctl.now .oar-disc{background:var(--ink); transform:scale(1.12);}   /* now's the time to press: ink, easy to catch from the corner of the eye */
  #oar-ctl.now .oar-disc svg{color:var(--paper) !important;}
  #oar-ctl.hit .oar-disc{transform:scale(1.22);}                    /* pressed right on time: a little pop */
  body.at-market #oar-ctl{display:none;}
  #oar-ctl.locked{pointer-events:none; cursor:default;}            /* the sail drives her fast: the oars are shipped */
  #oar-ctl.locked .oar-disc{opacity:.35; border-style:dashed; transform:none;}
  #oar-ctl.locked .oar-mark{opacity:.35;}
  #dock-btn{position:fixed; z-index:6; width:52px; height:52px; margin:-26px 0 0 -26px; padding:0; border-radius:50%;
    background:var(--paper); color:var(--ink); border:2px solid var(--ink); box-shadow:2px 3px 0 var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; animation:dockBob 1.6s ease-in-out infinite;}
  #dock-btn svg{width:32px; height:32px; display:none;}
  #dock-btn.coins .ico-coins, #dock-btn.crate .ico-crate{display:block;}
  #dock-btn:active{transform:translate(2px,2px); box-shadow:none;}
  body.at-market #dock-btn{display:none;}
  @keyframes dockBob{0%,100%{translate:0 0} 50%{translate:0 -4px}}

  .hp{display:flex; align-items:center; gap:8px;}

  /* --- Touch controls --- */
  /* helm buttons: round wooden 'knobs' in the wheel's style — a dotted
     (dithered) face, a light ring and an inked rim */
  button, canvas{ -webkit-tap-highlight-color: transparent; }
  button:focus:not(:focus-visible){ outline:none; }
  [role="button"]{ -webkit-tap-highlight-color: transparent; }          /* (no blue square on a tap: the oar button is a div) */
  [role="button"]:focus:not(:focus-visible){ outline:none; }
  .helm-btn{
    position:fixed;
    overflow:visible;
    right:12px;
    z-index:7;
    width:78px; height:78px;
    border-radius:50%;
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(var(--ink) 0.75px, transparent 0.95px);
    background-size:3px 3px;
    border:3px solid var(--ink);
    box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5.5px var(--ink), 3px 3px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation;
    padding:0;
  }
  .helm-btn:active{transform:translate(2px,2px); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5.5px var(--ink), 1px 1px 0 var(--ink);}
  .helm-btn:focus-visible{outline:2px dashed var(--ink); outline-offset:3px;}
  /* the logbook icon: a closed book whose cover swings open (on its spine) when the panel opens */
  /* the logbook button is just the book: no round knob; a thin paper halo keeps it readable on any water */
  #btn-list{width:80px; height:80px; background:none; border:none; box-shadow:none; border-radius:0; right:11px;}
  #btn-list:active{box-shadow:none;}
  #btn-list .logbook{position:relative; display:block; width:76px; height:76px; perspective:200px;
    filter:drop-shadow(1.5px 0 0 var(--paper)) drop-shadow(-1.5px 0 0 var(--paper)) drop-shadow(0 1.5px 0 var(--paper)) drop-shadow(0 -1.5px 0 var(--paper)) drop-shadow(3px 4px 0 rgba(0,0,0,.3));}
  #btn-list .logbook canvas{position:absolute; left:0; top:0; width:76px; height:76px; image-rendering:pixelated;}
  /* news: something was just crossed off. A glint sweeps the cover and the book gives a little
     wiggle every couple of seconds, until the logbook is opened */
  #btn-list .glint{position:absolute; left:12px; top:7px; width:50px; height:54px; overflow:hidden; border-radius:5px; pointer-events:none; display:none;}
  #btn-list.news:not(.open) .glint{display:block;}
  #btn-list .glint::before{content:""; position:absolute; top:-30%; bottom:-30%; left:-34px; width:12px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95), rgba(255,255,255,0)); transform:skewX(-22deg);
    animation:logGlint 2.2s ease-in-out infinite;}
  @keyframes logGlint{0%{left:-34px} 40%,100%{left:72px}}
  #btn-list.news:not(.open) .logbook{animation:logWiggle 2.2s ease-in-out infinite;}
  @keyframes logWiggle{0%,55%,100%{transform:none} 63%{transform:rotate(-7deg) scale(1.07)} 72%{transform:rotate(6deg) scale(1.07)} 81%{transform:rotate(-3deg) scale(1.03)} 90%{transform:none}}
  #btn-list .log-cover{transform-origin:22% 50%; transition:transform .3s cubic-bezier(.3,.7,.3,1), opacity .15s .15s; backface-visibility:hidden;}
  #btn-list .log-pages{opacity:0; transform:scale(.85); transition:opacity .25s .12s, transform .35s .12s;}
  #btn-list.open .log-cover{transform:rotateY(-160deg); opacity:0;}
  #btn-list.open .log-pages{opacity:1; transform:none;}
  #btn-list{left:9px; right:auto; bottom:calc(10px + env(safe-area-inset-bottom,0px));}   /* bottom left; the compass sits above it */
  body.at-market #btn-list{display:none;}
  /* at the barter table the sail badge and the compass (with its fish counters) step aside */
  body.at-market #sail, body.at-market #compass, body.at-market #wood, body.at-market #wheel{display:none;}
  /* the shopping list: slides down from the top of the screen */
  /* the logbook, open: dark grained leather with a stitched edge and metal corners,
     framing two pages either side of a crease */
  #shoplist{
    position:fixed; left:50%; top:calc(8px + env(safe-area-inset-top,0px)); z-index:9;
    width:min(420px, calc(var(--fw) - 14px));
    /* closed: only the right half shows (the book shut, cover up), centred and above the screen */
    transform:translate(-75%, calc(-100% - 30px)); clip-path:inset(-12px -12px -12px 50%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), clip-path .34s cubic-bezier(.4,.1,.3,1);
    padding:12px 12px 15px;
    color:var(--ink);
    background-color:var(--ink);
    background-image:radial-gradient(rgba(235,231,220,.38) 0.7px, transparent 0.95px), radial-gradient(rgba(235,231,220,.2) 0.6px, transparent 0.8px);
    background-size:3px 3px, 5px 5px; background-position:0 0, 1px 2px;
    border:2px solid var(--ink); border-radius:10px;
    box-shadow:4px 5px 0 rgba(0,0,0,.35);
  }
  #fps{position:absolute; right:21px; bottom:20px; font:10px/12px ui-monospace, monospace; color:var(--ink); opacity:.5;
    font-variant-numeric:tabular-nums; letter-spacing:.04em; pointer-events:none; z-index:2;}
  #shoplist::before{                    /* stitching round the cover */
    content:""; position:absolute; inset:4px; border:1.5px dashed rgba(235,231,220,.55); border-radius:7px; pointer-events:none;
  }
  #shoplist .corner{position:absolute; width:26px; height:26px; z-index:2; pointer-events:none;}
  #shoplist .corner.tl{left:-3px; top:-3px;}
  #shoplist .corner.tr{right:-3px; top:-3px; transform:scaleX(-1);}
  #shoplist .corner.bl{left:-3px; bottom:-3px; transform:scaleY(-1);}
  #shoplist .corner.br{right:-3px; bottom:-3px; transform:scale(-1,-1);}
  #shoplist .pages{position:relative; display:flex; align-items:stretch; perspective:1100px;}
  /* the front cover swings on the spine (the middle of the crease): folded it lies over the
     right page showing its leather; open, its inside is the left page */
  #shoplist .leaf{flex:1; min-width:0; display:flex; position:relative; z-index:2; transform-style:preserve-3d;
    transform-origin:calc(100% + 8px) 50%; transform:rotateY(180deg); transition:transform .34s cubic-bezier(.4,.1,.3,1);}
  #shoplist.unfold .leaf{transform:rotateY(0deg);}
  #shoplist .leaf > .page{backface-visibility:hidden; -webkit-backface-visibility:hidden;}
  #shoplist .leaf-back{position:absolute; inset:-2px; transform:rotateY(180deg); backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center; border-radius:0 7px 7px 0; border:2px solid var(--ink);
    background-color:var(--ink); background-image:radial-gradient(rgba(235,231,220,.38) 0.7px, transparent 0.95px); background-size:3px 3px;}
  #shoplist .leaf-back svg{width:64px; height:64px;}
  #shoplist .page{flex:1; min-width:0; background:var(--paper); padding:10px 10px 12px; position:relative; min-height:150px;}
  #shoplist .page.left{border-radius:6px 0 0 6px; box-shadow:-2px 2px 0 var(--paper), -3px 3px 0 var(--ink), -5px 5px 0 var(--paper), -6px 6px 0 var(--ink);}   /* the edges of the pages beneath */
  #shoplist .page.right{border-radius:0 6px 6px 0;
    box-shadow:2px 2px 0 var(--paper), 3px 3px 0 var(--ink), 5px 5px 0 var(--paper), 6px 6px 0 var(--ink);}
  #shoplist .crease{                    /* the gutter: the pages curve down into it */
    flex:none; width:16px; position:relative; background-color:var(--paper);
    /* dotted shade in the middle only: plain paper strips over the dots at each side */
    background-image:linear-gradient(90deg, var(--paper) 0 3px, transparent 3px calc(100% - 3px), var(--paper) calc(100% - 3px)),
      radial-gradient(var(--ink) 0.7px, transparent 0.9px);
    background-size:100% 100%, 3px 3px;
  }
  #shoplist .crease::after{content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--ink);}
  /* the second spread: the sea chart, drawn across both pages and the crease */
  #shoplist{touch-action:none;}
  /* the third spread: home's look, three to choose from (a preview) */
  #base-l, #base-r{display:none;}
  #shoplist.on-base #base-l, #shoplist.on-base #base-r{display:block;}
  #shoplist.on-base #shoplist-body, #shoplist.on-base #hold-page{display:none;}
  #base-l h2{margin:0 0 6px;}
  #base-l .base-hint{font-size:12px; font-style:italic; margin:0 0 8px; opacity:.85;}
  #base-l .base-pick{display:flex; align-items:center; gap:8px; width:100%; margin:0 0 6px; padding:3px 6px 3px 3px; font:inherit; font-size:13px;
    color:var(--ink); background:none; border:1.5px dashed var(--ink); border-radius:3px; cursor:pointer; text-align:left;}
  #base-l .base-pick.on{border-style:solid; background:var(--ink); color:var(--paper);}
  #base-l .base-pick svg{width:34px; height:34px; flex:none;}
  #base-r canvas{width:100%; display:block; image-rendering:pixelated; border:1.5px solid var(--ink); border-radius:2px;}
  #base-name{margin:6px 0 14px; text-align:center; font-weight:bold; font-style:italic;}
  #shoplist.on-map #shoplist-body, #shoplist.on-map #hold-page, #shoplist.on-map #cmp-slot{display:none;}
  #wind-page{display:none;} #shoplist.on-map #wind-page{display:block;}   /* the wind card, on the chart's facing page */
  #shoplist.on-base #cmp-slot{display:none;}
  #cmp-slot #compass{display:none;}                    /* the room map has its place for now (the compass's code stays) */
  #rooms-box{position:relative; margin:10px auto 0; width:min(100%, 150px);}
  #rooms{position:relative; display:block; width:100%; height:auto; color:var(--ink);}
  #rooms-chart{position:absolute; left:8%; top:8%; width:90%; height:90%; image-rendering:pixelated;}   /* the coasts she has seen, under the grid (8..98 of the map's 100 units) */
  #rooms .frame{fill:none; stroke:var(--ink); stroke-width:1.2;}
  #rooms .seam{stroke:var(--ink); stroke-width:.4; stroke-dasharray:.6 1.4; opacity:.55;}   /* the borders between the squares, dotted */
  #rooms .lbl{fill:var(--ink); font:bold 4.2px Georgia, serif; opacity:.8;}
  #rooms-here{margin:4px 0 0; text-align:center; font-size:12px; font-style:italic;}
  #shoplist.on-map #rooms-here, #shoplist.on-base #rooms-here{display:none;}
  #rooms .you{fill:var(--paper); stroke:var(--ink); stroke-width:.6; animation:roomBlink .8s steps(1) infinite;}
  @keyframes roomBlink{50%{opacity:0;}}
  /* a page being turned: a sheet swinging on the spine, the page it leaves on its front and the new one on its back */
  #shoplist .turn{position:absolute; z-index:4; transform-style:preserve-3d; pointer-events:none;}
  #shoplist .turn > .page{position:absolute; inset:0; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden;}
  #shoplist .under{position:absolute; overflow:hidden;}
  #shoplist .turn > .back{transform:rotateY(180deg);}
  #shoplist .under{z-index:3; pointer-events:none;}
  #shoplist.open{transform:translate(-75%, 0);}                                   /* 1: the shut book comes down */
  #shoplist.open.unfold{transform:translate(-50%, 0); clip-path:inset(-12px);}   /* 2: it opens, re-centring */
  /* tutorial bubble: by the control being taught, its tail pointing at it */
  #tut-tip{position:fixed; left:0; bottom:0; max-width:215px; padding:6px 10px; font-style:italic; font-size:14px; line-height:1.3;
    z-index:9; pointer-events:none; opacity:0; transform:translateY(6px); transition:opacity .4s, transform .4s, visibility 0s .4s; visibility:hidden;}
  #tut-tip.show{opacity:1; transform:none; visibility:visible; transition:opacity .4s .3s, transform .4s .3s, visibility 0s;}
  #tut-tip::after{content:""; position:absolute; bottom:-7px; left:var(--tail, 50%); width:10px; height:10px; margin-left:-6px;
    background:var(--paper); border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:rotate(45deg);}
  #tut-tip.below::after{bottom:auto; top:-7px; transform:rotate(225deg);}   /* under its target (the compass at the top): the tail points up */
  body.at-market #tut-tip{display:none;}
  #toast{
    position:fixed; left:50%; bottom:calc(262px + env(safe-area-inset-bottom,0px)); z-index:10;   /* just above the wheel (and over the market) */
    transform:translate(-50%, -8px); opacity:0; transition:opacity .5s, transform .5s;
    padding:6px 14px; font-style:italic; font-size:15px; white-space:nowrap; pointer-events:none;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0);}
  body.at-market #toast{bottom:auto; top:calc(96px + env(safe-area-inset-top,0px));}   /* the compass is away: say it above the market */
  #shoplist h2{margin:0 0 8px; font-size:16px; font-style:italic;}
  #shoplist .list-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  #shoplist .list-head h2{margin:0;}
  #shoplist .day{font-size:13px; font-style:italic; font-variant-numeric:tabular-nums; white-space:nowrap; margin-left:6px;}
  #shoplist ul{list-style:none; margin:0; padding:0;}
  #shoplist li{display:grid; grid-template-columns:18px 1fr; gap:2px 5px; padding:6px 0; border-top:1.5px dashed var(--ink); font-size:14.5px;}
  #shoplist li:first-child{border-top:none;}
  #shoplist .mark{grid-row:span 2; font-size:17px; line-height:1.1;}
  #shoplist .food{font-weight:bold;}
  #shoplist .courses li{align-items:center;}
  #shoplist .courses .mark{grid-row:auto;}
  #shoplist li.got .food{text-decoration:line-through;}
  /* a course crossed off since the last look: its line is drawn across as the book opens */
  #shoplist li.got.fresh .food{text-decoration:none; background:linear-gradient(currentColor,currentColor) 0 58%/0% 2px no-repeat;
    animation:strikeIn .5s .55s ease-out forwards;}

  #shoplist .note{font-size:12px; font-style:italic; margin-top:8px;}
  #shoplist .prog{font-size:12px; font-style:italic; font-variant-numeric:tabular-nums; grid-column:2;}
  /* the hold, on the right page: small icons that stay inside the page */
  #wind-card{padding-bottom:14px;}   /* (clear of the fps counter in the corner) */
  #wind-card h3{margin:0 0 2px;}

    display:flex; align-items:center; gap:2px; font:inherit; font-size:11px; box-shadow:1px 2px 0 var(--ink);}   /* Eolus' fair wind: tap to call it */

  #sail-unused{position:fixed; right:13px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); width:76px; height:160px;

  #sail:focus-visible{outline:2px dashed var(--ink); outline-offset:-2px; border-radius:36px;}

  body.tut-compass #compass{border-radius:50%; animation:logWiggle 2.2s ease-in-out infinite, sailPing 1.1s ease-out infinite;}
  @keyframes sailPing{0%{box-shadow:0 0 0 0 rgba(235,231,220,.95), 0 0 0 0 rgba(27,26,23,.85)} 100%{box-shadow:0 0 0 14px rgba(235,231,220,0), 0 0 0 17px rgba(27,26,23,0)}}

  /* --- Intro / game over --- */
  /* setting sail: the backdrop fades on its own layer while the card rolls into a scroll */
  #intro.leaving{background:transparent;}
  .intro-bg{
    position:fixed; inset:0; z-index:19; pointer-events:none;
    background-color:var(--paper);
    background-image:radial-gradient(var(--ink) 0.8px, transparent 1px); background-size:4px 4px;
  }
  .scroll-roll{
    position:fixed; z-index:21; height:24px; pointer-events:none; transform-origin:50% 50%;
    background:var(--paper); border:2px solid var(--ink); border-radius:12px; box-shadow:3px 3px 0 var(--ink);
    background-image:repeating-linear-gradient(0deg, transparent 0 5px, rgba(27,26,23,.35) 5px 6px);
  }
  .scroll-roll::before, .scroll-roll::after{            /* the wooden rods sticking out of the roll */
    content:""; position:absolute; top:3px; width:12px; height:14px; border-radius:4px; background:var(--ink);
  }
  .scroll-roll::before{left:-9px;} .scroll-roll::after{right:-9px;}
  #intro, #gameover{
    position:fixed;
    inset:0;
    z-index:20;
    background-color:var(--paper);
    /* 1-bit dotted backdrop */
    background-image:radial-gradient(var(--ink) 0.8px, transparent 1px);
    background-size:4px 4px;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));

  .card{
    background:var(--paper);
    border:2px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    padding:18px 20px 22px;
    max-width:400px;
    max-height:100%;
    overflow:auto;
  }
  #intro h1, #gameover h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:.04em;
    font-style:italic;
  }
  #intro p, #gameover p{font-size:14.5px; line-height:1.5; margin:8px 0;}
  .intro-card{text-align:left; position:relative; display:flex; flex-direction:column; padding:0; overflow:visible;
    max-height:calc(100% - 28px); margin:14px 0;}          /* room for the rolls above and below */
  .intro-card .scroll-body{position:relative; overflow-y:auto; min-height:0; flex:1 1 auto; padding:44px 20px 44px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .intro-card .scroll-body::-webkit-scrollbar{display:none;}
  /* the two rolls the paper winds onto: like the scroll it rolls up into on setting sail, a little wider than the sheet */
  .card-roll{position:absolute; left:-10px; right:-10px; height:24px; z-index:2; pointer-events:none;
    background:var(--paper); border:2px solid var(--ink); border-radius:12px; box-shadow:3px 3px 0 var(--ink);
    background-image:repeating-linear-gradient(0deg, transparent 0 5px, rgba(27,26,23,.35) 5px 6px);}
  .card-roll::before, .card-roll::after{content:""; position:absolute; top:3px; width:12px; height:14px; border-radius:4px; background:var(--ink);}
  .card-roll::before{left:-9px;} .card-roll::after{right:-9px;}
  .card-roll.top{top:-13px;} .card-roll.bottom{bottom:-13px;}
  /* the paper darkens a little as it curves away into each roll */
  .curl-shade{position:absolute; left:0; right:0; height:30px; z-index:1; pointer-events:none;
    background-image:radial-gradient(var(--ink) 0.8px, transparent 1px); background-size:3px 3px;}
  .curl-shade.top{top:0; -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.55), transparent); mask-image:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);}
  .curl-shade.bottom{bottom:0; -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,.55), transparent); mask-image:linear-gradient(to top, rgba(0,0,0,.55), transparent);}
  #intro.leaving .card-roll, #intro.leaving .curl-shade{display:none;}
  .wg-setting{display:flex; align-items:center; gap:8px; margin:0 0 12px; font:12px/1.3 ui-monospace, monospace;}
  .wg-setting label{flex:0 0 auto;}
  .wg-setting input{flex:1 1 auto; accent-color:var(--ink);}
  .wg-setting input[type=checkbox]{flex:0 0 auto; width:18px; height:18px; margin:0;}
  .wg-setting span{flex:0 0 2.6em; text-align:right;}
  #wg-sails .sl-hint{margin:0 0 8px; font:italic 12px/1.35 Georgia, serif;}
  #wg-sails .sl-sail{margin:0 0 6px; padding:6px 0 4px; border-top:1px dashed var(--ink);}
  #wg-sails .sl-name{margin:0; text-align:center; font:bold 14px/1.3 Georgia, serif;}
  #wg-sails svg{display:block; width:176px; height:176px; margin:0 auto;}
  #wg-sails .sl-sub{margin:6px 0 3px; font:italic 12px/1.3 Georgia, serif;}
  #wg-audio .sl-hint{margin:0 0 8px; font:italic 12px/1.35 Georgia, serif;}
  #wg-audio .sl-row{display:grid; grid-template-columns:8em 1fr 2.8em; align-items:center; gap:6px; font:11.5px/1.3 ui-monospace, monospace;}
  #wg-audio .sl-row input{width:100%; margin:3px 0; accent-color:var(--ink);}
  #wg-audio .sl-row span{text-align:right;}
  #wg-audio .sl-row.changed label, #wg-audio .sl-row.changed span{font-weight:bold;}
  #wg-audio .sl-code{margin:6px 0 4px; padding:4px; font:10px/1.35 ui-monospace, monospace; word-break:break-all; user-select:all; -webkit-user-select:all; border:1px dotted var(--ink);}
  #intro #wg-audio .sl-reset{display:block; margin:4px auto 0; padding:5px 12px; font-size:13px; background:var(--paper); color:var(--ink);}
  #wg-sails .sl-row{display:grid; grid-template-columns:8em 1fr 2.8em; align-items:center; gap:6px; font:11.5px/1.3 ui-monospace, monospace;}
  #wg-sails .sl-row input{width:100%; margin:3px 0; accent-color:var(--ink);}
  #wg-sails .sl-row span{text-align:right;}
  #wg-sails .sl-row.changed label, #wg-sails .sl-row.changed span{font-weight:bold;}
  #wg-sails .sl-code{margin:6px 0 4px; padding:4px; font:10px/1.35 ui-monospace, monospace; word-break:break-all; user-select:all; -webkit-user-select:all; border:1px dotted var(--ink);}
  #intro #wg-sails .sl-reset{display:block; margin:4px auto 0; padding:5px 12px; font-size:13px; background:var(--paper); color:var(--ink);}
  .wg-sec{margin:0 0 10px; border-top:1.5px solid var(--ink);}
  .wg-sec > summary{list-style:none; cursor:pointer; padding:6px 0 6px 18px; position:relative; font:italic bold 17px/1.2 Georgia, serif; user-select:none;}
  .wg-sec > summary::-webkit-details-marker{display:none;}
  .wg-sec > summary::before{content:""; position:absolute; left:2px; top:50%; margin-top:-5px; border-left:7px solid var(--ink); border-top:5px solid transparent; border-bottom:5px solid transparent; transition:transform .15s;}
  .wg-sec[open] > summary::before{transform:rotate(90deg);}
  #wg-changes{margin:4px 0 12px; padding:6px 8px; font:11px/1.35 ui-monospace, monospace; border:1.5px dashed var(--ink); border-radius:3px; clear:both;}
  #intro #wg-changes .ch-head{margin:0; font:bold 11px/1.35 ui-monospace, monospace;}
  #intro #wg-changes .ch-head.past{margin-top:7px; opacity:.75;}
  #wg-changes ol{margin:2px 0 0; padding-left:20px;}
  #wg-changes ol.past{opacity:.75;}
  #wg-map{margin-top:4px;}
  #wg-map{display:block; width:200px; height:200px; margin:0 auto 10px; border:2px solid var(--ink); image-rendering:pixelated;}
  #wg-knobs, #wg-dknobs{display:grid; grid-template-columns:1fr 74px; gap:3px 8px; font:11.5px/1.3 ui-monospace, monospace;}
  #wg-knobs label, #wg-dknobs label{align-self:center; overflow:hidden; text-overflow:ellipsis;}
  #wg-knobs input, #wg-dknobs input{width:100%; box-sizing:border-box; font:inherit; padding:2px 4px; background:var(--paper); color:var(--ink); border:1.5px solid var(--ink); border-radius:2px;}
  #wg-knobs input.changed, #wg-dknobs input.changed{background:var(--ink); color:var(--paper);}
  #wg-build{margin:0 0 4px; font:11px/1.2 ui-monospace, monospace; opacity:0.65;}
  .wg-row{display:flex; gap:10px; justify-content:center;}
  #intro .wg-row button{padding:7px 16px; font-size:14px; background:var(--paper); color:var(--ink);}
  .shopping{margin:10px 0 18px; padding-left:22px; font-size:15px; line-height:1.7;}
  .shopping li{list-style:'– ';}
  #start-btn{display:block; margin:0 auto; background:var(--ink); color:var(--paper); animation:ring 1.8s ease-in-out infinite;}
  @keyframes ring{0%,100%{box-shadow:0 0 0 2px var(--paper), 0 0 0 4px rgba(27,26,23,0.15)} 50%{box-shadow:0 0 0 3px var(--paper), 0 0 0 7px rgba(27,26,23,0.55)}}
  #intro button, #gameover button{
    margin-top:16px;
    padding:10px 30px;
    font-size:16px;
    font-family:inherit;
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--ink);
    border-radius:4px;
    box-shadow:3px 3px 0 rgba(27,26,23,.35);
    cursor:pointer;
  }
  #intro button:active, #gameover button:active{transform:translate(2px,2px);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="wrap">
  <!-- shared fill patterns (dotted tones) for the inline SVG icons; kept outside any hidden element so they render -->

      <div class="res-item fish-sgombri" title="Mackerel"><svg class="log-ico" viewBox="0 0 22 12" aria-label="mackerel"><path d="M2 6 Q8 0.5 15 6 Q8 11.5 2 6 Z" fill="url(#sh-light)" stroke="currentColor" stroke-width="1.6"/><path d="M15 6 L21 2 L21 10 Z" fill="url(#sh-light)" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="5.2" r="1.1" fill="currentColor"/></svg><span id="f-sgombri">0</span></div>
      <div class="res-item fish-triglie" title="Red mullet"><svg class="log-ico" viewBox="0 0 22 12" aria-label="red mullet"><path d="M2 6 Q8 0.5 15 6 Q8 11.5 2 6 Z" fill="url(#sh-mid)" stroke="currentColor" stroke-width="1.6"/><path d="M15 6 L21 2 L21 10 Z" fill="url(#sh-mid)" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="5.2" r="1.3" fill="var(--paper)" stroke="currentColor" stroke-width="0.8"/></svg><span id="f-triglie">0</span></div>
      <div class="res-item fish-orate" title="Sea bream"><svg class="log-ico" viewBox="0 0 22 12" aria-label="sea bream"><path d="M2 6 Q8 0.5 15 6 Q8 11.5 2 6 Z" fill="currentColor" stroke="currentColor" stroke-width="1.6"/><path d="M15 6 L21 2 L21 10 Z" fill="currentColor"/><circle cx="6" cy="5.2" r="1.2" fill="var(--paper)"/></svg><span id="f-orate">0</span></div>

  </div>

    <div class="mood-track"><div class="mood-fill" id="mood-fill"></div></div>

  <button id="btn-list" class="helm-btn" type="button" aria-label="Logbook" aria-expanded="false" aria-controls="shoplist">
    <!-- the logbook: a leather-bound book; tapping it swings the cover open on its spine and shows the written pages -->
    <span class="logbook" aria-hidden="true">
      <canvas class="log-pages"></canvas>
      <canvas class="log-cover"></canvas>
      <span class="glint"></span>         <!-- a glint that sweeps the cover when something new is crossed off -->
    </span>
  </button>
  <!-- the logbook, open: a sturdy leather cover with metal corners framing two pages;
       the dinner list on the left page, the compass on the right -->

    <svg class="corner tr" aria-hidden="true"><use href="#book-corner"/></svg>
    <svg class="corner bl" aria-hidden="true"><use href="#book-corner"/></svg>
    <svg class="corner br" aria-hidden="true"><use href="#book-corner"/></svg>
    <div class="pages">
      <!-- the front cover: its inside is the left page; folded shut it lies over the right page, leather side up -->

        <div class="page left"><div id="shoplist-body"></div><div id="base-l"></div></div>

      </div>

  <div id="intro">
   <div class="card intro-card">

    <div class="curl-shade top"></div><div class="curl-shade bottom"></div>

    <div id="wg-dknobs"></div>

    <details class="wg-sec" id="wg-sec-world"><summary id="wg-title"></summary>

    <div id="wg-knobs"></div>
    <div class="wg-row"><button id="wg-reset" type="button"></button><button id="wg-gen" type="button"></button></div></details>

    <div class="fb-meter"><div class="fb-fill"></div></div></div>

<script>
(function(){
  "use strict";


  // the texts written in the page itself (intro card, buttons, labels)
  (function applyTexts(){

    set('#mk-quit', TEXT.market.quit); set('#mk-deal', TEXT.market.trade); set('.hp-label', TEXT.hud.hull);
  })();


  let canvas = document.getElementById('c');
  // low-res game buffer: 1 game pixel ≈ 1 CSS px on phones (Playdate-like
  // density), 2 on big screens. It's shown at an integer number of device
  // pixels per game pixel, so the dither stays crisp.
  // The scene is drawn in greys into a low-res buffer (one pixel per game
  // pixel), then turned into the two colours on the graphics card: a tiny
  // WebGL shader does the ordered dither (and the night's darkness) for every
  // pixel at once, straight onto the screen canvas. Without WebGL it falls
  // back to doing it in JavaScript (a pixel loop into a second buffer, then
  // scaled up), which is much slower (see ditherPass).
  // the shader, its quad and textures; run again if the browser drops and
  // restores the WebGL context (Android can, when the app goes to the background)
  function glSetup(g){
    const sh = (type, src)=>{ const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s); if(!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s)); return s; };
    const prog = g.createProgram();
    g.attachShader(prog, sh(g.VERTEX_SHADER, 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'));
    g.attachShader(prog, sh(g.FRAGMENT_SHADER, [
      'precision highp float;',
      'uniform sampler2D uImg, uMask, uBayer;',
      'uniform vec2 uGrid, uOff, uMaskSize;',      // game pixels across/down; dither offset (0..3); light mask size
      'uniform float uK, uH, uNight, uMB;',        // device px per game px; canvas height; darkness; mask block
      'uniform vec3 uPaper, uInk;',
      'void main(){',
      '  vec2 gp = floor(vec2(gl_FragCoord.x, uH - gl_FragCoord.y) / uK);',          // this game pixel (top-left origin)
      '  float lum = floor(texture2D(uImg, (gp + 0.5) / uGrid).r * 255.0 + 0.5);',

      '  float th = texture2D(uBayer, (mod(gp + uOff, 4.0) + 0.5) / 4.0).r * 255.0;',

  // frame; with WebGL it's uploaded as a texture, and drawing a frame this small

  const sceneCtx = (cv)=> cv.getContext('2d', SCENE_CTX);
  let ctx = buf.getContext('2d', (gl && !SCENE_ON_CPU) ? {} : {willReadFrequently:true});   // swapped briefly when baking island images

  // column on a wide screen (see #wrap in the CSS)

  const viewW = ()=> wrapEl.clientWidth || window.innerWidth, viewH = ()=> wrapEl.clientHeight || window.innerHeight;

    } else {

    }

  window.addEventListener('resize', resize);
  resize();

  // ---------- World setup ----------
  const WORLD = { w: WORLD_SIZE, h: WORLD_SIZE };   // (see WORLD_SIZE in Tuning)
  // The world is a torus: sail off one edge and you come back in on the
  // opposite one. Positions wrap, and distances always take the short way round.
  function wd(d,L){ return d - L*Math.round(d/L); }
  function wdx(a,b){ return wd(a-b, WORLD.w); }
  function wdy(a,b){ return wd(a-b, WORLD.h); }
  function wdist(ax,ay,bx,by){ return Math.hypot(wdx(ax,bx), wdy(ay,by)); }
  function wrapX(x){ return ((x%WORLD.w)+WORLD.w)%WORLD.w; }
  function wrapY(y){ return ((y%WORLD.h)+WORLD.h)%WORLD.h; }
  // Spatial hash on the wrapping world, so lookups ("any rock near here?")
  // only look at nearby cells instead of every object on the map.
  function SpatialGrid(cellWanted){
    const nx = Math.max(1, Math.round(WORLD.w/cellWanted)), ny = nx;
    const cell = WORLD.w/nx;                   // exact divisor, so cells tile the torus
    const cells = Array.from({length:nx*ny}, ()=>[]);
    const ci = (i,n)=>((i%n)+n)%n;
    let stamp = 0;
    const key = '_g'+nx;                       // per-grid visit stamp on each object

      remove(o){ for(const c of cells){ const k = c.indexOf(o); if(k >= 0) c.splice(k, 1); } },
      add(o,x,y,rad){
        for(let j=Math.floor((y-rad)/cell); j<=Math.floor((y+rad)/cell); j++)
          for(let i=Math.floor((x-rad)/cell); i<=Math.floor((x+rad)/cell); i++)
