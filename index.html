  // Collision damage: scales with how fast the boat was moving INTO the
  // obstacle (nx,ny is the outward normal), so grazing hurts less than
  // ramming. A short cooldown stops one bump from counting every frame.
  function impact(nx, ny){
    const vx = Math.cos(boat.angle)*boat.speed, vy = Math.sin(boat.angle)*boat.speed;
    const into = -(vx*nx + vy*ny);
    if(hitCooldown>0 || into < 4) return;
    const dmg = Math.max(1, Math.round(into/MAX_SPEED*HIT_MAX_DAMAGE));
    boat.health = Math.max(0, boat.health - dmg);
    hitCooldown = 0.6;
    // rebound: a push away from the surface, stronger for harder hits,
    // plus a small yaw so the bow swings off instead of re-hitting
    const kick = (20 + into*0.9)*1.15;                      // a bit more bounce than originally
    boat.rock = Math.min(2.5, (boat.rock||0) + 0.6 + into/MAX_SPEED);   // and she rocks for a while
    boat.kdamp = 3.5;
    boat.kx += nx*kick; boat.ky += ny*kick;
    const hx = Math.cos(boat.angle), hy = Math.sin(boat.angle);
    const cr = hx*ny - hy*nx;
    const side = Math.abs(cr) > 0.05 ? Math.sign(cr) : (Math.random()<0.5?-1:1);
    boat.angle += side * Math.min(0.3, 0.08 + into/MAX_SPEED*0.25);   // a small yaw so the bow swings off
    hurtFlash = 0.35;
    showHealth();
    Sfx.crash(Math.min(1, dmg/HIT_MAX_DAMAGE));
    buzz(dmg > 12 ? [70,35,90] : [45,25,45]);             // hull hit: a jolt, harder for big knocks
    shake = 0.25*Math.min(1, dmg/12);
    popups.push({x:boat.x, y:boat.y-20, text:'-'+dmg, life:1.1, max:1.1});
  }

  // wheel sounds: a soft knock every WHEEL_TICK of rotation, a quiet
  // wooden rub while turning, a muted thud at the stops
  const WHEEL_TICK = Math.PI/3;                // 60° → 6 knocks per turn
  let prevWheel = 0, wheelTickIdx = 0, wheelAtStop = false, lastTickT = 0;
  function wheelSound(dt){
    const angVel = Math.abs(wheelAngle-prevWheel)/Math.max(dt,1e-3);
    prevWheel = wheelAngle;
    const idx = Math.round(wheelAngle/WHEEL_TICK);
    if(idx!==wheelTickIdx){
      wheelTickIdx = idx;
      if(t-lastTickT > 0.09){            // never more than ~11 knocks/s
        lastTickT = t;
        const self = wheelPointer===null && !turnLeft && !turnRight;
        const k = Math.min(1, angVel/8);
        Sfx.tick((self?0.5:0.75)+0.25*k, (0.97+0.06*k)*(0.95+Math.random()*0.1));
        buzz(self ? 4 : 6, 60);                          // a click per spoke: under the finger, and softer as it spins back
      }
    }
    const atStop = Math.abs(wheelAngle) >= WHEEL_MAX-1e-4;
    if(atStop && !wheelAtStop && angVel>0.3){ Sfx.thunk(Math.min(1, 0.5+angVel/10)); buzz(22); }
    wheelAtStop = atStop;
    Sfx.wheel(angVel);
  }

  // ---------- Dialog: flavour text typed out letter by letter ----------
  const elDlg = document.getElementById('dialog');
  const elDlgTitle = document.getElementById('dlg-title');
  const elDlgText = document.getElementById('dlg-text');
  const elDlgFoot = document.getElementById('dlg-foot');
  const DLG_CPS = 32;               // letters per second
  let dlg = null;
  let camFx = 0, camFy = 0;         // camera focus (see update)
  function openDialog(title, text, pause){
    dlg = {text, shown:0, t:0, pause, ready:false};
    elDlgTitle.textContent = title;
    elDlgText.textContent = '';
    elDlgFoot.textContent = '';
    elDlg.classList.remove('hidden');
  }
  function closeDialog(){ dlg = null; elDlg.classList.add('hidden'); if(typeof closeMarket==='function') closeMarket(); }
  function updateDialog(dt){
    if(!dlg) return;
    dlg.t += dt;
    const before = Math.floor(dlg.shown);
    dlg.shown = Math.min(dlg.text.length, dlg.shown + dt*DLG_CPS);
    const n = Math.floor(dlg.shown);
    if(n!==before){
      elDlgText.textContent = dlg.text.slice(0,n);
      if(n%3===0 && dlg.text[n-1]!==' ') Sfx.type();
    }
    if(!dlg.ready && n>=dlg.text.length && dlg.t>=dlg.pause) dlg.ready = true;
  }
  // tap the box to show the whole text at once (the pause still runs)
  elDlg.addEventListener('pointerdown', ()=>{ if(dlg){ dlg.shown = dlg.text.length; elDlgText.textContent = dlg.text; } });
  const elGoTitle = document.getElementById('go-title');
  function showWin(){
    playing = false;
    boat.speed = 0;
    Sfx.wheel(0); Sfx.drone(0);
    closeDialog();
    const min = Math.floor(voyageTime/60), sec = Math.floor(voyageTime%60);
    elGoTitle.textContent = 'The banquet is served';
    elGoStats.textContent = 'You did the shopping in '+min+' min '+sec+' s, catching '+caught+' fish along the way.';
    gameover.classList.remove('hidden');
  }

  // ---------- Fishing ----------
  const FISH_STOP = 12;          // px/s: slow enough to count as stopped on a bank
  const FISH_SETTLE = 2;         // seconds stopped before the nets go over
  const NET_DROP = 1.4;          // net deploying animation
  const FISH_TIME_MIN = 2, FISH_TIME_MAX = 4;   // seconds with nets out before the haul (random each time)
  const NET_HAUL = 1.1;          // hauling animation
  let fishing = null;            // {bank, t, phase:'drop'|'wait'|'haul'|'cancel', ...}
  let settleT = 0;
  function bankUnderBoat(){
    for(const b of banks){
      if(b.state!=='live') continue;
      if(wdist(boat.x,boat.y,b.x,b.y) < b.r*0.9) return b;
    }
    return null;
  }
  function updateFishing(dt){
    for(let k=banks.length-1;k>=0;k--){
      const b = banks[k];
      b.t += dt; b.rot += dt*0.25;
      b.jumpT -= dt;
      if(b.jumpT<=0){ b.jumpT = rand(1.5,4.5); b.jump = {a:rand(0,6.3), d:rand(0.2,0.7)*b.r, t:0}; }
      if(b.jump){ b.jump.t += dt; if(b.jump.t>0.9) b.jump = null; }
      if(b.state==='scatter' && b.t > 1.8){ banks.splice(k,1); spawnBank(true, b.home); }
    }
    if(moor || boat.whirl){ fishing = null; settleT = 0; return; }
    const steering = turnLeft || turnRight || (wheelPointer!==null && Math.abs(wheelAngle) > 0.35);
    if(!fishing){
      const b = bankUnderBoat();
      if(b && boat.speed < FISH_STOP){
        settleT += dt;
        if(settleT >= FISH_SETTLE){
          fishing = {bank:b, t:0, phase:'drop', side: Math.random()<0.5?-1:1, dur: rand(FISH_TIME_MIN, FISH_TIME_MAX)};
          Sfx.splash();
          buzz(15);
        }
      } else settleT = 0;
      return;
    }
    const f = fishing;
    f.t += dt;
    // nets act like a sea anchor: the boat stays put while fishing
    boat.speed *= Math.exp(-3*dt); boat.kx *= Math.exp(-3*dt); boat.ky *= Math.exp(-3*dt);
    if(f.phase==='drop' && f.t>=NET_DROP){ f.phase='wait'; f.t=0; }
    else if(f.phase==='wait'){
      if(steering){ f.phase='cancel'; f.t=0; popups.push({x:boat.x, y:boat.y-22, text:'nets hauled in', life:1.3, max:1.3}); }
      else if(f.t>=f.dur){
        f.phase='haul'; f.t=0;
        let n = 1 + (Math.random()<0.5 ? 1 : 0);
        if(boonFish>0){ n *= 2; boonFish--; }
        const kind = FISH[f.bank.sec];
        counts[kind.key] += n; caught += n;
        popups.push({x:boat.x, y:boat.y-24, text:'+'+n+' '+(n===1?kind.one:kind.many), life:1.8, max:1.8});
        Sfx.pickup();
        buzz([15,50,25]);                           // fish in the boat
        f.bank.state='scatter'; f.bank.t=0;            // the school disperses
      }
    }
    else if((f.phase==='haul' || f.phase==='cancel') && f.t>=NET_HAUL){ fishing = null; settleT = 0; }
  }
  // 0..1 how far the net is out
  function netAmount(){
    if(!fishing) return 0;
    const f = fishing;
    if(f.phase==='drop') return Math.min(1, f.t/NET_DROP);
    if(f.phase==='wait') return 1;
    return Math.max(0, 1 - f.t/NET_HAUL);
  }

  // ---------- Fog of war ----------
  // The world is split into cells; the ones the boat has come within sight
  // of are remembered. Everything else sits under a soft, dotted fog.
  const FOG_CELL = 48, FOG_N = Math.round(WORLD.w/FOG_CELL);   // 7200/48 = 150 cells a side
  const SIGHT = 220;                   // how far around the boat you uncover
  const explored = new Uint8Array(FOG_N*FOG_N);
  const fci = (i)=>((i%FOG_N)+FOG_N)%FOG_N;
  function reveal(x,y){
    const r = SIGHT, C = FOG_CELL;
    for(let j=Math.floor((y-r)/C); j<=Math.floor((y+r)/C); j++)
      for(let i=Math.floor((x-r)/C); i<=Math.floor((x+r)/C); i++){
        const k = fci(j)*FOG_N + fci(i);
        if(explored[k]) continue;
        if(Math.hypot((i+0.5)*C - x, (j+0.5)*C - y) <= r) explored[k] = 1;
      }
  }
  const fogCv = document.createElement('canvas');
  const fogCtx = fogCv.getContext('2d');
  let fogImg = null;
  function drawFog(camX, camY, w, h){
    const C = FOG_CELL;
    const i0 = Math.floor(camX/C)-1, j0 = Math.floor(camY/C)-1;
    const nx = Math.ceil(w/C)+3, ny = Math.ceil(h/C)+3;
    if(fogCv.width!==nx || fogCv.height!==ny || !fogImg){ fogCv.width=nx; fogCv.height=ny; fogImg = fogCtx.createImageData(nx,ny); }
    const d = fogImg.data;
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      const p = (j*nx+i)*4;
      d[p]=d[p+1]=d[p+2]=0;
      const kk = fci(j0+j)*FOG_N + fci(i0+i);
      d[p+3] = (explored[kk] || buoyClear[kk]) ? 0 : 255;          // buoys and villages always show through   // solid black: no stray light dots
    }
    fogCtx.putImageData(fogImg,0,0);
    ctx.imageSmoothingEnabled = true;                 // soft edges between cells
    ctx.drawImage(fogCv, i0*C, j0*C, nx*C, ny*C);
  }

  // ---------- Rollers: big breaking waves ----------
  // Now and then a big wave rolls in from upwind, well away from any shore.
  // It builds up, breaks into tumbling foam, then fades out. Crossing its
  // crest head-on or broadside hurts; catching it from astern lets you surf.
  const rollers = [];
  const SURF_BOOST = 32;            // extra px/s while surfing
  let rollerT = 6;
  // crest offset (along the direction of travel) at u in -1..1: the middle
  // runs ahead, a slow swell rolls along the crest, the ends drag behind
  function rollerCrest(w, u){
    const p = w.t/w.dur;
    return w.bow*(1-u*u)
         + 2.2*Math.sin(u*4.5 + w.t*1.9 + w.seed) + 1.1*Math.sin(u*10 - w.t*2.7 + w.seed*2)
         - 5*Math.pow(Math.abs(u),3)*p;
  }
  function rollerStrength(w){       // 0..1 envelope: build, break, fade
    const p = w.t/w.dur;
    const sm = x=>{ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); };
    return p<0.3 ? sm(p/0.3) : p<0.7 ? 1 : 1 - sm((p-0.7)/0.3);
  }
  function spawnRoller(){
    const dw = windAngle + Math.PI, ux = Math.cos(dw), uy = Math.sin(dw);   // travel direction
    for(let tries=0; tries<20; tries++){
      const back = rand(60, 360), side = rand(-260, 260);
      const x = boat.x - ux*back - uy*side, y = boat.y - uy*back + ux*side;
      if(pierDist(wrapX(x),wrapY(y)).d < 280) continue;          // never inside or at a harbour
      // needs a bit of open water ahead of it (not right on a beach)
      let clear = true;
      for(let k=0;k<=2 && clear;k++) if(onLand(wrapX(x+ux*k*120), wrapY(y+uy*k*120), 70)) clear = false;
      if(!clear) continue;
      rollers.push({x, y, ux, uy, L: rand(45,75), bow: rand(5,8), thick: rand(9,13),
                    speed: rand(25,30), t:0, dur: rand(4,6), hit:false, broke:false, seed: rand(0,100)});
      return;
    }
  }
  function updateRollers(dt){
    if(!moor && playing){
      rollerT -= dt * (fishing ? 0.2 : 1);            // quieter seas while the nets are out
      if(rollerT<=0){
        const dg = danger(boat.x, boat.y);
        rollerT = rand(0.8,1.2) * (5.5 - 3.2*dg);        // a bit rarer near home, more frequent far out
        if(rollers.length < 6 && dg > 0.05) spawnRoller();
      }
    }
    for(let k=rollers.length-1;k>=0;k--){
      const w = rollers[k];
      w.t += dt;
      w.x += w.ux*w.speed*dt; w.y += w.uy*w.speed*dt;
      if(onLand(wrapX(w.x+w.ux*40), wrapY(w.y+w.uy*40), 60) || pierDist(wrapX(w.x),wrapY(w.y)).d < 170)
        w.t = Math.max(w.t, w.dur*0.75);                  // dies on shoaling water or at a harbour mouth
      const s = rollerStrength(w);
      const dx = wdx(boat.x, w.x), dy = wdy(boat.y, w.y);
      const dist = Math.hypot(dx,dy);
      // it breaks: a roar, louder the closer it is
      if(!w.broke && w.t > w.dur*0.3){ w.broke = true; if(dist < 700) Sfx.waveBreak(Math.max(0.15, 1-dist/700), Math.max(-0.8,Math.min(0.8,dx/400))); }
      if(w.t >= w.dur){ rollers.splice(k,1); continue; }
      if(w.hit || moor || boat.whirl || s < 0.55) continue;
      // boat in wave frame: across = along travel, along = along the crest
      const across = dx*w.ux + dy*w.uy, along = -dx*w.uy + dy*w.ux;
      const u = along/(w.L/2);
      if(Math.abs(u) >= 1) continue;
      const crest = rollerCrest(w, u);                    // the middle runs ahead, the crest undulates
      const half = w.thick*0.6*Math.pow(1-u*u,0.5) + boat.r*0.5;
      if(Math.abs(across - crest) > half) continue;
      w.hit = true;
      const c = Math.cos(boat.angle)*w.ux + Math.sin(boat.angle)*w.uy;   // 1 = sailing with the wave
      if(c > 0.55){
        boat.surfT = 2.6;
        popups.push({x:boat.x, y:boat.y-24, text:'surf!', life:1.4, max:1.4});
        Sfx.surf();
        boat.rock = Math.min(2.5, (boat.rock||0) + 0.8);
        buzz([180,50,120,50,70]);                   // riding the wave: a sustained rumble
      } else {
        const k2 = s*(0.6 + 0.4*(1-Math.max(0,c)));        // head-on and broadside hurt most
        const dmg = Math.round(6 + 10*k2);
        boat.health = Math.max(0, boat.health - dmg);
        boat.kx += w.ux*45*s; boat.ky += w.uy*45*s; boat.kdamp = 2.2;
        boat.speed *= 0.4;
        boat.angle += (Math.random()<0.5?-1:1)*0.25*k2;
        hurtFlash = 0.35; shake = 0.28; showHealth();
        popups.push({x:boat.x, y:boat.y-24, text:'-'+dmg, life:1.1, max:1.1});
        Sfx.waveHit(k2);
        boat.rock = Math.min(2.5, (boat.rock||0) + 1.6*k2);
        buzz([60,30,80]);                           // slapped by a wave
      }
    }
  }
  // the wave: a dark, steepening face along a bowed crest line, tapered at
  // the ends; once it breaks, white foam tumbles along the crest and spills
  // back, and as it fades the foam thins into scattered specks
  function drawRoller(w){
    if(!inView(w.x, w.y, w.L)) return;
    const s = rollerStrength(w), p = w.t/w.dur;
    const fx = w.ux, fy = w.uy, cx = -fy, cy = fx;       // travel / crest directions
    const N = 30;
    // the swell rises from the middle outward, and dies back from the ends
    const reach = Math.min(1, 0.3 + 0.7*Math.min(1, p/0.3)) * (p>0.75 ? 1 - (p-0.75)/0.25*0.45 : 1);
    const P = (u, off)=>{                                // u -1..1 along crest, off along travel
      const c = rollerCrest(w, u);
      return [w.x + cx*u*w.L/2 + fx*(c+off), w.y + cy*u*w.L/2 + fy*(c+off)];
    };
    // thickness: tapered ends, breathing, a little lumpy along the crest
    const taper = u=> Math.pow(Math.max(0,1-(u/reach)*(u/reach)), 0.6);
    const thick = u=> w.thick*taper(u)*(0.5+0.5*s)*(0.85 + 0.15*Math.sin(u*7 + w.t*2.3 + w.seed));
    const span = (fn)=>{ for(let i=0;i<=N;i++){ const u=(-1+2*i/N)*reach; fn(u,i); } };
    // the swell: soft overlapping patches of darker water along the crest,
    // each breathing on its own, so the wave reads as moving water
    for(let i=0;i<=N;i+=1){
      const u = (-1+2*i/N)*reach, tp = taper(u);
      if(tp < 0.05) continue;
      const th = thick(u), wob = Math.sin(w.t*2.2 + i*0.9 + w.seed);
      const [x,y] = P(u, -th*(0.45 + 0.12*wob));
      const r = th*(0.7 + 0.18*Math.sin(i*1.3 + w.t*1.6));
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, 'rgba(0,0,0,'+(0.14*s*tp)+')'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // crest: a broken, stippled line that comes and goes along its length
    ctx.strokeStyle = INKC; ctx.lineWidth = 1.2; ctx.lineCap='round';
    for(let i=0;i<N;i++){
      const u0=(-1+2*i/N)*reach, u1=(-1+2*(i+0.75)/N)*reach;
      const flick = 0.5 + 0.5*Math.sin(w.t*3.1 + i*1.7 + w.seed);
      if(flick < 0.25) continue;
      ctx.globalAlpha = Math.min(1, s*flick*taper((u0+u1)/2)*1.2);
      const [x0,y0]=P(u0,0), [x1,y1]=P(u1,0);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    // back of the wave: a few ripples trailing behind, stretched by the swell
    ctx.lineWidth = 1;
    for(let k=0;k<5;k++){
      const u = (-0.7 + 0.35*k)*reach, back = -thick(u)*(1.5 + 0.4*Math.sin(w.t*1.7+k)), l = 0.08;
      ctx.globalAlpha = s*0.45;
      const [x0,y0]=P(u-l,back), [x1,y1]=P(u+l,back-1.5);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // foam: tumbling blobs on the crest while breaking, spilling back and
    // breaking up into specks as the wave dies
    const foam = p<0.25 ? 0 : p<0.35 ? (p-0.25)/0.1 : 1;
    if(foam>0){
      const spill = Math.max(0, (p-0.55)/0.45);           // 0 → 1 over the fade
      // white water riding the crest (ink edge, paper body), thinning as it fades
      const bw = 3.2*foam*(1-spill*0.8);
      if(bw>0.8){
        const crestPath = ()=>{ ctx.beginPath(); for(let i=0;i<=N;i++){ const u=(-0.9+1.8*i/N)*reach; const [x,y]=P(u, Math.sin(w.t*3+i)*0.8 - spill*6); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); } };
        ctx.globalAlpha = Math.min(1, s*1.3); ctx.lineCap='round';
        ctx.strokeStyle = INKC; ctx.lineWidth = bw+2; crestPath(); ctx.stroke();
        ctx.strokeStyle = PAPERC; ctx.lineWidth = bw; crestPath(); ctx.stroke();
      }
      const nb = Math.floor(w.L/7);
      for(let i=0;i<nb;i++){
        const h = Math.sin(w.seed + i*12.9898)*43758.5453, rr = h - Math.floor(h);
        const u = (-0.95 + 1.9*(i+rr*0.8)/nb + 0.04*Math.sin(w.t*1.3 + i))*reach;   // foam slides along the crest
        const tw = taper(u);
        if(tw < 0.15) continue;
        const roll = Math.sin(w.t*4 + i*1.7)*2.2;          // tumbling
        const back = -spill*w.thick*1.4*(0.4+rr);
        const [x,y] = P(u, roll*0.5 + back);
        const r = (1.4 + 1.9*rr)*tw*foam*(1 - spill*0.7);
        if(r < 0.5) continue;
        ctx.globalAlpha = Math.min(1, s*1.3);
        ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
        if(spill < 0.6){ ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.stroke(); }
        // little curls thrown ahead of the crest
        if(i%3===0 && spill<0.3){
          const [qx,qy] = P(u, 5+roll);
          ctx.beginPath(); ctx.arc(qx,qy,2.4*tw,Math.atan2(fy,fx)-2.2,Math.atan2(fy,fx)+0.6); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Powers from the ruins ----------
  const BOONS = {
    wind: { title:'the friendly wind', text:"the wind changes its voice and settles at your back. For a minute it will blow from astern, wherever you go." },
    fish: { title:'the blessed nets', text:"the water round the pier fills with flashes of silver. Your next three hauls will bring twice the fish." },
    heal: { title:'the hull reborn', text:"the planks of the boat creak and close up on their own, good as new. The hull is whole again." }
  };
  let boonWindT = 0, boonFish = 0;
  const elBoon = document.getElementById('boon');
  function updateBoonBadge(){
    const parts = [];
    if(boonWindT>0) parts.push('friendly wind ' + Math.ceil(boonWindT) + ' s');
    if(boonFish>0) parts.push('blessed nets ×' + boonFish);
    elBoon.textContent = parts.length ? '✦ ' + parts.join('  ·  ') : '';
    elBoon.classList.toggle('show', parts.length>0);
  }
  function startRuin(r){
    const now = voyageTime;
    if(now < r.readyAt){
      openDialog(r.name, "The stones are silent. The wind passes between the columns without a word: whatever dwells here is still resting. Come back later.", 3);
      return;
    }
    r.readyAt = now + RUIN_COOLDOWN;
    const keys = Object.keys(BOONS), k = keys[Math.floor(Math.random()*keys.length)];
    const b = BOONS[k];
    if(k==='wind'){ boonWindT = 60; shiftDur = 0; }
    if(k==='fish') boonFish = 3;
    if(k==='heal'){ boat.health = MAX_HEALTH; showHealth(); }
    Sfx.bell(); buzz([14,22,14,22,14,22,14,22,14,22,40]);   // the ruins' power: a quick flutter
    openDialog(r.name + ' · ' + b.title,
      "You walk among the broken columns and the fallen drums in the grass. On an altar worn by the wind there is a carved sign no one can read any more. You touch it with your fingers and " + b.text, 5);
  }

  // ---------- Village market ----------
  // Docked at a village: a stall where you trade the fish that village
  // wants (from the far side of the map) for its food, or sell a fish to
  // patch the hull. The wheel casts off whenever you like.
  const elMk = document.getElementById('market');
  const elMkTitle = document.getElementById('mk-title'), elMkText = document.getElementById('mk-text');
  const elMkBuy = document.getElementById('mk-buy'), elMkFoot = document.getElementById('mk-foot'), elMkPrice = document.getElementById('mk-price');
  let marketV = null, mkLast = '';
  // what a village takes: fish from other waters, plus at most LOCAL_MAX of its own
  const foreignFish = (v, c)=> FISH_KEYS.filter(k=>k!==v.own).reduce((a,k)=>a+(c||counts)[k],0);
  const usable = (v, c)=> foreignFish(v,c) + Math.min(LOCAL_MAX, (c||counts)[v.own]);
  const canAfford = (v, c)=> foreignFish(v,c) >= FOOD_PRICE-LOCAL_MAX && usable(v,c) >= FOOD_PRICE;
  const accepted = (v)=> usable(v);
  function openMarket(v){
    marketV = v; mkLast=''; elMk.classList.remove('hidden'); renderMarket();
    document.body.classList.add('at-market');
    if(elList.classList.contains('open')) toggleList(false);
  }
  function closeMarket(){ marketV = null; elMk.classList.add('hidden'); document.body.classList.remove('at-market'); }
  function renderMarket(){
    if(!marketV) return;
    const v = marketV, have = accepted(v);
    const full = boat.health >= MAX_HEALTH-0.5;
    const buy = v.done ? '✓ '+v.food+' already aboard' : 'Buy '+v.food+'  ('+Math.min(have,FOOD_PRICE)+'/'+FOOD_PRICE+')';
    const others = FISH_KEYS.filter(k=>k!==v.own);
    // told with the same fish icons as the counters round the compass
    const ico = k => '<span class="mk-fish" title="'+FISH_NAME[k].many+'">'+document.querySelector('#wood .fish-'+k+' svg').outerHTML+'</span>';
    const price = '<div class="mk-row"><b>Price: '+FOOD_PRICE+' fish</b></div>'
      + '<div class="mk-row">'+others.map(ico).join('')+'<span class="mk-rule">any</span></div>'
      + '<div class="mk-row">'+ico(v.own)+'<span class="mk-rule">max '+LOCAL_MAX+'</span></div>';
    const key = [v.name,buy,price,v.done,have,full,fishTotal()].join('|');
    if(key===mkLast) return;
    mkLast = key;
    elMkTitle.textContent = v.name + ' market';
    elMkText.textContent = v.done ? "You've done your shopping here. They wave you off from the quay." : v.line;
    elMkPrice.innerHTML = v.done ? '' : price;
    elMkBuy.textContent = buy;
    elMkBuy.disabled = v.done || !canAfford(v);
    elMkBuy.classList.toggle('done', v.done);
    elMkFoot.textContent = '';
  }
  elMkBuy.addEventListener('click', ()=>{
    const v = marketV; if(!v || v.done || !canAfford(v)) return;
    // local fish first (up to the limit: they're worth least here), then the biggest piles
    let paid = 0;
    const loc = Math.min(LOCAL_MAX, counts[v.own]);
    counts[v.own] -= loc; paid += loc;
    while(paid < FOOD_PRICE){
      const k = FISH_KEYS.filter(k=>k!==v.own && counts[k]>0).reduce((a,b)=>counts[b]>counts[a]?b:a);
      counts[k]--; paid++;
    }
    v.done = true;
    Sfx.coins(); buzz([15,40,15,40,55]);   // deal done: coins on the counter
    if(elList.classList.contains('open')) renderList();
    popups.push({x:boat.x, y:boat.y-26, text:'+ '+v.food, life:1.8, max:1.8});
    renderMarket();
  });

  // ---------- Night sounds ----------
  // After dark: crickets chirping (louder near land) and, now and then,
  // a howl from some island far off, sometimes answered.
  let cricketT = 0.5, howlT = 12;
  // crickets come and go in spells; everything is placed on actual islands
  let crGate = 0, crTarget = 1, crPhaseT = 12;
  function updateNightSound(dt){
    const n = typeof NIGHT==='number' ? NIGHT : 0;
    if(!playing || n < 0.3) return;
    const k = (n-0.3)/0.7;
    // spells: on for a while, then a hush
    crPhaseT -= dt;
    if(crPhaseT <= 0){ crTarget = crTarget ? 0 : 1; crPhaseT = crTarget ? rand(8,18) : rand(6,14); }
    crGate += (crTarget - crGate)*Math.min(1, dt*0.5);
    // nearby islands: the crickets live there
    const near = [];
    islandGrid.query(boat.x, boat.y, 650, isl=>{
      const dx = wdx(isl.x, boat.x), dy = wdy(isl.y, boat.y), d = Math.max(0, Math.hypot(dx,dy) - isl.R*0.7);
      if(d < 650) near.push([isl, dx, d]);
    });
    if(near.length && crGate > 0.05){
      cricketT -= dt*(0.8 + 1.8*k)*crGate*Math.min(3, near.length);
      if(cricketT <= 0){
        cricketT = rand(0.2, 0.7);
        const [isl, dx, d] = near[Math.floor(Math.random()*near.length)];
        const v = Math.max(0, 1 - d/650);
        Sfx.cricket(0.013*k*v*crGate*rand(0.6,1), Math.max(-0.9, Math.min(0.9, dx/350)));
      }
    }
    // a howl from some island further off, sometimes answered from another
    howlT -= dt*k;
    if(howlT <= 0){
      howlT = rand(24, 55);
      const far = [];
      islandGrid.query(boat.x, boat.y, 1300, isl=>{ const dx=wdx(isl.x,boat.x), dy=wdy(isl.y,boat.y), d=Math.hypot(dx,dy); if(d > 250 && !isl.home && !isl.village) far.push([dx,d]); });
      if(far.length){
        const [dx,d] = far[Math.floor(Math.random()*far.length)];
        const v = 0.016*k*(1 - 0.5*d/1300);
        Sfx.howl(v, Math.max(-0.9, Math.min(0.9, dx/500)));
        if(far.length > 1 && Math.random() < 0.45){
          const [dx2,d2] = far[Math.floor(Math.random()*far.length)];
          setTimeout(()=> Sfx.howl(0.011*k*(1 - 0.5*d2/1300), Math.max(-0.9, Math.min(0.9, dx2/500))), rand(1800,3500));
        }
      }
    }
  }


  // ---------- Town sounds ----------
  let townEvT = 1, chatT = 0;
  const TOWN_VOL = 0.6;               // overall loudness of the town sounds
  const TOWN_EVENTS = ['hammer','hammer','call','call','call','cart','clink','laugh','bell'];
  function updateTownSound(dt){
    let best = 0, pan = 0;
    for(const v of VILLAGES){
      const dx = wdx(v.isl.x, boat.x), dy = wdy(v.isl.y, boat.y), d = Math.hypot(dx,dy);
      const lv = Math.max(0, Math.min(1, 1 - (d-70)/430));
      if(lv > best){ best = lv; pan = Math.max(-1, Math.min(1, dx/300)); }
    }
    const quiet = 1 - 0.55*(typeof NIGHT==='number' ? NIGHT : 0);   // hushed at night
    const lvl = playing ? best*quiet : 0;
    if(lvl > 0.05){
      chatT -= dt;
      if(chatT <= 0){                                   // background crowd: overlapping words
        chatT = rand(0.07, 0.22) / (0.3 + lvl);
        Sfx.chatter(TOWN_VOL*0.025*lvl*rand(0.5,1), Math.max(-0.9, Math.min(0.9, pan + rand(-0.5,0.5))));
      }
      townEvT -= dt*(0.4 + lvl);
      if(townEvT <= 0){
        townEvT = rand(0.9, 2.6);
        const kind = TOWN_EVENTS[Math.floor(Math.random()*TOWN_EVENTS.length)];
        Sfx.townEvent(kind, TOWN_VOL*lvl, Math.max(-0.9, Math.min(0.9, pan + rand(-0.3,0.3))));
      }

  // ---------- Wind streaks ----------
  // Now and then a long, thin line of wind sweeps across the view in the
  // direction the wind blows, sometimes ending in a little curl.
  const streaks = [];
  let streakT = 1;
  function makeStreakPath(){
    // a wavy line along +x that ends in a tightening curl (in local units)
    const pts = [[0,0]], L = rand(40, 70), amp = rand(1.5,3), fr = rand(0.05,0.08), ph = rand(0,6.3);
    for(let u=3; u<=L; u+=3) pts.push([u, Math.sin(u*fr+ph)*amp*(0.4+0.6*u/L)]);
    const [ex,ey] = pts[pts.length-1], dirUp = Math.random()<0.5 ? -1 : 1;
    let r = rand(4,6.5), a = -dirUp*Math.PI/2;
    const cx = ex, cy = ey + dirUp*r;
    for(let k=0;k<13;k++){ a += dirUp*0.38; r *= 0.94; pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]); }
    const cum = [0]; for(let k=1;k<pts.length;k++) cum.push(cum[k-1] + Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1]));
    return {pts, cum, len: cum[cum.length-1]};
  }
  function updateStreaks(dt){
    streakT -= dt;
    if(streakT <= 0){
      streakT = rand(1.2, 2.8) / (0.5 + windStrength);
      const dw = windAngle + Math.PI;
      const a = rand(0,Math.PI*2), d = rand(40, 260);
      streaks.push({x: boat.x + Math.cos(a)*d, y: boat.y + Math.sin(a)*d, ang: dw + rand(-0.15,0.15),
                    drift: rand(12, 22), age: 0, life: rand(1.8, 2.6), path: makeStreakPath(), wig: rand(0,6.3)});
    }
    const dw = windAngle + Math.PI;
    for(let k=streaks.length-1;k>=0;k--){
      const s = streaks[k];
      s.age += dt; s.x += Math.cos(dw)*s.drift*dt; s.y += Math.sin(dw)*s.drift*dt;   // barely drifting
      if(s.age >= s.life) streaks.splice(k,1);
    }
  }
  function drawStreaks(){
    ctx.strokeStyle = INKC; ctx.lineCap = 'round'; ctx.lineWidth = 1.2;
    for(const s of streaks){
      if(!inView(s.x, s.y, 140)) continue;
      const p = s.age/s.life, P = s.path;
      // the line draws itself out (head advancing), then the tail catches up
      const head = P.len * Math.min(1, p/0.55), tail = P.len * Math.max(0, (p-0.45)/0.55);
      const ca = Math.cos(s.ang), sa = Math.sin(s.ang);
      ctx.globalAlpha = 0.65 * Math.min(1, p*9, (1-p)*9);        // quick fade in and out
      ctx.beginPath();
      let started = false;
      for(let k=0;k<P.pts.length;k++){
        const c = P.cum[k];
        if(c < tail || c > head) continue;
        const wig = Math.sin(s.age*3 + k*0.4 + s.wig)*0.5;          // a slight ripple along the line
        const lx = P.pts[k][0], ly = P.pts[k][1] + wig;
        const x = s.x + lx*ca - ly*sa, y = s.y + lx*sa + ly*ca;
        if(started) ctx.lineTo(x,y); else { ctx.moveTo(x,y); started = true; }
      }
      if(started) ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Buoys and a village's waters ----------
  // a small window in the fog round every buoy, so they can be spotted
  // and followed before the waters are explored
  const buoyClear = new Uint8Array(FOG_N*FOG_N);
  for(const b of buoys){
    const C = FOG_CELL, r = 66;
    for(let j=Math.floor((b.y-r)/C); j<=Math.floor((b.y+r)/C); j++)
      for(let i=Math.floor((b.x-r)/C); i<=Math.floor((b.x+r)/C); i++)
        if(Math.hypot((i+0.5)*C - b.x, (j+0.5)*C - b.y) <= r) buoyClear[fci(j)*FOG_N + fci(i)] = 1;
  }
  // and a wide one round every village, so the towns can be seen from
  // afar and steered for
  const VILLAGE_CLEAR = 340;
  for(const v of VILLAGES){
    const C = FOG_CELL, r = VILLAGE_CLEAR, x = v.isl.x, y = v.isl.y;
    for(let j=Math.floor((y-r)/C); j<=Math.floor((y+r)/C); j++)
      for(let i=Math.floor((x-r)/C); i<=Math.floor((x+r)/C); i++)
        if(Math.hypot((i+0.5)*C - x, (j+0.5)*C - y) <= r) buoyClear[fci(j)*FOG_N + fci(i)] = 1;
  }
  const elToast = document.getElementById('toast');
  let toastT = 0;
  function toast(text){ elToast.textContent = text; elToast.classList.add('show'); toastT = 3.2; }
  function updateWaters(dt){
    if(toastT > 0){ toastT -= dt; if(toastT <= 0) elToast.classList.remove('show'); }
    // brushing past a buoy: it doesn't stop you, it just rocks and knocks
    for(const b of buoys){
      b.wob = Math.max(0, (b.wob||0) - dt*0.7);
      b.cool = Math.max(0, (b.cool||0) - dt);
      if(b.cool > 0 || moor) continue;
      const dx = wdx(b.x, boat.x), dy = wdy(b.y, boat.y);
      if(Math.abs(dx) < 18 && Math.abs(dy) < 18 && Math.hypot(dx,dy) < 16){
        b.wob = 1; b.cool = 1.2;
        b.wdir = Math.sign(dx*Math.sin(boat.angle) - dy*Math.cos(boat.angle)) || 1;   // tips away from the hull
        buzz([22,35,14]); Sfx.buoy();
      }
    }
    for(const v of VILLAGES){
      const d = wdist(boat.x, boat.y, v.isl.x, v.isl.y);
      if(!v.inside && d < BUOY_R){
        v.inside = true;
        if(playing){ toast('Entering the waters of ' + v.name); buzz([12,40,12]); }
      } else if(v.inside && d > BUOY_R + 150) v.inside = false;
    }
  }
  // a buoy: a striped float riding the swell, a pole with a cone topmark,
  // and a small lamp that blinks after dusk
  function drawBuoy(b){
    if(!inView(b.x, b.y, 20)) return;
    const w = b.wob||0, bob = Math.sin(t*1.8 + b.ph)*1.2 + w*Math.sin(t*11)*1.5;
    const tilt = Math.sin(t*1.3 + b.ph)*0.18 + w*w*(b.wdir||1)*0.7*Math.cos(t*8);   // a knock sets it rocking, dying away
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.5;                          // ripple ring
    ctx.beginPath(); ctx.ellipse(0, 2, 8 + Math.sin(t*1.8+b.ph), 3.5, 0, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = V(0.4); ctx.beginPath(); ctx.ellipse(2.5, 3, 5, 2.4, 0, 0, Math.PI*2); ctx.fill();   // shadow
    ctx.translate(0, -bob); ctx.rotate(tilt);
    ctx.fillStyle = PAPERC; ctx.strokeStyle = INKC; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,4.6,0,Math.PI*2); ctx.clip();                         // bands
    ctx.fillStyle = INKC; ctx.fillRect(-5,-1.2,10,2.4); ctx.restore();
    ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,-11); ctx.stroke();           // pole
    ctx.fillStyle = INKC; ctx.beginPath(); ctx.moveTo(-3,-10); ctx.lineTo(3,-10); ctx.lineTo(0,-15); ctx.closePath(); ctx.fill();   // topmark
    if((typeof NIGHT==='number' ? NIGHT : 0) > 0.3 && Math.sin(t*2.2 + b.ph) > 0.6){
      ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(0,-16.5,1.8,0,Math.PI*2); ctx.fill();         // blinking lamp
    }
    ctx.restore();
  }

  // ---------- Traders ----------
  function updateTraders(dt){
    for(const tr of traders){
      if(tr.wait > 0){
        tr.wait -= dt;
        if(tr.wait <= 0){                                   // pick the next lane from this port
          const port = tr.dir > 0 ? tr.lane.b : tr.lane.a;
          const opts = lanes.filter(L=> (L.a===port || L.b===port) && L!==tr.lane);
          const L = opts.length ? opts[Math.floor(Math.random()*opts.length)] : tr.lane;
          tr.lane = L; tr.dir = L.a===port ? 1 : -1; tr.s = tr.dir > 0 ? 0 : L.len;
        }
      } else {
        tr.s += tr.dir*tr.speed*dt;                          // she keeps to her lane, whoever is about
        if(tr.s <= 0 || tr.s >= tr.lane.len){ tr.s = Math.max(0, Math.min(tr.lane.len, tr.s)); tr.wait = rand(5,10); }
      }
      const [x,y,a] = lanePoint(tr.lane, tr.s);
      const ha = tr.dir > 0 ? a : a + Math.PI;               // her heading
      // run into her and she's shoved aside: she drifts off, spins a little,
      // then eases back onto her lane and carries on
      tr.kvx *= Math.exp(-3*dt); tr.kvy *= Math.exp(-3*dt);
      tr.kx += tr.kvx*dt; tr.ky += tr.kvy*dt;
      tr.kx *= Math.exp(-0.5*dt); tr.ky *= Math.exp(-0.5*dt);
      tr.yv *= Math.exp(-2.5*dt); tr.yaw += tr.yv*dt; tr.yaw *= Math.exp(-0.8*dt);
      tr.bumpCool = Math.max(0, tr.bumpCool - dt);
      if((tr.kx || tr.ky) && onLand(wrapX(x + tr.kx), wrapY(y + tr.ky), 10)){ tr.kvx = tr.kvy = 0; tr.kx *= 0.9; tr.ky *= 0.9; }   // never onto the shore
      tr.x = wrapX(x + tr.kx); tr.y = wrapY(y + tr.ky);
      if(!moor){
        const dx = wdx(tr.x, boat.x), dy = wdy(tr.y, boat.y), d = Math.hypot(dx,dy), R = boat.r + 13;   // from the boat to her
        if(d < R){
          const nx = d > 0.01 ? dx/d : Math.cos(boat.angle), ny = d > 0.01 ? dy/d : Math.sin(boat.angle);
          tr.kx += nx*(R-d); tr.ky += ny*(R-d);              // out of the way, at once
          tr.x = wrapX(x + tr.kx); tr.y = wrapY(y + tr.ky);
          if(tr.bumpCool <= 0){
            tr.bumpCool = 0.8;
            const push = 18 + Math.abs(boat.speed)*0.8;
            tr.kvx += nx*push; tr.kvy += ny*push;
            tr.yv += (Math.cos(boat.angle)*ny - Math.sin(boat.angle)*nx > 0 ? 1 : -1)*(0.6 + Math.abs(boat.speed)/MAX_SPEED);
            boat.speed *= 0.85;                               // a nudge you feel, no harm done
            boat.rock = Math.min(2.5, (boat.rock||0) + 0.3);
            buzz([18,30,10]); Sfx.buoy(); Sfx.thunk(0.25);
          }
        }
      }
      // foam from the propeller: churned up astern, spreading and fading
      for(let k=tr.foam.length-1;k>=0;k--){ const f = tr.foam[k]; f.age += dt; f.x += f.vx*dt; f.y += f.vy*dt; if(f.age >= f.life) tr.foam.splice(k,1); }
      if(tr.wait <= 0){
        tr.foamT -= dt;
        if(tr.foamT <= 0){
          tr.foamT = 0.07;
          const ca = Math.cos(tr.a), sa = Math.sin(tr.a), sx = tr.x - ca*18, sy = tr.y - sa*18;
          for(const sd of [-1,1]) tr.foam.push({x: sx - sa*sd*2, y: sy + ca*sd*2, vx: -sa*sd*9 - ca*4, vy: ca*sd*9 - sa*4, age: 0, life: rand(1.2,1.8)});
        }
      }
      if(tr.wait <= 0) tr.a = ha;
      // passing close: a hail across the water (a speech bubble and a voice)
      tr.talkCool = Math.max(0, tr.talkCool - dt); tr.talkT = Math.max(0, tr.talkT - dt);
      const pd = wdist(boat.x, boat.y, tr.x, tr.y);
      if(pd < 150 && tr.talkCool <= 0 && playing && !moor){
        tr.talkT = 2.8; tr.talkCool = rand(14, 22);
        tr.marks = Array.from({length: 2 + Math.floor(rand(0,2))}, ()=> rand(0.45, 1));   // scribbled 'words'
        const pan = Math.max(-0.9, Math.min(0.9, wdx(tr.x, boat.x)/260)), vol = 0.16*(1 - pd/220);
        Sfx.chatter(vol, pan); setTimeout(()=> Sfx.chatter(vol*0.9, pan), 380); setTimeout(()=> Sfx.chatter(vol*0.8, pan), 900);
      }
    }
  }
  // a trader is a little motor boat (a gozzo with a wheelhouse): no sail
  // to trim, just the outboard churning a white wake behind her
  function drawTrader(tr){
    // wake first (it may reach into view before the boat does)
    for(const f of tr.foam){
      if(!inView(f.x, f.y, 8)) continue;
      const k = f.age/f.life;
      ctx.globalAlpha = (1-k)*0.9;
      ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(f.x, f.y, 1.2 + k*3.2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = INKC; ctx.lineWidth = 0.8; ctx.globalAlpha = (1-k)*0.5; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if(!inView(tr.x, tr.y, 30)) return;
    const bob = Math.sin(t*1.4 + tr.ph)*0.5, roll = Math.sin(t*1.9 + tr.ph)*0.04;
    ctx.save(); ctx.translate(tr.x, tr.y - bob); ctx.rotate(tr.a + tr.yaw);
    ctx.save(); ctx.scale(1, 1 - Math.abs(roll));
    const hull = ()=>{ ctx.beginPath(); ctx.moveTo(19,0); ctx.quadraticCurveTo(11,-8.5,-4,-8); ctx.lineTo(-14,-6); ctx.quadraticCurveTo(-16,0,-14,6); ctx.lineTo(-4,8); ctx.quadraticCurveTo(11,8.5,19,0); ctx.closePath(); };
    ctx.save(); ctx.translate(2.5,3); ctx.fillStyle=V(0.45); hull(); ctx.fill(); ctx.restore();   // shadow
    ctx.fillStyle=PAPERC; hull(); ctx.fill();
    ctx.fillStyle=V(0.55); ctx.beginPath(); ctx.moveTo(19,0); ctx.quadraticCurveTo(11,8.5,-4,8); ctx.lineTo(-14,6); ctx.quadraticCurveTo(-15,3,-14,1.5); ctx.lineTo(18,0.5); ctx.closePath(); ctx.fill();   // shaded side
    ctx.strokeStyle=INKC; ctx.lineWidth=1.5; hull(); ctx.stroke();
    ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-12,0); ctx.stroke();                     // keel line
    // wheelhouse: a little cabin with a dark window band and a flat roof
    ctx.fillStyle=V(0.3); ctx.fillRect(-7.5,-4.8+1.2,11,9.6);
    ctx.fillStyle=PAPERC; ctx.fillRect(-8.5,-4.8,11,9.6);
    ctx.strokeStyle=INKC; ctx.lineWidth=1.2; ctx.strokeRect(-8.5,-4.8,11,9.6);
    ctx.fillStyle=INKC; ctx.fillRect(1,-3.6,1.4,7.2);                                                         // windscreen
    ctx.fillRect(-7,-4.8,1.1,1.1); ctx.fillRect(-7,3.7,1.1,1.1);                                               // rails
    ctx.beginPath(); ctx.moveTo(-3,-1); ctx.lineTo(-3,-7); ctx.stroke();                                       // a little mast with a pennant
    ctx.fillStyle=INKC; ctx.beginPath(); ctx.moveTo(-3,-7); ctx.lineTo(-6.5+Math.sin(t*6+tr.ph), -6.2); ctx.lineTo(-3,-5.4); ctx.closePath(); ctx.fill();
    // outboard motor on the transom
    ctx.fillStyle=INKC; ctx.fillRect(-18,-1.8,3.5,3.6);
    ctx.restore();
    ctx.restore();
    // the speech bubble: a scrawl of 'words' nobody could read, and a tail
    if(tr.talkT > 0){
      const k = tr.talkT/2.8, a = Math.min(1, (1-k)*8, k*5), bw = 34, bh = 14 + 5*(tr.marks.length-2);
      const bx = tr.x - bw/2, by = tr.y - 26 - bh - (1-k)*4;
      ctx.globalAlpha = a;
      ctx.fillStyle = PAPERC; ctx.strokeStyle = INKC; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tr.x-4, by+bh-0.5); ctx.lineTo(tr.x-1, by+bh+6); ctx.lineTo(tr.x+3, by+bh-0.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tr.x-4, by+bh); ctx.lineTo(tr.x-1, by+bh+6); ctx.lineTo(tr.x+3, by+bh); ctx.stroke();
      ctx.lineWidth = 1; ctx.beginPath();
      tr.marks.forEach((m,i)=>{ const y0 = by + 5 + i*4.5, x1 = bx + 5 + (bw-10)*m;
        ctx.moveTo(bx+5, y0); for(let x=bx+5; x<x1; x+=2.5) ctx.lineTo(x+1.25, y0 + ((x*7|0)%3 - 1)*0.8); });
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Update ----------
  let last = performance.now();
  function update(dt){
    const helmFree = !(anchored && weighT <= 0);          // the wheel is stowed while at anchor
    if(turnLeft && helmFree)  wheelAngle = Math.max(-WHEEL_MAX, wheelAngle - WHEEL_KEY_RATE*dt);
    if(turnRight && helmFree) wheelAngle = Math.min( WHEEL_MAX, wheelAngle + WHEEL_KEY_RATE*dt);
    // self-centering, like a car's steering wheel: when nobody holds it,
    // it spins back to centre, fast when far off and easing in at the end
    if(wheelPointer===null && !turnLeft && !turnRight && wheelAngle!==0){
      const step = Math.max(Math.abs(wheelAngle)*3.5, 0.8)*dt;
      wheelAngle = Math.abs(wheelAngle)<=step ? 0 : wheelAngle - Math.sign(wheelAngle)*step;
    }
    if(!moor && !boat.whirl) boat.angle += TURN_RATE*(sailLevel===SAIL_MIN ? 2 : 1)*(wheelAngle/WHEEL_MAX)*dt;   // slow sail = nimble, safe handling
    wheelSound(dt);
    Sfx.ambient(dt, Math.min(1, boat.speed/MAX_SPEED));

    // wind drift (or, under the ruins' spell, always from astern)
    if(boonWindT>0){
      boonWindT = Math.max(0, boonWindT-dt);
      const want = boat.angle + Math.PI;           // wind FROM behind the boat
      windAngle += Math.atan2(Math.sin(want-windAngle), Math.cos(want-windAngle))*Math.min(1, dt*2.5);
      if(boonWindT<=0) windTimer = rand(10,18);
    } else if(shiftDur>0){
      shiftT += dt;
      const k = Math.min(1, shiftT/shiftDur);
      const e = k*k*(3-2*k);                       // ease in/out
      windAngle = shiftFrom + shiftDelta*e;
      if(k>=1){ shiftDur = 0; windTimer = rand(12,22); }
    } else {
      windTimer -= dt;
      if(windTimer<=0){
        shiftFrom = windAngle;
        shiftDelta = (Math.random()<0.5?-1:1)*rand(0.5,1.6);  // ~30°–90°
        shiftT = 0;
        shiftDur = rand(3,5);
      }
    }
    windStrengthT += dt*0.06;
    windStrength = 0.75 + 0.25*Math.sin(windStrengthT);

    // sea surface drift (downwind), wrapped to the tile size
    updateAmbientLife(dt);
    updateStreaks(dt);
    updateTraders(dt);
    { // the nearest trader under way: you hear her engine as she comes by
      let best = 0, pan = 0;
      for(const tr of traders){ if(tr.wait > 0) continue; const d = wdist(boat.x,boat.y,tr.x,tr.y), l = Math.max(0, 1 - d/320); if(l > best){ best = l; pan = Math.max(-0.9, Math.min(0.9, wdx(tr.x,boat.x)/240)); } }
      Sfx.engine(playing ? best*best : 0, pan);
    }
    updateWaters(dt);
    boat.rock = Math.max(0, (boat.rock||0) - dt*0.8);            // the rocking dies down
    updateAnchor(dt);
    updateTownSound(dt);
    updateNightSound(dt);
    updateWhirlpools(dt);
    reveal(boat.x, boat.y);
    updateDialog(dt);
    updateBoonBadge();
    dayT = (dayT + dt/DAY_LEN) % 1;
    // camera focus: normally the boat; during a village visit it glides over
    // to frame the village below the dialog box, then back to the boat
    let fx = boat.x, fy = boat.y;
    if(moor && (moor.pier.isl.village || moor.pier.isl.ruin) && (dlg || marketV)){
      const vi = moor.pier.isl;
      fx = boat.x + wdx(vi.x, boat.x);
      fy = boat.y + wdy(vi.y, boat.y) - window.innerHeight*0.03;
    }
    const kf = Math.min(1, dt*2.2);
    camFx = boat.x + wdx(camFx, boat.x); camFy = boat.y + wdy(camFy, boat.y);   // follow wraps
    camFx += (fx-camFx)*kf; camFy += (fy-camFy)*kf;

    const relDeg = norm(boat.angle-windAngle)*180/Math.PI;
    const windSf = speedFactor(relDeg)*windStrength;   // how well the sail is fed
    boat.sailAmount += (SAIL_LEVELS[sailLevel].amount-boat.sailAmount)*Math.min(1,dt*2.5);
    const sf = windSf*boat.sailAmount;                    // actual drive
    let targetSpeed = anchored ? 0 : MAX_SPEED*sf*WIND_BOOST*downwindBonus(relDeg);   // a well-trimmed sail pays off more
    if(!anchored && sailLevel===SAIL_MIN) targetSpeed = Math.max(targetSpeed, ROW_SPEED);        // at minimum sail the oars keep her going
    boat.sailPower += (windSf-boat.sailPower)*Math.min(1,dt*3);

    // Square sail: the yard pivots on the mast at its centre. The sail's
    // belly faces where the wind blows TO (in boat frame), braced round at
    // most ~60° from the bow. Dead downwind the yard is square across the
    // hull; with wind on the beam it's braced round toward fore-and-aft.
    const relR = norm(boat.angle-windAngle);
    const MAX_BRACE = 1.05;
    // only ambiguous when head-to-wind: keep the side there (hysteresis)
    const wantSide = relR>=0 ? 1 : -1;
    if(wantSide!==boat.sailSide && Math.abs(relR)>0.2) boat.sailSide = wantSide;
    const faceRaw = norm(Math.PI-relR);         // wind-to direction, boat frame
    const faceTarget = boat.sailSide*Math.min(Math.abs(faceRaw), MAX_BRACE);
    boat.boomSigned += (faceTarget - boat.boomSigned)*Math.min(1,dt*3);
    // surfing a roller from astern: a temporary push above normal top speed
    const surf = boat.surfT>0 ? SURF_BOOST*Math.min(1, boat.surfT/0.8) : 0;
    boat.surfT = Math.max(0, (boat.surfT||0) - dt);
    boat.speed += (targetSpeed + surf - boat.speed)*Math.min(1,dt*(anchored ? 4 : surf>0 ? 3 : 1.6));   // the anchor bites quickly

    const hullR = boat.r*0.75;
    // ---- mooring at the home pier ----
    if(!moor && !boat.whirl){
      for(const pr of piers){
        const pf = pierFrame(pr, boat.x, boat.y);
        const near = pf.along > pr.shoreAlong+8 && pf.along < pr.total+20 && Math.abs(pf.lat) < MOOR_RANGE;
        if(pr===moorLock){ if(!near) moorLock = null; continue; }   // re-arm once clear of it
        if(near){
          const side = pf.lat>=0 ? 1 : -1;
          const b = berthAt(pr, pf.along, side);
          // approach from where the boat is, in the pier's own (unwrapped) frame
          const fx = pr.x0 + pr.dx*pf.along - pr.dy*pf.lat, fy = pr.y0 + pr.dy*pf.along + pr.dx*pf.lat;
          moor = {phase:'approach', t:0, side, pier:pr, fx, fy, fa:boat.angle, bx:b.x, by:b.y, ba:b.a};
          boat.kx = boat.ky = 0;
          break;
        }
      }
    }
    if(moor){
      boat.speed = 0; boat.kx = boat.ky = 0;
      if(moor.phase==='approach'){
        moor.t += dt;
        const k = Math.min(1, moor.t/MOOR_TIME), e = k*k*(3-2*k);
        boat.x = moor.fx + (moor.bx-moor.fx)*e;
        boat.y = moor.fy + (moor.by-moor.fy)*e;
        boat.angle = moor.fa + norm(moor.ba-moor.fa)*e;
        if(k>=1){ anchored = true; weighT = 0; anchorUI(); moor.phase = 'moored'; repairT = 0.4; Sfx.thunk(0.35); buzz([35,90,15]); }   // bump, then tied up
      } else {
        boat.x = moor.bx; boat.y = moor.by; boat.angle = moor.ba;
        const village = moor.pier.isl.village, ruin = moor.pier.isl.ruin;
        if(!moor.started){ moor.started = true; moor.skipLock = true; if(village) openMarket(village); if(ruin) startRuin(ruin); }
        if(village) renderMarket();
        if(!village && !ruin && foodsGot()===VILLAGES.length && !won && !moor.banquet){
          moor.banquet = true;
          openDialog('Home · the banquet', BANQUET_TEXT, 6);
        }
        if(moor.banquet && dlg && dlg.ready && !won){ won = true; setTimeout(showWin, 600); }
        // repairs: one piece of wood from the hold at a time
        repairT -= dt;
        // at a village, never touch the fish you still need for its food:
        // pay with local fish first, then only what's beyond the price
        const spare = (k)=>{
          if(!village || village.done) return true;
          const c = {...counts}; c[k]--;
          if(canAfford(village)) return canAfford(village, c);           // don't break a deal you can make
          return usable(village, c) === usable(village);                  // only fish that don't count here
        };
        const payable = FISH_KEYS.filter(k=> counts[k]>0 && spare(k));
        if(!moor.banquet && repairT<=0 && payable.length && boat.health < MAX_HEALTH-0.5){
          // sell one fish to pay for the repairs
          const k = (village && payable.includes(village.own)) ? village.own : payable.reduce((a,b)=>counts[b]>counts[a]?b:a);
          counts[k]--;
          const before = boat.health;
          boat.health = Math.min(MAX_HEALTH, boat.health + FISH_HEAL);
          popups.push({x:boat.x, y:boat.y-22, text:'+'+Math.round(boat.health-before), life:1.2, max:1.2});
          Sfx.hammer();
            showHealth();
          repairT = REPAIR_EVERY;
          moor.repaired = true;
        }
        // cast off: once there's nothing left to repair, any wheel input
        // pushes the boat away from the pier, out towards open water
        const repaired = boat.health >= MAX_HEALTH-0.5 || !payable.length;
        const steering = turnLeft || turnRight || (wheelPointer!==null && Math.abs(wheelAngle) > 0.35);
        if(!steering) moor.skipLock = false;                  // a fresh turn of the wheel is needed
        // at the ruins the wheel first skips the text, then (another turn) casts off
        if(ruin && dlg && !dlg.ready && steering && !moor.skipLock){
          dlg.shown = dlg.text.length; elDlgText.textContent = dlg.text; dlg.t = Math.max(dlg.t, dlg.pause); dlg.ready = true;
          moor.skipLock = true;
        }
        const done = village ? true : ruin ? (dlg && dlg.ready && repaired) : (repaired && !moor.banquet);
        if(ruin && done && !moor.told){                        // visit over and hull seen to
          moor.told = true; moor.rang = true;
          elDlgFoot.textContent = 'Hold the centre of the wheel to weigh anchor.';
        }
        if(done && !anchored){                               // anchor weighed: off we go
          boat.kx = -moor.pier.dy*moor.side*9;     // a small push off the pier
          boat.ky =  moor.pier.dx*moor.side*9;
          boat.kdamp = 1.1;                         // …that fades slowly
          boat.speed = 3;
          moorLock = moor.pier; moor = null; closeDialog(); closeMarket();
          Sfx.thunk(0.25); buzz([10,40,30]);            // lines cast off
        }
      }
    } else {
      // ---- whirlpools ----
      for(const w of whirlpools){
        if(w.s<=0) continue;                              // faded out: no effect
        const dx = wdx(boat.x,w.x), dy = wdy(boat.y,w.y), d = Math.hypot(dx,dy);
        if(d > w.r){ if(w.escaping){ w.escaping = false; w.armed = true; } continue; }
        if(boat.whirl || w.escaping) continue;          // thrown out: no pull until clear
        // outer ring: a pull toward the eye (plus a little swirl), almost
        // nothing near the rim and rising exponentially toward the core
        if(d > w.core){
          const k = 1 - (d-w.core)/(w.r-w.core);          // 0 at rim → 1 at core edge
          const pull = w.s*WHIRL_PULL*(Math.exp(WHIRL_CURVE*k)-1)/(Math.exp(WHIRL_CURVE)-1);
          const ux = -dx/(d||1), uy = -dy/(d||1);
          boat.x += (ux*pull - uy*w.dir*pull*0.35)*dt;
          boat.y += (uy*pull + ux*w.dir*pull*0.35)*dt;
        }
        if(!w.armed) continue;
        // core: caught, spun round, damaged and flung out (only once it's fully formed)
        if(d < w.core && w.s > 0.7){
          boat.whirl = { w, t:0, dur: 2.0, a0: Math.atan2(dy,dx), d0: Math.max(d, 8),
                         h0: boat.angle, out: rand(-Math.PI, Math.PI) };
          w.armed = false;
          boat.speed = 0; boat.kx = boat.ky = 0;
          boat.health = Math.max(0, boat.health - WHIRL_DAMAGE);
          hurtFlash = 0.35; shake = 0.15; showHealth(); Sfx.crash(0.6);
          buzz([60,40,60,40,90]);                   // spun round
          popups.push({x:w.x, y:w.y-w.core-8, text:'Whirlpool! -'+WHIRL_DAMAGE, life:1.4, max:1.4});
          Sfx.whirl();
        }
      }
      if(boat.whirl){
        // orbit the eye (drawn in, then out again) while the hull spins,
        // then swing to a random heading and get flung off along it
        const q = boat.whirl, w = q.w;
        q.t += dt;
        const k = Math.min(1, q.t/q.dur);
        const a = q.a0 + w.dir*k*Math.PI*2.5;
        const r = q.d0 + (w.core*0.45 - q.d0)*Math.sin(Math.PI*k);
        boat.x = w.x + Math.cos(a)*r;
        boat.y = w.y + Math.sin(a)*r;
        const spin = q.h0 + w.dir*k*Math.PI*3.2;
        const blend = Math.max(0, (k-0.65)/0.35), e = blend*blend*(3-2*blend);
        boat.angle = spin + norm(q.out - spin)*e;
        boat.speed = 0;
        if(k>=1){
          boat.angle = q.out;
          // new random heading, but the throw itself is straight outward and
          // sized to carry the boat past the rim of the pull ring
          const ox = wdx(boat.x,w.x), oy = wdy(boat.y,w.y), od = Math.hypot(ox,oy)||1;
          boat.kdamp = 1.1;
          const kick = (w.r - od + 30)*boat.kdamp;
          boat.kx = ox/od*kick; boat.ky = oy/od*kick;
          boat.speed = 0;
          boat.whirl = null;
          w.escaping = true;
        }
      } else {
        boat.x += Math.cos(boat.angle)*boat.speed*dt + boat.kx*dt;
        boat.y += Math.sin(boat.angle)*boat.speed*dt + boat.ky*dt;
        const kd = Math.exp(-boat.kdamp*dt);              // rebound fades out
        boat.kx *= kd; boat.ky *= kd;
      }
    }

    // wake: foam spawned at the stern, left behind in world space
    wakeAcc += boat.speed*dt;
    while(wakeAcc > 7){
      wakeAcc -= 7;
      const ca=Math.cos(boat.angle), sa=Math.sin(boat.angle);
      for(const side of [-1,1]){
        wake.push({
          x: boat.x - ca*15 - sa*side*5,
          y: boat.y - sa*15 + ca*side*5,
          vx: -sa*side*12, vy: ca*side*12,
          life: 1.8, max: 1.8
        });
      }
    }
    for(let k=wake.length-1;k>=0;k--){
      const f=wake[k];
      f.life-=dt;
      if(f.life<=0){ wake.splice(k,1); continue; }
      f.x+=f.vx*dt; f.y+=f.vy*dt;
      const damp=Math.pow(0.97,dt*60);          // frame-rate independent
      f.vx*=damp; f.vy*=damp;
    }

    // no walls: the world wraps around (see the end of the collision block)

    // island collision (star-shaped outline → push out radially)
    hitCooldown = Math.max(0, hitCooldown-dt);
    if(!moor && !boat.whirl) islandGrid.query(boat.x, boat.y, hullR, isl=>{
      const dx=wdx(boat.x,isl.x), dy=wdy(boat.y,isl.y), d=Math.hypot(dx,dy);
      if(d > isl.rmax+hullR) return;
      const minD = rAt(isl, Math.atan2(dy,dx)) + hullR;
      if(d<minD){
        impact(dx/(d||1), dy/(d||1));
        boat.x += dx/(d||1)*minD - dx;
        boat.y += dy/(d||1)*minD - dy;
        boat.speed*=0.25;
      }
    });
    // rock collision
    if(!moor && !boat.whirl) rockGrid.query(boat.x, boat.y, 40, o=>{
      const dx=wdx(boat.x,o.x), dy=wdy(boat.y,o.y);
      const d=Math.hypot(dx,dy), minD=o.r*0.9+hullR;
      if(d<minD){
        impact(dx/(d||1), dy/(d||1));
        boat.x += dx/(d||1)*minD - dx;
        boat.y += dy/(d||1)*minD - dy;
        boat.speed*=0.3;
      }
    });

    // wrap around the world's edges
    boat.x = wrapX(boat.x); boat.y = wrapY(boat.y);

    // pier collisions
    if(!moor){
      const pd = pierDist(boat.x, boat.y), minD = PIER_W/2 + hullR;   // nearest of all piers
      if(pd.d < minD){
        impact(pd.nx, pd.ny);
        boat.x = pd.qx + pd.nx*minD;
        boat.y = pd.qy + pd.ny*minD;
        boat.speed *= 0.3;
      }
    }

    // mooring hint
    if(!moor && !dlg){
      const b = fishing ? fishing.bank : bankUnderBoat();
      elHint.classList.add('hidden');                   // fishing speaks for itself: nets, fish, splash
      bankHint = !!b && !fishing && !anchored;           // over a bank: the hub of the wheel glows
    }
    else elHint.classList.add('hidden');              // at a quay: no hint window

    updateFishing(dt);
    updateRollers(dt);
    // oars: out when crawling along and steering, back in once under way;
    // they row while the boat is actually turning
    {
      const low = anchored || boat.speed < 9;
      const turning = Math.abs(wheelAngle/WHEEL_MAX) > 0.08;
      const crawling = !anchored && (sailLevel===SAIL_MIN || (boat.speed > 2 && boat.speed < 9));
      const want = !moor && !boat.whirl && ((low && turning) || crawling);
      boat.oarHold = want ? 0.5 : Math.max(0, (boat.oarHold||0) - dt);   // a short grace so they don't flicker
      boat.oarsOut = want || boat.oarHold > 0;
      const tgt = boat.oarsOut ? 1 : 0;
      boat.oarK += Math.sign(tgt-boat.oarK)*Math.min(Math.abs(tgt-boat.oarK), dt*2.2);
      if(boat.oarK>0 && (turning || crawling)) boat.oarPh += dt*(turning ? 4 + 5*Math.abs(wheelAngle/WHEEL_MAX) : 3.2);
    }
    voyageTime += dt;

    // popups, flash, shake
    for(let k=popups.length-1;k>=0;k--){
      popups[k].life -= dt; popups[k].y -= 18*dt;
      if(popups[k].life<=0) popups.splice(k,1);
    }
    hurtFlash = Math.max(0, hurtFlash-dt);
    shake = Math.max(0, shake-dt);

    if(boat.health<=0) sink();

    // UI text
    const info = andaturaName(relDeg);
    elAndaturaLabel.textContent = info.name;
    elAndaturaSpeed.textContent = anchored ? "at anchor" : sailLevel===SAIL_MIN ? "rowing" : "speed: "+Math.round(sf*100)+"%";
    for(const k in elFish){
      elFish[k].textContent = counts[k];
      const has = counts[k] > 0, item = elFish[k].parentElement;
      if(has !== item.classList.contains('has')){
        item.classList.toggle('has', has);
        if(has){ cmp.classList.remove('nudge'); void cmp.offsetWidth; cmp.classList.add('nudge'); }   // a first catch of this kind
      }
    }
    const hp = Math.ceil(boat.health);
    elHpNum.textContent = hp;
    elHpFill.style.width = (boat.health/MAX_HEALTH*100)+'%';
    elStatus.classList.toggle('low', hp<=25);
    elHpMeter.setAttribute('aria-valuenow', hp);
    elStatus.classList.toggle('hurt', hurtFlash>0);
    healthShowT = Math.max(0, healthShowT-dt);
    elStatus.classList.toggle('show', healthShowT>0);
    elWood.classList.add('show');                                   // always visible
  }

  // ---------- 1-bit rendering ----------
  // Everything is drawn in greys into a low-res buffer, then every frame a
  // post-pass turns it into pure ink/paper with a 4×4 ordered (Bayer)
  // dither. Any grey, gradient or transparency therefore becomes a dot
  // pattern, Playdate-style. The pattern is anchored to the world (offset
  // by the camera) so it doesn't crawl over the scene while you sail.
  const INK = [27,26,23], PAPER = [235,231,220];
  let INK32 = (255<<24)|(INK[2]<<16)|(INK[1]<<8)|INK[0];
  let PAPER32 = (255<<24)|(PAPER[2]<<16)|(PAPER[1]<<8)|PAPER[0];

  // ---------- Day and night ----------
  // Palette only: the two 1-bit colours drift through a day. Everything is
  // drawn exactly the same; only "paper" and "ink" change colour.
  const DAY_LEN = 360;                         // seconds for a whole day
  let dayT = 0.1;                              // 0 = first light; start mid-morning
  const DAY_KEYS = [                           // [time of day, paper rgb, ink rgb, darkness 0..1]
    [0.00, [214,190,196], [ 44, 32, 48], 0.35], // dawn: rose paper, plum ink
    [0.07, [235,231,220], [ 27, 26, 23], 0],    // day
    [0.50, [235,231,220], [ 27, 26, 23], 0],
    [0.58, [240,204,156], [ 54, 32, 30], 0.15], // golden hour
    [0.66, [168,184,214], [ 10, 12, 24], 1],    // night: lamps and moon-blue light, the rest dark
    [0.93, [168,184,214], [ 10, 12, 24], 1],
    [1.00, [214,190,196], [ 44, 32, 48], 0.35]
  ];
  let NIGHT = 0;
  function dayPalette(){
    let k = 0; while(k < DAY_KEYS.length-2 && dayT >= DAY_KEYS[k+1][0]) k++;
    const [t0,p0,i0,n0] = DAY_KEYS[k], [t1,p1,i1,n1] = DAY_KEYS[k+1];
    let f = (dayT-t0)/Math.max(1e-6,t1-t0); f = f*f*(3-2*f);
    const mix = (a,b)=> a.map((v,j)=> Math.round(v+(b[j]-v)*f));
    const P = mix(p0,p1), I = mix(i0,i1);
    PAPER32 = (255<<24)|(P[2]<<16)|(P[1]<<8)|P[0];
    INK32   = (255<<24)|(I[2]<<16)|(I[1]<<8)|I[0];
    NIGHT = n0 + (n1-n0)*f;
  }
  // Night light: a coarse mask (one value per 4×4 pixel block) of how lit
  // each spot is. Outside the light everything sinks toward ink.
  const NIGHT_FLOOR = 0.1, MB = 4;
  let nightCamX = 0, nightCamY = 0, lightMask = null, lmW = 0, lmH = 0;
  function nightLights(){
    const fl = 1 + 0.05*Math.sin(t*9) + 0.03*Math.sin(t*23);             // lantern flicker
    const L = [[boat.x, boat.y, 82*fl, 140*fl, 1]];                    // the boat's lantern: wide, crisp edge
    L.push([START.x-4, START.y+16, 10, 42, 1], [PIER.x1, PIER.y1, 4, 22, 1]);   // home: windows, pier lamp
    for(const v of VILLAGES){
      const vl = v.isl.vl;
      L.push([v.isl.x, v.isl.y, 8, 40, 1]);                             // piazza lamp
      vl.houses.forEach((h,n)=>{ if(n%3===0) L.push([h.x+h.w/2, h.y+h.h/2, 3, 20, 0.9]); });   // lit windows
      L.push([vl.light.x, vl.light.y, 6, 30, 1]);                       // lighthouse lantern
      L.push([v.pier.x1, v.pier.y1, 3, 18, 0.8]);                       // pier-head lamp
    }
    for(const r of RUINS) L.push([r.isl.rl.cx, r.isl.rl.cy, 6, 46, 0.55]);   // a faint, uncanny glow
    for(const tr of traders) L.push([tr.x, tr.y, 6, 38, 0.8]);                   // traders' lanterns
    for(const b of buoys) if(Math.sin(t*2.2 + b.ph) > 0.6) L.push([b.x, b.y-14, 3, 20, 0.9]);   // buoy lamps blinking
    return L;
  }
  function buildLightMask(){
    lmW = Math.ceil(GW/MB); lmH = Math.ceil(GH/MB);
    if(!lightMask || lightMask.length !== lmW*lmH) lightMask = new Float32Array(lmW*lmH);
    const vw = GW*PX, vh = GH*PX, vcx = nightCamX + vw/2, vcy = nightCamY + vh/2;
    const Ls = nightLights().filter(([x,y,r0,r1])=> Math.abs(wdx(x,vcx)) < vw/2 + r1 && Math.abs(wdy(y,vcy)) < vh/2 + r1);
    const beams = VILLAGES.map(v=>{ const lt=v.isl.vl.light; return [lt.x+0.5, lt.y+0.5, t*0.35+lt.ph]; })
      .filter(([x,y])=> Math.abs(wdx(x,vcx)) < vw/2+BEAM_LEN && Math.abs(wdy(y,vcy)) < vh/2+BEAM_LEN);
    for(let by=0; by<lmH; by++) for(let bx=0; bx<lmW; bx++){
      const wx = nightCamX + (bx*MB+MB/2)*PX, wy = nightCamY + (by*MB+MB/2)*PX;
      let l = 0;
      for(const [x,y,r0,r1,str] of Ls){

    ctx.save(); traceIsland(isl, i=>isl.radii[i]-2); ctx.clip();
    ctx.fillStyle = V(0.84);                        // thin dotted fringe
    ctx.beginPath(); ctx.arc(cx,cy,L.VR+4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = PAPERC;
    ctx.beginPath();
    for(let k=0;k<14;k++){
      const a = k/14*Math.PI*2, r = L.VR*(0.8+0.25*Math.sin(k*2.3+isl.x));
      ctx.moveTo(cx+Math.cos(a)*r*0.75+r*0.45, cy+Math.sin(a)*r*0.75);

    ctx.strokeStyle = PAPERC; ctx.lineWidth = 6;
    ctx.beginPath(); for(const l of L.lanes){ ctx.moveTo(l[0],l[1]); ctx.lineTo(l[2],l[3]); } ctx.stroke();
    ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(cx,cy,17,0,Math.PI*2); ctx.fill();
    // cobbles: a sparse pixel pattern on the piazza
    for(let yy=-15; yy<=15; yy+=3) for(let xx=-15; xx<=15; xx+=3){
      if(xx*xx+yy*yy > 15*15 || ((xx+yy)/3)%2) continue;
      P(cx+xx, cy+yy, 1, 1, V(0.55));

    drawPier(isl.village.pier);
  }
  function drawHouse(hs){
    const {x,y,w,h} = hs;
    P(x+2,y+2,w,h,V(0.3));                       // cast shadow
    P(x,y,w,h,INKC);                             // 1px outline
    if(hs.roof==='flat'){
      P(x+1,y+1,w-2,h-2,PAPERC);                 // whitewashed flat roof
      for(let i=x+3;i<x+w-3;i+=2){ P(i,y+2,1,1,INKC); P(i,y+h-3,1,1,INKC); }   // parapet
      P(x+w-5,y+3,2,2,INKC);                     // stair hatch
    } else if(hs.vert){
      const m = x+Math.floor(w/2);
      P(x+1,y+1,m-x-1,h-2,PAPERC);               // sunny slope
      for(let j=y+2;j<y+h-1;j+=2) P(x+1,j,m-x-1,1,V(0.72));   // tile rows
      P(m+1,y+1,x+w-2-m,h-2,V(0.42));            // shaded slope
      P(m,y,1,h,INKC);                           // ridge

      const m = y+Math.floor(h/2);
      P(x+1,y+1,w-2,m-y-1,PAPERC);
      for(let i=x+2;i<x+w-1;i+=2) P(i,y+1,1,m-y-1,V(0.72));
      P(x+1,m+1,w-2,y+h-2-m,V(0.42));
      P(x,m,w,1,INKC);
    }
  }
  function drawVillage(isl){
    const L = isl.vl, cx = isl.x, cy = isl.y;
    for(const hs of L.houses) drawHouse(hs);
    // market stalls: striped awnings
    for(const st of L.stalls){

      P(st.x-1,st.y-1,8,6,INKC);
      for(let i=0;i<6;i++) P(st.x+i,st.y,1,4, i%2 ? INKC : PAPERC);
    }

  }
  // the lighthouse beam sweeps round slowly (live, not cached): a pale wedge
  // with dotted edges, so the villages can be spotted from a distance
  const BEAM_LEN = 720;
  function drawBeam(Lt){
    const a = t*0.35 + Lt.ph, len = BEAM_LEN, sp = 0.1;   // one turn every ~18 s
    const x = Lt.x+0.5, y = Lt.y+0.5;
    // pale light: lifts the dark fog out at sea, fading along its length
    const g = ctx.createRadialGradient(x,y,0,x,y,len);
    g.addColorStop(0,'rgba(255,255,255,0.75)'); g.addColorStop(0.5,'rgba(255,255,255,0.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(a-sp)*len, y+Math.sin(a-sp)*len);
    ctx.lineTo(x+Math.cos(a+sp)*len, y+Math.sin(a+sp)*len);
    ctx.closePath(); ctx.fill();
    // a faint shadowy wedge so it also reads on the white, explored sea
    const gs = ctx.createRadialGradient(x,y,0,x,y,len);
    gs.addColorStop(0,'rgba(0,0,0,0.1)'); gs.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = gs;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(a-sp)*len, y+Math.sin(a-sp)*len);
    ctx.lineTo(x+Math.cos(a+sp)*len, y+Math.sin(a+sp)*len);
    ctx.closePath(); ctx.fill();
    // dotted edges along the whole length, fading out
    const ge = ctx.createRadialGradient(x,y,0,x,y,len);
    ge.addColorStop(0,'rgba(0,0,0,0.55)'); ge.addColorStop(1,'rgba(0,0,0,0)');
    ctx.strokeStyle = ge; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a-sp)*7, y+Math.sin(a-sp)*7); ctx.lineTo(x+Math.cos(a-sp)*len, y+Math.sin(a-sp)*len);
    ctx.moveTo(x+Math.cos(a+sp)*7, y+Math.sin(a+sp)*7); ctx.lineTo(x+Math.cos(a+sp)*len, y+Math.sin(a+sp)*len);
    ctx.stroke();
    // the lit lantern
    ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  }
  // the lighthouse(s) of a harbour: a tower with a long shadow and a lamp
  function drawHarbour(pr){
    for(const lt of pr.lights){
      const x=lt.x, y=lt.y, big=lt.tall;
      const sh = big ? 20 : 10;
      ctx.fillStyle='rgba(0,0,0,0.32)';
      ctx.beginPath(); ctx.moveTo(x-2.5,y+1); ctx.lineTo(x+sh*0.8-1.5,y+sh+1); ctx.lineTo(x+sh*0.8+2.5,y+sh-2); ctx.lineTo(x+2.5,y-1); ctx.closePath(); ctx.fill();
      const r = big ? 4.6 : 3.4;
      ctx.fillStyle=PAPERC; ctx.strokeStyle=INKC; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      if(big){ ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(x,y,r-1.8,0,Math.PI*2); ctx.stroke(); }
      ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(x,y,big?1.6:1.2,0,Math.PI*2); ctx.fill();
    }
  }
  // Cliffs: where the coast is rock and faces south (toward the viewer), the
  // island's edge is shown as a pale limestone wall with vertical fissures,
  // the plateau sitting on top of it, a bit like the Faraglioni of Capri.
  function drawCliffs(isl){
    if(!isl.rocky.some(v=>v)) return;
    const N = ISL_N, R = isl.radii;
    const H = (i)=>{ const th=i/N*Math.PI*2, f=Math.sin(th)+0.35; return isl.rocky[i] && f>0.05 ? Math.min(1,(f-0.05)/0.6)*(18+6*Math.sin(i*1.7+isl.x)+4*Math.sin(i*0.37)) : 0; };
    const P = (i,up)=>[isl.x+COS[i]*R[i], isl.y+SIN[i]*R[i]-up];
    let i0 = 0; while(i0<N && H(i0)>0) i0++;
    for(let k=0;k<N;k++){
      const i=(i0+k)%N; if(H(i)<=0) continue;
      let j=i; const run=[]; while(H(j%N)>0 && run.length<N){ run.push(j%N); j++; }
      k += run.length;
      if(run.length<2) continue;
      // wall: pale limestone, so it stands out from the scrub above
      ctx.fillStyle=V(0.9);
      ctx.beginPath();
      run.forEach((q,n)=>{ const [x,y]=P(q,0); n? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      for(let n=run.length-1;n>=0;n--){ const [x,y]=P(run[n],H(run[n])); ctx.lineTo(x,y); }
      ctx.closePath(); ctx.fill();
      // fissures and a darker foot
      ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.globalAlpha=0.7;
      ctx.beginPath();
      run.forEach((q,n)=>{ if(n%2) return; const h=H(q); const [x,y]=P(q,0); ctx.moveTo(x,y); ctx.lineTo(x,y-h*(0.55+0.45*Math.abs(Math.sin(q*3.1)))); });
      ctx.stroke(); ctx.globalAlpha=1;
      // cliff top edge
      ctx.lineWidth=1.3; ctx.beginPath();
      run.forEach((q,n)=>{ const [x,y]=P(q,H(q)); n? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      ctx.stroke();
    }
  }
  // a pier of big worn stone blocks (for the ruins)
  function drawStonePier(pr){
    const {x0,y0,dx,dy} = pr, len = pr.total, hw = PIER_W/2+1;
    ctx.save(); ctx.translate(x0,y0); ctx.rotate(Math.atan2(dy,dx));
    const sxl = 4*dx+4*dy, syl = -4*dy+4*dx;
    ctx.fillStyle=V(0.5); ctx.fillRect(sxl,-hw+syl,len,hw*2);
    for(let u=0; u<len; u+=9){
      const h = Math.sin((x0+u)*5.3+y0)*43758.5; const rr = h-Math.floor(h);
      const bw = Math.min(9, len-u);
      for(const [yy,hh] of [[-hw,hw],[0,hw]]){
        ctx.fillStyle = rr>0.5 ? PAPERC : V(0.88); ctx.fillRect(u, yy, bw, hh);
        ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.strokeRect(u+0.5, yy+0.5, bw-1, hh-1);
      }
    }
    ctx.lineWidth=1.6; ctx.strokeRect(0,-hw,len,hw*2);
    ctx.restore();
  }
  // ---------- Ruins: pixel-art temple stones ----------
  function drawRuinGround(isl){
    const L = isl.rl, pr = isl.ruin.pier;
    // bare, stony ground: sparse dots, clipped to the island
    ctx.save(); traceIsland(isl, i=>isl.radii[i]-3); ctx.clip();
    ctx.fillStyle = V(0.86); ctx.beginPath(); ctx.ellipse(L.cx, L.cy, 56, 46, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = V(0.95); ctx.beginPath(); ctx.ellipse(L.cx, L.cy, 44, 36, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // old paved way down to the pier
    ctx.strokeStyle = V(0.7); ctx.lineWidth = 7; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(L.cx, L.cy); ctx.lineTo(pr.x0, pr.y0); ctx.stroke();
    ctx.strokeStyle = PAPERC; ctx.lineWidth = 5; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.moveTo(L.cx, L.cy); ctx.lineTo(pr.x0, pr.y0); ctx.stroke(); ctx.setLineDash([]);
    drawPier(pr);
  }
  function drawRuins(isl){
    const L = isl.rl, cx = Math.round(L.cx), cy = Math.round(L.cy), W = L.plat.w, H = L.plat.h;
    // stepped platform (stylobate)
    P(cx-W/2+3, cy-H/2+3, W, H, V(0.4));
    P(cx-W/2, cy-H/2, W, H, INKC);
    P(cx-W/2+1, cy-H/2+1, W-2, H-2, V(0.75));
    P(cx-W/2+3, cy-H/2+3, W-6, H-6, INKC);
    P(cx-W/2+4, cy-H/2+4, W-8, H-8, PAPERC);
    for(let i=cx-W/2+6; i<cx+W/2-6; i+=6) P(i, cy-H/2+4, 1, H-8, V(0.7));      // floor slabs
    // fallen drums and column pieces
    for(const d of L.drums){
      ctx.save(); ctx.translate(Math.round(d.x), Math.round(d.y)); ctx.rotate(d.a);
      const len = d.long ? 12 : 5;
      ctx.fillStyle=V(0.45); ctx.fillRect(-len/2+1.5, -2.5+1.5, len, 5);
      ctx.fillStyle=PAPERC; ctx.fillRect(-len/2, -2.5, len, 5);
      ctx.strokeStyle=INKC; ctx.lineWidth=1; ctx.strokeRect(-len/2, -2.5, len, 5);
      if(d.long){ ctx.beginPath(); ctx.moveTo(-len/2+4,-2.5); ctx.lineTo(-len/2+4,2.5); ctx.moveTo(len/2-4,-2.5); ctx.lineTo(len/2-4,2.5); ctx.stroke(); }
      ctx.restore();
    }
    // columns, back row first: standing ones rise upward and cast long shadows
    const cols = [...L.cols].sort((a,b)=>a.y-b.y);
    for(const c of cols){
      const x = Math.round(c.x), y = Math.round(c.y);
      if(c.h > 0){ for(let k=1;k<=c.h;k+=1.5) P(x+k*0.7, y+k*0.45, 4, 3, V(0.35)); }   // shadow
      if(c.h <= 0){ P(x-2,y-1,5,3,V(0.6)); P(x-2,y-1,5,1,INKC); continue; }             // only the base left
      P(x-2, y-c.h, 5, c.h, INKC);                                                       // shaft
      P(x-1, y-c.h+1, 2, c.h-1, PAPERC);
      P(x+1, y-c.h+1, 1, c.h-1, V(0.6));
      P(x-3, y-c.h-2, 7, 2, INKC);                                                       // capital
      if(c.h < 9) P(x-2, y-c.h-3, 2, 1, INKC);                                          // broken top
      P(x-3, y-1, 7, 2, INKC);                                                           // base
    }
    // broken arch
    const ax = Math.round(L.arch.x), ay = Math.round(L.arch.y);
    P(ax-7+2, ay-2+2, 14, 4, V(0.4));
    P(ax-7, ay-12, 3, 13, INKC); P(ax-6, ay-11, 1, 11, PAPERC);
    P(ax+4, ay-7, 3, 8, INKC); P(ax+5, ay-6, 1, 6, PAPERC);
    ctx.strokeStyle=INKC; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ax-1, ay-12, 5, Math.PI, Math.PI*1.55); ctx.stroke();
  }
  // mooring lines are live (they depend on the boat), so they're drawn on
  // top of the cached island image
  function drawMooringLines(){
    if(!moor) return;
    const pr = moor.pier;
    const {x0,y0,dx,dy} = pr;
    const px=-dy, py=dx, hw=PIER_W/2;
    // bow and stern lines to the pier edge while moored
    if(moor && moor.phase==='moored'){
      const sd = moor.side, ca = Math.cos(boat.angle), sa = Math.sin(boat.angle);
      ctx.strokeStyle=INKC; ctx.lineWidth=1;
      for(const f of [11,-11]){
        const hx2 = boat.x + ca*f - px*sd*4, hy2 = boat.y + sa*f - py*sd*4;
        const pf = pierFrame(pr,hx2,hy2);
        const ea = pf.along + f*0.9;
        const ex = x0 + dx*ea + px*sd*hw, ey = y0 + dy*ea + py*sd*hw;
        ctx.beginPath(); ctx.moveTo(hx2,hy2);

        ctx.stroke();

        ctx.beginPath(); ctx.arc(ex,ey,1.8,0,Math.PI*2); ctx.fill();

    }

  }
  // the house (flat roof terrace with a railing, a small pitched-roof room
  // and a striped awning), a lean-to boat shed, a net drying on poles,
  // a rowboat pulled up on the beach and a few barrels
  function drawHomeBuildings(isl){
    const x=isl.x, y=isl.y;
    ctx.save();
    ctx.translate(x,y); ctx.scale(HOME_BLD,HOME_BLD); ctx.translate(-x,-y);
    const rect=(x0,y0,w,h,fill)=>{ ctx.fillStyle=fill; ctx.fillRect(x0,y0,w,h); };
    // --- house ---
    const HX=x-21, HY=y, HW=34, HH=24;
    rect(HX+4,HY+4,HW,HH,V(0.35));                        // cast shadow
    rect(HX,HY,HW,HH,PAPERC);                             // terrace
    // railing: inner line + balusters
    ctx.strokeStyle=INKC; ctx.lineWidth=1;
    ctx.strokeRect(HX+2.5,HY+2.5,HW-5,HH-5);
    ctx.beginPath();
    for(let u=HX+5; u<HX+HW-3; u+=3){ ctx.moveTo(u,HY); ctx.lineTo(u,HY+2.5); ctx.moveTo(u,HY+HH-2.5); ctx.lineTo(u,HY+HH); }
    for(let v=HY+5; v<HY+HH-3; v+=3){ ctx.moveTo(HX,v); ctx.lineTo(HX+2.5,v); ctx.moveTo(HX+HW-2.5,v); ctx.lineTo(HX+HW,v); }

    ctx.beginPath(); for(let u=HX+6; u<HX+16; u+=2.5){ ctx.moveTo(u,HY+5); ctx.lineTo(u,HY+14); }
    ctx.lineWidth=1.2; ctx.stroke();
    ctx.lineWidth=1; ctx.strokeRect(HX+5,HY+5,11,9);
    // upper room with a pitched roof, casting a shadow on the terrace
    const RX=HX+HW-15, RW=15, RH=13, RY=HY+HH-RH;
    rect(RX-3,RY+3,RW,RH,V(0.55));
    rect(RX,RY,RW/2,RH,PAPERC);

    skPoly([[RX,RY],[RX+RW,RY],[RX+RW,RY+RH],[RX,RY+RH]], true, 1.2, 1.4);
    ctx.lineWidth=1.8; ctx.beginPath(); skSeg(RX+RW/2,RY,RX+RW/2+0.3,RY+RH,1.2); ctx.stroke();
    // outer walls, sketchy
    skPoly([[HX,HY],[HX+HW,HY],[HX+HW,HY+HH],[HX,HY+HH]], true, 2, 1.7);
    // door + step
    rect(x-7,HY-2.5,6,2.5,INKC);                        // door faces the pier (north)

    // --- lean-to boat shed near the east shore ---
    const SX=x+32, SY=y-22, SW=18, SH=13;
    rect(SX+3,SY+3,SW,SH,V(0.35));
    rect(SX,SY,SW,SH,V(0.82));
    ctx.strokeStyle=INKC; ctx.lineWidth=1;
    ctx.beginPath(); for(let u=SX+3; u<SX+SW; u+=3){ ctx.moveTo(u,SY); ctx.lineTo(u+0.3,SY+SH); } ctx.globalAlpha=0.7; ctx.stroke(); ctx.globalAlpha=1;
    skPoly([[SX,SY],[SX+SW,SY],[SX+SW,SY+SH],[SX,SY+SH]], true, 1.6, 1.5);
    ctx.lineWidth=2.2; ctx.beginPath(); skSeg(SX,SY,SX+SW,SY,1.5); ctx.stroke();   // high side of the roof
    // barrels
    for(const [bx,by] of [[SX+SW+4,SY+4],[SX+SW+5,SY+10]]){
      ctx.fillStyle=PAPERC; ctx.beginPath(); ctx.arc(bx,by,2.6,0,Math.PI*2); ctx.fill();
      ctx.lineWidth=1.1; ctx.stroke();
      ctx.beginPath(); ctx.arc(bx,by,1.1,0,Math.PI*2); ctx.stroke();
    }

    // --- fishing net drying between two poles, on the beach ---
    const P1=[x-62,y+10], P2=[x-44,y+22], sag=5;

    for(let u=-30; u<40; u+=3.2){ ctx.moveTo(P1[0]+u,P1[1]-12); ctx.lineTo(P1[0]+u+18,P1[1]+18); ctx.moveTo(P1[0]+u+18,P1[1]-12); ctx.lineTo(P1[0]+u,P1[1]+18); }
    ctx.stroke(); ctx.globalAlpha=1;
    ctx.restore();
    ctx.strokeStyle=INKC; ctx.lineWidth=1.3;
    ctx.beginPath(); skSeg(P1[0],P1[1],P2[0],P2[1],1.5); ctx.stroke();
    ctx.fillStyle=INKC;
