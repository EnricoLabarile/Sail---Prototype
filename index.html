      c.save(); c.translate(cx+jx,cy+jy); c.rotate(a);
      c.fillStyle=g(70); c.beginPath(); c.moveTo(14,1.2); c.lineTo(-2,-3.8); c.lineTo(-2,6.2); c.closePath(); c.fill();   // its shadow on the card
      c.fillStyle=INKW;                                    // needle toward home: dark, with a lit half
      c.beginPath(); c.moveTo(13,0); c.lineTo(-3,-5); c.lineTo(-3,5); c.closePath(); c.fill();
      c.fillStyle=g(120); c.beginPath(); c.moveTo(13,0); c.lineTo(-3,-5); c.lineTo(-3,0); c.closePath(); c.fill();
      c.fillStyle=PAPW; c.strokeStyle=INKW; c.lineWidth=1.2;  // tail
      c.beginPath(); c.moveTo(-3,-5); c.lineTo(-15,0); c.lineTo(-3,5); c.closePath(); c.fill(); c.stroke();
      c.restore();
      c.fillStyle=INKW; c.beginPath(); c.arc(cx,cy,3.2,0,Math.PI*2); c.fill();      // the pivot: an ink cap with a bright pin
      c.fillStyle=g(200); c.beginPath(); c.arc(cx,cy,1.6,0,Math.PI*2); c.fill();
      // little house riding on the rim, in the direction of home
      if(m < 0.35) drawCompassHouse(c, cx+Math.cos(a)*19, cy+Math.sin(a)*19, 0.7, INKW, PAPW);
    }
    // the glass: a soft glare across the top left
    c.strokeStyle='rgba(255,255,255,0.75)'; c.lineWidth=2.2; c.lineCap='round';
    c.beginPath(); c.arc(cx,cy,24.5,Math.PI*1.08,Math.PI*1.38); c.stroke();
    c.lineWidth=1.2; c.beginPath(); c.arc(cx,cy,24.5,Math.PI*1.45,Math.PI*1.52); c.stroke();
    c.lineCap='butt';
    c.setTransform(1,0,0,1,0,0);
    ditherUI(c, CMP_PX, CMP_PX);
    cmpCtx.clearRect(0,0,cmp.width,cmp.height);
    cmpCtx.drawImage(cmpLo, 0, 0, cmp.width, cmp.height);
  }
  function drawCompassHouse(c, x, y, s, INKW, PAPW){
    c.save(); c.translate(x,y); c.scale(s,s);
    c.fillStyle=PAPW; c.beginPath(); c.arc(0,0,7.5,0,Math.PI*2); c.fill();
    c.strokeStyle=INKW; c.lineWidth=1.4; c.stroke();
    c.fillStyle=INKW;
    c.beginPath(); c.moveTo(-5,-0.5); c.lineTo(0,-5); c.lineTo(5,-0.5); c.closePath(); c.fill();
    c.fillRect(-3.5,-0.5,7,4.5);
    c.fillStyle=PAPW; c.fillRect(-1,1.5,2,3);
    c.restore();
  }

  function drawWheel(){
    const c = wl, INKW='#000', PAPW='#fff';
    // the wood is a mid grey (dithered to a dotted tone), so the wheel stands out from the pale sea
    const WOOD = 'rgb(172,172,172)', WOOD_SH = 'rgb(122,122,122)', WOOD_RIM = 'rgb(160,160,160)';
    c.clearRect(0,0,WH_W,WH_H);
    const rudder = wheelAngle/WHEEL_MAX;

    // at anchor the wheel (and its rudder gauge) is put away: it fades out
    // and only the hub stays, to weigh anchor or switch sail
    wheelVis += ((stowed() ? 0 : 1) - wheelVis) * 0.15;
    c.globalAlpha = wheelVis;
    // rudder indicator: paper track, ink tick and marker
    const barW = 140, bx = WH_CX-barW/2, by = 8;
    c.fillStyle=PAPW; c.strokeStyle=INKW; c.lineWidth=1.5;
    c.beginPath(); c.roundRect(bx-6, by-4, barW+12, 12, 3); c.fill(); c.stroke();
    c.fillStyle=INKW; c.fillRect(WH_CX-0.75, by-2, 1.5, 8);
    const mx = WH_CX + rudder*barW/2;
    c.beginPath(); c.arc(mx, by+2, 4, 0, Math.PI*2);
    if(Math.abs(rudder)<0.04){ c.fillStyle=PAPW; c.fill(); c.lineWidth=1.8; c.stroke(); }
    else { c.fillStyle=INKW; c.fill(); }

    // wheel: ink woodcut look; every part has an ink outline so it reads over any terrain
    c.save();
    c.translate(WH_CX, WH_CY);
    c.scale(WH_S, WH_S);
    // no backing disc: the gaps between the spokes are open, so the sea shows through
    c.rotate(wheelAngle);
    c.lineCap='round'; c.lineJoin='round';
    // a spoke/handle profile along +x, turned like a lathe piece: symmetric
    // outline built from [radius, half-width] stations
    const turned = (st)=>{
      c.beginPath();
      st.forEach(([r,hw],n)=> n ? c.lineTo(r,-hw) : c.moveTo(r,-hw));
      for(let n=st.length-1;n>=0;n--) c.lineTo(st[n][0], st[n][1]);
      c.closePath();
    };
    const HANDLE = [[58,2.2],[61,2.6],[62.5,4.2],[64,2.8],[66,4.6],[69.5,5.4],[72.5,4.4],[74,2.6],[75.5,3.6],[78,3.4],[79.5,1.8]];
    const SPOKE  = [[13,3.8],[22,3.2],[27,3],[28.5,4.6],[31,4.6],[32.5,3],[44,2.8],[50,3.2]];
    for(let k=0;k<8;k++){
      c.save(); c.rotate(k*Math.PI/4 - Math.PI/2);
      // handle: paper body, ink outline, an ink band at the neck
      c.fillStyle=WOOD; c.strokeStyle=INKW; c.lineWidth=1.6;
      turned(HANDLE); c.fill();
      c.save(); turned(HANDLE); c.clip(); c.fillStyle=WOOD_SH; c.fillRect(56,1,26,8); c.restore();   // shaded flank
      turned(HANDLE); c.stroke();
      c.lineWidth=1; c.beginPath(); c.moveTo(69.5,-5.4); c.lineTo(69.5,5.4); c.stroke();   // grain line
      c.fillStyle=INKW; c.fillRect(63.2,-3.4,1.6,6.8);
      if(k===0){                                            // king spoke: a whipped rope band
        c.fillRect(66.5,-5.2,6,10.4);
        c.strokeStyle=PAPW; c.lineWidth=0.9;
        c.beginPath(); for(let u=67.3;u<72.5;u+=1.6){ c.moveTo(u,-4.6); c.lineTo(u+0.8,4.6); } c.stroke();
      }
      // spoke
      c.fillStyle=WOOD; c.strokeStyle=INKW; c.lineWidth=1.4;
      turned(SPOKE); c.fill();
      c.save(); turned(SPOKE); c.clip(); c.fillStyle=WOOD_SH; c.fillRect(12,1,40,6); c.restore();
      turned(SPOKE); c.stroke();
      c.restore();
    }
    // rim: two ink edges, a paper band with wood grain, and brass caps with
    // rivets where each spoke passes through
    c.strokeStyle=INKW; c.lineWidth=12; c.beginPath(); c.arc(0,0,55,0,Math.PI*2); c.stroke();
    c.strokeStyle=WOOD_RIM; c.lineWidth=8.6; c.beginPath(); c.arc(0,0,55,0,Math.PI*2); c.stroke();
    c.save(); c.rotate(-wheelAngle);                          // light from top-left: rim darker bottom-right
    c.strokeStyle='rgba(0,0,0,0.18)'; c.lineWidth=8.6; c.beginPath(); c.arc(0,0,55,-0.15*Math.PI,0.85*Math.PI); c.stroke();
    c.restore();
    c.strokeStyle=INKW; c.lineWidth=0.8;
    for(let g=0; g<10; g++){                                  // grain: broken arcs along the band
      const a0 = g*0.63 + (g%3)*0.07, rr = 53.5 + (g%2)*2.5, len = 0.22 + (g%3)*0.06;
      c.beginPath(); c.arc(0,0,rr,a0,a0+len); c.stroke();
    }
    for(let k=0;k<8;k++){
      c.save(); c.rotate(k*Math.PI/4 - Math.PI/2);
      c.fillStyle=INKW; c.fillRect(50.2,-3.6,9.6,7.2);
      c.fillStyle=PAPW; c.fillRect(51.4,-2.4,7.2,4.8);
      c.fillStyle=INKW; c.beginPath(); c.arc(55,0,1.3,0,Math.PI*2); c.fill();
      c.restore();
    }
    // hub: ink boss, paper ring with bolts, inked cap with a bright axle
    c.fillStyle=INKW; c.beginPath(); c.arc(0,0,15.5,0,Math.PI*2); c.fill();
    c.fillStyle=WOOD_SH; c.beginPath(); c.arc(0,0,13,0,Math.PI*2); c.fill();
    c.fillStyle=INKW; c.beginPath(); c.arc(0,0,9.5,0,Math.PI*2); c.fill();
    for(let k=0;k<8;k++){ const a=k*Math.PI/4; c.fillStyle=INKW; c.beginPath(); c.arc(Math.cos(a)*11.3,Math.sin(a)*11.3,1.1,0,Math.PI*2); c.fill(); }
    c.fillStyle=PAPW; c.beginPath(); c.arc(0,0,4.8,0,Math.PI*2); c.fill();
    c.strokeStyle=INKW; c.lineWidth=1.2; c.beginPath(); c.arc(0,0,2.4,0,Math.PI*2); c.stroke();
    c.beginPath(); c.moveTo(-2.4,0); c.lineTo(2.4,0); c.stroke();
    c.restore();    c.globalAlpha = 1;                                     // the hub is always drawn solid
    // the hub is the anchor button: a half-second press drops or weighs the
    // anchor (a ring fills while it's held, then a little shake)
    if(hubHold && !hubHold.done && performance.now() - hubHold.t0 >= HUB_HOLD){
      hubHold.done = true; hubShake = 1;
      setAnchor(!(anchored && weighT <= 0));
    }
    hubShake = Math.max(0, hubShake - 0.06);
    {
      const jx = hubShake ? Math.sin(performance.now()*0.09)*2.2*hubShake : 0;
      // with the wheel away the hub grows to twice its size and turns dark,
      // a dotted ink knob like the old anchor button
      hubScale = 1 + (1 - wheelVis);
      const inv = wheelVis < 0.5, HI = inv ? PAPW : INKW;
      c.save(); c.translate(WH_CX + jx, WH_CY); c.scale(WH_S*hubScale, WH_S*hubScale);
      // the knob is shaded in greys (dithered like the rest of the UI): dark at
      // anchor, a light, slightly shaded face while sailing (a bit bigger then)
      const HR = inv ? 13 : 14.5;
      const kg = c.createLinearGradient(-HR, -HR, HR, HR);
      if(inv){ kg.addColorStop(0, 'rgb(105,105,105)'); kg.addColorStop(1, 'rgb(35,35,35)'); }
      else { kg.addColorStop(0, PAPW); kg.addColorStop(0.55, PAPW); kg.addColorStop(1, 'rgb(200,200,200)'); }
      c.fillStyle = kg; c.strokeStyle=INKW; c.lineWidth=2;
      c.beginPath(); c.arc(0,0,HR,0,Math.PI*2); c.fill(); c.stroke();
      if(inv){ c.strokeStyle=PAPW; c.lineWidth=1.3; c.beginPath(); c.arc(0,0,HR+1.4,0,Math.PI*2); c.stroke(); }   // one light rim, so the dark knob reads on dark water
      const ring = (r, a0, a1, lw, dash)=>{                // an ink ring with a paper halo, readable anywhere
        c.save(); if(dash) c.setLineDash(dash);
        c.strokeStyle=PAPW; c.lineWidth=lw+2; c.beginPath(); c.arc(0,0,r,a0,a1); c.stroke();
        c.strokeStyle=INKW; c.lineWidth=lw;   c.beginPath(); c.arc(0,0,r,a0,a1); c.stroke();
        c.restore();
      };
      if(bankHint){ c.save(); c.rotate(performance.now()*0.002); ring(18.5, 0, Math.PI*2, 1.6, [3,3]); c.restore(); }   // over a fish bank
      if(hubHold && !hubHold.done){
        const k = Math.min(1, (performance.now()-hubHold.t0)/HUB_HOLD);
        ring(16, -Math.PI/2, -Math.PI/2+k*Math.PI*2, 2.8);
      }
      c.strokeStyle = HI; c.fillStyle = HI;
      c.lineCap='round';
      // always an anchor: ink on the light hub while sailing (bigger, bolder), paper on the dark knob at anchor
      c.save(); c.scale(inv ? 1.1 : 1.28, inv ? 1.1 : 1.28);
      c.lineWidth = inv ? 1.7 : 1.75;
      c.beginPath(); c.arc(0,-7,1.9,0,Math.PI*2); c.stroke();
      c.beginPath(); c.moveTo(0,-5); c.lineTo(0,7.5); c.moveTo(-4.5,-2.2); c.lineTo(4.5,-2.2); c.stroke();
      c.beginPath(); c.moveTo(-6.5,2.5); c.quadraticCurveTo(-5,7.5,0,7.5); c.quadraticCurveTo(5,7.5,6.5,2.5); c.stroke();
      c.restore();
      c.restore();
    }
    drawTutorialHints(c);
    ditherUI(c, WH_W, WH_H);
    wctx.clearRect(0,0,wheelCv.width,wheelCv.height);
    wctx.drawImage(wlo, 0, 0, wheelCv.width, wheelCv.height);
  }
  // 1-bit: ordered dither of a UI canvas to the interface palette; transparent outside
  function ditherUI(c, W, H){
    const im = c.getImageData(0,0,W,H), dd = im.data, o32 = new Uint32Array(dd.buffer);
    for(let y=0, p=0; y<H; y++){
      const row = (y&3)*4;
      for(let x=0; x<W; x++, p++){
        const q = p<<2;
        if(dd[q+3] < 110){ o32[p] = 0; continue; }
        const lum = dd[q] * dd[q+3]/255 + 255*(1-dd[q+3]/255);   // alpha edges blend toward paper
        o32[p] = lum > BAYER[row + (x&3)] ? UI_PAPER32 : UI_INK32;
      }
    }
    c.putImageData(im,0,0);
  }


  // anchor: drops and holds the boat where it is; press again to weigh it
  let anchored = false;

  // weighing anchor takes a moment: the chain comes in (you hear it) and
  // only when it's aboard does the boat get under way again
  const WEIGH_TIME = 0.9;
  let weighT = 0;
  function anchorUI(){ renderSailBtn(); }            // the hub of the wheel shows the state
  function setAnchor(on, instant){
    // at the quay with the text still running: the first press just finishes it
    if(!on && moor && moor.phase==='moored' && dlg && !dlg.ready){
      dlg.shown = dlg.text.length; elDlgText.textContent = dlg.text; dlg.t = Math.max(dlg.t, dlg.pause); dlg.ready = true;
      return;
    }
    if(on){
      if(anchored && weighT <= 0) return;
      weighT = 0; anchored = true; anchorUI();
      Sfx.init(); Sfx.anchor(true); buzz([45,40,20,30,15]);
    } else {
      if(!anchored || weighT > 0) return;
      if(instant){ anchored = false; anchorUI(); return; }
      weighT = WEIGH_TIME;
      Sfx.init(); Sfx.anchor(false); buzz([10,25,10,25,10,25,10,25,10]);
    }
  }
  function updateAnchor(dt){
    if(weighT > 0){
      weighT -= dt;
      if(weighT <= 0){
        weighT = 0; anchored = false; anchorUI();
        if(tut === 'anchor') tutSet('wheel');                               // tutorial: now steer
      }
    }
  }
  anchored = true;                       // the voyage begins at the quay, anchor down
  // sail: full → medium → minimum. At minimum the sail is all but furled
  // and the oars keep her moving at a slow, steady pace.
  const ROW_SPEED = 9;
  // the sail is switched with the halyard (see below), the anchor with the
  // hub of the wheel; this just keeps the labels in step
  function renderSailBtn(){
    wheelCv.setAttribute('aria-label', 'Helm: drag round to steer. Centre: hold half a second to ' + (anchored ? 'weigh' : 'drop') + ' anchor.');
    ropeHit.setAttribute('aria-label', 'Halyard: pull down to switch sail (now ' + SAIL_LEVELS[sailLevel].name + ').');
  }
  // a switch: full sail ↔ minimum
  function cycleSail(){
    sailLevel = sailLevel === 0 ? SAIL_MIN : 0;
    renderSailBtn(); Sfx.init(); Sfx.thunk(0.3); buzz(10);
  }

  // ---------- Dashboard ----------
  // The cockpit: a wooden panel across the bottom of the screen, like a car's
  // dashboard under the windscreen. The sea is seen above it; the wheel's hub
  // sits on its top rail (the lower half of the wheel rests on the wood) and
  // the other controls are set into it. Drawn in greys (planks, grain, butt
  // joints, nails, a rounded rail along the top), then dithered like the rest
  // of the interface; painted again on resize and when the light changes.
  const DASH_H = 112;                          // CSS px above the safe area (the hub sits just over the rail)
  const dashCv = document.getElementById('dash');
  let dashDone = false;
  window.addEventListener('resize', ()=>{ dashDone = false; });
  function drawDash(){
    dashDone = true;
    const r = dashCv.getBoundingClientRect(), W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height));
    const k = Math.max(1, Math.round(window.devicePixelRatio||1));
    const lo = document.createElement('canvas'); lo.width = W; lo.height = H;
    const c = lo.getContext('2d', {willReadFrequently:true});
    const g = v=> 'rgb('+v+','+v+','+v+')', INKW = '#000';
    const hash = (n)=>{ const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); };   // stable "random"
    const RAIL = 13, PLANK = 30;
    c.fillStyle = g(104); c.fillRect(0, 0, W, H);                                  // dark oiled wood
    // planks: grain, butt joints (staggered) and a nail either side of each joint
    for(let row = 0, y = RAIL+3; y < H; row++, y += PLANK){
      c.strokeStyle = g(74); c.lineWidth = 1;
      for(let n = 0; n < 4; n++){
        const yy = y + 5 + n*6.5 + hash(row*9+n)*3, ph = hash(row*13+n)*6, amp = 0.8 + hash(row*7+n)*1.4;
        c.beginPath(); for(let x = 0; x <= W; x += 6) c.lineTo(x, yy + Math.sin(x/37 + ph)*amp); c.stroke();
      }
      c.strokeStyle = g(140); c.lineWidth = 0.9;                                 // a lighter streak in the grain
      const ys = y + 9 + hash(row*5)*12;
      c.beginPath(); for(let x = 0; x <= W; x += 6) c.lineTo(x, ys + Math.sin(x/53 + row)*1.2); c.stroke();
      c.fillStyle = g(150); c.fillRect(0, y+1, W, 1);                            // the bevel under the seam
      c.fillStyle = INKW; c.fillRect(0, y-0.5, W, 1.5);                          // seam
      const off = (row%2) ? 70 : 0;
      for(let x = off + 60 + hash(row)*30; x < W; x += 150 + hash(row+x)*40){
        c.fillStyle = INKW; c.fillRect(Math.round(x), y, 1.5, PLANK);            // butt joint
        for(const nx of [x-5, x+6]){                                             // nails
          c.fillStyle = g(30); c.beginPath(); c.arc(nx, y+PLANK/2, 1.9, 0, Math.PI*2); c.fill();
          c.fillStyle = g(200); c.fillRect(nx-1, y+PLANK/2-1.2, 1, 1);
        }
      }
    }
    // the rail along the top: a rounded, lighter moulding with a highlight,
    // and a shadow cast on the planks below it
    c.fillStyle = g(58); c.fillRect(0, RAIL, W, 4);
    const rg = c.createLinearGradient(0, 0, 0, RAIL);
    rg.addColorStop(0, g(205)); rg.addColorStop(0.35, g(170)); rg.addColorStop(1, g(105));
    c.fillStyle = rg; c.fillRect(0, 0, W, RAIL);
    c.fillStyle = INKW; c.fillRect(0, 0, W, 1.6); c.fillRect(0, RAIL-0.5, W, 1.5);
    c.fillStyle = g(240); c.fillRect(0, 3, W, 1);
    ditherUI(c, W, H);
    if(dashCv.width !== W*k || dashCv.height !== H*k){ dashCv.width = W*k; dashCv.height = H*k; }
    const x = dashCv.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, dashCv.width, dashCv.height);
    x.drawImage(lo, 0, 0, dashCv.width, dashCv.height);
  }

  // ---------- Halyard ----------
  // A rope hanging from a block on the right of the screen. Grab it and it
  // goes where the finger goes, like a real line: it never stretches, it
  // swings slack when you move towards the block, and pulled further away
  // it runs out through the block (heavier the further it comes), clicking
  // as it goes. Past the mark the sail switches with a clack. Let go and it
  // swings back to hang where it was.
  const ropeCv = document.getElementById('rope'), ropeHit = document.getElementById('rope-hit');
  const rctx = ropeCv.getContext('2d');
  const RP_W = 170, RP_H = 222, RP_CX = RP_W - 32;          // drawing units; the block hangs 32 units from the right edge
  const ROPE_SCALE = 1.6;                                    // drawn this much bigger (crisp: the low-res canvas grows too)
  const RPX_W = Math.round(RP_W*ROPE_SCALE), RPX_H = Math.round(RP_H*ROPE_SCALE);
  // the badge is lowered HEAD_Y units so its top lines up with the top of
  // the wheel; the rope hangs straight from it
  const HEAD_Y = 73;
  // how much line hangs: long with the sail open, short with it furled (the
  // line hauled in); it eases between the two when the sail switches
  const ROPE_TOP = 30 + HEAD_Y, ROPE_LEN_OPEN = 64, ROPE_LEN_FURLED = 10;   // furled: the handle hangs just under the badge
  let ROPE_LEN = ROPE_LEN_FURLED;                          // (the voyage starts with the sail furled)
  const ROPE_MAX = 40, ROPE_FIRE = 18, ROPE_TICK = 6;       // most line out, where it switches, units per click
  let ROPE_REST = ROPE_TOP + ROPE_LEN;
  const rlo = document.createElement('canvas'); rlo.width = RPX_W; rlo.height = RPX_H;
  const rl = rlo.getContext('2d', {willReadFrequently:true});
  function sizeRope(){
    const k = Math.max(1, Math.round((window.devicePixelRatio||1)));
    ropeCv.width = RPX_W*k; ropeCv.height = RPX_H*k;
    rctx.imageSmoothingEnabled = false;
  }
  sizeRope();
  window.addEventListener('resize', sizeRope);
  // the toggle at the rope's end: position and velocity, in canvas pixels
  const rope = {x: RP_CX, y: ROPE_REST, vx: 0, vy: 0, pull: 0, ptr: null, ox: 0, oy: 0, lx: 0, ly: 0, lt: 0};
  let ropeFired = false, ropeTickIdx = 0, ropeLastT = performance.now(), ropeFlash = 0;
  const ropeLocal = ev=>{ const r = ropeCv.getBoundingClientRect(); return [(ev.clientX - r.left)*(RP_W/r.width), (ev.clientY - r.top)*(RP_H/r.height)]; };
  // put the toggle as near (tx,ty) as a rope of fixed length allows
  function ropeTo(tx, ty){
    tx = Math.max(16, Math.min(RP_W - 10, tx)); ty = Math.max(ROPE_TOP + 6, Math.min(RP_H - 22, ty));
    const dx = tx - RP_CX, dy = ty - ROPE_TOP, d = Math.hypot(dx, dy) || 1;
    if(d <= ROPE_LEN){ rope.x = tx; rope.y = ty; rope.pull = 0; return; }   // slack: it just follows
    const pull = ROPE_MAX*(1 - Math.exp(-(d - ROPE_LEN)/(ROPE_MAX*0.9)));   // taut: line runs out, heavier as it comes
    rope.x = RP_CX + dx/d*(ROPE_LEN + pull); rope.y = ROPE_TOP + dy/d*(ROPE_LEN + pull); rope.pull = pull;
  }
  ropeHit.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    rope.ptr = ev.pointerId; ropeHit.setPointerCapture(ev.pointerId); ropeHit.classList.add('grabbed');
    const [x,y] = ropeLocal(ev);
    rope.ox = rope.x - x; rope.oy = rope.y - y;              // hold it where the finger landed
    rope.vx = rope.vy = 0; rope.lx = rope.x; rope.ly = rope.y; rope.lt = performance.now();
    ropeFired = false; ropeTickIdx = Math.floor(rope.pull/ROPE_TICK);
    Sfx.init(); buzz(6);
  });

  // Collision damage: scales with how fast the boat was moving INTO the
  // obstacle (nx,ny is the outward normal), so grazing hurts less than
  // ramming. A short cooldown stops one bump from counting every frame.
  function impact(nx, ny){
    const vx = Math.cos(boat.angle)*boat.speed, vy = Math.sin(boat.angle)*boat.speed;
    const into = -(vx*nx + vy*ny);
    if(hitCooldown>0 || into < 4) return;

    boat.health = Math.max(0, boat.health - dmg);
    hitCooldown = 0.6;
    // rebound: a push away from the surface, stronger for harder hits,
    // plus a small yaw so the bow swings off instead of re-hitting
    const kick = (20 + into*0.9)*1.15;                      // a bit more bounce than originally
    boat.rock = Math.min(2.5, (boat.rock||0) + 0.6 + into/MAX_SPEED);   // and she rocks for a while
    boat.kdamp = 3.5;
    boat.kx += nx*kick; boat.ky += ny*kick;
    const hx = Math.cos(boat.angle), hy = Math.sin(boat.angle);

    boat.angle += side * Math.min(0.3, 0.08 + into/MAX_SPEED*0.25);   // a small yaw so the bow swings off

    const dishes = VILLAGES.reduce((a,v)=>a+dishesGot(v),0), all = VILLAGES.reduce((a,v)=>a+v.dishes.length,0), gifts = VILLAGES.filter(v=>v.giftGot).length;
    elGoTitle.textContent = ENDINGS[tier].title;
    elGoStats.textContent = ENDINGS[tier].name+': '+dishes+' of '+all+' dishes'+(gifts ? ', '+gifts+(gifts===1?' gift':' gifts') : '')
      + '. You did the shopping in '+min+' min '+sec+' s, catching '+caught+' fish along the way.';
    gameover.classList.remove('hidden');
  }

  // ---------- Fishing ----------
  const FISH_STOP = 12;          // px/s: slow enough to count as stopped on a bank
  const FISH_SETTLE = 2;         // seconds stopped before the nets go over
  const FISH_ANCHOR_SETTLE = 0.25;   // …or this long after the anchor goes down on a bank
  const NET_DROP = 1.4;          // net deploying animation
  const FISH_TIME_MIN = 2, FISH_TIME_MAX = 4;   // seconds with nets out before the haul (random each time)
  const NET_HAUL = 1.1;          // hauling animation
  let fishing = null;            // {bank, t, phase:'drop'|'wait'|'haul'|'cancel', ...}
  let settleT = 0;
  function bankUnderBoat(){
    for(const b of banks){
      if(b.state!=='live') continue;
      if(wdist(boat.x,boat.y,b.x,b.y) < b.r*0.9) return b;
    }
    return null;
  }
  function updateFishing(dt){
    for(let k=banks.length-1;k>=0;k--){
      const b = banks[k];
      b.t += dt; b.rot += dt*0.25;
      b.jumpT -= dt;
      if(b.jumpT<=0){ b.jumpT = rand(1.5,4.5); b.jump = {a:rand(0,6.3), d:rand(0.2,0.7)*b.r, t:0}; }
      if(b.jump){ b.jump.t += dt; if(b.jump.t>0.9) b.jump = null; }
      if(b.state==='scatter' && b.t > 1.8){ banks.splice(k,1); spawnBank(true, b.home); }
    }
    if(moor || boat.whirl){ fishing = null; settleT = 0; return; }
    const steering = turnLeft || turnRight || (wheelPointer!==null && Math.abs(wheelAngle) > 0.35);
    if(!fishing){
      const b = bankUnderBoat();
      const atAnchor = anchored && weighT <= 0;             // anchor down on a bank: nets over almost at once
      if(b && (atAnchor || boat.speed < FISH_STOP)){
        settleT += dt;
        if(settleT >= (atAnchor ? FISH_ANCHOR_SETTLE : FISH_SETTLE)){
          fishing = {bank:b, t:0, phase:'drop', side: Math.random()<0.5?-1:1, dur: rand(FISH_TIME_MIN, FISH_TIME_MAX)};
          Sfx.splash();
          buzz(15);
        }
      } else settleT = 0;
      return;
    }
    const f = fishing;
    f.t += dt;
    // nets act like a sea anchor: the boat stays put while fishing
    boat.speed *= Math.exp(-3*dt); boat.kx *= Math.exp(-3*dt); boat.ky *= Math.exp(-3*dt);
    if(f.phase==='drop' && f.t>=NET_DROP){ f.phase='wait'; f.t=0; }
    else if(f.phase==='wait'){
      if(steering){ f.phase='cancel'; f.t=0; popups.push({x:boat.x, y:boat.y-22, text:'nets hauled in', life:1.3, max:1.3}); }
      else if(f.t>=f.dur){
        f.phase='haul'; f.t=0;
        let n = 1 + (Math.random()<0.5 ? 1 : 0);
        if(boonFish>0){ n *= 2; boonFish--; }
        const kind = FISH[f.bank.sec];
        counts[kind.key] += n; caught += n;
        popups.push({x:boat.x, y:boat.y-24, text:'+'+n+' '+(n===1?kind.one:kind.many), life:1.8, max:1.8});
        Sfx.pickup();
        buzz([15,50,25]);                           // fish in the boat
        f.bank.state='scatter'; f.bank.t=0;            // the school disperses
      }
    }
    else if((f.phase==='haul' || f.phase==='cancel') && f.t>=NET_HAUL){ fishing = null; settleT = 0; }
  }
  // 0..1 how far the net is out
  function netAmount(){
    if(!fishing) return 0;
    const f = fishing;
    if(f.phase==='drop') return Math.min(1, f.t/NET_DROP);
    if(f.phase==='wait') return 1;
    return Math.max(0, 1 - f.t/NET_HAUL);
  }

  // ---------- Fog of war ----------
  // The world is split into cells; the ones the boat has come within sight
  // of are remembered. Everything else sits under a soft, dotted fog.
  const FOG_CELL = 48, FOG_N = Math.round(WORLD.w/FOG_CELL);   // 7200/48 = 150 cells a side
  const SIGHT = 220;                   // how far around the boat you uncover
  const explored = new Uint8Array(FOG_N*FOG_N);
  const fci = (i)=>((i%FOG_N)+FOG_N)%FOG_N;
  function reveal(x,y){
    const r = SIGHT, C = FOG_CELL;
    for(let j=Math.floor((y-r)/C); j<=Math.floor((y+r)/C); j++)
      for(let i=Math.floor((x-r)/C); i<=Math.floor((x+r)/C); i++){
        const k = fci(j)*FOG_N + fci(i);
        if(explored[k]) continue;
        if(Math.hypot((i+0.5)*C - x, (j+0.5)*C - y) <= r) explored[k] = 1;
      }
  }
  const fogCv = document.createElement('canvas');
  const fogCtx = fogCv.getContext('2d');
  let fogImg = null;
  function drawFog(camX, camY, w, h){
    const C = FOG_CELL;
    const i0 = Math.floor(camX/C)-1, j0 = Math.floor(camY/C)-1;
    const nx = Math.ceil(w/C)+3, ny = Math.ceil(h/C)+3;
    if(fogCv.width!==nx || fogCv.height!==ny || !fogImg){ fogCv.width=nx; fogCv.height=ny; fogImg = fogCtx.createImageData(nx,ny); }
    const d = fogImg.data;
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      const p = (j*nx+i)*4;
      d[p]=d[p+1]=d[p+2]=0;
      const kk = fci(j0+j)*FOG_N + fci(i0+i);
      d[p+3] = (explored[kk] || buoyClear[kk]) ? 0 : 255;          // buoys and villages always show through   // solid black: no stray light dots
    }
    fogCtx.putImageData(fogImg,0,0);
    ctx.imageSmoothingEnabled = true;                 // soft edges between cells
    ctx.drawImage(fogCv, i0*C, j0*C, nx*C, ny*C);
  }

  // ---------- Rollers: big breaking waves ----------
  // Now and then a big wave rolls in from upwind, well away from any shore.
  // It builds up, breaks into tumbling foam, then fades out. Crossing its
  // crest head-on or broadside hurts; catching it from astern lets you surf.
  const rollers = [];
  const SURF_BOOST = 32;            // extra px/s while surfing
  const SURF_COS = 0.4;             // surf if the heading is within ~66° of the wave's travel (else it hurts)
  let rollerT = 6;
  // crest offset (along the direction of travel) at u in -1..1: the middle
  // runs ahead, a slow swell rolls along the crest, the ends drag behind
  function rollerCrest(w, u){
    const p = w.t/w.dur;
    return w.bow*(1-u*u)
         + 2.2*Math.sin(u*4.5 + w.t*1.9 + w.seed) + 1.1*Math.sin(u*10 - w.t*2.7 + w.seed*2)
         - 5*Math.pow(Math.abs(u),3)*p;
  }
  function rollerStrength(w){       // 0..1 envelope: build, break, fade
    const p = w.t/w.dur;
    const sm = x=>{ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); };
    return p<0.3 ? sm(p/0.3) : p<0.7 ? 1 : 1 - sm((p-0.7)/0.3);
  }
  function spawnRoller(){
    const dw = windAngle + Math.PI, ux = Math.cos(dw), uy = Math.sin(dw);   // travel direction
    for(let tries=0; tries<20; tries++){
      const back = rand(60, 360), side = rand(-260, 260);
      const x = boat.x - ux*back - uy*side, y = boat.y - uy*back + ux*side;
      if(pierDist(wrapX(x),wrapY(y)).d < 280) continue;          // never inside or at a harbour
      if(wdist(wrapX(x),wrapY(y),START.x,START.y) < SAFE_R + 120) continue;   // never in home waters
      // needs a bit of open water ahead of it (not right on a beach)
      let clear = true;
      for(let k=0;k<=2 && clear;k++) if(onLand(wrapX(x+ux*k*120), wrapY(y+uy*k*120), 70)) clear = false;
      if(!clear) continue;
      rollers.push({x, y, ux, uy, L: rand(45,75), bow: rand(5,8), thick: rand(9,13),
                    speed: rand(25,30), t:0, dur: rand(4,6), hit:false, broke:false, seed: rand(0,100)});
      return;
    }
  }
  function updateRollers(dt){
    if(!moor && playing){
      rollerT -= dt * (fishing ? 0.2 : 1);            // quieter seas while the nets are out
      if(rollerT<=0){
        const dg = danger(boat.x, boat.y);
        const open = 1 - archipelago(boat.x, boat.y);
        rollerT = rand(0.8,1.2) * (5.5 - 3.2*dg) * (1.6 - 1.1*open);   // rarer near home and among islands, frequent far out on open sea
        if(rollers.length < (open > 0.6 ? 9 : 6) && dg > 0.05) spawnRoller();
      }
    }
    for(let k=rollers.length-1;k>=0;k--){
      const w = rollers[k];
      w.t += dt;
      w.x += w.ux*w.speed*dt; w.y += w.uy*w.speed*dt;
      if(onLand(wrapX(w.x+w.ux*40), wrapY(w.y+w.uy*40), 60) || pierDist(wrapX(w.x),wrapY(w.y)).d < 170)
        w.t = Math.max(w.t, w.dur*0.75);                  // dies on shoaling water or at a harbour mouth
      if(wdist(wrapX(w.x),wrapY(w.y),START.x,START.y) < SAFE_R + 60){ w.hit = true; w.t = Math.max(w.t, w.dur*0.8); }   // home waters: it dies down harmlessly
      const s = rollerStrength(w);
      const dx = wdx(boat.x, w.x), dy = wdy(boat.y, w.y);
      const dist = Math.hypot(dx,dy);
      // it breaks: a roar, louder the closer it is
      if(!w.broke && w.t > w.dur*0.3){ w.broke = true; if(dist < 700) Sfx.waveBreak(Math.max(0.15, 1-dist/700), Math.max(-0.8,Math.min(0.8,dx/400))); }
      if(w.t >= w.dur){ rollers.splice(k,1); continue; }
      if(w.hit || moor || boat.whirl || s < 0.55) continue;
      // boat in wave frame: across = along travel, along = along the crest
      const across = dx*w.ux + dy*w.uy, along = -dx*w.uy + dy*w.ux;
      const u = along/(w.L/2);
      if(Math.abs(u) >= 1) continue;
      const crest = rollerCrest(w, u);                    // the middle runs ahead, the crest undulates
      const half = w.thick*0.6*Math.pow(1-u*u,0.5) + boat.r*0.5;
      if(Math.abs(across - crest) > half) continue;
      w.hit = true;
      const c = Math.cos(boat.angle)*w.ux + Math.sin(boat.angle)*w.uy;   // 1 = sailing with the wave
      if(c > SURF_COS){
        boat.surfT = 2.6;
        popups.push({x:boat.x, y:boat.y-24, text:'surf!', life:1.4, max:1.4});
        Sfx.surf();
        boat.rock = Math.min(2.5, (boat.rock||0) + 0.8);
        buzz([180,50,120,50,70]);                   // riding the wave: a sustained rumble
      } else {
        const k2 = s*(0.6 + 0.4*(1-Math.max(0,c)));        // head-on and broadside hurt most
        const dmg = Math.round(6 + 10*k2);
        boat.health = Math.max(0, boat.health - dmg);
        boat.kx += w.ux*45*s; boat.ky += w.uy*45*s; boat.kdamp = 2.2;
        boat.speed *= 0.4;
        boat.angle += (Math.random()<0.5?-1:1)*0.25*k2;
        hurtFlash = 0.35; shake = 0.28; showHealth();
        popups.push({x:boat.x, y:boat.y-24, text:'-'+dmg, life:1.1, max:1.1});
        Sfx.waveHit(k2);
        boat.rock = Math.min(2.5, (boat.rock||0) + 1.6*k2);
        buzz([60,30,80]);                           // slapped by a wave
      }
    }
  }
  // the wave: a dark, steepening face along a bowed crest line, tapered at
  // the ends; once it breaks, white foam tumbles along the crest and spills
  // back, and as it fades the foam thins into scattered specks
  function drawRoller(w){
    if(!inView(w.x, w.y, w.L)) return;
    const s = rollerStrength(w), p = w.t/w.dur;
    const fx = w.ux, fy = w.uy, cx = -fy, cy = fx;       // travel / crest directions
    const N = 30;
    // the swell rises from the middle outward, and dies back from the ends
    const reach = Math.min(1, 0.3 + 0.7*Math.min(1, p/0.3)) * (p>0.75 ? 1 - (p-0.75)/0.25*0.45 : 1);
    const P = (u, off)=>{                                // u -1..1 along crest, off along travel
      const c = rollerCrest(w, u);
      return [w.x + cx*u*w.L/2 + fx*(c+off), w.y + cy*u*w.L/2 + fy*(c+off)];
    };
    // thickness: tapered ends, breathing, a little lumpy along the crest
    const taper = u=> Math.pow(Math.max(0,1-(u/reach)*(u/reach)), 0.6);
    const thick = u=> w.thick*taper(u)*(0.5+0.5*s)*(0.85 + 0.15*Math.sin(u*7 + w.t*2.3 + w.seed));
    const span = (fn)=>{ for(let i=0;i<=N;i++){ const u=(-1+2*i/N)*reach; fn(u,i); } };
    // the swell: soft overlapping patches of darker water along the crest,
    // each breathing on its own, so the wave reads as moving water
    for(let i=0;i<=N;i+=1){
      const u = (-1+2*i/N)*reach, tp = taper(u);
      if(tp < 0.05) continue;
      const th = thick(u), wob = Math.sin(w.t*2.2 + i*0.9 + w.seed);
      const [x,y] = P(u, -th*(0.45 + 0.12*wob));
      const r = th*(0.7 + 0.18*Math.sin(i*1.3 + w.t*1.6));
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, 'rgba(0,0,0,'+(0.14*s*tp)+')'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // crest: a broken, stippled line that comes and goes along its length
    ctx.strokeStyle = INKC; ctx.lineWidth = 1.2; ctx.lineCap='round';
    for(let i=0;i<N;i++){
      const u0=(-1+2*i/N)*reach, u1=(-1+2*(i+0.75)/N)*reach;
      const flick = 0.5 + 0.5*Math.sin(w.t*3.1 + i*1.7 + w.seed);
      if(flick < 0.25) continue;
      ctx.globalAlpha = Math.min(1, s*flick*taper((u0+u1)/2)*1.2);
      const [x0,y0]=P(u0,0), [x1,y1]=P(u1,0);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    // back of the wave: a few ripples trailing behind, stretched by the swell
    ctx.lineWidth = 1;
    for(let k=0;k<5;k++){
      const u = (-0.7 + 0.35*k)*reach, back = -thick(u)*(1.5 + 0.4*Math.sin(w.t*1.7+k)), l = 0.08;
      ctx.globalAlpha = s*0.45;
      const [x0,y0]=P(u-l,back), [x1,y1]=P(u+l,back-1.5);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // foam: tumbling blobs on the crest while breaking, spilling back and
    // breaking up into specks as the wave dies
    const foam = p<0.25 ? 0 : p<0.35 ? (p-0.25)/0.1 : 1;
    if(foam>0){
      const spill = Math.max(0, (p-0.55)/0.45);           // 0 → 1 over the fade
      // white water riding the crest (ink edge, paper body), thinning as it fades
      const bw = 3.2*foam*(1-spill*0.8);
      if(bw>0.8){
        const crestPath = ()=>{ ctx.beginPath(); for(let i=0;i<=N;i++){ const u=(-0.9+1.8*i/N)*reach; const [x,y]=P(u, Math.sin(w.t*3+i)*0.8 - spill*6); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); } };
        ctx.globalAlpha = Math.min(1, s*1.3); ctx.lineCap='round';
        ctx.strokeStyle = INKC; ctx.lineWidth = bw+2; crestPath(); ctx.stroke();
        ctx.strokeStyle = PAPERC; ctx.lineWidth = bw; crestPath(); ctx.stroke();
      }
      const nb = Math.floor(w.L/7);
      for(let i=0;i<nb;i++){
        const h = Math.sin(w.seed + i*12.9898)*43758.5453, rr = h - Math.floor(h);
        const u = (-0.95 + 1.9*(i+rr*0.8)/nb + 0.04*Math.sin(w.t*1.3 + i))*reach;   // foam slides along the crest
        const tw = taper(u);
        if(tw < 0.15) continue;
        const roll = Math.sin(w.t*4 + i*1.7)*2.2;          // tumbling
        const back = -spill*w.thick*1.4*(0.4+rr);
        const [x,y] = P(u, roll*0.5 + back);
        const r = (1.4 + 1.9*rr)*tw*foam*(1 - spill*0.7);
        if(r < 0.5) continue;
        ctx.globalAlpha = Math.min(1, s*1.3);
        ctx.fillStyle = PAPERC; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
        if(spill < 0.6){ ctx.strokeStyle = INKC; ctx.lineWidth = 0.9; ctx.stroke(); }
        // little curls thrown ahead of the crest
        if(i%3===0 && spill<0.3){
          const [qx,qy] = P(u, 5+roll);
          ctx.beginPath(); ctx.arc(qx,qy,2.4*tw,Math.atan2(fy,fx)-2.2,Math.atan2(fy,fx)+0.6); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Powers from the ruins ----------
  const BOONS = {
    wind: { title:'the friendly wind', text:"the wind changes its voice and settles at your back. For a minute it will blow from astern, wherever you go." },
    fish: { title:'the blessed nets', text:"the water round the pier fills with flashes of silver. Your next three hauls will bring twice the fish." },
    heal: { title:'the hull reborn', text:"the planks of the boat creak and close up on their own, good as new. The hull is whole again." }
  };
  let boonWindT = 0, boonFish = 0;
  const elBoon = document.getElementById('boon');
  function updateBoonBadge(){
    const parts = [];
    if(boonWindT>0) parts.push('friendly wind ' + Math.ceil(boonWindT) + ' s');
    if(boonFish>0) parts.push('blessed nets ×' + boonFish);
    elBoon.textContent = parts.length ? '✦ ' + parts.join('  ·  ') : '';
    elBoon.classList.toggle('show', parts.length>0);
  }
  function startRuin(r){
    const now = voyageTime;
    if(now < r.readyAt){
      openDialog(r.name, "The stones are silent. The wind passes between the columns without a word: whatever dwells here is still resting. Come back later.", 3);
      return;
    }
    r.readyAt = now + RUIN_COOLDOWN;
    const keys = Object.keys(BOONS), k = keys[Math.floor(Math.random()*keys.length)];
    const b = BOONS[k];
    if(k==='wind'){ boonWindT = 60; shiftDur = 0; }
    if(k==='fish') boonFish = 3;
    if(k==='heal'){ boat.health = MAX_HEALTH; showHealth(); }
    Sfx.bell(); buzz([14,22,14,22,14,22,14,22,14,22,40]);   // the ruins' power: a quick flutter
    openDialog(r.name + ' · ' + b.title,
      "You walk among the broken columns and the fallen drums in the grass. On an altar worn by the wind there is a carved sign no one can read any more. You touch it with your fingers and " + b.text, 5);
  }

  // ---------- Village market ----------
  // Docked at a village: a barter table. On the left your hold (every fish
  // a unit), on the right the stall with the village's dishes (one of each).
  // Drag goods across, or tap them, to make an offer;
  // the balance shows what the deal is worth. Selling fish earns coins, and
  // fish from other waters are worth more here. A negative balance is paid
  // from the purse; a positive one is paid to you in coins.
  const elMk = document.getElementById('market');
  const elMkTitle = document.getElementById('mk-title'), elMkText = document.getElementById('mk-text');
  const elMkYou = document.getElementById('mk-you-items'), elMkThem = document.getElementById('mk-them-items');
  const elMkPurse = document.getElementById('mk-purse'), elMkBal = document.getElementById('mk-bal');
  const elMkDeal = document.getElementById('mk-deal'), elMkFoot = document.getElementById('mk-foot');
  let marketV = null, mkItems = [], mkKey = '';
  const fishValue = (v, k)=> k===v.own ? COIN_LOCAL : COIN_FOREIGN;
  const fishWorth = (v)=> FISH_KEYS.reduce((a,k)=> a + counts[k]*fishValue(v,k), 0);   // the whole hold, sold here
  // the cheapest dish still on the stall (Infinity when everything's bought)
  const nextPrice = (v)=> Math.min(...v.dishes.filter(d=>!d.bought).map(d=>d.price), Infinity);
  const mkState = (v)=> [v.name, dishesGot(v), coins, ...FISH_KEYS.map(k=>counts[k])].join('|');
  function openMarket(v){
    marketV = v; elMk.classList.remove('hidden');
    document.body.classList.add('at-market');
    if(elList.classList.contains('open')) toggleList(false);
    mkKey = ''; renderMarket();
  }
  function closeMarket(){ marketV = null; mkDrag = null; elMk.classList.add('hidden'); document.body.classList.remove('at-market'); }
  // lay the table afresh from what's in the hold and on the stall
  function stockTable(v){
    mkItems = [];
    for(const k of FISH_KEYS) for(let n=0;n<counts[k];n++) mkItems.push({kind:'fish', key:k, origin:'you', side:'you', value: fishValue(v,k)});
    v.dishes.forEach((dsh,i)=>{ if(!dsh.bought) mkItems.push({kind:'food', dish:i, name:dsh.name, origin:'them', side:'them', value: dsh.price}); });
    mkItems.forEach((it,i)=> it.id = i);
  }
  // called every frame while docked: only redraws when something changed
  // (a repair can take a fish from the hold)
  function renderMarket(){
    if(!marketV) return;
    const key = mkState(marketV);
    if(key === mkKey) return;
    mkKey = key; stockTable(marketV); drawTable();
  }
  const mkBalance = ()=> mkItems.reduce((a,it)=> a + (it.side===it.origin ? 0 : it.origin==='you' ? it.value : -it.value), 0);
  const COIN_SVG = '<svg class="coin" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--paper)" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1"/></svg>';

  // ---------- Cicadas ----------
  // In the afternoon a chorus of cicadas sings on the wild islands (in the
  // pines and the macchia): heard only when the boat is close to a shore,
  // never on the village islands (the town is heard there), and quiet by
  // evening; the crickets take over at night.
  const CICADA_REACH = 220;                    // heard only this close to a shore
  let cicadaT = 0, cicadaNear = 0;
  // they sing in the afternoon: in from early afternoon, quiet by evening
  // (dayT: 0 first light, 0.5 midday-ish, 0.58 golden hour, 0.66 night)
  function cicadaHours(){
    const ss = (a,b,x)=>{ const k = Math.max(0, Math.min(1, (x-a)/(b-a))); return k*k*(3-2*k); };
    return ss(0.28, 0.34, dayT) * (1 - ss(0.5, 0.57, dayT));
  }
  function updateCicadas(dt){
    cicadaT -= dt;
    if(cicadaT <= 0){                                   // how close is land? (a few times a second is plenty)
      cicadaT = 0.3; let best = 0;
      islandGrid.query(boat.x, boat.y, CICADA_REACH + 200, isl=>{
        if(isl.village || isl.home) return;            // not at home, nor on town islands (their own sounds come first)
        const d = Math.max(0, Math.hypot(wdx(isl.x, boat.x), wdy(isl.y, boat.y)) - isl.rmax*0.9);   // ≈ distance from the shore
        best = Math.max(best, 1 - Math.min(1, d/CICADA_REACH));
      });
      cicadaNear = best;
    }
    Sfx.cicadas(playing ? cicadaHours()*cicadaNear*cicadaNear : 0);
  }

  // ---------- Night sounds ----------
  // After dark: crickets chirping (louder near land) and, now and then,
  // a howl from some island far off, sometimes answered.
  let cricketT = 0.5, howlT = 12;
  // crickets come and go in spells; everything is placed on actual islands
  let crGate = 0, crTarget = 1, crPhaseT = 12;
  function updateNightSound(dt){
    const n = typeof NIGHT==='number' ? NIGHT : 0;
    if(!playing || n < 0.3) return;
    const k = (n-0.3)/0.7;
    // spells: on for a while, then a hush
    crPhaseT -= dt;
    if(crPhaseT <= 0){ crTarget = crTarget ? 0 : 1; crPhaseT = crTarget ? rand(8,18) : rand(6,14); }
    crGate += (crTarget - crGate)*Math.min(1, dt*0.5);
    // nearby islands: the crickets live there
    const near = [];
    islandGrid.query(boat.x, boat.y, 650, isl=>{
      const dx = wdx(isl.x, boat.x), dy = wdy(isl.y, boat.y), d = Math.max(0, Math.hypot(dx,dy) - isl.R*0.7);
      if(d < 650) near.push([isl, dx, d]);
    });
    if(near.length && crGate > 0.05){
      cricketT -= dt*(0.8 + 1.8*k)*crGate*Math.min(3, near.length);
      if(cricketT <= 0){
        cricketT = rand(0.2, 0.7);
        const [isl, dx, d] = near[Math.floor(Math.random()*near.length)];
        const v = Math.max(0, 1 - d/650);
        Sfx.cricket(0.013*k*v*crGate*rand(0.6,1), Math.max(-0.9, Math.min(0.9, dx/350)));
      }
    }
    // a howl from some island further off, sometimes answered from another
    howlT -= dt*k;
    if(howlT <= 0){
      howlT = rand(24, 55);
      const far = [];
      islandGrid.query(boat.x, boat.y, 1300, isl=>{ const dx=wdx(isl.x,boat.x), dy=wdy(isl.y,boat.y), d=Math.hypot(dx,dy); if(d > 250 && !isl.home && !isl.village) far.push([dx,d]); });
      if(far.length){
        const [dx,d] = far[Math.floor(Math.random()*far.length)];
        const v = 0.016*k*(1 - 0.5*d/1300);
        Sfx.howl(v, Math.max(-0.9, Math.min(0.9, dx/500)));
        if(far.length > 1 && Math.random() < 0.45){
          const [dx2,d2] = far[Math.floor(Math.random()*far.length)];
          setTimeout(()=> Sfx.howl(0.011*k*(1 - 0.5*d2/1300), Math.max(-0.9, Math.min(0.9, dx2/500))), rand(1800,3500));
        }
      }
    }
  }


  // ---------- Town sounds ----------
  let townEvT = 1, chatT = 0;
  const TOWN_VOL = 0.6;               // overall loudness of the town sounds
  const TOWN_EVENTS = ['hammer','hammer','call','call','call','cart','clink','laugh','bell'];
  function updateTownSound(dt){
    let best = 0, pan = 0;
    for(const v of VILLAGES){
      const dx = wdx(v.isl.x, boat.x), dy = wdy(v.isl.y, boat.y), d = Math.hypot(dx,dy);

  // ---------- Wind streaks ----------
  // Now and then a long, thin line of wind sweeps across the view in the
  // direction the wind blows, sometimes ending in a little curl.
  const streaks = [];
  let streakT = 1;
  function makeStreakPath(){
    // a wavy line along +x that ends in a tightening curl (in local units)
    const pts = [[0,0]], L = rand(40, 70), amp = rand(1.5,3), fr = rand(0.05,0.08), ph = rand(0,6.3);
    for(let u=3; u<=L; u+=3) pts.push([u, Math.sin(u*fr+ph)*amp*(0.4+0.6*u/L)]);
    const [ex,ey] = pts[pts.length-1], dirUp = Math.random()<0.5 ? -1 : 1;
    let r = rand(4,6.5), a = -dirUp*Math.PI/2;
    const cx = ex, cy = ey + dirUp*r;
    for(let k=0;k<13;k++){ a += dirUp*0.38; r *= 0.94; pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]); }
    const cum = [0]; for(let k=1;k<pts.length;k++) cum.push(cum[k-1] + Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1]));
    return {pts, cum, len: cum[cum.length-1]};
  }
  function updateStreaks(dt){
    streakT -= dt;
    if(streakT <= 0){
      streakT = rand(1.2, 2.8) / (0.5 + windStrength);
      const dw = windAngle + Math.PI;
      const a = rand(0,Math.PI*2), d = rand(40, 260);
      streaks.push({x: boat.x + Math.cos(a)*d, y: boat.y + Math.sin(a)*d, ang: dw + rand(-0.15,0.15),
                    drift: rand(12, 22), age: 0, life: rand(1.8, 2.6), path: makeStreakPath(), wig: rand(0,6.3)});
    }
    const dw = windAngle + Math.PI;
    for(let k=streaks.length-1;k>=0;k--){
      const s = streaks[k];
      s.age += dt; s.x += Math.cos(dw)*s.drift*dt; s.y += Math.sin(dw)*s.drift*dt;   // barely drifting
      if(s.age >= s.life) streaks.splice(k,1);
    }
  }
  function drawStreaks(){
    ctx.strokeStyle = INKC; ctx.lineCap = 'round'; ctx.lineWidth = 1.2;
    for(const s of streaks){
      if(!inView(s.x, s.y, 140)) continue;
      const p = s.age/s.life, P = s.path;
      // the line draws itself out (head advancing), then the tail catches up
      const head = P.len * Math.min(1, p/0.55), tail = P.len * Math.max(0, (p-0.45)/0.55);
      const ca = Math.cos(s.ang), sa = Math.sin(s.ang);
      ctx.globalAlpha = 0.65 * Math.min(1, p*9, (1-p)*9);        // quick fade in and out
      ctx.beginPath();
      let started = false;
      for(let k=0;k<P.pts.length;k++){
        const c = P.cum[k];
        if(c < tail || c > head) continue;
        const wig = Math.sin(s.age*3 + k*0.4 + s.wig)*0.5;          // a slight ripple along the line
        const lx = P.pts[k][0], ly = P.pts[k][1] + wig;
        const x = s.x + lx*ca - ly*sa, y = s.y + lx*sa + ly*ca;
        if(started) ctx.lineTo(x,y); else { ctx.moveTo(x,y); started = true; }
      }
      if(started) ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Shopping list ----------
  const elList = document.getElementById('shoplist'), elListBody = document.getElementById('shoplist-body'), elListBtn = document.getElementById('btn-list');
  function renderList(){

  // the right page: the boat's hold. The purse, every fish aboard (small, as
