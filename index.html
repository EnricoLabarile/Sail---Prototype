<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vento e Vele</title>
<style>
  :root{
    --ink:#1b1a17;
    --paper:#ebe7dc;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:'Georgia','Iowan Old Style',serif;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #wrap{position:fixed; inset:0; overflow:hidden;}
  #c{
    position:absolute; top:0; left:0;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }

  /* --- HUD: flat ink on paper, 1-bit --- */
  .hud{position:fixed; pointer-events:none; color:var(--ink); z-index:5;}
  .panel{
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:4px;
    box-shadow:3px 3px 0 var(--ink);
  }
  #topbar{
    top:calc(12px + env(safe-area-inset-top,0px));
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:0 14px;
  }
  #wood{font-size:15px;}
  #andatura-box{
    padding:4px 9px;
    font-size:11.5px;
    min-width:0;
    text-align:center;
    line-height:1.25;
  }
  #andatura-label{font-weight:bold; font-size:13.5px; white-space:nowrap;}
  #status{
    position:fixed;
    top:calc(162px + env(safe-area-inset-top,0px));
    left:14px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:7px 12px;
    font-size:15px;
    z-index:5;
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .35s, transform .35s;
  }
  #status.show{opacity:1; transform:none;}
  #status.hurt{background:var(--ink); color:var(--paper);}
  #status.hurt .hp-track{border-color:var(--paper);}
  #status.hurt .hp-fill{background:var(--paper);}
  #boon{
    position:fixed;
    top:calc(204px + env(safe-area-inset-top,0px)); left:14px;
    padding:3px 9px; font-size:12px; font-style:italic;
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #boon.show{opacity:1;}
  #wood{
    position:fixed; left:50%; top:calc(3px + env(safe-area-inset-top,0px)); transform:translateX(-50%);
    display:grid; grid-template-areas:". n ." "w c e" ". s ."; grid-template-columns:auto 100px auto; grid-template-rows:24px 100px 24px;
    gap:3px 6px; align-items:center; justify-items:center; padding:0;
    background:none; border:none; box-shadow:none; pointer-events:none; z-index:5;
  }
  #wood .res-item{opacity:0; transition:opacity .6s; }
  #wood .res-item.has{opacity:1;}
  #compass.nudge{animation:nudge .55s ease-in-out;}
  @keyframes nudge{0%,100%{transform:translateX(-50%) rotate(0)} 20%{transform:translateX(-50%) rotate(-7deg)} 45%{transform:translateX(-50%) rotate(6deg)} 70%{transform:translateX(-50%) rotate(-3deg)}}
  #wood .res-item{background:var(--paper); border:2px solid var(--ink); border-radius:12px; padding:1px 7px; box-shadow:2px 2px 0 var(--ink);}
  #wood .fish-orate{justify-self:end;} #wood .fish-sgombri{justify-self:start;}
  #wood .fish-sarde{grid-area:n;} #wood .fish-sgombri{grid-area:e;} #wood .fish-triglie{grid-area:s;} #wood .fish-orate{grid-area:w;}

  #wood .res-item{display:flex; align-items:center; gap:3px;}
  #compass{
    position:fixed;
    top:calc(30px + env(safe-area-inset-top,0px));
    left:50%; transform:translateX(-50%);
    width:100px; height:100px;
    z-index:5;
    pointer-events:none;
  }
  #market{
    position:fixed;
    top:calc(162px + env(safe-area-inset-top,0px));
    left:50%; transform:translateX(-50%);
    width:min(420px, calc(100vw - 28px));
    padding:12px 14px 12px;
    z-index:8;
  }
  #mk-title{font-weight:bold; font-style:italic; font-size:15px; margin-bottom:5px;}
  #mk-text{font-size:14px; line-height:1.4; margin-bottom:8px;}
  #mk-price{font-size:13px; line-height:1.45; white-space:pre-line; margin-bottom:10px; padding:6px 8px; border:1.5px dashed var(--ink);}
  #mk-price:empty{display:none;}
  #mk-price{white-space:normal;}
  .mk-row{display:flex; align-items:center; gap:8px; min-height:26px;}
  .mk-fish svg{width:30px; height:16px; display:block;}
  .mk-rule{font-size:13.5px; margin-left:4px;}
  #market button{
    display:block; width:100%; margin:0 0 8px; padding:10px 10px;
    font-family:inherit; font-size:15px; text-align:left;
    background:var(--paper); color:var(--ink);
    border:2px solid var(--ink); border-radius:4px; box-shadow:3px 3px 0 var(--ink);
    cursor:pointer; touch-action:manipulation;
  }
  #market button:active:not(:disabled){transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  #market button:disabled{box-shadow:none; border-style:dashed; opacity:.7; cursor:default;}
  #market button.done{background:var(--ink); color:var(--paper); opacity:1; border-style:solid;}
  #mk-foot:empty{display:none;}
  #mk-foot{font-size:12.5px; white-space:pre-line; border-top:1.5px solid var(--ink); padding-top:6px; margin-top:2px;}
  #dialog{
    position:fixed;
    top:calc(162px + env(safe-area-inset-top,0px));
    left:50%; transform:translateX(-50%);
    width:min(420px, calc(100vw - 28px));
    padding:12px 15px 13px;
    z-index:7;
    cursor:pointer;
  }
  #dlg-title{font-weight:bold; font-style:italic; font-size:15px; margin-bottom:6px; letter-spacing:.02em;}
  #dlg-text{font-size:15px; line-height:1.45; min-height:4.35em;}
  #dlg-foot{font-size:12.5px; margin-top:9px; white-space:pre-line; border-top:1.5px solid var(--ink); padding-top:6px;}
  #dlg-foot:empty{display:none;}
  #hint{
    white-space:pre-line;
    position:fixed;
    top:calc(236px + env(safe-area-inset-top,0px));
    left:14px;
    padding:5px 10px;
    font-size:13px;
    font-style:italic;
    z-index:5;
    pointer-events:none;
  }
  .hp{display:flex; align-items:center; gap:8px;}
  .hp-label{font-size:13px;}
  .hp-track{
    width:88px; height:10px;
    border:1.5px solid var(--ink);
    border-radius:2px;
    padding:1px;
  }
  .hp-fill{height:100%; width:100%; background:var(--ink);}
  #status.low .hp-fill{animation:blink .6s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #hp-num{min-width:24px; text-align:right; font-variant-numeric:tabular-nums;}
  .res-item{display:flex; align-items:center; gap:6px;}
  .log-ico{width:22px; height:12px;}

  /* --- Touch controls --- */
  /* helm buttons: round wooden 'knobs' in the wheel's style — a dotted
     (dithered) face, a light ring and an inked rim */
  button, canvas{ -webkit-tap-highlight-color: transparent; }
  button:focus:not(:focus-visible){ outline:none; }
  .helm-btn{
    position:fixed;
    overflow:visible;
    right:12px;
    z-index:7;
    width:78px; height:78px;
    border-radius:50%;
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(var(--ink) 0.75px, transparent 0.95px);
    background-size:3px 3px;
    border:3px solid var(--ink);
    box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5.5px var(--ink), 3px 3px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation;
    padding:0;
  }
  .helm-btn:active{transform:translate(2px,2px); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5.5px var(--ink), 1px 1px 0 var(--ink);}
  .helm-btn:focus-visible{outline:2px dashed var(--ink); outline-offset:3px;}
  #btn-list svg{width:42px; height:42px; background:var(--paper); border-radius:50%; padding:4px; box-sizing:content-box;}
  #btn-list{left:12px; right:auto; bottom:calc(20px + env(safe-area-inset-bottom,0px));}
  body.at-market #btn-list{display:none;}
  #btn-list.open{background-color:var(--ink); background-image:radial-gradient(var(--paper) 0.75px, transparent 0.95px);}
  /* the shopping list: slides down from the top of the screen */
  #shoplist{
    position:fixed; left:50%; top:0; z-index:9;
    width:min(400px, calc(100vw - 24px));
    transform:translate(-50%, -110%); transition:transform .45s cubic-bezier(.2,.8,.2,1);
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
    border-top:none; border-radius:0 0 6px 6px;
  }
  #shoplist.open{transform:translate(-50%, 0);}
  #toast{
    position:fixed; left:50%; bottom:calc(262px + env(safe-area-inset-bottom,0px)); z-index:8;   /* just above the wheel */
    transform:translate(-50%, -8px); opacity:0; transition:opacity .5s, transform .5s;
    padding:6px 14px; font-style:italic; font-size:15px; white-space:nowrap; pointer-events:none;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0);}
  #shoplist h2{margin:0 0 8px; font-size:17px; font-style:italic;}
  #shoplist ul{list-style:none; margin:0; padding:0;}
  #shoplist li{display:grid; grid-template-columns:22px 1fr; gap:2px 6px; padding:7px 0; border-top:1.5px dashed var(--ink); font-size:14.5px;}
  #shoplist li:first-child{border-top:none;}
  #shoplist .mark{grid-row:span 2; font-size:17px; line-height:1.1;}
  #shoplist .food{font-weight:bold;}
  #shoplist .where{font-size:12.5px; line-height:1.35;}
  #shoplist li.got .food{text-decoration:line-through;}
  #shoplist .note{font-size:12px; font-style:italic; margin-top:8px;}
  #wheel{
    transition:opacity .35s;
    position:fixed;
    left:50%; transform:translateX(-50%);
    bottom:calc(6px + env(safe-area-inset-bottom,0px));
    width:221px; height:242px;
    touch-action:none; cursor:grab;
    z-index:6;
  }
  #wheel.grabbed{cursor:grabbing;}
  /* the halyard: a rope hanging from a block on the right; pull it down to switch sail */
  #rope{
    position:fixed;
    right:6px; bottom:calc(10px + env(safe-area-inset-bottom,0px));
    width:52px; height:210px;
    touch-action:none; cursor:grab;
    z-index:7;
  }
  #rope.grabbed{cursor:grabbing;}
  #rope:focus-visible{outline:2px dashed var(--ink); outline-offset:2px;}

  /* --- Intro / game over --- */
  #intro, #gameover{
    position:fixed;
    inset:0;
    z-index:20;
    background-color:var(--paper);
    /* 1-bit dotted backdrop */
    background-image:radial-gradient(var(--ink) 0.8px, transparent 1px);
    background-size:4px 4px;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  .card{
    background:var(--paper);
    border:2px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    padding:18px 20px 22px;
    max-width:400px;
    max-height:100%;
    overflow:auto;
  }
  #intro h1, #gameover h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:.04em;
    font-style:italic;
  }
  #intro p, #gameover p{font-size:14.5px; line-height:1.5; margin:8px 0;}
  .intro-card{text-align:left;}
  .shopping{margin:10px 0 18px; padding-left:22px; font-size:15px; line-height:1.7;}
  .shopping li{list-style:'– ';}
  #start-btn{display:block; margin:0 auto; background:var(--ink); color:var(--paper); animation:ring 1.8s ease-in-out infinite;}
  @keyframes ring{0%,100%{box-shadow:0 0 0 2px var(--paper), 0 0 0 4px rgba(27,26,23,0.15)} 50%{box-shadow:0 0 0 3px var(--paper), 0 0 0 7px rgba(27,26,23,0.55)}}
  #intro button, #gameover button{
    margin-top:16px;
    padding:10px 30px;
    font-size:16px;
    font-family:inherit;
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--ink);
    border-radius:4px;
    box-shadow:3px 3px 0 rgba(27,26,23,.35);
    cursor:pointer;
  }
  #intro button:active, #gameover button:active{transform:translate(2px,2px);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud" id="topbar">
    <div id="wood" class="panel">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <pattern id="sh-light" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="var(--paper)"/><rect width="1" height="1" fill="var(--ink)"/></pattern>
        <pattern id="sh-mid" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="var(--paper)"/><rect width="1" height="1" fill="var(--ink)"/><rect x="1" y="1" width="1" height="1" fill="var(--ink)"/></pattern>
      </defs></svg>
      <div class="res-item fish-sarde" title="Sardines"><svg class="log-ico" viewBox="0 0 22 12" aria-label="sardines"><path d="M2 6 Q8 0.5 15 6 Q8 11.5 2 6 Z" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><path d="M15 6 L21 2 L21 10 Z" fill="var(--paper)" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="5.2" r="1.1" fill="currentColor"/></svg><span id="f-sarde">0</span></div>
      <div class="res-item fish-sgombri" title="Mackerel"><svg class="log-ico" viewBox="0 0 22 12" aria-label="mackerel"><path d="M2 6 Q8 0.5 15 6 Q8 11.5 2 6 Z" fill="url(#sh-light)" stroke="currentColor" stroke-width="1.6"/><path d="M15 6 L21 2 L21 10 Z" fill="url(#sh-light)" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="5.2" r="1.1" fill="currentColor"/></svg><span id="f-sgombri">0</span></div>
      <div class="res-item fish-triglie" title="Red mullet"><svg class="log-ico" viewBox="0 0 22 12" aria-label="red mullet"><path d="M2 6 Q8 0.5 15 6 Q8 11.5 2 6 Z" fill="url(#sh-mid)" stroke="currentColor" stroke-width="1.6"/><path d="M15 6 L21 2 L21 10 Z" fill="url(#sh-mid)" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="5.2" r="1.3" fill="var(--paper)" stroke="currentColor" stroke-width="0.8"/></svg><span id="f-triglie">0</span></div>
      <div class="res-item fish-orate" title="Sea bream"><svg class="log-ico" viewBox="0 0 22 12" aria-label="sea bream"><path d="M2 6 Q8 0.5 15 6 Q8 11.5 2 6 Z" fill="currentColor" stroke="currentColor" stroke-width="1.6"/><path d="M15 6 L21 2 L21 10 Z" fill="currentColor"/><circle cx="6" cy="5.2" r="1.2" fill="var(--paper)"/></svg><span id="f-orate">0</span></div>
    </div>
    <div id="boon" class="panel" aria-live="polite"></div>
    <div id="andatura-box" class="panel" hidden>
      <div id="andatura-label">—</div>
      <div id="andatura-speed">speed: 0%</div>
    </div>
  </div>


  <div class="hud panel" id="status">
    <div class="hp" role="meter" aria-label="Hull integrity" aria-valuemin="0" aria-valuemax="100" id="hp-meter">
      <span class="hp-label">Hull</span>
      <div class="hp-track"><div class="hp-fill" id="hp-fill"></div></div>
      <span id="hp-num">100</span>
    </div>
  </div>

  <button id="btn-list" class="helm-btn" type="button" aria-label="Shopping list" aria-expanded="false" aria-controls="shoplist">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3 H16 L19 6 V21 H6 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 3 V6 H19" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 10 H16 M9 13.5 H16 M9 17 H13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <div id="shoplist" class="panel" role="region" aria-label="Shopping list"></div>
  <div id="toast" class="panel" role="status" aria-live="polite"></div>
  <canvas id="wheel" aria-label="Helm: drag clockwise or anticlockwise to steer"></canvas>
  <canvas id="rope" tabindex="0" role="button" aria-label="Halyard: pull down to switch sail"></canvas>

  <div id="intro">
   <div class="card intro-card">
    <p>You are planning a big party and require delicacies from the four corners of the world. Here is the shopping list for the banquet:</p>
    <ul class="shopping">
      <li>Fried Panzerotti from Nordania</li>
      <li>Mozzarelle from Sudia</li>
      <li>Lasagna from Estolia</li>
      <li>Limoncello from Westa</li>
    </ul>
    <button id="start-btn">Set sail</button>
   </div>
  </div>

  <canvas id="compass" width="72" height="72" aria-label="Compass: points home. Ports visited: none"></canvas>
  <div id="hint" class="panel hidden"></div>
  <div id="market" class="panel hidden" role="dialog" aria-label="Market">
    <div id="mk-title"></div>
    <div id="mk-text"></div>
    <div id="mk-price"></div>
    <button id="mk-buy" type="button"></button>
    <div id="mk-foot"></div>
  </div>
  <div id="dialog" class="panel hidden" role="status" aria-live="polite">
    <div id="dlg-title"></div>
    <div id="dlg-text"></div>
    <div id="dlg-foot"></div>
  </div>

  <div id="gameover" class="hidden">
   <div class="card">
    <h1 id="go-title">The boat has sunk</h1>
    <p id="go-stats"></p>
    <button id="restart-btn">Set sail again</button>
   </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('c');
  const sctx = canvas.getContext('2d');
  // low-res game buffer: 1 game pixel ≈ 1 CSS px on phones (Playdate-like
  // density), 2 on big screens. It's shown at an integer number of device
  // pixels per game pixel, so the dither stays crisp.
  // The scene is drawn in greys into a low-res buffer (one pixel per game
  // pixel), dithered to two colours into a second one, then scaled up.
  const buf = document.createElement('canvas');
  let ctx = buf.getContext('2d', {willReadFrequently:true});   // swapped briefly when baking island images
  const obuf = document.createElement('canvas');       // final 1-bit frame, screen size
  const octx = obuf.getContext('2d');
  let PX = 1, K = 1, GW = 1, GH = 1, outImg = null;
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    const target = Math.max(1, Math.floor(Math.min(w,h)/380));
    K = Math.max(1, Math.round(target*dpr));
    PX = K/dpr;
    GW = Math.ceil(w/PX); GH = Math.ceil(h/PX);
    buf.width = GW; buf.height = GH;
    obuf.width = GW; obuf.height = GH;
    canvas.width = GW*K; canvas.height = GH*K;
    canvas.style.width = (GW*PX)+'px'; canvas.style.height = (GH*PX)+'px';
    outImg = octx.createImageData(GW, GH);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- World setup ----------
  const WORLD = { w: 7200, h: 7200 };
  // The world is a torus: sail off one edge and you come back in on the
  // opposite one. Positions wrap, and distances always take the short way round.
  function wd(d,L){ return d - L*Math.round(d/L); }
  function wdx(a,b){ return wd(a-b, WORLD.w); }
  function wdy(a,b){ return wd(a-b, WORLD.h); }
  function wdist(ax,ay,bx,by){ return Math.hypot(wdx(ax,bx), wdy(ay,by)); }
  function wrapX(x){ return ((x%WORLD.w)+WORLD.w)%WORLD.w; }
  function wrapY(y){ return ((y%WORLD.h)+WORLD.h)%WORLD.h; }
  // Spatial hash on the wrapping world, so lookups ("any rock near here?")
  // only look at nearby cells instead of every object on the map.
  function SpatialGrid(cellWanted){
    const nx = Math.max(1, Math.round(WORLD.w/cellWanted)), ny = nx;
    const cell = WORLD.w/nx;                   // exact divisor, so cells tile the torus
    const cells = Array.from({length:nx*ny}, ()=>[]);
    const ci = (i,n)=>((i%n)+n)%n;
    let stamp = 0;
    const key = '_g'+nx;                       // per-grid visit stamp on each object
    return {
      add(o,x,y,rad){
        for(let j=Math.floor((y-rad)/cell); j<=Math.floor((y+rad)/cell); j++)
          for(let i=Math.floor((x-rad)/cell); i<=Math.floor((x+rad)/cell); i++)
            cells[ci(j,ny)*nx+ci(i,nx)].push(o);
      },
      // calls fn on every object whose box may overlap (x±rad, y±rad);
      // stops and returns true as soon as fn returns true
      query(x,y,rad,fn){
        stamp++;
        for(let j=Math.floor((y-rad)/cell); j<=Math.floor((y+rad)/cell); j++)
          for(let i=Math.floor((x-rad)/cell); i<=Math.floor((x+rad)/cell); i++){
            for(const o of cells[ci(j,ny)*nx+ci(i,nx)]){
              if(o[key]===stamp) continue;
              o[key]=stamp;
              if(fn(o)===true) return true;
            }
          }
        return false;
      }
    };
  }
  const islandGrid = SpatialGrid(512), rockGrid = SpatialGrid(64);
  const rand = (a,b)=>a+Math.random()*(b-a);
  const norm = (a)=>{ while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a; };

  // ---------- Islands ----------
  // Each island is star-shaped: a radius sampled at ISL_N angles, built from
  // a few random harmonics so the outline is irregular but smooth. Along the
  // perimeter, a low-frequency noise decides rocky vs sandy stretches.
  const ISL_N = 96;
  const COS = new Float32Array(ISL_N), SIN = new Float32Array(ISL_N);
  for(let i=0;i<ISL_N;i++){ COS[i]=Math.cos(i/ISL_N*Math.PI*2); SIN[i]=Math.sin(i/ISL_N*Math.PI*2); }

  function harmonics(kFrom,kTo,aMin,aMax,falloff){
    const h=[];
    for(let k=kFrom;k<=kTo;k++) h.push({k, amp:rand(aMin,aMax)/Math.pow(k,falloff), ph:rand(0,Math.PI*2)});
    return h;
  }
  function evalH(h,th){ let v=0; for(const o of h) v+=o.amp*Math.sin(o.k*th+o.ph); return v; }
  function sumAmp(h){ let v=0; for(const o of h) v+=o.amp; return v; }

  function makeIsland(x,y,R){
    // big lobes + a fine, crinkled coastline
    const shapeH = harmonics(2,9,0.06,0.3,0.9).concat(harmonics(10,22,0.008,0.022,0));
    const rockH  = harmonics(1,3,0.4,1,0);
    const vegH   = harmonics(3,7,0.2,0.6,0);
    const edgeH  = harmonics(6,16,0.4,1,0.4);      // wobble of the vegetation line
    const rockNorm = sumAmp(rockH), vegNorm = sumAmp(vegH), edgeNorm = sumAmp(edgeH);
    const radii=new Float32Array(ISL_N), rocky=new Uint8Array(ISL_N), sand=new Float32Array(ISL_N);
    let rmax=0;
    for(let i=0;i<ISL_N;i++){
      const th=i/ISL_N*Math.PI*2;
      const r=Math.max(R*0.55, R*(1+evalH(shapeH,th)));
      radii[i]=r; if(r>rmax) rmax=r;
      rocky[i] = evalH(rockH,th)/rockNorm > -0.45 ? 1 : 0;   // mostly sheer limestone cliffs
      const vn = evalH(vegH,th)/vegNorm;          // -1..1
      const en = evalH(edgeH,th)/edgeNorm;
      // beach width: narrow on rocky stretches, from thin strips to wide
      // bays elsewhere, with a ragged vegetation line
      sand[i] = rocky[i] ? Math.max(2, 3+2*(vn+1)+en*1.5)
                         : Math.max(4, 6 + 22*Math.pow((vn+1)/2, 1.6) + en*3.5);
    }
    const isl = {x,y,R,rmax,radii,rocky,sand};
    decorateIsland(isl);
    return isl;
  }
  // Mediterranean macchia: a close, billowy carpet of tree-spurge domes
  // (Euphorbia dendroides), darker thickets, open patches of stony garrigue,
  // tufts of grass, and here and there a stone pine (Pinus pinea) with its
  // flat umbrella crown.
  const gaussR = ()=> (Math.random()+Math.random()+Math.random()-1.5)/1.5;
  function vegPoint(isl, depth){          // random point inside the vegetation, depth 0 edge → 1 centre
    const i=Math.floor(Math.random()*ISL_N);
    const inner = isl.radii[i]-isl.sand[i];
    const d = inner*(1-depth);
    return [isl.x+COS[i]*d, isl.y+SIN[i]*d, i];
  }
  function inVegetation(isl, x, y, m){
    const dx=x-isl.x, dy=y-isl.y, a=Math.atan2(dy,dx), i=Math.round(islIndex(a))%ISL_N;
    return Math.hypot(dx,dy) < rAt(isl,a) - isl.sand[i] - m;
  }
  // the spurge carpet: many small domes, allowed to overlap a little, kept
  // out of clearings and anywhere `blocked` says
  function scatterMacchia(isl, blocked, density){
    const R = isl.R, bushes = [], cell = 8, G = Math.ceil(isl.rmax*2/cell)+2, grid = new Array(G*G);
    const ox = isl.x - isl.rmax - cell, oy = isl.y - isl.rmax - cell;
    const tries = Math.floor(R*R/7*(density||1)), sk = Math.pow(R/120, 0.25), cl = isl.clearings;
    for(let k=0;k<tries;k++){
      // a point well inside the scrub (sampled along a spoke from the centre)
      const i = (Math.random()*ISL_N)|0, r = (2.6 + Math.random()*2.2)*sk;
      const inner = isl.radii[i] - isl.sand[i] - r*0.7;
      const d = inner*(1 - Math.pow(Math.random(),0.8));
      const x = isl.x + COS[i]*d + (Math.random()-0.5)*4, y = isl.y + SIN[i]*d + (Math.random()-0.5)*4;
      if(blocked && blocked(x,y,r)) continue;
      let ok = true;
      for(let c=0;c<cl.length;c++){ const q=cl[c]; if((x-q[0])*(x-q[0])+(y-q[1])*(y-q[1]) < q[2]*q[2]){ ok=false; break; } }
      if(!ok) continue;
      const gx = ((x-ox)/cell)|0, gy = ((y-oy)/cell)|0;
      for(let a=-1; a<=1 && ok; a++) for(let b2=-1; b2<=1 && ok; b2++){
        const list = grid[(gy+b2)*G + gx+a];
        if(list) for(const o of list){ const m=(o.r+r)*0.78; if((o.x-x)*(o.x-x)+(o.y-y)*(o.y-y) < m*m){ ok = false; break; } }
      }
      if(!ok) continue;
      const bsh = {x, y, r};
      bushes.push(bsh);
      (grid[gy*G+gx] || (grid[gy*G+gx] = [])).push(bsh);
    }
    bushes.sort((a,b)=>a.y-b.y);                          // back to front
    return bushes;
  }
  function decorateIsland(isl){
    const R = isl.R;
    isl.clumps=[]; isl.palms=[]; isl.plants=[]; isl.pines=[];
    // open garrigue: pale, stony clearings in the scrub
    isl.clearings = [];
    const nc = 1 + Math.floor(R/55) + (Math.random()<0.5?1:0);
    for(let k=0;k<nc;k++){
      const [cx,cy] = vegPoint(isl, rand(0.2,0.8)), cr = R*rand(0.08,0.16);
      for(let m=0;m<3;m++) isl.clearings.push([cx+rand(-1,1)*cr*0.7, cy+rand(-1,1)*cr*0.5, cr*rand(0.6,1)]);
    }
    isl.stones = [];
    for(const [cx,cy,cr] of isl.clearings) for(let m=0;m<Math.floor(cr*0.9);m++){
      const a=rand(0,6.3), d=Math.sqrt(Math.random())*cr*0.9; isl.stones.push([cx+Math.cos(a)*d, cy+Math.sin(a)*d, rand(0.6,1.6)]);
    }
    // darker thickets (lentisk, myrtle) under the spurge
    isl.patches = [];
    const np = 2+Math.floor(R/40);
    for(let k=0;k<np;k++){
      const [cx,cy] = vegPoint(isl, rand(0.25,0.8));
      const blobs=[]; const r0=rand(8,16)*R/110+3;
      for(let m=0;m<3;m++) blobs.push([cx+rand(-1,1)*r0*0.8, cy+rand(-1,1)*r0*0.6, r0*rand(0.6,1)]);
      isl.patches.push(blobs);
    }
    isl.bushes = scatterMacchia(isl, null, 1);
    // a few stone pines, alone or in a small group
    // pines: some standing alone, some in clumps whose crowns touch
    isl.umbrellas = [];
    const lone = Math.floor(rand(0, 2 + R/45));
    for(let k=0;k<lone;k++){ const [x,y] = vegPoint(isl, rand(0.15,0.85)); addUmbrella(isl, x, y); }
    const groups = Math.floor(rand(0, 1 + R/70));
    for(let g=0; g<groups; g++){
      const [gx,gy] = vegPoint(isl, rand(0.25,0.8)), n = 3 + Math.floor(rand(0,5));
      for(let k=0;k<n;k++) addUmbrella(isl, gx + gaussR()*R*0.13, gy + gaussR()*R*0.09);
    }
    isl.umbrellas.sort((a,b)=>a.y-b.y);
    // grass tufts in the gaps
    isl.tufts = [];
    for(let k=0;k<Math.floor(R/3);k++){ const [tx,ty] = vegPoint(isl, Math.sqrt(Math.random())*0.9); isl.tufts.push([tx,ty]); }
  }
  function addUmbrella(isl, x, y){
    if(!inVegetation(isl, x, y, 6)) return;
    if(isl.umbrellas.some(u=> Math.abs(u.x-x) < 9 && Math.abs(u.y-y) < 6)) return;   // not two trunks in one spot
    // a rounded crown built of many tufts of needles, fuller at the top,
    // a little ragged at the edge, on a tall trunk that bends as it rises
    const w = rand(24,38), ch = w*rand(0.5,0.68), h = rand(15,24), lobes = [];
    const nt = 9 + Math.floor(w/3);
    for(let k=0;k<nt;k++){
      const a = Math.PI + Math.random()*Math.PI, rr = Math.sqrt(Math.random());      // upper half-ellipse
      lobes.push([Math.cos(a)*w*0.5*rr, Math.sin(a)*ch*rr + ch*0.12, rand(3.2,5.8)*w/32]);
    }
    for(let k=0;k<5;k++){ const u = -0.42 + k*0.21; lobes.push([u*w, ch*0.12 + rand(-1,1.5), rand(3.5,5)*w/32]); }   // the flat-ish underside
    lobes.sort((a,b)=>b[1]-a[1]);                        // lower tufts first, top ones drawn over them
    isl.umbrellas.push({x, y, h, w, ch, lean: rand(-5,5), bend: rand(-4,4), lobes});
    // clear the spurge right under the crown's trunk
    if(isl.bushes) isl.bushes = isl.bushes.filter(b=> Math.hypot(b.x-x, b.y-y) > 7 && Math.hypot(b.x-x-w*0.25, (b.y-y)*2.6) > w*0.38);   // its shade keeps the ground clear
  }
  function islIndex(th){
    let f = th/(Math.PI*2)*ISL_N; f = ((f%ISL_N)+ISL_N)%ISL_N;
    return f;
  }
  function rAt(isl,th){
    const f=islIndex(th), i0=Math.floor(f)%ISL_N, i1=(i0+1)%ISL_N, k=f-Math.floor(f);
    return isl.radii[i0]*(1-k)+isl.radii[i1]*k;
  }
  function rockyAt(isl,th){ return isl.rocky[Math.round(islIndex(th))%ISL_N]===1; }
  // true if (x,y) is on land of any island (with optional extra margin)
  function onLand(x,y,margin){
    return islandGrid.query(x,y,margin, isl=>{
      const dx=wdx(x,isl.x), dy=wdy(y,isl.y), d=Math.hypot(dx,dy);
      if(d>isl.rmax+margin) return false;
      return d < rAt(isl,Math.atan2(dy,dx))+margin;
    });
  }
  function addIsland(isl){ islands.push(isl); islandGrid.add(isl, isl.x, isl.y, isl.rmax); }

  const START = {x:WORLD.w/2, y:WORLD.h/2};   // centre of the home island
  // 0 at home, 1 from DANGER_RING outwards: drives island, rock, whirlpool
  // and fish-bank density, so the far seas are richer but more treacherous
  const DANGER_RING = 3400;
  function danger(x,y){ return Math.min(1, wdist(x,y,START.x,START.y)/DANGER_RING); }
  const islands = [];

  // ---------- Home island ----------
  // A tiny sandy islet in the middle of the map with a hut and a pier;
  // the boat starts moored at the end of the pier.
  const HOME_R = 100;
  const HOME_BLD = 1.2;             // buildings on the home island are drawn a bit larger, to read at a glance
  const PIER_W = 12, PIER_LEN = 50, PIER_DIR = -Math.PI/2;  // pier points north
  const home = (function(){
    const x=START.x, y=START.y;
    const radii=new Float32Array(ISL_N), rocky=new Uint8Array(ISL_N), sand=new Float32Array(ISL_N);
    const p1=rand(0,Math.PI*2), p2=rand(0,Math.PI*2);
    let rmax=0;
    for(let i=0;i<ISL_N;i++){
      const th=i/ISL_N*Math.PI*2;
      radii[i]=HOME_R*(1+0.09*Math.sin(2*th+p1)+0.05*Math.sin(3*th+p2)+0.015*Math.sin(11*th+p1*3));
      if(radii[i]>rmax) rmax=radii[i];
      sand[i]=12+4*Math.sin(3*th+p2)+1.5*Math.sin(9*th);
    }
    const isl = {x,y,R:HOME_R,rmax,radii,rocky,sand,home:true};
    isl.clumps=[]; isl.pines=[];
    isl.patches=[[[x-34,y+6,7],[x-28,y+12,6]], [[x+30,y-14,6],[x+36,y-8,5]]];
    isl.palms=[];
    isl.plants=[];
    // bare, sun-bleached yard around the buildings (in home-scale units, see HOME_BLD)
    // the layout was drawn for a south-facing pier: mirror it top↔bottom
    const my = (py)=> 2*y - py;
    isl.patches.forEach(b=>b.forEach(q=>q[1]=my(q[1])));
    const B = HOME_BLD;
    isl.yard=[[x-4*B,y+12*B,26*B],[x+10*B,y+2*B,16*B],[x+27*B,y-18*B,14*B],[x-10*B,y-12*B,12*B],[x+18*B,y-38*B,13*B]];
    const inYard=(px,py)=>isl.yard.some(([cx,cy,r])=>Math.hypot(px-cx,py-cy)<r+2);
    isl.tufts=[];
    for(let k=0;k<90 && isl.tufts.length<55;k++){ const a=rand(0,6.3), d=Math.sqrt(Math.random())*(HOME_R-14); const tx=x+Math.cos(a)*d, ty=y+Math.sin(a)*d; if(!inYard(tx,ty)) isl.tufts.push([tx,ty]); }
    isl.clearings = []; isl.stones = []; isl.umbrellas = [];
    isl.bushes = scatterMacchia(isl, (px,py,r)=> isl.yard.some(([cx,cy,rr])=> Math.hypot(px-cx,py-cy) < rr+r+3), 0.8);
    addUmbrella(isl, x+48, y+30);                                   // a stone pine by the house
    isl.umbrellas.forEach(u=>{ if(isl.yard.some(([cx,cy,rr])=> Math.hypot(u.x-cx,u.y-cy) < rr+4)) u.gone = true; });
    isl.umbrellas = isl.umbrellas.filter(u=>!u.gone);
    return isl;
  })();
  // Carve a bay into an island facing `dir`: the coast pulls in around that
  // direction and the two horns either side stand out a little, making a C.
  // Decorations left in the new water are removed.
  // Remove an island's decorations where blocked(x, y, margin) is true.
  function clearDecor(isl, blocked){
    isl.clumps  = (isl.clumps ||[]).filter(c=>!blocked(c.x,c.y,c.r));
    isl.plants  = (isl.plants ||[]).filter(p=>!blocked(p.x,p.y,3));
    isl.patches = (isl.patches||[]).filter(b=>!b.some(([x,y,r])=>blocked(x,y,r)));
    isl.tufts   = (isl.tufts  ||[]).filter(([x,y])=>!blocked(x,y,1));
    if(isl.bushes) isl.bushes = isl.bushes.filter(b=>!blocked(b.x,b.y,b.r));
    if(isl.umbrellas) isl.umbrellas = isl.umbrellas.filter(u=>!blocked(u.x,u.y,8));
    if(isl.stones) isl.stones = isl.stones.filter(([x,y])=>!blocked(x,y,1));
    isl.specks = null;                                       // re-scattered lazily
  }
  // (the island is registered in the grid afterwards, with its final rmax)
  function carveBay(isl, dir, depth, halfW){
    for(let i=0;i<ISL_N;i++){
      const th = i/ISL_N*Math.PI*2;
      const d = Math.abs(Math.atan2(Math.sin(th-dir), Math.cos(th-dir)));
      let f = 1;
      if(d < halfW){ const c = Math.cos(d/halfW*Math.PI/2); f -= depth*c*c; }
      else if(d < halfW*1.7){ const c = Math.sin((d-halfW)/(halfW*0.7)*Math.PI); f += 0.12*c; }   // horns
      isl.radii[i] *= f;
    }
    isl.rmax = Math.max(...isl.radii);
    // anything now standing in the water goes
    clearDecor(isl, (x,y,m)=> Math.hypot(x-isl.x,y-isl.y) > rAt(isl,Math.atan2(y-isl.y,x-isl.x)) - m - 6);
  }
  // (home is added to the grid once its harbour bay has been carved, below)
  // ---------- Piers ----------
  // A pier runs from a root point on land (r0 from the island centre) out
  // past the shore by PIER_LEN, along direction dir.
  function makePier(isl, dir, r0){
    const cx=Math.cos(dir), cy=Math.sin(dir);
    const shore = rAt(isl, dir);
    const pr = { isl, dir, x0:isl.x+cx*r0, y0:isl.y+cy*r0,
                 x1:isl.x+cx*(shore+PIER_LEN), y1:isl.y+cy*(shore+PIER_LEN), dx:cx, dy:cy };
    pr.total = Math.hypot(pr.x1-pr.x0, pr.y1-pr.y0);
    pr.shoreAlong = shore - r0;                    // where the pier leaves the beach
    buildHarbour(pr);
    return pr;
  }
  // Villages get one tall lighthouse on the left-hand point of their bay
  // (the sweeping beam starts there).
  function buildHarbour(pr){
    const isl = pr.isl;
    pr.lights = []; pr.side = 1;
    if(isl.home) return;
    const ang = pr.dir - 0.95, rr = rAt(isl, ang) - 10;
    pr.lights.push({x:isl.x+Math.cos(ang)*rr, y:isl.y+Math.sin(ang)*rr, tall:true, ph: rand(0,6.3)});
  }
  carveBay(home, PIER_DIR, 0.3, 0.85);
  home.rmax = Math.max(...home.radii);
  const BERTH_OFF_START = PIER_W/2 + 12;
  const PIER = makePier(home, PIER_DIR, Math.min(HOME_R*0.55, rAt(home,PIER_DIR)-8));
  PIER.side = 1;                                   // the boat starts on the open (mouth) side
  addIsland(home);
  const piers = [PIER];
  // moored alongside the seaward end of the home quay, bow pointing out to sea
  const SPAWN = (function(){
    const a = PIER.total - 16, off = BERTH_OFF_START;
    return { x: PIER.x0 + PIER.dx*a - PIER.dy*PIER.side*off,
             y: PIER.y0 + PIER.dy*a + PIER.dx*PIER.side*off, angle: PIER.dir };
  })();
  // pier-aligned coordinates: along = out from the pier root toward the
  // sea, lat = signed distance across it (wrapped, like everything else)
  function pierFrame(pr,x,y){
    const ax=wdx(x,pr.x0), ay=wdy(y,pr.y0);
    return {along: ax*pr.dx+ay*pr.dy, lat: -ax*pr.dy+ay*pr.dx};
  }
  const BERTH_OFF = PIER_W/2 + 12;                          // hull centre to quay centre when moored
  const MOOR_RANGE = PIER_W/2 + 12 + 30;                    // lateral distance that triggers mooring
  function berthAt(pr, along, side){
    const a = Math.max(pr.shoreAlong+24, Math.min(pr.total-14, along));
    return { x: pr.x0 + pr.dx*a - pr.dy*side*BERTH_OFF,
             y: pr.y0 + pr.dy*a + pr.dx*side*BERTH_OFF, a: pr.dir };
  }
  // nearest pier to a point: distance to its centre line and outward normal
  // (qx,qy is the closest point, expressed next to the query point)
  function pierDist(x,y){
    let best = {d:Infinity, nx:0, ny:0, qx:x, qy:y};
    for(const pr of piers){
      const vx=pr.x1-pr.x0, vy=pr.y1-pr.y0;
      const ax=wdx(x,pr.x0), ay=wdy(y,pr.y0);
      const k=Math.max(0,Math.min(1,(ax*vx+ay*vy)/(vx*vx+vy*vy)));
      const dx=ax-vx*k, dy=ay-vy*k, d=Math.hypot(dx,dy);
      if(d<best.d) best = {d, nx:dx/(d||1), ny:dy/(d||1), qx:x-dx, qy:y-dy};
    }
    return best;
  }

  // ---------- Villages ----------
  // Four market villages toward the edges of the world, one per compass
  // point, each on its own island with a pier facing home and a lighthouse.
  // Each sells one thing for the banquet back home.
  const VILLAGE_DIST = 2475;
  const VILLAGES = [
    { name:'Nordania', ux:0, uy:-1, food:'fried panzerotti', own:'sarde',
      line:"The baker on the quay fries panzerotti all day long. He'll trade them for fish, but sardines he has plenty of: everyone catches those up here." },
    { name:'Estolia', ux:1, uy:0, food:'lasagna', own:'sgombri',
      line:"In the trattoria by the harbour a lasagna is resting on the sill. The cook takes fish in payment, but mackerel she's sick of: the whole east lives on it." },
    { name:'Sudia', ux:0, uy:1, food:'mozzarelle', own:'triglie',
      line:"At the dairy the cheesemaker is still stretching the morning's mozzarelle. He takes any fish you like, except red mullet: he catches those himself at dawn." },
    { name:'Westa', ux:-1, uy:0, food:'limoncello', own:'orate',
      line:"Grandma keeps the limoncello in the cool of the cellar. She'll swap a bottle for fish, as long as it isn't sea bream: out west her larder is full of it." }
  ];
  const BANQUET_TEXT = "On the home pier you unload the panzerotti, the mozzarelle, the lasagna and the limoncello. Someone spreads a tablecloth on the terrace, the lanterns are lit, the wine arrives. The sea is calm and the wind has dropped. The banquet can begin.";
  let won = false;
  // hand-shaped village island: rounded, with a wide clearing at the centre
  function makeVillageIsland(v){
    const x = wrapX(START.x + v.ux*VILLAGE_DIST), y = wrapY(START.y + v.uy*VILLAGE_DIST);
    const isl = makeIsland(x, y, rand(108,122));
    // soften the shape a little so the village and pier fit well
    for(let i=0;i<ISL_N;i++) isl.radii[i] = isl.R*0.55 + isl.radii[i]*0.45;
    isl.rmax = Math.max(...isl.radii);
    const dir = Math.atan2(START.y-y, START.x-x);            // pier faces home
    carveBay(isl, dir, 0.32, 0.85);
    const pr = makePier(isl, dir, Math.min(isl.R*0.45, rAt(isl,dir)-10));
    isl.village = v; v.isl = isl; v.pier = pr; v.done = false;
    makeVillageLayout(isl, v, pr);
    piers.push(pr);
    addIsland(isl);
  }
  function segDist(px,py, ax,ay, bx,by){
    const vx=bx-ax, vy=by-ay, k=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/(vx*vx+vy*vy)));
    return Math.hypot(px-ax-vx*k, py-ay-vy*k);
  }
  function makeVillageLayout(isl, v, pr){
    const cx = isl.x, cy = isl.y;
    const VR = Math.min(isl.R*0.52, 62);
    const L = {VR, houses:[], stalls:[], lanes:[]};
    // lanes: one down to the pier, two or three out into the scrub
    L.lanes.push([cx,cy,pr.x0,pr.y0]);
    const nl = 2+Math.floor(rand(0,2));
    for(let k=0;k<nl;k++){
      const a = pr.dir + Math.PI*(0.5+k*2/(nl+1)) + rand(-0.3,0.3);
      L.lanes.push([cx,cy,cx+Math.cos(a)*(VR+6),cy+Math.sin(a)*(VR+6)]);
    }
    const onLane = (x,y,m)=>L.lanes.some(l=>segDist(x,y,l[0],l[1],l[2],l[3])<m);
    // houses clustered around the piazza, off the lanes, never overlapping
    for(let tries=0; tries<2000 && L.houses.length<20; tries++){
      const a = rand(0,Math.PI*2), d = 19 + Math.random()*(VR-24);
      const w = Math.round(rand(12,19)), h = Math.round(rand(10,15));
      const hx = Math.round(cx+Math.cos(a)*d - w/2), hy = Math.round(cy+Math.sin(a)*d - h/2);
      if(onLane(hx+w/2, hy+h/2, 6+Math.max(w,h)/2)) continue;
      if(Math.hypot(hx+w/2-cx, hy+h/2-cy) > VR-4) continue;
      { const a=Math.atan2(hy+h/2-cy, hx+w/2-cx); if(Math.hypot(hx+w/2-cx, hy+h/2-cy) > rAt(isl,a)-Math.max(w,h)-6) continue; }   // stay on land (bay)
      if(L.houses.some(o=> hx < o.x+o.w+2 && hx+w+2 > o.x && hy < o.y+o.h+2 && hy+h+2 > o.y)) continue;
      L.houses.push({x:hx, y:hy, w, h, roof: Math.random()<0.55 ? 'flat' : 'gable', vert: Math.random()<0.5});
    }
    // market stalls around the piazza
    for(let k=0;k<4;k++){
      const a = pr.dir + 0.8 + k*Math.PI/2 + rand(-0.2,0.2);
      L.stalls.push({x: Math.round(cx+Math.cos(a)*12-3), y: Math.round(cy+Math.sin(a)*12-2)});
    }
    // lighthouse on the shore beside the pier root, with the keeper's hut
    const tl = pr.lights.find(l=>l.tall);
    L.light = {x: tl.x, y: tl.y, ph: tl.ph};
    L.hut = {x: Math.round(tl.x - Math.cos(pr.dir)*14 - 4), y: Math.round(tl.y - Math.sin(pr.dir)*14 - 4), w:8, h:7, roof:'gable', vert:false};
    isl.vl = L;
    // clear the decorations out of the village and off the pier path
    const busy = (x,y,m)=> Math.hypot(x-cx,y-cy) < VR+m || onLane(x,y,m+4)
      || segDist(x,y,pr.x0,pr.y0,pr.x1,pr.y1) < 10+m || Math.hypot(x-L.light.x,y-L.light.y) < 16+m;
    clearDecor(isl, busy);
  }
  for(const v of VILLAGES) makeVillageIsland(v);

  // ---------- Ruins ----------
  // Four islands on the diagonals, each with the stones of an ancient
  // sanctuary and a stone pier. Docking there grants a mysterious power.
  const RUIN_COOLDOWN = 180;          // seconds before the same ruin answers again
  const RUINS = [
    { name:'Ruins',       ux:-1, uy:-1 },
    { name:'Ruins',         ux: 1, uy:-1 },
    { name:'Ruins',           ux: 1, uy: 1 },
    { name:'Ruins', ux:-1, uy: 1 }
  ];
  function makeRuinIsland(r){
    const d = VILLAGE_DIST/Math.SQRT2*1.02;
    const x = wrapX(START.x + r.ux*d), y = wrapY(START.y + r.uy*d);
    const isl = makeIsland(x, y, rand(96,110));
    for(let i=0;i<ISL_N;i++) isl.radii[i] = isl.R*0.5 + isl.radii[i]*0.5;
    isl.rmax = Math.max(...isl.radii);
    const dir = Math.atan2(START.y-y, START.x-x);
    carveBay(isl, dir, 0.22, 0.7);
    const pr = makePier(isl, dir, Math.min(isl.R*0.42, rAt(isl,dir)-10));
    pr.stone = true; pr.lights = [];
    isl.ruin = r; r.isl = isl; r.pier = pr; r.readyAt = 0;
    makeRuinLayout(isl, pr);
    piers.push(pr);
    addIsland(isl);
  }
  function makeRuinLayout(isl, pr){
    const cx = isl.x - pr.dx*6, cy = isl.y - pr.dy*6;
    const L = {cx, cy, R: 34};
    // temple platform with a colonnade: some columns standing, some broken,
    // some fallen; drums scattered around; a broken arch nearby
    L.plat = {w: 46, h: 30};
    L.cols = [];
    for(let i=0;i<5;i++) for(const row of [-1,1]){
      const st = Math.random();
      L.cols.push({x: cx-18+i*9, y: cy+row*11, h: st<0.4 ? rand(12,17) : st<0.75 ? rand(3,7) : 0});
    }
    L.drums = [];
    for(let k=0;k<7;k++){ const a=rand(0,6.3), d=rand(26,42); L.drums.push({x:cx+Math.cos(a)*d, y:cy+Math.sin(a)*d*0.8, a:rand(0,6.3), long: Math.random()<0.4}); }
    const aa = rand(0,6.3);
    L.arch = {x: cx+Math.cos(aa)*40, y: cy+Math.sin(aa)*30};
    isl.rl = L;
    const busy = (x,y,m)=> Math.hypot(x-cx,y-cy) < 52+m || segDist(x,y,pr.x0,pr.y0,cx,cy) < 8+m;
    clearDecor(isl, busy);
  }
  for(const r of RUINS) makeRuinIsland(r);
  const SPECIALS = [...VILLAGES, ...RUINS];        // keep rocks and whirlpools away from these
  function foodsGot(){ return VILLAGES.filter(v=>v.done).length; }
  function banquetLine(){
    return 'Banquet:  ' + VILLAGES.map(v=>(v.done?'● ':'○ ')+v.food).join('   ');
  }

  (function genIslands(){
    const N = 180;
    let attempts=0;
    while(islands.length<N && attempts<60000){
      attempts++;
      const x = rand(0, WORLD.w);
      const y = rand(0, WORLD.h);
      const dg = danger(x,y);
      if(Math.random() > 0.2 + 0.8*dg*dg) continue;        // sparser near home, crowded far out
      const R = rand(90,160), gap = 210 - 120*dg;          // narrower channels far out
      // cheap pre-check with a generous radius before building the island
      if (wdist(x,y,START.x,START.y) < R*0.6+360) continue;
      if (islandGrid.query(x,y,R*0.6+gap, o=> wdist(x,y,o.x,o.y) < R*0.6+o.rmax+gap)) continue;
      const isl = makeIsland(x,y,R);
      if (wdist(x,y,START.x,START.y) < isl.rmax+360) continue;
      const clash = islandGrid.query(x,y,isl.rmax+gap, o=> wdist(x,y,o.x,o.y) < isl.rmax+o.rmax+gap);
      if(!clash) addIsland(isl);
    }
  })();

  // ---------- Rocks ----------
  // Density falls off with distance from shore, higher off rocky coast,
  // plus a few reef patches per island and sparse clusters in open water.
  const rocks = [];
  function makeRock(x,y,r){
    const n=6+Math.floor(rand(0,3)), pts=[];
    const a0=rand(0,Math.PI*2);
    for(let k=0;k<n;k++){
      const a=a0+k/n*Math.PI*2+rand(-0.25,0.25), rr=r*rand(0.75,1.15);
      pts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
    }
    const g=Math.floor(rand(-10,10));
    const tone=(v)=>'rgb('+(v[0]+g)+','+(v[1]+g)+','+(v[2]+g)+')';
    return {x,y,r,pts,foam:rand(0,Math.PI*2), dark:tone([109,104,98]), light:tone([143,138,130])};
  }
  function tryStack(x,y,r){
    x = wrapX(x); y = wrapY(y);
    if(wdist(x,y,START.x,START.y) < 300) return false;
    for(const v of SPECIALS) if(v.isl && wdist(x,y,v.isl.x,v.isl.y) < v.isl.rmax+160) return false;
    if(onLand(x,y,r+4)) return false;
    if(rockGrid.query(x,y,60, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < o.r+r+10)) return false;
    const o = makeRock(x,y,r);
    o.stack = true; o.h = r*rand(1.4,2.4);
    rocks.push(o); rockGrid.add(o,x,y,0);
    return true;
  }
  function tryRock(x,y,r,allowShore){
    x = wrapX(x); y = wrapY(y);
    if(wdist(x,y,START.x,START.y) < 260) return false;
    for(const v of SPECIALS) if(wdist(x,y,v.isl.x,v.isl.y) < v.isl.rmax+140) return false;   // clear approach
    if(!allowShore && onLand(x,y,r*0.5+2)) return false;
    if(rockGrid.query(x,y,30, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < o.r+r+2)) return false;
    const o = makeRock(x,y,r);
    rocks.push(o); rockGrid.add(o,x,y,0);
    return true;
  }
  const gauss = ()=> (Math.random()+Math.random()+Math.random()-1.5)/1.5;
  (function genRocks(){
    for(const isl of islands){
      if(isl.home || isl.village || isl.ruin) continue;          // keep home, village and ruin waters clear
      const rf = 0.4 + 1.4*danger(isl.x, isl.y);   // rockiness grows with distance
      // boulders sitting right on rocky stretches of coast
      for(let i=0;i<ISL_N;i+=2){
        if(!isl.rocky[i] || Math.random()<0.9) continue;
        const r=isl.radii[i]+rand(-2,5);
        tryRock(isl.x+COS[i]*r, isl.y+SIN[i]*r, rand(3,7), true);
      }
      // scattered rocks, denser near the shore
      // faraglioni: a few tall stacks standing just off the cliffs
      if(Math.random() < 0.7){
        const ns = 1 + Math.floor(rand(0,3)), a0 = rand(0,Math.PI*2);
        for(let k=0, tries=0; k<ns && tries<20; tries++){
          const a = a0 + rand(-0.7,0.7), d = rAt(isl,a) + rand(24,58);
          if(tryStack(isl.x+Math.cos(a)*d, isl.y+Math.sin(a)*d, rand(10,17))) k++;
        }
      }
      const target = Math.round(isl.R*0.035*rf);
      let placed=0, tries=0;
      while(placed<target && tries<target*20){
        tries++;
        const th=rand(0,Math.PI*2);
        const rocky=rockyAt(isl,th);
        if(!rocky && Math.random()>0.3) continue;
        const d = 6 - Math.log(1-Math.random())*(rocky?42:24);
        if(d>300) continue;
        const size = rand(3,6) + 9*Math.exp(-d/50)*Math.random();
        const r=rAt(isl,th)+d;
        if(tryRock(isl.x+Math.cos(th)*r, isl.y+Math.sin(th)*r, size, false)) placed++;
      }
      // reef patches: tight clusters a bit offshore, preferably off rocky coast
      const nReef = Math.random() < 0.35*rf ? 1 : 0;
      for(let q=0;q<nReef;q++){
        let th=rand(0,Math.PI*2);
        for(let k=0;k<12 && !rockyAt(isl,th);k++) th=rand(0,Math.PI*2);
        const cr=rAt(isl,th)+rand(50,140);
        const cx=isl.x+Math.cos(th)*cr, cy=isl.y+Math.sin(th)*cr;
        const n=4+Math.floor(rand(0,5));
        let got=0;
        for(let k=0;k<n*3 && got<n;k++){
          if(tryRock(cx+gauss()*38, cy+gauss()*38, rand(3,8), false)) got++;
        }
      }
    }
    // sparse open-water rocks
    for(let c=0;c<127;c++){
      const x=rand(0,WORLD.w), y=rand(0,WORLD.h);
      const dg=danger(x,y);
      if(Math.random() > 0.05 + 0.95*Math.pow(dg,1.5)) continue;
      if(onLand(x,y,60)) continue;
      const n=1+Math.floor(rand(0, 1+2*dg));
      for(let k=0;k<n;k++) tryRock(x+gauss()*20, y+gauss()*20, rand(4,10), false);
    }
  })();

  // ---------- Whirlpools ----------
  // Open-water hazards, only away from home and more common far out.
  // Sail into the eye and the boat is spun round and flung off on a random heading.
  const whirlpools = [];
  // A whirlpool lives a while in one spot, fades out, and some time later
  // opens up somewhere else. While faded out it has no effect at all.
  const WHIRL_FADE = 3;                   // seconds to open up / die down
  const bankList = [];                    // fish banks (filled further down)
  function findWhirlSpot(avoidBoat){
    for(let tries=0; tries<600; tries++){
      const x = rand(0, WORLD.w), y = rand(0, WORLD.h);
      const dg = danger(x,y);
      if(wdist(x,y,START.x,START.y) < 620) continue;
      if(SPECIALS.some(v=>wdist(x,y,v.isl.x,v.isl.y) < 460)) continue;
      if(Math.random() > Math.pow(dg,1.5)) continue;
      const r = rand(120, 155);            // outer edge of the pull ring (wide)
      const core = rand(30, 40);           // where the boat gets caught and spun
      if(avoidBoat && wdist(x,y,boat.x,boat.y) < r+260) continue;   // never right under the boat
      if(onLand(x,y,core+50)) continue;
      // rocks may sit in the pull ring, never in the core
      if(rockGrid.query(x,y,core+60, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < core+o.r+30)) continue;
      if(whirlpools.some(w=> w.phase!=='off' && wdist(w.x,w.y,x,y) < r+w.r+50)) continue;
      if(bankList.some(b=> b.state==='live' && wdist(b.x,b.y,x,y) < r+b.r+40)) continue;
      return {x, y, r, core};
    }
    return null;
  }
  (function genWhirlpools(){
    const N = 200;
    for(let k=0; k<N*3 && whirlpools.length<N; k++){
      const sp = findWhirlSpot(false);
      if(!sp) continue;
      const on = Math.random()<0.65;                 // start out of step with each other
      whirlpools.push({...sp, dir: Math.random()<0.5?-1:1, rot: rand(0,Math.PI*2),
                       hd: rand(0,Math.PI*2), vel: rand(5,9),
                       speed: rand(1.4,2.2), armed: true, escaping: false,
                       phase: on ? 'on' : 'off', s: on ? 1 : 0,
                       timer: on ? rand(5,60) : rand(2,25)});
    }
  })();
  // may a whirlpool's eye be here? open water, clear of home and villages
  function whirlWaterOK(x,y,core){
    if(wdist(x,y,START.x,START.y) < 620) return false;
    if(SPECIALS.some(v=>wdist(x,y,v.isl.x,v.isl.y) < 460)) return false;
    if(onLand(x,y,core+50)) return false;
    if(pierDist(x,y).d < 240) return false;                 // keep out of harbour mouths
    return !rockGrid.query(x,y,core+40, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < core+o.r+20);
  }
  function updateWhirlpools(dt){
    // slow wandering: a heading that drifts; turn away from land, rocks, piers
    for(const w of whirlpools){
      if(w.s<=0 || w.hd===undefined) continue;
      w.hd += rand(-0.6,0.6)*dt;
      // check the water a few seconds ahead, twice a second (staggered)
      w.chk = (w.chk===undefined ? Math.random()*0.5 : w.chk) - dt;
      if(w.chk<=0){
        w.chk = 0.5;
        const ahead = w.vel*6;
        if(!whirlWaterOK(wrapX(w.x+Math.cos(w.hd)*ahead), wrapY(w.y+Math.sin(w.hd)*ahead), w.core)) w.hd += Math.PI*rand(0.6,1.4);
      }
      w.x = wrapX(w.x + Math.cos(w.hd)*w.vel*dt); w.y = wrapY(w.y + Math.sin(w.hd)*w.vel*dt);
    }
    // how loud the drone is: nearest formed whirlpool, rising steeply as you close in
    let lvl = boat.whirl ? 1 : 0;
    for(const w of whirlpools){
      if(w.s<=0) continue;
      const d = wdist(boat.x,boat.y,w.x,w.y), reach = w.r*2.6;
      if(d < reach) lvl = Math.max(lvl, w.s*Math.pow(1 - Math.max(0,d-w.core)/(reach-w.core), 1.5));
    }
    Sfx.drone(playing ? lvl : 0);
    for(const w of whirlpools){
      w.rot += w.dir*w.speed*dt;
      const holding = boat.whirl && boat.whirl.w===w;            // don't vanish mid-spin
      if(w.phase==='in'){ w.s = Math.min(1, w.s + dt/WHIRL_FADE); if(w.s>=1){ w.phase='on'; w.timer=rand(25,60); } }
      else if(w.phase==='on'){ w.timer -= dt; if(w.timer<=0 && !holding) w.phase='out'; }
      else if(w.phase==='out'){ if(!holding) w.s = Math.max(0, w.s - dt/WHIRL_FADE); if(w.s<=0){ w.phase='off'; w.timer=rand(4,12); } }
      else if(w.phase==='off'){
        w.timer -= dt;
        if(w.timer<=0){
          w.phase = 'wait';                                       // mark as free while searching
          const sp = findWhirlSpot(true);
          if(sp){ Object.assign(w, sp); w.phase='in'; w.s=0; w.armed=true; w.escaping=false; w.dir=Math.random()<0.5?-1:1; w.hd=rand(0,Math.PI*2); w.vel=rand(5,9); }
          else { w.phase='off'; w.timer=rand(3,8); }
        }
      }
    }
  }

  // ---------- Fish banks ----------
  // Schools of fish circling in open water. Stop the boat on one (sail
  // down) and after a moment the nets go over the side; ten seconds later
  // you haul 1–2 fish and the school scatters. Which fish depends on which
  // side of home the bank lies (north / east / south / west).
  const FISH = {
    nord:  {key:'sarde',   one:'sardine',    many:'sardines'},
    est:   {key:'sgombri', one:'mackerel',   many:'mackerel'},
    sud:   {key:'triglie', one:'red mullet', many:'red mullet'},
    ovest: {key:'orate',   one:'sea bream',  many:'sea bream'}
  };
  const FISH_KEYS = ['sarde','sgombri','triglie','orate'];
  const FISH_NAME = {}; for(const k in FISH) FISH_NAME[FISH[k].key] = FISH[k];
  const FOOD_PRICE = 4;              // fish for a village's food…
  const LOCAL_MAX = 2;               // …of which at most this many may be the village's own kind
  const counts = { sarde:0, sgombri:0, triglie:0, orate:0 };   // fish in the hold
  let caught = 0;                    // fish landed this voyage
  const FISH_HEAL = 15;              // hull points repaired per fish sold at a pier
  const BANK_COUNT = 240;
  function fishTotal(){ return FISH_KEYS.reduce((a,k)=>a+counts[k],0); }
  function sectorAt(x,y){
    const dx = wdx(x,START.x), dy = wdy(y,START.y);
    if(Math.abs(dx) > Math.abs(dy)) return dx>0 ? 'est' : 'ovest';
    return dy>0 ? 'sud' : 'nord';
  }
  const banks = bankList;
  function spotIsClear(x,y,m){
    if(onLand(x,y,m)) return false;
    if(pierDist(x,y).d < m+60) return false;
    for(const w of whirlpools) if(wdist(w.x,w.y,x,y) < w.core+m+60) return false;   // may sit in a pull ring: a gamble
    for(const b of banks) if(b.state!=='gone' && wdist(b.x,b.y,x,y) < b.r+m+90) return false;
    return !rockGrid.query(x,y,m+30, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < o.r+m+14);
  }
  // away: keep new banks out of the player's sight
  // the waters round home (where north, east, south and west meet) keep
  // their own, denser set of banks, with every kind of fish in them
  const HOME_WATERS = 950, HOME_BANKS = 11;
  function spawnBank(away, home){
    for(let tries=0; tries<900; tries++){
      let x, y;
      if(home){ const a = rand(0,Math.PI*2), d = rand(260, HOME_WATERS); x = wrapX(START.x+Math.cos(a)*d); y = wrapY(START.y+Math.sin(a)*d); }
      else { x = rand(0,WORLD.w); y = rand(0,WORLD.h); if(wdist(x,y,START.x,START.y) < HOME_WATERS) continue; }
      if(wdist(x,y,START.x,START.y) < 260) continue;
      if(away && wdist(x,y,boat.x,boat.y) < 900) continue;
      if(!home && Math.random() > 0.12 + 0.88*Math.pow(danger(x,y),1.3)) continue;     // richer the farther out
      const r = rand(36,46);
      if(!spotIsClear(x,y,r)) continue;
      const sec = home ? ['nord','est','sud','ovest'][Math.floor(Math.random()*4)] : sectorAt(x,y);
      const fish = [];
      // each kind looks different: sardines many and small and pale,
      // mackerel lighter-dotted, red mullet mid-grey, sea bream few, big and dark
      const LOOK = { nord:[12,15,0.62], est:[9,11,0.9], sud:[7,8,1.1], ovest:[4,5,1.45] }[sec];
      const n = LOOK[0] + Math.floor(rand(0, LOOK[1]-LOOK[0]+1));
      for(let k=0;k<n;k++) fish.push({a:rand(0,6.3), rad:rand(0.25,0.8), sp:rand(0.5,0.9)*(Math.random()<0.5?-1:1),
                                      ph:rand(0,6.3), wob:rand(0.15,0.35), size:LOOK[2]*rand(0.9,1.1)});
      const blobs = [];                               // soft, lumpy patch of disturbed water
      for(let k=0;k<5;k++){ const a=rand(0,6.3), d=rand(0,0.35)*r; blobs.push([Math.cos(a)*d, Math.sin(a)*d, r*rand(0.6,0.85)]); }
      const ripples = [];
      for(let k=0;k<11;k++) ripples.push({a:k/11*Math.PI*2+rand(-0.2,0.2), len:rand(0.22,0.42), rr:rand(0.86,1.06), ph:rand(0,6.3)});
      banks.push({x, y, r, sec, home: !!home, fish, blobs, ripples, state:'live', t:0, rot:rand(0,6.3), jumpT:rand(1,4)});
      return;
    }
  }

  // ---------- Boat ----------
  const boat = {
    x: SPAWN.x, y: SPAWN.y,
    angle: SPAWN.angle,
    speed: 0,
    health: 100,
    kx: 0, ky: 0,     // rebound velocity after a collision (decays quickly)
    kdamp: 3.5,       // how fast kx/ky fade (slower for the push off the pier)
    oarK: 0, oarsOut: false, oarPh: 0,   // oars: how far out (0..1), and rowing phase
    whirl: null,      // set while caught in a whirlpool
    sailPower: 0,
    sailAmount: 1,    // smoothed sail area (0..1)
    sailSide: 1,      // which side the boom is on (+1 / -1), with hysteresis
    boomSigned: 0,    // smoothed angle the square sail faces (boat frame)
    r: 16
  };
  const wake=[]; let wakeAcc=0;
  for(let k=0;k<BANK_COUNT;k++) spawnBank(false, false);

  // ---------- Trade routes and the boats that sail them ----------
  // Sea lanes are found once, when the world is made: an A* search over a
  // coarse grid of open water (wrapping round the world like everything
  // else), straightened where the way is clear and smoothed into curves.
  // They run between neighbouring villages (none to home).
  const NAV_CELL = 40, NAV_N = Math.round(WORLD.w/NAV_CELL);
  const navOpen = new Uint8Array(NAV_N*NAV_N);
  const ni = (i)=> ((i%NAV_N)+NAV_N)%NAV_N;
  for(let j=0;j<NAV_N;j++) for(let i=0;i<NAV_N;i++){
    const x = (i+0.5)*NAV_CELL, y = (j+0.5)*NAV_CELL;
    navOpen[j*NAV_N+i] = (!onLand(x,y,34) && !rockGrid.query(x,y,26, o=> Math.hypot(wdx(o.x,x),wdy(o.y,y)) < o.r+18)) ? 1 : 0;
  }

    // the hub is the anchor button: a half-second press drops or weighs the
    // anchor (a ring fills while it's held, then a little shake)
    if(hubHold && !hubHold.done && performance.now() - hubHold.t0 >= HUB_HOLD){
      hubHold.done = true; hubShake = 1;
      setAnchor(!(anchored && weighT <= 0));
    }
    hubShake = Math.max(0, hubShake - 0.06);
    {
      const jx = hubShake ? Math.sin(performance.now()*0.09)*2.2*hubShake : 0;
      // with the wheel away the hub grows to twice its size and turns dark,
      // a dotted ink knob like the old anchor button
      hubScale = 1 + (1 - wheelVis);
      const inv = wheelVis < 0.5, HI = inv ? PAPW : INKW;
      c.save(); c.translate(WH_CX + jx, WH_CY); c.scale(WH_S*hubScale, WH_S*hubScale);
      c.fillStyle = inv ? INKW : PAPW; c.strokeStyle=INKW; c.lineWidth=2;
      c.beginPath(); c.arc(0,0,13,0,Math.PI*2); c.fill(); c.stroke();
      if(inv){ c.strokeStyle=PAPW; c.lineWidth=1.3; c.beginPath(); c.arc(0,0,14.4,0,Math.PI*2); c.stroke(); }   // a light rim so the dark knob reads on dark water
      if(inv){
        c.save(); c.beginPath(); c.arc(0,0,12,0,Math.PI*2); c.clip(); c.fillStyle=PAPW;
        for(let yy=-12; yy<12; yy+=2.2) for(let xx=-12; xx<12; xx+=2.2) c.fillRect(xx+((yy*10|0)%2?1.1:0), yy, 0.55, 0.55);
        c.restore();
        c.strokeStyle=PAPW; c.lineWidth=1.1; c.beginPath(); c.arc(0,0,10.6,0,Math.PI*2); c.stroke();
        c.fillStyle=INKW; c.beginPath(); c.arc(0,0,9.4,0,Math.PI*2); c.fill();
      }
      const ring = (r, a0, a1, lw, dash)=>{                // an ink ring with a paper halo, readable anywhere
        c.save(); if(dash) c.setLineDash(dash);
        c.strokeStyle=PAPW; c.lineWidth=lw+2; c.beginPath(); c.arc(0,0,r,a0,a1); c.stroke();
        c.strokeStyle=INKW; c.lineWidth=lw;   c.beginPath(); c.arc(0,0,r,a0,a1); c.stroke();
        c.restore();
      };
      if(bankHint){ c.save(); c.rotate(performance.now()*0.002); ring(18.5, 0, Math.PI*2, 1.6, [3,3]); c.restore(); }   // over a fish bank
      if(hubHold && !hubHold.done){
        const k = Math.min(1, (performance.now()-hubHold.t0)/HUB_HOLD);
        ring(16, -Math.PI/2, -Math.PI/2+k*Math.PI*2, 2.8);
      }
      c.strokeStyle = HI; c.fillStyle = HI;
      c.lineCap='round';
      // always an anchor: light hub while sailing, dark knob at anchor
      c.lineWidth=1.6;
      c.beginPath(); c.arc(0,-7,1.9,0,Math.PI*2); c.stroke();
      c.beginPath(); c.moveTo(0,-5); c.lineTo(0,7.5); c.moveTo(-4.5,-2.2); c.lineTo(4.5,-2.2); c.stroke();
      c.beginPath(); c.moveTo(-6.5,2.5); c.quadraticCurveTo(-5,7.5,0,7.5); c.quadraticCurveTo(5,7.5,6.5,2.5); c.stroke();
      c.restore();
    }
    ditherUI(c, WH_W, WH_H);
    wctx.clearRect(0,0,wheelCv.width,wheelCv.height);
    wctx.drawImage(wlo, 0, 0, wheelCv.width, wheelCv.height);
  }
  // 1-bit: ordered dither of a UI canvas to the interface palette; transparent outside
  function ditherUI(c, W, H){
    const im = c.getImageData(0,0,W,H), dd = im.data, o32 = new Uint32Array(dd.buffer);
    for(let y=0, p=0; y<H; y++){
      const row = (y&3)*4;
      for(let x=0; x<W; x++, p++){
        const q = p<<2;
        if(dd[q+3] < 110){ o32[p] = 0; continue; }
        const lum = dd[q] * dd[q+3]/255 + 255*(1-dd[q+3]/255);   // alpha edges blend toward paper
        o32[p] = lum > BAYER[row + (x&3)] ? UI_PAPER32 : UI_INK32;
      }
    }
    c.putImageData(im,0,0);
  }

  const ROW_SPEED = 9;
  // the sail is switched with the halyard (see below), the anchor with the

  // ---------- Halyard ----------
  // A rope hanging from a block on the right of the screen. Swipe it down
  // like pulling a line: it follows the finger (stiffer the further it
  // goes), clicking through the block as it runs, and past the mark the
  // sail switches with a clack. Let go and it springs back up.
  const ropeCv = document.getElementById('rope');
  const rctx = ropeCv.getContext('2d');
  const RP_W = 52, RP_H = 210, RP_CX = 26;
  const ROPE_TOP = 66, ROPE_REST = 136;          // bottom of the block, rest height of the toggle
  const ROPE_MAX = 54, ROPE_FIRE = 34, ROPE_TICK = 9;   // longest pull, where it switches, px per click
  const rlo = document.createElement('canvas'); rlo.width = RP_W; rlo.height = RP_H;
  const rl = rlo.getContext('2d', {willReadFrequently:true});
  function sizeRope(){
    const k = Math.max(1, Math.round((window.devicePixelRatio||1)));
    ropeCv.width = RP_W*k; ropeCv.height = RP_H*k;
    rctx.imageSmoothingEnabled = false;
  }
  sizeRope();
  window.addEventListener('resize', sizeRope);
  let ropePull = 0, ropeV = 0, ropePointer = null, ropeY0 = 0, ropeFired = false, ropeTickIdx = 0, ropeLastT = performance.now(), ropeFlash = 0;
  const ropeLocalY = ev=>{ const r = ropeCv.getBoundingClientRect(); return (ev.clientY - r.top)*(RP_H/r.height); };
  ropeCv.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    ropePointer = ev.pointerId; ropeCv.setPointerCapture(ev.pointerId); ropeCv.classList.add('grabbed');
    ropeY0 = ropeLocalY(ev) - Math.max(0, ropePull); ropeFired = false; ropeTickIdx = Math.floor(Math.max(0, ropePull)/ROPE_TICK); ropeV = 0;
    Sfx.init(); buzz(6);
  });
  ropeCv.addEventListener('pointermove', ev=>{
    if(ev.pointerId !== ropePointer) return;
    ev.preventDefault();
    const dy = ropeLocalY(ev) - ropeY0;
    ropePull = dy <= 0 ? 0 : ROPE_MAX*(1 - Math.exp(-dy/(ROPE_MAX*0.9)));   // it gets heavier as it comes
    const idx = Math.floor(ropePull/ROPE_TICK);
    if(idx > ropeTickIdx){ buzz(5); Sfx.tick(0.3, 1.15 + idx*0.06); }     // the line clicking through the block
    ropeTickIdx = idx;
    if(!ropeFired && ropePull >= ROPE_FIRE){ ropeFired = true; switchByRope(); }
  });
  const ropeRelease = ev=>{
    if(ev.pointerId !== ropePointer) return;

  };
  ropeCv.addEventListener('pointerup', ropeRelease);
  ropeCv.addEventListener('pointercancel', ropeRelease);
  ropeCv.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.repeat){ e.preventDefault(); pullRope(); } });
  function switchByRope(){
    cycleSail(); Sfx.thunk(0.55); buzz([28,40,14]); ropeFlash = 1;
  }
  // a pull from the keyboard: the rope jumps down and springs back on its own
  function pullRope(){ ropePull = ROPE_FIRE + 4; ropeV = 0; switchByRope(); }
  function drawRope(){
    const now = performance.now(), dt = Math.min(0.05, (now - ropeLastT)/1000); ropeLastT = now;
    if(ropePointer === null){                                   // let go: spring back up, a little overshoot
      ropeV += (-90*ropePull - 11*ropeV)*dt; ropePull += ropeV*dt;
      if(ropePull < -6){ ropePull = -6; ropeV = 0; }
      if(Math.abs(ropePull) < 0.05 && Math.abs(ropeV) < 0.5){ ropePull = 0; ropeV = 0; }
    }
    ropeFlash = Math.max(0, ropeFlash - dt*2.5);
    const c = rl, INKW = '#000', PAPW = '#fff', pull = ropePull, hy = ROPE_REST + pull;
    c.clearRect(0,0,RP_W,RP_H);
    c.lineCap = 'round'; c.lineJoin = 'round';
    // the badge: which sail is set, in a paper disc (it pops when switched)
    {
      const s = 1 + 0.25*Math.sin(ropeFlash*Math.PI);
      c.save(); c.translate(RP_CX, 18); c.scale(s, s);
      c.fillStyle = PAPW; c.strokeStyle = INKW; c.lineWidth = 2;
      c.beginPath(); c.arc(0,0,15,0,Math.PI*2); c.fill(); c.stroke();
      c.lineWidth=1.4; c.beginPath(); c.moveTo(0,-10); c.lineTo(0,10); c.stroke();          // mast
      c.lineWidth=1.8; c.beginPath(); c.moveTo(-7,-7); c.lineTo(7,-7); c.stroke();          // yard
      c.fillStyle = INKW;
      if(sailLevel === SAIL_MIN){                                                            // furled, over a little wave
        c.beginPath(); c.roundRect(-6.5,-6.6,13,3.6,1.7); c.fill();
        c.lineWidth=1.2; c.beginPath(); c.moveTo(-6.5,7); c.quadraticCurveTo(-3.2,5,0,7); c.quadraticCurveTo(3.2,9,6.5,7); c.stroke();
      } else {                                                                               // full and drawing
        c.beginPath(); c.moveTo(-6,-6.2); c.quadraticCurveTo(0,-4.2,6,-6.2); c.quadraticCurveTo(8.2,0,6,6);
        c.quadraticCurveTo(0,8,-6,6); c.quadraticCurveTo(-8.2,0,-6,-6.2); c.fill();
      }
      c.restore();
    }
    // shackle and block, with a sheave that turns as the line runs
    c.strokeStyle = INKW; c.lineWidth = 2;
    c.beginPath(); c.moveTo(RP_CX, 33); c.lineTo(RP_CX, 38); c.stroke();
    c.beginPath(); c.ellipse(RP_CX, 38.5, 3.2, 2.4, 0, 0, Math.PI*2); c.stroke();
    c.fillStyle = 'rgb(170,170,170)'; c.strokeStyle = INKW; c.lineWidth = 1.8;
    c.beginPath(); c.roundRect(RP_CX-10, 41, 20, 26, 7); c.fill(); c.stroke();
    c.fillStyle = 'rgb(215,215,215)'; c.beginPath(); c.roundRect(RP_CX-7.5, 43, 7, 21, 4); c.fill();   // lit cheek
    c.save(); c.translate(RP_CX, 54); c.rotate(pull/6);
    c.fillStyle = PAPW; c.strokeStyle = INKW; c.lineWidth = 1.4;
    c.beginPath(); c.arc(0,0,6.5,0,Math.PI*2); c.fill(); c.stroke();
    c.lineWidth = 1.1; c.beginPath(); for(let k=0;k<3;k++){ const a = k*Math.PI/3; c.moveTo(Math.cos(a)*5.5, Math.sin(a)*5.5); c.lineTo(-Math.cos(a)*5.5, -Math.sin(a)*5.5); } c.stroke();
    c.fillStyle = INKW; c.beginPath(); c.arc(0,0,1.6,0,Math.PI*2); c.fill();
    c.restore();
    // the rope: laid strands that run down through the block as it's pulled
    const sway = Math.max(-3, Math.min(3, -ropeV*0.012));
    const rx = y=> RP_CX + sway*Math.sin(Math.PI*(y-ROPE_TOP)/Math.max(1, hy-ROPE_TOP));
    c.lineWidth = 7; c.strokeStyle = INKW;
    c.beginPath(); for(let y=ROPE_TOP; y<=hy; y+=3) (y===ROPE_TOP ? c.moveTo(rx(y), y) : c.lineTo(rx(y), y)); c.lineTo(rx(hy), hy); c.stroke();
    c.lineWidth = 4.2; c.strokeStyle = PAPW;
    c.beginPath(); for(let y=ROPE_TOP; y<=hy; y+=3) (y===ROPE_TOP ? c.moveTo(rx(y), y) : c.lineTo(rx(y), y)); c.lineTo(rx(hy), hy); c.stroke();
    c.strokeStyle = INKW; c.lineWidth = 1.1; c.lineCap = 'butt';
    c.beginPath();
    for(let y = ROPE_TOP + ((pull % 4) + 4) % 4; y < hy - 1; y += 4){ const x = rx(y); c.moveTo(x-2.1, y-1.4); c.lineTo(x+2.1, y+1.4); }
    c.stroke(); c.lineCap = 'round';
    // the toggle: a wooden peg through the rope's end, and a knot below it
    {
      const x = rx(hy);
      c.fillStyle = PAPW; c.strokeStyle = INKW; c.lineWidth = 1.6;                                // knot
      c.beginPath(); c.arc(x, hy+14.5, 5, 0, Math.PI*2); c.fill(); c.stroke();
      c.lineWidth = 1; c.beginPath(); c.arc(x-1, hy+14.5, 2.6, -1.2, 2); c.moveTo(x+3.5, hy+11.5); c.lineTo(x-3.5, hy+17.5); c.stroke();
      c.strokeStyle = INKW; c.lineWidth = 7; c.beginPath(); c.moveTo(x, hy); c.lineTo(x, hy+12); c.stroke();
      c.strokeStyle = PAPW; c.lineWidth = 4.2; c.beginPath(); c.moveTo(x, hy); c.lineTo(x, hy+11); c.stroke();
      c.fillStyle = PAPW; c.strokeStyle = INKW; c.lineWidth = 1.8;
      c.beginPath(); c.roundRect(x-15, hy-1, 30, 9, 4.5); c.fill(); c.stroke();
      c.fillStyle = 'rgb(175,175,175)'; c.fillRect(x-12, hy+4, 24, 2.2);                        // shaded underside
      c.fillStyle = INKW; c.fillRect(x-1.6, hy-1, 3.2, 9);                                        // the rope passing through
    }
    // idle: two little chevrons under the knot, saying 'pull me'
    const idle = ropePointer === null && Math.abs(ropePull) < 1;
    if(idle){
      const bob = (Math.sin(now*0.004)+1)*1.5;
      const chev = ()=>{ c.beginPath(); for(const dy of [0, 7]){ const y = hy + 27 + dy + bob; c.moveTo(RP_CX-5, y); c.lineTo(RP_CX, y+4); c.lineTo(RP_CX+5, y); } };
      c.strokeStyle = PAPW; c.lineWidth = 4; chev(); c.stroke();    // paper halo: reads on dark water
      c.strokeStyle = INKW; c.lineWidth = 1.6; chev(); c.stroke();

    ditherUI(c, RP_W, RP_H);
    rctx.clearRect(0,0,ropeCv.width,ropeCv.height);
    rctx.drawImage(rlo, 0, 0, ropeCv.width, ropeCv.height);
  }
